<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>ECHO//LIFE v40 Top Down</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020407;color:#eff;font-family:system-ui}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:5;top:max(6px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:5px;pointer-events:none}.p{background:#041017dd;border:1px solid #61eaff55;border-radius:8px;padding:5px 9px;box-shadow:0 8px 25px #000b}.brand{font-weight:950;letter-spacing:4px}.stat{font-size:8px;text-align:center;min-width:58px}.stat b{display:block;font-size:14px}.obj{margin-left:auto;font-size:10px}.joy{position:fixed;z-index:8;left:max(20px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:112px;height:112px;border:2px solid #6ef3ff66;border-radius:50%;background:#06161bbb;touch-action:none}.stick{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#5bdbe8 40%,#153c46)}.fire{position:fixed;z-index:9;right:max(22px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;border:1px solid #ffc0cb;color:#fff;font-weight:900;background:radial-gradient(circle at 35% 30%,#ffe1da,#dc3a58 48%,#500d1c);box-shadow:0 0 34px #ff45665c}.dash{position:fixed;z-index:9;right:120px;bottom:31px;width:58px;height:58px;border-radius:50%;border:1px solid #8ef2ff77;color:#fff;background:#12323b;font-weight:800}.msg{position:fixed;z-index:6;top:58px;left:50%;transform:translateX(-50%);background:#02080bcc;border:1px solid #6df3ff55;border-radius:20px;padding:5px 14px;font-size:10px}.overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#102934ee,#010305fa 70%)}.card{width:min(540px,90vw);padding:28px;text-align:center;background:#07151be8;border:1px solid #61dbea66;border-radius:18px}.card h1{letter-spacing:9px;text-shadow:0 0 25px #4ef}.card button{width:100%;padding:12px;background:#143b47;border:1px solid #58cfe0;color:#fff;border-radius:8px;font-weight:800}</style></head><body><canvas id=c width=1920 height=1080></canvas><div class=hud><div class='p brand'>ECHO//LIFE</div><div class='p stat'>HP<b id=hp>100</b></div><div class='p stat'>LVL<b id=lvl>1</b></div><div class='p stat'>AMMO<b id=ammo>60</b></div><div class='p stat'>¢<b id=cash>100</b></div><div class='p obj'>NEON WARD · PURGE <b id=obj>0/12</b></div></div><div id=msg class=msg>v40 · TOP-DOWN SCROLLER</div><div id=joy class=joy><div id=stick class=stick></div></div><button id=dash class=dash>DASH</button><button id=fire class=fire>FIRE</button><div id=title class=overlay><div class=card><h1>ECHO//LIFE</h1><h2>TOP-DOWN SCROLLER</h2><p>Explore the city · auto-aim combat · continuous scrolling world</p><button id=start>ENTER NEON WARD</button></div></div><script>(()=>{const $=s=>document.getElementById(s),C=$('c'),g=C.getContext('2d');let P={x:0,y:0,hp:100,lvl:1,ammo:60,cash:100,kills:0,obj:0,goal:12,a:0},E=[],B=[],FX=[],cam={x:0,y:0},shoot=0,dashing=0;const rnd=(a,b)=>a+Math.random()*(b-a);function spawn(){for(let i=0;i<24;i++){let a=Math.random()*6.28,d=rnd(450,1300);E.push({x:P.x+Math.cos(a)*d,y:P.y+Math.sin(a)*d,hp:55+P.lvl*6,v:rnd(.45,.9)})}}spawn();function world(x,y){return{x:x-cam.x+960,y:y-cam.y+540}}function roadGrid(){let size=360,ox=(((-cam.x)%size)+size)%size,oy=(((-cam.y)%size)+size)%size;g.fillStyle='#091116';g.fillRect(0,0,1920,1080);for(let ix=-1;ix<7;ix++)for(let iy=-1;iy<5;iy++){let x=ox+ix*size,y=oy+iy*size;g.fillStyle=(ix+iy)&1?'#142226':'#18282c';g.fillRect(x+66,y+66,size-132,size-132);g.fillStyle='#202f32';g.fillRect(x+80,y+80,size-160,size-160);for(let wx=x+100;wx<x+size-90;wx+=46)for(let wy=y+105;wy<y+size-90;wy+=45){g.fillStyle=((wx+wy)|0)%3?'#62eaff55':'#ff4d9a44';g.fillRect(wx,wy,17,12)}g.fillStyle='#0d181d';g.fillRect(x,y,size,66);g.fillRect(x,y,66,size);g.fillStyle='#121d21';g.fillRect(x,y+size-66,size,66);g.fillRect(x+size-66,y,66,size);g.strokeStyle='#e5d36955';g.lineWidth=3;g.setLineDash([28,28]);g.beginPath();g.moveTo(x,y+33);g.lineTo(x+size,y+33);g.moveTo(x+33,y);g.lineTo(x+33,y+size);g.stroke();g.setLineDash([]);for(let k=0;k<4;k++){g.fillStyle=k%2?'#ff4c9b':'#54eaff';g.shadowColor=g.fillStyle;g.shadowBlur=18;g.fillRect(x+90+k*55,y+72,36,5);g.shadowBlur=0}}}function actor(x,y,a,bad=false){g.save();g.translate(x,y);g.rotate(a);g.fillStyle='#000a';g.beginPath();g.ellipse(0,10,25,13,0,0,7);g.fill();g.fillStyle=bad?'#9f2f48':'#2097ae';g.beginPath();g.roundRect(-16,-23,32,43,9);g.fill();g.fillStyle='#c18b6d';g.beginPath();g.arc(0,-30,10,0,7);g.fill();g.fillStyle='#11181b';g.beginPath();g.arc(0,-34,10,Math.PI,6.2);g.fill();g.strokeStyle='#31474e';g.lineWidth=7;g.beginPath();g.moveTo(11,-9);g.lineTo(37,-9);g.stroke();g.fillStyle='#647a80';g.fillRect(31,-13,17,8);if(!bad&&shoot){g.fillStyle='#fff3a0';g.shadowColor='#ffb22d';g.shadowBlur=30;g.beginPath();g.moveTo(48,-9);g.lineTo(67,-20);g.lineTo(59,-8);g.lineTo(67,4);g.closePath();g.fill();g.shadowBlur=0}g.restore()}function particle(x,y,c,n=14){for(let i=0;i<n;i++)FX.push({x,y,vx:rnd(-6,6),vy:rnd(-6,6),l:25,c})}function nearest(){let best=null,d=1e9;for(let e of E){if(e.hp<=0)continue;let q=Math.hypot(e.x-P.x,e.y-P.y);if(q<d){d=q;best=e}}return d<650?best:null}function fire(){if(P.ammo<=0)return $('msg').textContent='OUT OF AMMO';let e=nearest();if(!e)return $('msg').textContent='NO TARGET';P.ammo--;P.a=Math.atan2(e.y-P.y,e.x-P.x);shoot=5;e.hp-=34;let dx=Math.cos(P.a),dy=Math.sin(P.a);B.push({x:P.x+dx*35,y:P.y+dy*35,vx:dx*22,vy:dy*22,l:22});navigator.vibrate?.(18);if(e.hp<=0){P.kills++;P.obj++;P.cash+=20;particle(e.x,e.y,'#ff9b55',25);$('msg').textContent='HOSTILE DOWN · +20¢';if(P.obj>=P.goal){P.obj=0;P.goal+=3;P.lvl++;P.cash+=120;P.ammo+=30;spawn();$('msg').textContent='DISTRICT CLEARED · LEVEL '+P.lvl}}ui()}function update(){if(shoot)shoot--;cam.x+=(P.x-cam.x)*.09;cam.y+=(P.y-cam.y)*.09;for(let e of E){if(e.hp<=0)continue;let dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;if(d<720){e.x+=dx/d*e.v;e.y+=dy/d*e.v;if(d<35&&!dashing){P.hp-=.12;if(P.hp<=0){P.hp=100;P.cash=Math.max(0,P.cash-40);P.x=P.y=0;E=[];spawn();$('msg').textContent='SIGNAL RESTORED · -40¢'}}}}B=B.filter(b=>b.l-->0);B.forEach(b=>{b.x+=b.vx;b.y+=b.vy});FX=FX.filter(f=>f.l-->0);FX.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.vx*=.94;f.vy*=.94});if(dashing)dashing--;ui()}function draw(){requestAnimationFrame(draw);update();roadGrid();for(let i=0;i<14;i++){let wx=Math.floor((cam.x-900)/500)*500+i*500,wy=Math.floor((cam.y-500)/700)*700+(i%3)*230,p=world(wx,wy);g.fillStyle='#071014';g.fillRect(p.x,p.y,100,45);g.strokeStyle=i%2?'#ff4c9b':'#54eaff';g.shadowColor=g.strokeStyle;g.shadowBlur=18;g.strokeRect(p.x,p.y,100,45);g.shadowBlur=0}E.filter(e=>e.hp>0).forEach(e=>{let p=world(e.x,e.y),a=Math.atan2(P.y-e.y,P.x-e.x);if(p.x>-80&&p.x<2000&&p.y>-80&&p.y<1160){actor(p.x,p.y,a,true);g.fillStyle='#17070a';g.fillRect(p.x-23,p.y-52,46,5);g.fillStyle='#62e68f';g.fillRect(p.x-23,p.y-52,46*(e.hp/(55+P.lvl*6)),5)}});B.forEach(b=>{let p=world(b.x,b.y);g.fillStyle='#fff4a0';g.shadowColor='#ffe060';g.shadowBlur=20;g.beginPath();g.arc(p.x,p.y,5,0,7);g.fill();g.shadowBlur=0});FX.forEach(f=>{let p=world(f.x,f.y);g.globalAlpha=f.l/25;g.fillStyle=f.c;g.fillRect(p.x,p.y,5,5)});g.globalAlpha=1;let pp=world(P.x,P.y);actor(pp.x,pp.y,P.a,false);g.strokeStyle='#dff8ff36';for(let i=0;i<100;i++){let x=(i*103+performance.now()*.3)%2000,y=(i*67+performance.now()*.7)%1150;g.beginPath();g.moveTo(x,y);g.lineTo(x-8,y+22);g.stroke()}let v=g.createRadialGradient(960,540,360,960,540,1050);v.addColorStop(0,'#0000');v.addColorStop(1,'#000d');g.fillStyle=v;g.fillRect(0,0,1920,1080)}function ui(){$('hp').textContent=Math.max(0,Math.round(P.hp));$('lvl').textContent=P.lvl;$('ammo').textContent=P.ammo;$('cash').textContent=P.cash;$('obj').textContent=P.obj+'/'+P.goal}$('fire').onclick=fire;$('dash').onclick=()=>{dashing=18;P.x+=Math.cos(P.a)*130;P.y+=Math.sin(P.a)*130;navigator.vibrate?.(20);$('msg').textContent='DASH'};$('start').onclick=()=>{$('title').style.display='none';ui()};let ja=false,jx=0,jy=0,last=0;$('joy').onpointerdown=e=>{ja=true;$('joy').setPointerCapture(e.pointerId);let r=$('joy').getBoundingClientRect();jx=r.left+r.width/2;jy=r.top+r.height/2};$('joy').onpointermove=e=>{if(!ja)return;let dx=e.clientX-jx,dy=e.clientY-jy,m=Math.hypot(dx,dy)||1,L=33;if(m>L){dx=dx/m*L;dy=dy/m*L}$('stick').style.transform=`translate(${dx}px,${dy}px)`;if(Date.now()-last>16&&m>7){last=Date.now();let speed=dashing?9:5;P.x+=dx/L*speed;P.y+=dy/L*speed;P.a=Math.atan2(dy,dx)}};let end=()=>{ja=false;$('stick').style.transform=''};$('joy').onpointerup=end;$('joy').onpointercancel=end;document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')P.y-=12;if(k==='s'||e.key==='ArrowDown')P.y+=12;if(k==='a'||e.key==='ArrowLeft')P.x-=12;if(k==='d'||e.key==='ArrowRight')P.x+=12;if(e.key===' ')fire()});draw();ui()})();</script></body></html>
