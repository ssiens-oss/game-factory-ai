ca;if(rz<.35)return null;return{x:960+rx/rz*850,y:540+145/rz,s:330/rz,d:rz}}function building(off,w,h,col,neon){g.fillStyle=col;g.fillRect(off,540-h,w,h);let grad=g.createLinearGradient(off,0,off+w,0);grad.addColorStop(0,'#fff0');grad.addColorStop(.5,'#ffffff0d');grad.addColorStop(1,'#0005');g.fillStyle=grad;g.fillRect(off,540-h,w,h);for(let yy=560-h;yy<515;yy+=31)for(let xx=off+14;xx<off+w-12;xx+=27){let on=((xx+yy)|0)%5;g.fillStyle=on?neon:'#061014';g.globalAlpha=on?.7:1;g.fillRect(xx,yy,10,14)}g.globalAlpha=1;g.fillStyle='#020609';g.fillRect(off+w*.15,520-h*.55,w*.7,30);g.strokeStyle=neon;g.shadowColor=neon;g.shadowBlur=20;g.strokeRect(off+w*.15,520-h*.55,w*.7,30);g.shadowBlur=0}function enemy(e,p){let s=Math.min(330,p.s),y=625-s*.72;g.fillStyle='#000a';g.beginPath();g.ellipse(p.x,y+s*1.02,s*.36,s*.1,0,0,7);g.fill();let body=g.createLinearGradient(p.x-s*.25,y,p.x+s*.25,y);body.addColorStop(0,'#47111f');body.addColorStop(.45,e.type%2?'#c83b59':'#8f263e');body.addColorStop(1,'#280b13');g.fillStyle=body;g.beginPath();g.roundRect(p.x-s*.24,y,s*.48,s*.66,s*.08);g.fill();g.strokeStyle='#1a2023';g.lineWidth=Math.max(4,s*.08);g.beginPath();g.moveTo(p.x-s*.13,y+s*.61);g.lineTo(p.x-s*.2,y+s*.96);g.moveTo(p.x+s*.13,y+s*.61);g.lineTo(p.x+s*.2,y+s*.96);g.stroke();g.fillStyle='#c58e70';g.beginPath();g.arc(p.x,y-s*.16,s*.17,0,7);g.fill();g.fillStyle='#101518';g.beginPath();g.arc(p.x,y-s*.21,s*.18,Math.PI,6.2);g.fill();g.fillStyle='#ff334f';g.shadowColor='#ff334f';g.shadowBlur=12;g.fillRect(p.x-s*.07,y-s*.17,s*.04,s*.025);g.fillRect(p.x+s*.03,y-s*.17,s*.04,s*.025);g.shadowBlur=0;g.strokeStyle='#283b42';g.lineWidth=Math.max(4,s*.065);g.beginPath();g.moveTo(p.x+s*.17,y+s*.2);g.lineTo(p.x+s*.55,y+s*.29);g.stroke();g.fillStyle='#4d6268';g.fillRect(p.x+s*.43,y+s*.24,s*.2,s*.08);g.fillStyle='#19070b';g.fillRect(p.x-s*.27,y-s*.45,s*.54,6);g.fillStyle='#61e58f';g.fillRect(p.x-s*.27,y-s*.45,s*.54*(e.hp/75),6)}function draw(){requestAnimationFrame(draw);g.save();if(shake>.2){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.73}let sky=g.createLinearGradient(0,0,0,1080);sky.addColorStop(0,'#163f55');sky.addColorStop(.36,'#0a202d');sky.addColorStop(.5,'#071116');sky.addColorStop(1,'#010204');g.fillStyle=sky;g.fillRect(0,0,1920,1080);let moon=g.createRadialGradient(1490,170,4,1490,170,170);moon.addColorStop(0,'#eaffffcc');moon.addColorStop(.12,'#9defff38');moon.addColorStop(1,'#8defff00');g.fillStyle=moon;g.beginPath();g.arc(1490,170,170,0,7);g.fill();for(let i=-22;i<24;i++){let off=((i*145-P.a*760)%2050+2050)%2050-70,h=190+(Math.abs(i*83)%290),w=105+(i&1)*30;building(off,w,h,i%2?'#0b2029':'#102a35',i%3?'#54eaff':'#ff4b9b')}let road=g.createLinearGradient(0,540,0,1080);road.addColorStop(0,'#1b2b30');road.addColorStop(.3,'#101a1f');road.addColorStop(1,'#020305');g.fillStyle=road;g.fillRect(0,540,1920,540);let glow=g.createLinearGradient(0,540,0,1080);glow.addColorStop(0,'#45eaff00');glow.addColorStop(1,'#45eaff19');g.fillStyle=glow;g.fillRect(0,540,960,540);let glow2=g.createLinearGradient(1920,540,1920,1080);glow2.addColorStop(0,'#ff4c9b00');glow2.addColorStop(1,'#ff4c9b16');g.fillStyle=glow2;g.fillRect(960,540,960,540);g.strokeStyle='#79efff25';g.lineWidth=2;for(let i=1;i<22;i++){let y=540+540*(1-1/(1+i*.19));g.beginPath();g.moveTo(0,y);g.lineTo(1920,y);g.stroke()}for(let i=-15;i<=15;i++){g.beginPath();g.moveTo(960,540);g.lineTo(960+i*170,1080);g.stroke()}g.strokeStyle='#efd96f66';g.lineWidth=7;g.setLineDash([50,42]);g.beginPath();g.moveTo(960,600);g.lineTo(960,1080);g.stroke();g.setLineDash([]);let V=E.filter(e=>e.hp>0).map(e=>({e,p:proj(e.x,e.z)})).filter(q=>q.p).sort((a,b)=>b.p.d-a.p.d);V.forEach(q=>enemy(q.e,q.p));g.strokeStyle='#dff8ff42';g.lineWidth=2;for(let i=0;i<210;i++){let xx=(i*113+performance.now()*.38)%2050,yy=(i*71+performance.now()*.95)%1160;g.beginPath();g.moveTo(xx,yy);g.lineTo(xx-13,yy+35);g.stroke()}let fog=g.createLinearGradient(0,650,0,1080);fog.addColorStop(0,'#bdefff00');fog.addColorStop(1,'#bdefff18');g.fillStyle=fog;g.fillRect(0,0,1920,1080);let vig=g.createRadialGradient(960,520,420,960,520,1200);vig.addColorStop(0,'#0000');vig.addColorStop(1,'#000d');g.fillStyle=vig;g.fillRect(0,0,1920,1080);g.restore()}function ui(){$('hp').textContent=P.hp;$('ammo').textContent=P.mag+'/'+P.res;$('kills').textContent=P.kills;$('obj').textContent=P.obj+'/'+P.goal}function fire(){if(P.mag<=0){$('msg').textContent='RELOAD';return}P.mag--;$('muzzle').style.display='block';setTimeout(()=>$('muzzle').style.display='none',55);shake=11;navigator.vibrate?.(20);let best=null,score=999;E.forEach(e=>{if(e.hp<=0)return;let p=proj(e.x,e.z);if(!p)return;let d=Math.abs(p.x-960)+Math.abs(p.y-540)*.35;if(d<score&&d<Math.max(75,p.s*.42)){score=d;best=e}});if(best){best.hp-=40;$('msg').textContent='HIT';if(best.hp<=0){P.kills++;P.obj++;$('msg').textContent='HOSTILE DOWN';if(P.obj>=P.goal){P.obj=0;P.goal+=2;P.res+=30;spawn();$('msg').textContent='SECTOR CLEARED · +30 AMMO'}}}else $('msg').textContent='MISS';ui()}function reload(){if(P.mag>=15||P.res<=0)return;let n=Math.min(15-P.mag,P.res);P.mag+=n;P.res-=n;$('msg').textContent='RELOADED';ui()}$('fire').onclick=fire;$('reload').onclick=reload;$('start').onclick=()=>{$('title').style.display='none';ui()};let ja=false,jx=0,jy=0,last=0;$('joy').onpointerdown=e=>{ja=true;$('joy').setPointerCapture(e.pointerId);let r=$('joy').getBoundingClientRect();jx=r.left+r.width/2;jy=r.top+r.height/2};$('joy').onpointermove=e=>{if(!ja)return;let dx=e.clientX-jx,dy=e.clientY-jy,m=Math.hypot(dx,dy)||1,L=33;if(m>L){dx=dx/m*L;dy=dy/m*L}$('stick').style.transform=`translate(${dx}px,${dy}px)`;if(Date.now()-last>18){last=Date.now();let f=-dy/L*.18,s=dx/L*.14;P.x+=Math.cos(P.a)*s+Math.sin(P.a)*f;P.z+=-Math.sin(P.a)*s+Math.cos(P.a)*f}};let je=()=>{ja=false;$('stick').style.transform=''};$('joy').onpointerup=je;$('joy').onpointercancel=je;let la=false,lx=0;$('look').onpointerdown=e=>{la=true;lx=e.clientX;$('look').setPointerCapture(e.pointerId)};$('look').onpointermove=e=>{if(!la)return;let dx=e.clientX-lx;lx=e.clientX;P.a+=dx*.0045};$('look').onpointerup=()=>la=false;$('look').onpointercancel=()=>la=false;document.addEventListener('keydown',e=>{if(e.key===' ')fire();if(e.key.toLowerCase()==='r')reload();if(e.key==='ArrowLeft')P.a-=.08;if(e.key==='ArrowRight')P.a+=.08;if(e.key==='ArrowUp'){P.x+=Math.sin(P.a)*.2;P.z+=Math.cos(P.a)*.2}});draw();ui()})();</script></body></html>
