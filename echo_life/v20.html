<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v20</title><style>*{box-sizing:border-box}body{margin:0;background:#010405;color:#eaffff;font-family:system-ui;text-align:center}main{max-width:940px;margin:auto;padding:6px}h1{margin:2px;letter-spacing:8px;text-shadow:0 0 15px #6df1ff}.hud{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}.hud div,.panel{background:#0a2028ed;border:1px solid #376b76;border-radius:9px;padding:6px;font-size:10px}#wrap{position:relative}canvas{width:100%;aspect-ratio:16/10;border:1px solid #528995;border-radius:14px;background:#071015;touch-action:none;box-shadow:0 25px 70px #000}#mini{position:absolute;right:8px;top:8px;width:112px;height:82px;aspect-ratio:auto;border-radius:7px;background:#02090dcc}.pad{width:190px;margin:5px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.pad i{visibility:hidden}button{border:1px solid #4ea7b6;background:linear-gradient(#23798a,#0d4350);color:#fff;border-radius:8px;padding:9px;font-weight:800}.actions,.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.actions button,.tabs button{font-size:9px;padding:9px 1px}.tabs{margin-top:3px}.good{color:#8fffc5}.danger{color:#ff7187}.gold{color:#ffe279}.modal,.title{position:fixed;inset:0;background:#010407f4;display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}.card{width:min(560px,100%);max-height:86vh;overflow:auto;background:#0b1d24;border:1px solid #43808c;border-radius:16px;padding:18px;text-align:left}.card button{width:100%;margin:4px 0}.title .card{text-align:center}.title h1{font-size:34px}.hidden{display:none}@media(max-width:600px){.hud{grid-template-columns:repeat(4,1fr)}.actions,.tabs{grid-template-columns:repeat(3,1fr)}}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>EN<br><b id="en">100</b></div><div>LVL<br><b id="lvl">1</b></div><div>AMMO<br><b id="ammo">18</b></div><div>$<br><b id="cash">80</b></div><div>HEAT<br><b id="heat">0</b></div><div>PLACE<br><b id="place">CITY</b></div><div>DAY<br><b id="day">1</b></div></div><div id="story" class="panel">Welcome to v20.</div><div id="wrap"><canvas id="view" width="960" height="600"></canvas><canvas id="mini" width="112" height="82"></canvas></div><div class="pad"><i></i><button onclick="mv(0,-1)">▲</button><i></i><button onclick="mv(-1,0)">◀</button><button onclick="interact()">◎</button><button onclick="mv(1,0)">▶</button><i></i><button onclick="mv(0,1)">▼</button><i></i></div><div class="actions"><button onclick="attack()">ATTACK</button><button onclick="stealth()">STEALTH</button><button onclick="takedown()">TAKEDOWN</button><button onclick="grenade()">BLAST</button><button onclick="loot()">LOOT</button><button onclick="interact()">USE/ENTER</button></div><div class="tabs"><button onclick="map()">MAP</button><button onclick="inventory()">GEAR</button><button onclick="weapons()">WEAPONS</button><button onclick="shop()">SHOP</button><button onclick="missions()">QUESTS</button><button onclick="systemMenu()">SYSTEM</button></div><div id="status" class="panel"></div></main><div id="modal" class="modal hidden"><div id="card" class="card"></div></div><div id="title" class="title"><div class="card"><h1>ECHO//LIFE</h1><p>A city remembers lives that haven't happened yet.</p><button onclick="newGame()">NEW GAME</button><button onclick="loadSlot(1)">CONTINUE SLOT 1</button><button onclick="loadSlot(2)">CONTINUE SLOT 2</button><button onclick="loadSlot(3)">CONTINUE SLOT 3</button><button onclick="tutorial()">HOW TO PLAY</button></div></div><script>const C=view,g=C.getContext('2d'),M=mini,m=M.getContext('2d'),W=58,H=29,O=480;const zones={DOWNTOWN:['MARKET','CLINIC','TOWER','SAFEHOUSE'],OLD_TOWN:['CHURCH','PAWN SHOP','HOTEL','COURTHOUSE'],INDUSTRIAL:['GARAGE','FACTORY','POWER','SCRAPYARD'],RIVERSIDE:['DOCKS','MOTEL','RADIO','FERRY'],UNDERGROUND:['SUBWAY','LAB','VAULT','BUNKER'],UPTOWN:['MALL','POLICE','OFFICES','PENTHOUSE']};let slot=1,s;function fresh(){return{x:12,y:10,hp:100,en:100,lvl:1,xp:0,cash:80,ammo:18,grenades:2,heat:0,stealth:false,zone:'DOWNTOWN',inside:null,ix:5,iy:7,weapon:0,weapons:[{n:'Pipe',type:'melee',d:14},{n:'Revolver',type:'gun',d:25}],armor:1,bag:['Medkit','Scrap'],slots:12,enemies:[],objects:[],kills:0,mission:0,comp:true,compHP:90,rep:0,day:1,weather:'RAIN',particles:[],shots:[],shake:0,checkpoint:'DOWNTOWN',dialogue:{},deaths:0,sound:true}}function iso(a,b,z=0){return{x:O+(a-b)*W/2,y:60+(a+b)*H/2-z}}function poly(p,f){g.beginPath();g.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>g.lineTo(q.x,q.y));g.closePath();g.fillStyle=f;g.fill();g.strokeStyle='#0008';g.stroke()}function tile(a,b,f){poly([iso(a,b),iso(a+1,b),iso(a+1,b+1),iso(a,b+1)],f)}function shadow(a,b,r=15){let q=iso(a,b);g.fillStyle='#0009';g.beginPath();g.ellipse(q.x,q.y+5,r,r/3,0,0,7);g.fill()}function person(a,b,col='#288da0',big=1){let q=iso(a,b,5),bob=Math.sin(performance.now()/130+a)*2;shadow(a,b,16*big);g.save();g.translate(q.x,q.y+bob);g.fillStyle=col;g.shadowColor=col;g.shadowBlur=8;g.beginPath();g.roundRect(-9*big,-31*big,18*big,25*big,5);g.fill();g.strokeStyle='#17262b';g.lineWidth=5*big;g.beginPath();g.moveTo(-4*big,-7*big);g.lineTo(-7*big,10*big);g.moveTo(4*big,-7*big);g.lineTo(7*big,10*big);g.stroke();g.fillStyle='#c99b78';g.beginPath();g.arc(0,-39*big,7*big,0,7);g.fill();g.restore()}function health(e){let q=iso(e.x,e.y,52),w=36;g.fillStyle='#240b0f';g.fillRect(q.x-w/2,q.y,w,5);g.fillStyle=e.boss?'#ff3158':'#76e38c';g.fillRect(q.x-w/2,q.y,w*Math.max(0,e.hp/e.max),5)}function building(a,b,w,h,z,n,col){let d=iso(a,b+h),e=iso(a+w,b+h),t=iso(a,b,z),u=iso(a+w,b,z),v=iso(a,b+h,z),q=iso(a+w,b+h,z);poly([d,e,q,v],'#24383d');poly([iso(a+w,b),e,q,u],'#17282d');poly([t,u,q,v],col);let p=iso(a+w/2,b+h,z*.75);g.fillStyle='#dfffff';g.font='bold 11px system-ui';g.textAlign='center';g.fillText(n,p.x,p.y)}function city(){let base={DOWNTOWN:'#233a3d',OLD_TOWN:'#3d342f',INDUSTRIAL:'#3b3b34',RIVERSIDE:'#233e3b',UNDERGROUND:'#23242b',UPTOWN:'#303a45'}[s.zone];for(let a=0;a<27;a++)for(let b=0;b<21;b++)tile(a,b,(a%7===6||b%6===5)?'#141e22':base);let ns=zones[s.zone];[[1,1],[8,1],[15,1],[22,2]].forEach((p,i)=>building(p[0],p[1],4,3,90+i*15,ns[i],base));actors()}function interior(){for(let a=2;a<12;a++)for(let b=2;b<10;b++)tile(a,b,(a+b)%2?'#26363a':'#182429');for(let i=0;i<4;i++){let q=iso(3+i*2,4,10);g.fillStyle=i%2?'#735e48':'#4b6167';g.fillRect(q.x-24,q.y-20,48,24)}g.fillStyle='#dfffff';g.font='bold 20px system-ui';g.fillText(s.inside,420,45);actors()}function actors(){s.objects.forEach(o=>{if(o.hp>0){let q=iso(o.x,o.y,8);g.fillStyle=o.type==='barrel'?'#a33b31':'#5b6161';g.fillRect(q.x-12,q.y-20,24,22)}});s.enemies.forEach(e=>{if(e.hp>0){person(e.x,e.y,e.alert?'#b92f43':'#65545b',e.boss?1.6:1);health(e)}});if(s.comp&&s.compHP>0)person((s.inside?s.ix:s.x)-1,(s.inside?s.iy:s.y)+1,'#50b977');person(s.inside?s.ix:s.x,s.inside?s.iy:s.y,s.stealth?'#31535a':'#288da0')}function drawMini(){m.clearRect(0,0,112,82);m.fillStyle='#071319';m.fillRect(0,0,112,82);m.strokeStyle='#41636c';for(let i=1;i<4;i++){m.beginPath();m.moveTo(i*28,0);m.lineTo(i*28,82);m.stroke()}let px=(s.inside?s.ix/12:s.x/27)*108+2,py=(s.inside?s.iy/10:s.y/21)*78+2;m.fillStyle='#65efff';m.beginPath();m.arc(px,py,4,0,7);m.fill();m.fillStyle='#ff536d';s.enemies.filter(e=>e.hp>0&&e.alert).forEach(e=>{m.fillRect((e.x/(s.inside?12:27))*108,(e.y/(s.inside?10:21))*78,3,3)})}function fx(a,b,col,n=18){let q=iso(a,b,20);for(let i=0;i<n;i++)s.particles.push({x:q.x,y:q.y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:15,col})}function drawFx(){s.particles=s.particles.filter(p=>p.life-->0);s.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;g.globalAlpha=p.life/15;g.fillStyle=p.col;g.fillRect(p.x,p.y,3,3)});g.globalAlpha=1;s.shots=s.shots.filter(p=>p.life-->0);s.shots.forEach(p=>{g.strokeStyle=p.col;g.beginPath();g.moveTo(p.a.x,p.a.y);g.lineTo(p.b.x,p.b.y);g.stroke()})}function draw(){g.clearRect(0,0,960,600);g.save();if(s&&s.shake){g.translate((Math.random()-.5)*s.shake,(Math.random()-.5)*s.shake);s.shake*=.7}g.fillStyle='#071015';g.fillRect(-20,-20,1000,640);if(s){s.inside?interior():city();drawFx();drawMini()}g.restore();requestAnimationFrame(draw)}function spawn(){s.enemies=[];s.objects=[];let n=s.inside?2:3+Math.min(3,Math.floor(s.heat/25));for(let i=0;i<n;i++){let hp=40+s.lvl*7;s.enemies.push({x:(s.inside?7:16)+i%4,y:(s.inside?4:8)+i%3,hp,max:hp,alert:false,boss:false})}for(let i=0;i<5;i++)s.objects.push({x:(s.inside?3:7)+i*2,y:6+(i%2)*2,hp:25,type:i%2?'crate':'barrel'});if(s.mission>=3&&!s.inside){s.enemies.push({x:22,y:5,hp:260,max:260,alert:true,boss:true})}}function px(){return s.inside?s.ix:s.x}function py(){return s.inside?s.iy:s.y}function dist(e){return Math.abs(px()-e.x)+Math.abs(py()-e.y)}function nearest(r){return s.enemies.filter(e=>e.hp>0).sort((a,b)=>dist(a)-dist(b)).find(e=>dist(e)<=r)}function mv(dx,dy){if(s.inside){s.ix=Math.max(2,Math.min(11,s.ix+dx));s.iy=Math.max(2,Math.min(9,s.iy+dy))}else{s.x=Math.max(0,Math.min(26,s.x+dx));s.y=Math.max(0,Math.min(20,s.y+dy))}s.en=Math.max(0,s.en-1);enemyTurn();allyTurn();checkDeath();ui()}function attack(){let w=s.weapons[s.weapon],e=nearest(w.type==='melee'?2:8);if(!e)return msg('No target in range.');if(w.type==='gun'){if(!s.ammo)return msg('Out of ammo.');s.ammo--;s.shots.push({a:iso(px(),py(),22),b:iso(e.x,e.y,22),col:'#ffe58b',life:4});s.heat=Math.min(100,s.heat+8)}e.hp-=w.d;fx(e.x,e.y,'#ff637a');s.shake=4;kill(e);enemyTurn();allyTurn();checkDeath();ui()}function stealth(){s.stealth=!s.stealth;msg(s.stealth?'Stealth active. Detection reduced.':'Stealth off.');ui()}function takedown(){let e=nearest(1);if(!s.stealth||!e||e.alert)return msg('Need stealth beside an unaware enemy.');e.hp=0;kill(e);msg('<span class="good">Silent takedown.</span>');ui()}function grenade(){if(!s.grenades)return msg('No grenades.');s.grenades--;s.shake=13;s.enemies.forEach(e=>{if(dist(e)<=5){e.hp-=55;fx(e.x,e.y,'#ff9b45',30);kill(e)}});s.objects.forEach(o=>{if(Math.abs(px()-o.x)+Math.abs(py()-o.y)<=5)o.hp=0});beep(80,.15);enemyTurn();checkDeath();ui()}function kill(e){if(e.hp<=0&&!e.dead){e.dead=true;s.kills++;s.cash+=e.boss?200:18;s.xp+=e.boss?200:25;if(e.boss){s.mission=4;s.bag.push('Command Core')}while(s.xp>=100){s.xp-=100;s.lvl++;s.hp=100}}}function enemyTurn(){s.enemies.filter(e=>e.hp>0).forEach(e=>{let d=dist(e),detect=s.stealth?3:7;if(d<=detect)e.alert=true;if(!e.alert)return;if(d<=1)s.hp-=Math.max(3,10-s.armor);else{let dx=px()-e.x,dy=py()-e.y;if(Math.abs(dx)>Math.abs(dy))e.x+=Math.sign(dx);else e.y+=Math.sign(dy)}})}function allyTurn(){if(!s.comp||s.compHP<=0)return;let e=nearest(6);if(e&&e.alert){e.hp-=10;s.shots.push({a:iso(px()-1,py()+1,22),b:iso(e.x,e.y,22),col:'#7dffad',life:4});kill(e)}}function checkDeath(){if(s.hp>0)return;s.deaths++;s.hp=100;s.en=100;s.cash=Math.max(0,s.cash-25);s.zone=s.checkpoint;s.inside=null;s.x=12;s.y=10;s.heat=0;spawn();msg('<span class="danger">YOU DIED · respawned at '+s.checkpoint+' · $25 lost</span>')}function loot(){let o=s.objects.find(o=>o.hp<=0&&!o.looted&&Math.abs(px()-o.x)+Math.abs(py()-o.y)<=4);if(o){o.looted=true;let p=['Ammo','Scrap','Medkit','Grenade','Weapon Parts'],it=p[Math.floor(Math.random()*p.length)];if(it==='Ammo')s.ammo+=8;else if(it==='Grenade')s.grenades++;else if(s.bag.length<s.slots)s.bag.push(it);msg('Looted '+it+'.')}else msg('Nothing nearby to loot.');ui()}function buildingHere(){let names=zones[s.zone];if(s.x<6&&s.y<7)return names[0];if(s.x>7&&s.x<14&&s.y<7)return names[1];if(s.x>14&&s.x<21&&s.y<7)return names[2];if(s.x>21&&s.y<8)return names[3]}function interact(){if(s.inside){if(s.ix<=3&&s.iy>=7){s.inside=null;s.x=12;s.y=8;spawn();msg('Returned outside.')}else dialogue(s.inside);return ui()}let b=buildingHere();if(!b)return msg('Move to a marked building.');s.inside=b;s.ix=4;s.iy=8;spawn();msg('Entered '+b+'.');ui()}function dialogue(p){if(p.includes('MARKET')||p.includes('PAWN')||p.includes('MALL'))return shop();if(p.includes('CLINIC'))return show('<h2>Clinic</h2><button onclick="heal()">Heal fully · $30</button>');if(p.includes('SAFEHOUSE')){s.checkpoint=s.zone;return msg('<span class="good">Checkpoint updated.</span>')}if(p.includes('RADIO')&&s.mission===0)return choice('Radio Operator','A signal is repeating tomorrow’s emergency broadcasts.',['Trace it','Ignore it'],v=>{if(v===0)s.mission=1});if(p.includes('POWER')&&s.mission===1)return choice('Engineer','I can give you the Grid Key, but the Wardens want it too.',['Take key','Leave it'],v=>{if(v===0){s.mission=2;s.bag.push('Grid Key')}});if(p.includes('POLICE')&&s.mission===2){s.mission=3;s.inside=null;spawn();return msg('<span class="danger">COMMAND ECHO DEPLOYED OUTSIDE.</span>')}return choice('Survivor','Every district is changing. People remember things that have not happened.',['Ask about Echoes','Ask about supplies'],v=>{s.rep+=(v===0?2:1)})}function choice(name,text,opts,cb){show('<h2>'+name+'</h2><p>'+text+'</p>'+opts.map((o,i)=>'<button onclick="choose('+i+')">'+o+'</button>').join(''));window.choiceCB=cb}function choose(i){choiceCB(i);closeM();ui()}function shop(){show('<h2>Trader · $'+s.cash+'</h2><button onclick="buy(\'ammo\',25)">12 Ammo $25</button><button onclick="buy(\'grenade\',35)">Grenade $35</button><button onclick="buy(\'shotgun\',100)">Shotgun $100</button><button onclick="buy(\'rifle\',160)">Rifle $160</button>')}function buy(k,c){if(s.cash<c)return alert('Not enough cash');s.cash-=c;if(k==='ammo')s.ammo+=12;if(k==='grenade')s.grenades++;if(k==='shotgun'&&!s.weapons.some(w=>w.n==='Shotgun'))s.weapons.push({n:'Shotgun',type:'gun',d:42});if(k==='rifle'&&!s.weapons.some(w=>w.n==='Rifle'))s.weapons.push({n:'Rifle',type:'gun',d:55});shop();ui()}function heal(){if(s.cash<30)return alert('Need $30');s.cash-=30;s.hp=100;closeM();ui()}function map(){show('<h2>City Map</h2>'+Object.keys(zones).map(z=>'<button onclick="go(\''+z+'\')">'+z+'</button>').join(''))}function go(z){s.zone=z;s.inside=null;s.x=12;s.y=10;s.day+=.25;s.weather=Math.random()<.3?'STORM':Math.random()<.7?'RAIN':'CLEAR';spawn();closeM();ui()}function inventory(){show('<h2>Inventory '+s.bag.length+'/'+s.slots+'</h2><p>'+s.bag.join(' · ')+'</p><p>Grenades '+s.grenades+' · Armor '+s.armor+'</p><button onclick="useMed()">Use Medkit</button>')}function useMed(){let i=s.bag.indexOf('Medkit');if(i<0)return alert('No Medkit');s.bag.splice(i,1);s.hp=Math.min(100,s.hp+55);closeM();ui()}function weapons(){show('<h2>Weapons</h2>'+s.weapons.map((w,i)=>'<button onclick="equip('+i+')">'+(i===s.weapon?'✓ ':'')+w.n+' · '+w.d+' DMG</button>').join(''))}function equip(i){s.weapon=i;closeM();ui()}function missions(){show('<h2>Main Quest</h2><p>'+(s.mission>0?'✓':'○')+' Investigate Riverside Radio</p><p>'+(s.mission>1?'✓':'○')+' Get Grid Key at Industrial Power</p><p>'+(s.mission>2?'✓':'○')+' Reach Uptown Police</p><p>'+(s.mission>3?'✓':'○')+' Defeat Command Echo</p><p>Deaths '+s.deaths+' · Kills '+s.kills+' · Reputation '+s.rep+'</p>')}function systemMenu(){show('<h2>System</h2><button onclick="saveSlot(1)">Save Slot 1</button><button onclick="saveSlot(2)">Save Slot 2</button><button onclick="saveSlot(3)">Save Slot 3</button><button onclick="toggleSound()">Sound '+(s.sound?'ON':'OFF')+'</button><button onclick="tutorial()">Tutorial</button><button onclick="titleScreen()">Title Screen</button>')}function saveSlot(n){localStorage.setItem('echo20slot'+n,JSON.stringify(s));slot=n;msg('Saved to slot '+n+'.');closeM()}function loadSlot(n){slot=n;s=JSON.parse(localStorage.getItem('echo20slot'+n)||'null')||fresh();spawn();title.classList.add('hidden');msg('Loaded slot '+n+'.');ui()}function newGame(){s=fresh();slot=1;spawn();title.classList.add('hidden');tutorial();ui()}function titleScreen(){closeM();title.classList.remove('hidden')}function tutorial(){show('<h2>How to Play</h2><p>Move with arrows. Enter marked buildings with USE/ENTER. ATTACK uses the equipped weapon. STEALTH reduces detection and enables TAKEDOWN. BLAST damages groups and objects. LOOT destroyed containers. Use MAP to travel. Safehouses become respawn checkpoints. Save manually in SYSTEM; autosave also runs while playing.</p>')}function toggleSound(){s.sound=!s.sound;closeM();ui()}function beep(freq=.1,d=.05){if(!s.sound)return;try{let a=new(window.AudioContext||window.webkitAudioContext),o=a.createOscillator(),v=a.createGain();o.frequency.value=freq;v.gain.value=.025;o.connect(v);v.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}function show(h){card.innerHTML=h+'<button onclick="closeM()">CLOSE</button>';modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}function msg(t){story.innerHTML=t}function autosave(){if(s)localStorage.setItem('echo20slot'+slot,JSON.stringify(s))}function ui(){if(!s)return;hp.textContent=Math.max(0,Math.round(s.hp));en.textContent=Math.round(s.en);lvl.textContent=s.lvl;ammo.textContent=s.ammo;cash.textContent=s.cash;heat.textContent=Math.round(s.heat);place.textContent=s.inside||s.zone;day.textContent=s.day.toFixed(1);status.textContent=(s.stealth?'STEALTH · ':'')+s.weather+' · '+s.weapons[s.weapon].n+' '+s.weapons[s.weapon].d+'DMG · Armor '+s.armor+' · Grenades '+s.grenades+' · Mara '+s.compHP+'HP · Mission '+s.mission+'/4';autosave()}s=fresh();spawn();draw();</script></body></html>
