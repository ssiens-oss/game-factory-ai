'#7d3947','#356682','#80643f','#43715d'][i%4];g.beginPath();g.roundRect(-31,-14,62,24,8);g.fill();let grad=g.createLinearGradient(-15,-25,16,-9);grad.addColorStop(0,'#9ee8f399');grad.addColorStop(1,'#10252d');g.fillStyle=grad;g.beginPath();g.roundRect(-16,-25,34,17,6);g.fill();g.fillStyle='#050708';g.beginPath();g.arc(-20,10,7,0,7);g.arc(20,10,7,0,7);g.fill();g.strokeStyle='#69777b';g.lineWidth=2;g.beginPath();g.arc(-20,10,3,0,7);g.arc(20,10,3,0,7);g.stroke();g.fillStyle='#fff2a8';g.fillRect(-31,-7,4,7);g.fillStyle='#f34b46';g.fillRect(28,-7,3,7);g.restore()}function tree(x,y,dead=false){let a=iso(x,y),b=iso(x,y,48);g.strokeStyle='#513a2d';g.lineWidth=7;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();for(let i=0;i<9;i++){g.fillStyle=dead?'#403a34':i%2?'#244e3b':'#326149';g.beginPath();g.arc(b.x+(i-4)*6,b.y-(i%3)*8,dead?6:14,0,7);g.fill()}}function person(x,y,c,big=1){let p=iso(x,y,5),t=performance.now(),w=Math.sin(t/115+x)*4,bob=Math.abs(Math.sin(t/180+x))*2;g.save();g.translate(p.x,p.y-bob);g.scale(big,big);g.fillStyle='#000c';g.beginPath();g.ellipse(0,7,22,7,0,0,7);g.fill();g.strokeStyle='#11191d';g.lineCap='round';g.lineWidth=8;g.beginPath();g.moveTo(-6,-12);g.lineTo(-9+w,-1);g.moveTo(6,-12);g.lineTo(9-w,-1);g.stroke();g.fillStyle='#17262b';g.beginPath();g.roundRect(-14,-41,28,32,7);g.fill();g.fillStyle=c;g.beginPath();g.roundRect(-15,-39,30,23,7);g.fill();g.fillStyle='#101a1f';g.fillRect(-14,-26,28,6);g.fillStyle='#39464a';g.fillRect(-8,-25,6,7);g.strokeStyle='#c99a76';g.lineWidth=6;g.beginPath();g.moveTo(-12,-34);g.lineTo(-20,-18-w*.2);g.moveTo(12,-34);g.lineTo(20,-18+w*.2);g.stroke();g.fillStyle='#c99a76';g.beginPath();g.arc(0,-53,10,0,7);g.fill();g.fillStyle='#251e20';g.beginPath();g.arc(0,-57,10,Math.PI,6.2);g.fill();g.fillStyle='#111';g.fillRect(-6,-53,3,2);g.fillRect(3,-53,3,2);g.strokeStyle='#273238';g.lineWidth=5;g.beginPath();g.moveTo(11,-30);g.lineTo(32,-24);g.stroke();g.fillStyle='#3b4a4f';g.fillRect(26,-28,12,6);g.fillStyle='#151b1e';g.fillRect(31,-22,4,6);g.restore()}function spawn(){s.enemies=[];for(let i=0;i<6;i++){let h=50+s.lvl*7;s.enemies.push({x:17+i%3,y:7+(i*2)%11,hp:h,max:h,alert:false,boss:i===5&&s.lvl>2})}}function fx(x,y,c,n=18){let p=iso(x,y,27);for(let i=0;i<n;i++)s.particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,l:22,c})}function draw(){requestAnimationFrame(draw);if(!s)return;g.save();if(s.shake>1){g.translate((Math.random()-.5)*s.shake,(Math.random()-.5)*s.shake);s.shake*=.72}let sky=g.createLinearGradient(0,0,0,810);sky.addColorStop(0,['#173d4c','#493738','#303d3b','#164553','#20232e','#2d435f'][s.zone]);sky.addColorStop(.52,'#0a171d');sky.addColorStop(1,'#010406');g.fillStyle=sky;g.fillRect(0,0,1440,810);let moon=g.createRadialGradient(1130,105,4,1130,105,100);moon.addColorStop(0,'#dffaffcc');moon.addColorStop(.12,'#9ed9e944');moon.addColorStop(1,'#8ed7e900');g.fillStyle=moon;g.beginPath();g.arc(1130,105,100,0,7);g.fill();g.fillStyle='#0a151a';for(let i=0;i<22;i++){let h=170+(i%5)*32;g.fillRect(i*72,205-h*.4,50,h);for(let r=0;r<4;r++){g.fillStyle=(i+r)%3?'#75dbea18':'#ffc96b14';g.fillRect(i*72+8,225-h*.4+r*26,8,12)}}for(let x=0;x<27;x++)for(let y=0;y<21;y++)x%7===6||y%6===5?road(x,y):tile(x,y,(x+y)%2?'#293c3f':'#34494c');building(1,1,4,3,130,0);building(8,1,4,3,150,1);building(15,1,4,3,170,2);building(22,2,4,3,144,3);for(let i=0;i<9;i++){lamp(4+(i*5)%23,8+(i*4)%12);tree(2+(i*4)%25,9+(i*3)%11,s.zone===2);car(5+(i*6)%21,10+(i*5)%10,i)}s.loot.forEach(l=>{let p=iso(l.x,l.y,13+Math.sin(performance.now()/160)*6);g.shadowColor='#6cf7ff';g.shadowBlur=34;g.fillStyle='#c2ffff';g.beginPath();g.moveTo(p.x,p.y-10);g.lineTo(p.x+9,p.y);g.lineTo(p.x,p.y+10);g.lineTo(p.x-9,p.y);g.fill();g.shadowBlur=0});s.enemies.filter(e=>e.hp>0).forEach(e=>{person(e.x,e.y,e.boss?'#e52f54':'#a63b4f',e.boss?1.5:1);let p=iso(e.x,e.y,e.boss?94:73),w=e.boss?74:48;g.fillStyle='#160609';g.fillRect(p.x-w/2,p.y,w,7);g.fillStyle=e.boss?'#ff365c':'#62e18e';g.fillRect(p.x-w/2,p.y,w*Math.max(0,e.hp/e.max),7)});person(s.x,s.y,s.stealth?'#77755e':'#218fa9');s.shots=s.shots.filter(a=>a.l-->0);s.shots.forEach(a=>{g.shadowColor='#ffe681';g.shadowBlur=22;g.strokeStyle='#fff4b0';g.lineWidth=4;g.beginPath();g.moveTo(a.a.x,a.a.y);g.lineTo(a.b.x,a.b.y);g.stroke();g.shadowBlur=0});s.particles=s.particles.filter(p=>p.l-->0);s.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;g.globalAlpha=p.l/22;g.fillStyle=p.c;g.fillRect(p.x,p.y,5,5)});g.globalAlpha=1;g.strokeStyle='#e4fbff4b';for(let i=0;i<130;i++){let x=(i*97+performance.now()*.38)%1500,y=(i*57+performance.now()*.86)%850;g.beginPath();g.moveTo(x,y);g.lineTo(x-10,y+28);g.stroke()}if(flash>0){g.fillStyle='#ff24402b';g.fillRect(0,0,1440,810);flash--}let fog=g.createLinearGradient(0,400,0,810);fog.addColorStop(0,'#c5eef000');fog.addColorStop(1,'#b8dfe018');g.fillStyle=fog;g.fillRect(0,0,1440,810);let v=g.createRadialGradient(720,400,260,720,400,800);v.addColorStop(0,'#0000');v.addColorStop(1,'#000e');g.fillStyle=v;g.fillRect(0,0,1440,810);g.restore()}function dist(e){return Math.abs(s.x-e.x)+Math.abs(s.y-e.y)}function near(r){return s.enemies.filter(e=>e.hp>0).sort((a,b)=>dist(a)-dist(b)).find(e=>dist(e)<=r)}function move(dx,dy){s.x=Math.max(0,Math.min(26,s.x+dx));s.y=Math.max(0,Math.min(20,s.y+dy));turn();ui()}function turn(){s.enemies.filter(e=>e.hp>0).forEach(e=>{let d=dist(e);if(d<=(s.stealth?3:8))e.alert=true;if(!e.alert)return;if(d<=1){s.hp-=Math.max(3,(e.boss?15:9)-s.armor);flash=6}else if(Math.abs(s.x-e.x)>Math.abs(s.y-e.y))e.x+=Math.sign(s.x-e.x);else e.y+=Math.sign(s.y-e.y)});if(s.hp<=0){s.hp=100;s.cash=Math.max(0,s.cash-25);s.combo=0;s.x=13;s.y=11;spawn();msg('RESPAWNED · -25 CREDITS')}}function attack(){let w=s.weapons[s.weapon],e=near(w[2]);if(!e)return msg('NO TARGET IN RANGE');if(s.weapon){if(!s.ammo)return msg('OUT OF AMMO');s.ammo--}s.shots.push({a:iso(s.x,s.y,29),b:iso(e.x,e.y,29),l:5});e.hp-=w[1];s.shake=6;fx(e.x,e.y,'#ff526c');navigator.vibrate?.(25);if(e.hp<=0){s.cash+=e.boss?100:20;s.xp+=e.boss?60:25;s.combo++;s.loot.push({x:e.x,y:e.y});fx(e.x,e.y,'#ffd15c',30);if(s.xp>=100){s.xp-=100;s.lvl++;s.hp=100;msg('LEVEL UP · '+s.lvl)}}turn();ui()}function blast(){if(!s.grenades)return msg('NO GRENADES');s.grenades--;s.shake=20;s.enemies.forEach(e=>{if(e.hp>0&&dist(e)<=5){e.hp-=70;fx(e.x,e.y,'#ff9d42',42);if(e.hp<=0){s.loot.push({x:e.x,y:e.y});s.cash+=20;s.combo++}}});navigator.vibrate?.([40,30,80]);ui()}function takeLoot(){let i=s.loot.findIndex(l=>Math.abs(l.x-s.x)+Math.abs(l.y-s.y)<=2);if(i<0)return msg('NO LOOT NEARBY');s.loot.splice(i,1);let c=10+Math.floor(Math.random()*21);s.cash+=c;s.ammo+=5;msg('LOOT · +'+c+' CREDITS · +5 AMMO');ui()}function msg(x){$('story').textContent=x}function ui(){if(!s)return;$('hp').textContent=Math.max(0,s.hp);$('lvl').textContent=s.lvl;$('ammo').textContent=s.ammo;$('cash').textContent=s.cash;$('armor').textContent=s.armor;$('combo').textContent=s.combo;$('zone').textContent=Z[s.zone];$('status').textContent=(s.stealth?'STEALTH · ':'')+s.weapons[s.weapon][0]+' · '+s.weapons[s.weapon][1]+' DMG · GRENADES '+s.grenades+' · HOSTILES '+s.enemies.filter(e=>e.hp>0).length;localStorage.setItem('echo30',JSON.stringify(s))}function show(h){$('card').innerHTML=h+'<button id="close">CLOSE</button>';$('modal').classList.remove('hidden');$('close').onclick=()=>$('modal').classList.add('hidden')}function map(){show('<h2>TRAVEL</h2>'+Z.map((z,i)=>'<button data-z="'+i+'">'+z+'</button>').join(''));document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{s.zone=+b.dataset.z;s.x=13;s.y=11;spawn();$('modal').classList.add('hidden');msg('ENTERED '+Z[s.zone]);ui()})}function start(load){s=load?JSON.parse(localStorage.getItem('echo30')||'null'):null;if(!s)s=fresh();spawn();$('title').classList.add('hidden');ui()}$('new').onclick=()=>start(false);$('cont').onclick=()=>start(true);$('fire').onclick=attack;$('blast').onclick=blast;$('loot').onclick=takeLoot;$('stealth').onclick=()=>{s.stealth=!s.stealth;ui()};$('swap').onclick=()=>{s.weapon=(s.weapon+1)%s.weapons.length;msg('EQUIPPED '+s.weapons[s.weapon][0]);ui()};$('map').onclick=map;$('use').onclick=()=>msg('SIGNAL SCAN · '+Z[s.zone]+' · ANOMALY DETECTED');document.addEventListener('keydown',e=>{if(!s)return;let k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')move(0,-1);if(k==='s'||e.key==='ArrowDown')move(0,1);if(k==='a'||e.key==='ArrowLeft')move(-1,0);if(k==='d'||e.key==='ArrowRight')move(1,0);if(e.key===' ')attack()});let active=false,cx=0,cy=0,last=0;$('joy').onpointerdown=e=>{active=true;$('joy').setPointerCapture(e.pointerId);let r=$('joy').getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2};$('joy').onpointermove=e=>{if(!active||!s)return;let dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy)||1,L=30;if(mag>L){dx=dx/mag*L;dy=dy/mag*L}$('stick').style.transform=`translate(${dx}px,${dy}px)`;if(Date.now()-last>110&&Math.hypot(dx,dy)>12){last=Date.now();Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy))}};let end=()=>{active=false;$('stick').style.transform=''};$('joy').onpointerup=end;$('joy').onpointercancel=end;draw()})();</script></body></html>
