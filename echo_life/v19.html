<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v19</title><style>*{box-sizing:border-box}body{margin:0;background:#020609;color:#eaffff;font-family:system-ui;text-align:center}main{max-width:920px;margin:auto;padding:6px}h1{margin:2px;letter-spacing:8px;text-shadow:0 0 12px #6deeff,0 0 35px #147f95}.hud{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}.hud div,.panel{background:#0a2028ed;border:1px solid #376b76;border-radius:9px;padding:6px;font-size:10px}canvas{width:100%;aspect-ratio:16/10;border:1px solid #528995;border-radius:14px;background:#071015;touch-action:none;box-shadow:0 25px 70px #000}.pad{width:180px;margin:5px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.pad i{visibility:hidden}button{border:1px solid #4ea7b6;background:linear-gradient(#23798a,#0d4350);color:#fff;border-radius:8px;padding:9px;font-weight:800}.actions,.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.actions button,.tabs button{font-size:9px;padding:9px 1px}.tabs{margin-top:3px}.good{color:#8fffc5}.danger{color:#ff7187}.gold{color:#ffe279}.modal{position:fixed;inset:0;background:#010407ed;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.card{width:min(540px,100%);max-height:82vh;overflow:auto;background:#0b1d24;border:1px solid #43808c;border-radius:15px;padding:15px;text-align:left}.card button{width:100%;margin:3px}.hidden{display:none}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>EN<br><b id="en">100</b></div><div>LVL<br><b id="lvl">1</b></div><div>AMMO<br><b id="ammo">18</b></div><div>$<br><b id="cash">80</b></div><div>HEAT<br><b id="heat">0</b></div><div>STANCE<br><b id="stance">OPEN</b></div><div>ZONE<br><b id="zone">DOWNTOWN</b></div></div><div id="story" class="panel">v19: expanded city, stealth, destruction, arsenal and NPC economy.</div><canvas id="view" width="960" height="600"></canvas><div class="pad"><i></i><button onclick="mv(0,-1)">▲</button><i></i><button onclick="mv(-1,0)">◀</button><button onclick="interact()">◎</button><button onclick="mv(1,0)">▶</button><i></i><button onclick="mv(0,1)">▼</button><i></i></div><div class="actions"><button onclick="attack()">ATTACK</button><button onclick="stealth()">STEALTH</button><button onclick="takedown()">TAKEDOWN</button><button onclick="grenade()">BLAST</button><button onclick="loot()">LOOT</button><button onclick="interact()">TALK/USE</button></div><div class="tabs"><button onclick="map()">MAP</button><button onclick="inventory()">INVENTORY</button><button onclick="weapons()">WEAPONS</button><button onclick="shop()">SHOP</button><button onclick="missions()">MISSIONS</button><button onclick="help()">HELP</button></div><div id="status" class="panel"></div></main><div id="modal" class="modal hidden"><div id="card" class="card"></div></div><script>const C=view,g=C.getContext('2d'),W=58,H=29,O=480;let s=JSON.parse(localStorage.getItem('echo19')||'null')||{x:12,y:10,hp:100,en:100,lvl:1,xp:0,cash:80,ammo:18,grenades:2,heat:0,stealth:false,zone:'DOWNTOWN',weapon:0,weapons:[{n:'Pipe',type:'melee',d:14},{n:'Revolver',type:'gun',d:25}],armor:1,bag:['Medkit','Scrap'],slots:12,enemies:[],objects:[],kills:0,mission:0,comp:true,compHP:90,rep:0,day:1,weather:'RAIN',particles:[],shots:[],shake:0};const zones={DOWNTOWN:['MARKET','CLINIC','TOWER','SAFEHOUSE'],OLD_TOWN:['CHURCH','PAWN SHOP','HOTEL','COURTHOUSE'],INDUSTRIAL:['GARAGE','FACTORY','POWER','SCRAPYARD'],RIVERSIDE:['DOCKS','MOTEL','RADIO','FERRY'],UNDERGROUND:['SUBWAY','LAB','VAULT','BUNKER'],UPTOWN:['MALL','POLICE','OFFICES','PENTHOUSE']};function iso(a,b,z=0){return{x:O+(a-b)*W/2,y:60+(a+b)*H/2-z}}function poly(p,f){g.beginPath();g.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>g.lineTo(q.x,q.y));g.closePath();g.fillStyle=f;g.fill();g.strokeStyle='#0008';g.stroke()}function tile(a,b,f){poly([iso(a,b),iso(a+1,b),iso(a+1,b+1),iso(a,b+1)],f)}function shadow(a,b,r=15){let q=iso(a,b);g.fillStyle='#0009';g.beginPath();g.ellipse(q.x,q.y+5,r,r/3,0,0,7);g.fill()}function person(a,b,col='#288da0',big=1){let q=iso(a,b,5),bob=Math.sin(performance.now()/130+a)*2;shadow(a,b,16*big);g.save();g.translate(q.x,q.y+bob);g.shadowColor=col;g.shadowBlur=8;g.fillStyle=col;g.beginPath();g.roundRect(-9*big,-31*big,18*big,25*big,5);g.fill();g.strokeStyle='#17262b';g.lineWidth=5*big;g.beginPath();g.moveTo(-4*big,-7*big);g.lineTo(-7*big,10*big);g.moveTo(4*big,-7*big);g.lineTo(7*big,10*big);g.stroke();g.fillStyle='#c99b78';g.beginPath();g.arc(0,-39*big,7*big,0,7);g.fill();g.restore()}function building(a,b,w,h,z,n,col){let d=iso(a,b+h),e=iso(a+w,b+h),t=iso(a,b,z),u=iso(a+w,b,z),v=iso(a,b+h,z),q=iso(a+w,b+h,z);poly([d,e,q,v],'#24383d');poly([iso(a+w,b),e,q,u],'#17282d');poly([t,u,q,v],col);let m=iso(a+w/2,b+h,z*.75);g.save();g.shadowColor='#78efff';g.shadowBlur=15;g.fillStyle='#dfffff';g.font='bold 11px system-ui';g.textAlign='center';g.fillText(n,m.x,m.y);g.restore()}function world(){let base={DOWNTOWN:'#233a3d',OLD_TOWN:'#3d342f',INDUSTRIAL:'#3b3b34',RIVERSIDE:'#233e3b',UNDERGROUND:'#23242b',UPTOWN:'#303a45'}[s.zone];for(let a=0;a<27;a++)for(let b=0;b<21;b++)tile(a,b,(a%7===6||b%6===5)?'#141e22':base);let ns=zones[s.zone];[[1,1],[8,1],[15,1],[22,2]].forEach((p,i)=>building(p[0],p[1],4,3,90+i*15,ns[i],base));s.objects.forEach(o=>{if(o.hp>0){let q=iso(o.x,o.y,8);g.fillStyle=o.type==='barrel'?'#a33b31':'#5b6161';g.fillRect(q.x-13,q.y-22,26,24)}});s.enemies.forEach(e=>{if(e.hp>0)person(e.x,e.y,e.alert?'#b92f43':'#65545b',e.boss?1.6:1)});if(s.comp&&s.compHP>0)person(s.x-1,s.y+1,'#50b977');person(s.x,s.y,s.stealth?'#31535a':'#288da0')}function fx(a,b,col,n=20){let q=iso(a,b,20);for(let i=0;i<n;i++)s.particles.push({x:q.x,y:q.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:10+Math.random()*15,col})}function drawFx(){s.particles=s.particles.filter(p=>p.life-->0);s.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;g.globalAlpha=p.life/25;g.fillStyle=p.col;g.fillRect(p.x,p.y,4,4)});g.globalAlpha=1;s.shots=s.shots.filter(p=>p.life-->0);s.shots.forEach(p=>{g.strokeStyle=p.col;g.lineWidth=2;g.beginPath();g.moveTo(p.a.x,p.a.y);g.lineTo(p.b.x,p.b.y);g.stroke()})}function draw(){g.clearRect(0,0,960,600);g.save();if(s.shake){g.translate((Math.random()-.5)*s.shake,(Math.random()-.5)*s.shake);s.shake*=.7}let bg=g.createLinearGradient(0,0,0,600);bg.addColorStop(0,'#14272e');bg.addColorStop(1,'#020608');g.fillStyle=bg;g.fillRect(-30,-30,1020,660);world();if(s.weather!=='CLEAR'&&s.zone!=='UNDERGROUND'){g.strokeStyle='#d9f8ff55';for(let i=0;i<90;i++){let x=(i*71+performance.now()/6)%1000,y=(i*41+performance.now()/2.5)%650;g.beginPath();g.moveTo(x,y);g.lineTo(x-7,y+20);g.stroke()}}drawFx();let v=g.createRadialGradient(480,300,190,480,300,520);v.addColorStop(0,'#0000');v.addColorStop(1,'#000c');g.fillStyle=v;g.fillRect(0,0,960,600);g.restore();requestAnimationFrame(draw)}function spawn(){s.enemies=[];s.objects=[];let n=3+Math.min(4,Math.floor(s.heat/20));for(let i=0;i<n;i++)s.enemies.push({x:16+i%4,y:8+i%3,hp:40+s.lvl*7,alert:false,boss:false});for(let i=0;i<6;i++)s.objects.push({x:7+i*3,y:6+(i%3)*3,hp:25,type:i%2?'crate':'barrel'});if(s.mission>=3)s.enemies.push({x:22,y:5,hp:260,alert:true,boss:true})}function nearest(r){return s.enemies.filter(e=>e.hp>0).sort((a,b)=>dist(a)-dist(b)).find(e=>dist(e)<=r)}function dist(e){return Math.abs(s.x-e.x)+Math.abs(s.y-e.y)}function mv(dx,dy){s.x=Math.max(0,Math.min(26,s.x+dx));s.y=Math.max(0,Math.min(20,s.y+dy));s.en=Math.max(0,s.en-1);if(!s.stealth)s.heat=Math.min(100,s.heat+.4);enemyTurn();allyTurn();ui()}function attack(){let w=s.weapons[s.weapon],r=w.type==='melee'?2:8,e=nearest(r);if(!e)return msg('No target in '+(w.type==='melee'?'melee':'weapon')+' range.');if(w.type==='gun'){if(!s.ammo)return msg('Out of ammo.');s.ammo--;let a=iso(s.x,s.y,22),b=iso(e.x,e.y,22);s.shots.push({a,b,col:'#ffe58b',life:4});s.heat=Math.min(100,s.heat+10)}e.hp-=w.d;fx(e.x,e.y,'#ff637a');s.shake=4;msg(w.n+' hits for '+w.d+'.');kill(e);enemyTurn();allyTurn();ui()}function stealth(){s.stealth=!s.stealth;s.en=Math.max(0,s.en-5);msg(s.stealth?'STEALTH MODE: detection radius reduced.':'Stealth disengaged.');ui()}function takedown(){if(!s.stealth)return msg('Enter stealth first.');let e=nearest(1);if(!e)return msg('Sneak directly beside an enemy.');if(e.alert)return msg('Enemy is alert — takedown unavailable.');e.hp=0;s.heat=Math.max(0,s.heat-8);kill(e);msg('<span class="good">SILENT TAKEDOWN.</span>');ui()}function grenade(){if(!s.grenades)return msg('No explosives.');s.grenades--;s.shake=14;s.heat=Math.min(100,s.heat+25);s.enemies.forEach(e=>{if(dist(e)<=5){e.hp-=55;fx(e.x,e.y,'#ff9a3c',35);kill(e)}});s.objects.forEach(o=>{let d=Math.abs(s.x-o.x)+Math.abs(s.y-o.y);if(d<=5){o.hp=0;fx(o.x,o.y,'#ffc04f',25)}});msg('<span class="danger">BLAST — nearby enemies and objects damaged.</span>');enemyTurn();ui()}function kill(e){if(e.hp<=0&&!e.dead){e.dead=true;s.kills++;s.cash+=e.boss?200:18;s.xp+=e.boss?200:25;if(e.boss){s.mission=4;s.bag.push('Command Core')}while(s.xp>=100){s.xp-=100;s.lvl++;s.hp=100}}}function enemyTurn(){s.enemies.filter(e=>e.hp>0).forEach(e=>{let d=dist(e),detect=s.stealth?3:7;if(d<=detect)e.alert=true;if(!e.alert)return;if(d<=1){s.hp-=Math.max(3,10-s.armor);s.shake=5}else{let dx=s.x-e.x,dy=s.y-e.y;if(Math.abs(dx)>Math.abs(dy))e.x+=Math.sign(dx);else e.y+=Math.sign(dy)}})}function allyTurn(){if(!s.comp||s.compHP<=0)return;let e=nearest(6);if(e&&e.alert){e.hp-=10;let a=iso(s.x-1,s.y+1,22),b=iso(e.x,e.y,22);s.shots.push({a,b,col:'#7dffad',life:4});kill(e)}}function loot(){let o=s.objects.find(o=>o.hp<=0&&!o.looted&&Math.abs(s.x-o.x)+Math.abs(s.y-o.y)<=4);if(o){o.looted=true;let p=['Ammo','Scrap','Medkit','Grenade','Weapon Parts'],it=p[Math.floor(Math.random()*p.length)];if(it==='Ammo')s.ammo+=8;else if(it==='Grenade')s.grenades++;else if(s.bag.length<s.slots)s.bag.push(it);return msg('<span class="gold">Salvaged '+it+'.</span>')}if(s.enemies.some(e=>e.hp>0))return msg('Area is still hostile.');s.cash+=15;msg('Area salvage sold for $15.');ui()}function interact(){let names=zones[s.zone];if(s.x<6&&s.y<7)return npc(names[0]);if(s.x>7&&s.x<14&&s.y<7)return npc(names[1]);if(s.x>14&&s.x<21&&s.y<7)return npc(names[2]);if(s.x>21&&s.y<8)return npc(names[3]);msg('Nothing to interact with here.')}function npc(place){if(place.includes('MARKET')||place.includes('PAWN')||place.includes('MALL'))return shop();if(place.includes('CLINIC'))return show('<h2>CLINIC</h2><button onclick="heal()">Full heal $30</button>');if(place.includes('RADIO')&&s.mission===0){s.mission=1;return msg('Radio operator: "The Command signal moved to Uptown."')}if(place.includes('POWER')&&s.mission===1){s.mission=2;s.bag.push('Grid Key');return msg('Engineer: Grid Key acquired. Find the Police station in Uptown.')}if(place.includes('POLICE')&&s.mission===2){s.mission=3;spawn();return msg('<span class="danger">COMMAND ECHO DEPLOYED. Eliminate it.</span>')}show('<h2>'+place+'</h2><p>A survivor shares rumors, trade routes and safe locations.</p><button onclick="rumor()">Ask for rumor</button>')}function rumor(){s.rep++;closeM();msg('Rumor added: destroyed containers can hide rare weapon parts.');ui()}function shop(){show('<h2>TRADER</h2><p>$'+s.cash+'</p><button onclick="buy(\'ammo\',25)">12 Ammo — $25</button><button onclick="buy(\'grenade\',35)">Grenade — $35</button><button onclick="buy(\'med\',30)">Medkit — $30</button><button onclick="buy(\'shotgun\',100)">Shotgun — $100</button><button onclick="buy(\'rifle\',160)">Rifle — $160</button>')}function buy(k,c){if(s.cash<c)return alert('Not enough cash');s.cash-=c;if(k==='ammo')s.ammo+=12;if(k==='grenade')s.grenades++;if(k==='med')s.bag.push('Medkit');if(k==='shotgun'&&!s.weapons.some(w=>w.n==='Shotgun'))s.weapons.push({n:'Shotgun',type:'gun',d:42});if(k==='rifle'&&!s.weapons.some(w=>w.n==='Rifle'))s.weapons.push({n:'Rifle',type:'gun',d:55});shop();ui()}function heal(){if(s.cash<30)return alert('Need $30');s.cash-=30;s.hp=100;closeM();ui()}function map(){show('<h2>EXPANDED CITY</h2>'+Object.keys(zones).map(z=>'<button onclick="go(\''+z+'\')">'+z+' · '+zones[z].join(' / ')+'</button>').join(''))}function go(z){s.zone=z;s.x=12;s.y=10;s.day+=.25;s.weather=Math.random()<.25?'STORM':Math.random()<.65?'RAIN':'CLEAR';s.stealth=false;spawn();closeM();msg('Entered '+z+'.');ui()}function inventory(){show('<h2>INVENTORY '+s.bag.length+'/'+s.slots+'</h2><p>'+s.bag.join(' · ')+'</p><p>Grenades '+s.grenades+' · Armor '+s.armor+'</p><button onclick="useMed()">Use Medkit</button>')}function useMed(){let i=s.bag.indexOf('Medkit');if(i<0)return alert('No Medkit');s.bag.splice(i,1);s.hp=Math.min(100,s.hp+55);closeM();ui()}function weapons(){show('<h2>ARSENAL</h2>'+s.weapons.map((w,i)=>'<button onclick="equip('+i+')">'+(i===s.weapon?'✓ ':'')+w.n+' · '+w.d+' DMG · '+w.type+'</button>').join(''))}function equip(i){s.weapon=i;closeM();msg('Equipped '+s.weapons[i].n+'.');ui()}function missions(){show('<h2>COMMAND SIGNAL</h2><p>'+(s.mission>0?'✓':'○')+' Speak to Riverside radio operator</p><p>'+(s.mission>1?'✓':'○')+' Recover Grid Key at Industrial Power</p><p>'+(s.mission>2?'✓':'○')+' Reach Uptown Police station</p><p>'+(s.mission>3?'✓':'○')+' Destroy Command Echo</p><p>Kills '+s.kills+' · Reputation '+s.rep+'</p>')}function help(){show('<h2>v19 SYSTEMS</h2><p>STEALTH lowers detection. Sneak adjacent for TAKEDOWN. BLAST destroys barrels/crates and damages groups. Use WEAPONS to switch gear. Shops sell ammo, grenades and guns. Visit marked buildings to advance missions.</p>')}function msg(t){story.innerHTML=t}function show(h){card.innerHTML=h+'<button onclick="closeM()">CLOSE</button>';modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}function save(){localStorage.setItem('echo19',JSON.stringify(s))}function ui(){hp.textContent=Math.max(0,Math.round(s.hp));en.textContent=Math.round(s.en);lvl.textContent=s.lvl;ammo.textContent=s.ammo;cash.textContent=s.cash;heat.textContent=Math.round(s.heat);stance.textContent=s.stealth?'STEALTH':'OPEN';zone.textContent=s.zone;status.textContent=s.weather+' · '+s.weapons[s.weapon].n+' '+s.weapons[s.weapon].d+'DMG · Grenades '+s.grenades+' · Armor '+s.armor+' · Bag '+s.bag.length+'/'+s.slots+' · Mara '+s.compHP+'HP · Mission '+s.mission+'/4';save()}spawn();ui();draw();</script></body></html>
