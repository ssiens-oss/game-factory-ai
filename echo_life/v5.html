<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v7</title><style>*{box-sizing:border-box}body{margin:0;background:#03080b;color:#eaffff;font-family:system-ui;text-align:center}main{max-width:650px;margin:auto;padding:8px}h1{letter-spacing:7px;text-shadow:0 0 20px #31dff5;margin:6px}.hud{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.hud div,.panel{background:#0c2028e8;border:1px solid #39717d;border-radius:10px;padding:7px;font-size:11px}.world{position:relative;width:100%;aspect-ratio:900/620;margin:7px 0;border-radius:16px;overflow:hidden;background:url('assets/city.svg?v=7') center/cover;border:1px solid #4b7f88}.sprite{position:absolute;width:58px;height:84px;transform:translate(-50%,-65%);transition:.2s;z-index:4}#p{background:url('assets/survivor.svg?v=5') center/contain no-repeat;filter:drop-shadow(0 7px 5px #000)}#e{background:url('assets/echo.svg?v=5') center/contain no-repeat;filter:drop-shadow(0 0 10px #f34);animation:g .7s infinite}.npc{position:absolute;width:30px;height:45px;background:linear-gradient(#c99b78 0 20%,#657b67 21% 60%,#28373b 61%);border-radius:40%;z-index:3}.hostile{background:linear-gradient(#c99b78 0 20%,#8c3434 21% 60%,#292b2e 61%)}.shade{position:absolute;inset:0;pointer-events:none;z-index:6}.night .shade{background:#00142b99}.blackout .shade{background:#000b}.rain{position:absolute;inset:-30%;z-index:7;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 22px,#bdefff35 23px 24px,transparent 25px 48px);animation:r .6s linear infinite}.danger{color:#ff7086}.good{color:#8fffc5}.mission{color:#ffe482}.dpad{width:180px;margin:6px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.blank{visibility:hidden}button{background:linear-gradient(#237b8c,#104653);color:white;border:1px solid #4eb3c5;border-radius:9px;padding:10px;font-weight:800;margin:2px}.dpad button{margin:0}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.actions button{font-size:10px;margin:0;padding:10px 2px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.hidden{display:none!important}#story{min-height:55px;display:flex;align-items:center;justify-content:center}.death{position:fixed;inset:0;background:#020305f5;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.deathBox{max-width:420px;border:1px solid #a83249;background:#13090d;padding:25px;border-radius:18px}.shelter{box-shadow:inset 0 0 25px #5dff9a22}@keyframes r{to{transform:translate(-30px,55px)}}@keyframes g{50%{opacity:.5;transform:translate(-48%,-65%)}} </style></head><body><main><h1>ECHO//LIFE</h1><div id="phase" class="panel">PRE-COLLAPSE · 72 HOURS</div><div class="hud"><div>HP<br><b id="hp">100</b></div><div>ENERGY<br><b id="en">100</b></div><div>FOOD<br><b id="food">100</b></div><div>WATER<br><b id="water">100</b></div><div>CASH<br><b id="cash">$40</b></div><div>ARMOR<br><b id="armor">0</b></div></div><div id="story" class="panel">MISSION: Find supplies and establish a shelter before the blackout.</div><div id="world" class="world"><div class="npc" style="left:28%;top:30%"></div><div id="bad" class="npc hostile" style="left:72%;top:34%"></div><div id="e" class="sprite hidden"></div><div id="p" class="sprite"></div><div class="shade"></div><div class="rain"></div></div><div id="loc" class="panel">PARK</div><div class="dpad"><i class="blank"></i><button onclick="mv(0,-1)">▲</button><i class="blank"></i><button onclick="mv(-1,0)">◀</button><button onclick="talk()">◎</button><button onclick="mv(1,0)">▶</button><i class="blank"></i><button onclick="mv(0,1)">▼</button><i class="blank"></i></div><div class="actions"><button onclick="search()">SEARCH</button><button onclick="attack()">FIGHT</button><button onclick="consume()">USE ITEM</button><button onclick="rest()">REST</button></div><div class="tabs"><button onclick="showInv()">INVENTORY</button><button onclick="craft()">CRAFT</button><button onclick="shelter()">SHELTER</button></div><div id="info" class="panel">Weapon: FISTS · Backpack: empty</div><div id="death" class="death hidden"><div class="deathBox"><h2>THIS LIFE ENDS</h2><p id="legacy"></p><button onclick="rebirth()">BEGIN NEXT LIFE</button></div></div></main><script>let old;try{old=JSON.parse(localStorage.getItem('echoLifeEcho'))}catch(e){}let s={x:2,y:2,ex:old?4:-1,ey:old?4:-1,time:72,post:0,hp:100,en:100,food:100,water:100,cash:40,armor:0,bag:[],weapon:'FISTS',dmg:5,collapsed:false,shelter:false,kills:0,traits:{courage:0,greed:0,empathy:0}};const places=['APARTMENTS','MARKET','CLINIC','GARAGE','ALLEY','PARK','WAREHOUSE','DINER','SUBSTATION','PHARMACY'];const loot=['Water','Food','Bandage','Battery','Wire','Scrap','Crowbar','Flashlight'];if(old)e.classList.remove('hidden');function pos(q,x,y){q.style.left=(10+x*20)+'%';q.style.top=(12+y*19)+'%'}function tick(v){if(s.collapsed)s.post+=v;else{s.time=Math.max(0,s.time-v);if(s.time===0){s.collapsed=true;document.body.classList.add('blackout');story.innerHTML='<span class="danger">BLACKOUT. SURVIVE 24 HOURS.</span>'}}s.en-=v*2;s.food-=v*.8;s.water-=v*1.2;if(s.food<=0||s.water<=0)s.hp-=v*4;if(s.en<=0)s.hp-=v*2;day();if(s.hp<=0)die()}function day(){let night=Math.floor((72-s.time+s.post)/12)%2;document.body.classList.toggle('night',!!night&&!s.collapsed);phase.textContent=s.collapsed?'POST-BLACKOUT · '+s.post.toFixed(1)+' / 24h':s.time.toFixed(1)+' HOURS UNTIL BLACKOUT';if(s.collapsed&&s.post>=24){story.innerHTML='<span class="good">YOU SURVIVED THE FIRST DAY. The city is changing.</span>'}}function chase(){if(s.ex<0)return;if(Math.random()<.65){if(s.ex<s.x)s.ex++;else if(s.ex>s.x)s.ex--;else if(s.ey<s.y)s.ey++;else if(s.ey>s.y)s.ey--}if(s.ex===s.x&&s.ey===s.y){s.hp-=Math.max(4,12-s.armor);story.innerHTML='<span class="danger">YOUR ECHO FOUND YOU.</span>';s.ex=0;s.ey=0}}function mv(dx,dy){s.x=Math.max(0,Math.min(4,s.x+dx));s.y=Math.max(0,Math.min(4,s.y+dy));tick(.25);chase();render()}function search(){if(s.bag.length>=8)return msg('Backpack full.');tick(1);let q=loot[Math.floor(Math.random()*loot.length)];s.bag.push(q);if(q==='Crowbar'){s.weapon='CROWBAR';s.dmg=18}msg('Found '+q+'.');chase();render()}function attack(){if(s.en<5)return msg('Too exhausted.');tick(.25);s.en-=5;if(Math.random()<.75){s.kills++;s.traits.courage++;bad.style.left='90%';bad.style.top='85%';msg('Hit for '+s.dmg+'. The attacker retreats.')}else{s.hp-=Math.max(2,8-s.armor);msg('You miss. They hit back.')}render()}function talk(){s.traits.empathy++;msg(s.collapsed?'Survivor: "The clinic has a generator. We could make a safe zone."':'Survivor: "Stock water. Something is wrong with the grid."')}function consume(){let i=s.bag.findIndex(x=>['Water','Food','Bandage'].includes(x));if(i<0)return msg('No usable food, water, or bandage.');let q=s.bag.splice(i,1)[0];if(q==='Water')s.water=Math.min(100,s.water+40);if(q==='Food')s.food=Math.min(100,s.food+35);if(q==='Bandage')s.hp=Math.min(100,s.hp+30);msg('Used '+q+'.');render()}function craft(){let scrap=s.bag.indexOf('Scrap'),wire=s.bag.indexOf('Wire');if(scrap>=0&&wire>=0){s.bag.splice(Math.max(scrap,wire),1);s.bag.splice(Math.min(scrap,wire),1);s.armor+=4;msg('CRAFTED SCRAP ARMOR. Damage resistance +4.')}else msg('Crafting needs Scrap + Wire.');render()}function shelter(){if(s.shelter)return msg('Shelter already established.');if(s.bag.includes('Battery')&&s.bag.includes('Flashlight')){s.shelter=true;world.classList.add('shelter');s.traits.courage+=2;msg('SHELTER ESTABLISHED. Rest is safer and restores more energy.')}else msg('Shelter requires Battery + Flashlight.')}function rest(){tick(2);s.en=Math.min(100,s.en+(s.shelter?50:30));if(s.shelter){s.water=Math.max(0,s.water-1);msg('You rest safely inside your shelter.')}else{chase();msg('You sleep exposed. Something moves outside.')}render()}function showInv(){msg('INVENTORY: '+(s.bag.join(' · ')||'empty')+' | '+s.weapon+' dmg '+s.dmg+' | Armor '+s.armor)}function msg(x){story.textContent=x}function die(){let a=Object.entries(s.traits).sort((x,y)=>y[1]-x[1]),type=(a[0]&&a[0][1]?a[0][0]:'SURVIVOR').toUpperCase();localStorage.setItem('echoLifeEcho',JSON.stringify({type,items:s.bag.length,bag:s.bag,weapon:s.weapon,kills:s.kills,traits:s.traits}));legacy.textContent='Your '+type+' Echo now carries '+s.bag.length+' items and remembers '+s.kills+' fights. It can appear in the next life.';death.classList.remove('hidden')}function rebirth(){location.reload()}function render(){pos(p,s.x,s.y);if(s.ex>=0)pos(e,s.ex,s.ey);hp.textContent=Math.max(0,Math.round(s.hp));en.textContent=Math.max(0,Math.round(s.en));food.textContent=Math.max(0,Math.round(s.food));water.textContent=Math.max(0,Math.round(s.water));cash.textContent='$'+s.cash;armor.textContent=s.armor;loc.textContent=places[(s.x+s.y*5)%places.length];info.textContent='Weapon: '+s.weapon+' ('+s.dmg+' dmg) · Backpack: '+(s.bag.join(' • ')||'empty')+' · Shelter: '+(s.shelter?'YES':'NO')}render()</script></body></html>
