<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE ART BUILD</title><style>*{box-sizing:border-box}body{margin:0;background:#03080b;color:#eaffff;font-family:system-ui;text-align:center}main{max-width:650px;margin:auto;padding:10px}h1{letter-spacing:7px;text-shadow:0 0 20px #31dff5;margin:8px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.hud div,.panel{background:#0c2028e8;border:1px solid #39717d;border-radius:12px;padding:9px}.world{position:relative;width:100%;aspect-ratio:900/620;margin:9px 0;border-radius:18px;overflow:hidden;background:url('assets/city.svg?v=5') center/cover;border:1px solid #4b7f88;box-shadow:0 18px 45px #000}.sprite{position:absolute;width:58px;height:84px;transform:translate(-50%,-65%);transition:.2s;z-index:4;filter:drop-shadow(0 8px 5px #000)}#p{background:url('assets/survivor.svg?v=5') center/contain no-repeat}#e{background:url('assets/echo.svg?v=5') center/contain no-repeat;animation:glitch .7s infinite}.rain{position:absolute;inset:-30%;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 22px,#bdefff38 23px 24px,transparent 25px 48px);animation:rain .6s linear infinite;z-index:6}.loot{position:absolute;font-size:26px;filter:drop-shadow(0 0 8px #ffe56b);animation:bob 1.2s infinite;z-index:3}.dpad{width:190px;margin:8px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.blank{visibility:hidden}button{background:linear-gradient(#237b8c,#104653);color:white;border:1px solid #4eb3c5;border-radius:10px;padding:12px;font-weight:800;margin:3px}.actions{display:grid;grid-template-columns:repeat(3,1fr)}#story{min-height:65px;display:flex;align-items:center;justify-content:center}.hidden{display:none}.echoWarn{color:#ff7187}.blackout .world{filter:saturate(.45) brightness(.55)}@keyframes rain{to{transform:translate(-30px,55px)}}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes glitch{50%{filter:drop-shadow(5px 0 #ff1744) drop-shadow(-4px 0 #63f4ff);transform:translate(-48%,-65%)}}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>TIME<br><b id="t">72h</b></div><div>HEALTH<br><b id="h">100</b></div><div>ENERGY<br><b id="n">100</b></div><div>CASH<br><b id="c">$40</b></div></div><div id="story" class="panel">ART BUILD v5 — the city is no longer CSS boxes.</div><div class="world"><span class="loot" style="left:47%;top:47%">🎒</span><span class="loot" style="left:73%;top:75%">📦</span><div id="e" class="sprite hidden"></div><div id="p" class="sprite"></div><div class="rain"></div></div><div id="loc" class="panel">MEMORIAL PARK</div><div class="dpad"><i class="blank"></i><button onclick="mv(0,-1)">▲</button><i class="blank"></i><button onclick="mv(-1,0)">◀</button><button onclick="look()">◎</button><button onclick="mv(1,0)">▶</button><i class="blank"></i><button onclick="mv(0,1)">▼</button><i class="blank"></i></div><div class="actions"><button onclick="search()">SEARCH</button><button onclick="rest()">REST</button><button onclick="look()">OBSERVE</button></div><div class="panel">BACKPACK: <span id="bag">empty</span></div></main><script>let old;try{old=JSON.parse(localStorage.getItem('echoLifeEcho'))}catch(x){}let s={x:2,y:2,ex:old?4:-1,ey:old?4:-1,time:72,hp:100,en:100,cash:40,bag:[]};const places=['APARTMENTS','MARKET','CLINIC','GARAGE','ALLEY','PARK','WAREHOUSE','DINER','SUBSTATION','PHARMACY'];const loot=['Water','Battery','Food','Flashlight','Bandage','Radio','Multi-tool'];if(old){e.classList.remove('hidden');story.innerHTML='<span class="echoWarn">ECHO DETECTED — '+old.type+'. It remembers your last life.</span>'}function pos(el,x,y){el.style.left=(10+x*20)+'%';el.style.top=(12+y*19)+'%'}function tick(v){s.time=Math.max(0,s.time-v);s.en=Math.max(0,s.en-v*2);if(!s.time){document.body.classList.add('blackout');story.textContent='BLACKOUT. The city dies block by block.'}}function chase(){if(s.ex<0)return;if(Math.random()<.7){if(s.ex<s.x)s.ex++;else if(s.ex>s.x)s.ex--;else if(s.ey<s.y)s.ey++;else if(s.ey>s.y)s.ey--}if(s.ex===s.x&&s.ey===s.y){s.hp-=10;story.innerHTML='<span class="echoWarn">YOUR ECHO CAUGHT YOU. It knows where you run.</span>';s.ex=0;s.ey=0}}function mv(dx,dy){s.x=Math.max(0,Math.min(4,s.x+dx));s.y=Math.max(0,Math.min(4,s.y+dy));tick(.25);chase();render()}function search(){if(s.bag.length>=8)return story.textContent='Backpack full.';tick(1);let q=loot[Math.floor(Math.random()*loot.length)];s.bag.push(q);story.textContent='You found '+q+'.';chase();render()}function rest(){tick(2);s.en=Math.min(100,s.en+30);story.textContent='You rest while rain hits the rooftops.';chase();render()}function look(){story.textContent=old?'A red figure moves between buildings. It is getting closer.':'The streets feel wrong. Everyone is preparing for something.'}function render(){pos(p,s.x,s.y);if(s.ex>=0)pos(e,s.ex,s.ey);t.textContent=s.time.toFixed(1)+'h';h.textContent=s.hp;n.textContent=Math.round(s.en);c.textContent='$'+s.cash;loc.textContent=places[(s.x+s.y*5)%places.length];bag.textContent=s.bag.length?s.bag.join(' • '):'empty'}render()</script></body></html>
