<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v9</title><style>*{box-sizing:border-box}body{margin:0;background:#02070a;color:#eaffff;font-family:system-ui;text-align:center;overflow-x:hidden}main{max-width:720px;margin:auto;padding:7px}h1{letter-spacing:6px;margin:4px;text-shadow:0 0 18px #31dff5}.panel,.stat{background:#091d24e8;border:1px solid #356d78;border-radius:10px;padding:7px}.hud{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.stat{font-size:10px}.viewport{position:relative;width:100%;height:min(72vw,460px);min-height:330px;margin:6px 0;border:1px solid #477b84;border-radius:15px;overflow:hidden;background:#0b1518}.world{position:absolute;width:1800px;height:1240px;left:0;top:0;background-color:#15272a;background-image:linear-gradient(90deg,transparent 0 280px,#111a1d 281px 380px,transparent 381px 680px,#111a1d 681px 790px,transparent 791px 1100px,#111a1d 1101px 1210px,transparent 1211px),linear-gradient(0deg,transparent 0 230px,#10191c 231px 330px,transparent 331px 590px,#10191c 591px 700px,transparent 701px 950px,#10191c 951px 1060px,transparent 1061px);transition:transform .18s}.block{position:absolute;background:linear-gradient(145deg,#344a4d,#18272b);border:2px solid #4c676c;border-radius:7px;box-shadow:8px 10px 0 #0005}.block:after{content:"";position:absolute;inset:12px;background:repeating-linear-gradient(90deg,#76d6df25 0 14px,transparent 15px 35px)}.label{position:absolute;color:#8ceaf5;font-size:16px;font-weight:900;letter-spacing:2px;text-shadow:0 2px 4px #000;z-index:2}.park{position:absolute;background:#173a2f;border:2px solid #315b4c;border-radius:18px}.roadline{position:absolute;background:repeating-linear-gradient(90deg,#d6bc5d88 0 24px,transparent 25px 48px);height:3px}.sprite{position:absolute;width:55px;height:80px;transform:translate(-50%,-65%);z-index:10}#p{background:url('assets/survivor.svg?v=5') center/contain no-repeat;filter:drop-shadow(0 7px 4px #000)}#e{background:url('assets/echo.svg?v=5') center/contain no-repeat;filter:drop-shadow(0 0 10px #f34)}.marker{position:absolute;font-size:29px;z-index:5;filter:drop-shadow(0 3px 4px #000)}.npc{position:absolute;width:28px;height:42px;border-radius:40%;background:linear-gradient(#c99b78 0 20%,#537963 21% 60%,#28373b 61%);z-index:5}.rain{position:absolute;inset:-30%;z-index:20;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 22px,#bdefff30 23px 24px,transparent 25px 48px);animation:r .6s linear infinite}.shade{position:absolute;inset:0;z-index:19;pointer-events:none}.night .shade{background:#00152d88}.blackout .shade{background:#000a}.danger{color:#ff7187}.good{color:#8fffc5}.gold{color:#ffe482}.district{font-size:11px;letter-spacing:2px;color:#7fe9f6}.dpad{width:178px;margin:5px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.blank{visibility:hidden}button{background:linear-gradient(#237b8c,#104653);color:#fff;border:1px solid #4eb3c5;border-radius:9px;padding:9px;font-weight:800;margin:2px}.dpad button{margin:0}.actions,.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.actions button,.tabs button{font-size:10px;margin:0;padding:9px 2px}.tabs{margin-top:4px}.overlay{position:fixed;inset:0;background:#010407ef;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(440px,100%);background:#0b1d24;border:1px solid #43808c;border-radius:16px;padding:18px;text-align:left}.card button{width:100%}.hidden{display:none!important}#story{min-height:50px;display:flex;align-items:center;justify-content:center}@keyframes r{to{transform:translate(-30px,55px)}}</style></head><body><main><h1>ECHO//LIFE</h1><div id="district" class="district">CENTRAL</div><div class="hud"><div class="stat">HP<br><b id="hp">100</b></div><div class="stat">ENERGY<br><b id="en">100</b></div><div class="stat">FOOD<br><b id="food">100</b></div><div class="stat">WATER<br><b id="water">100</b></div><div class="stat">CASH<br><b id="cash">$40</b></div><div class="stat">LVL<br><b id="level">1</b></div></div><div id="story" class="panel">OPEN WORLD ONLINE — explore the city.</div><div id="viewport" class="viewport"><div id="world" class="world"><div class="block" style="left:70px;top:60px;width:220px;height:160px"></div><div class="label" style="left:105px;top:120px">CLINIC</div><div class="block" style="left:430px;top:70px;width:210px;height:150px"></div><div class="label" style="left:465px;top:125px">MARKET</div><div class="block" style="left:830px;top:70px;width:230px;height:150px"></div><div class="label" style="left:870px;top:125px">GARAGE</div><div class="block" style="left:1300px;top:80px;width:250px;height:150px"></div><div class="label" style="left:1340px;top:135px">WAREHOUSE</div><div class="park" style="left:430px;top:400px;width:300px;height:170px"></div><div class="label" style="left:500px;top:470px">MEMORIAL PARK</div><div class="block" style="left:880px;top:410px;width:230px;height:160px"></div><div class="label" style="left:925px;top:470px">DINER</div><div class="block" style="left:1350px;top:420px;width:260px;height:170px"></div><div class="label" style="left:1390px;top:485px">SUBSTATION</div><div class="block" style="left:100px;top:810px;width:250px;height:170px"></div><div class="label" style="left:150px;top:875px">APARTMENTS</div><div class="block" style="left:620px;top:850px;width:240px;height:170px"></div><div class="label" style="left:665px;top:915px">PHARMACY</div><div class="block" style="left:1180px;top:820px;width:280px;height:180px"></div><div class="label" style="left:1230px;top:890px">SAFE ZONE</div><span class="marker" style="left:520px;top:260px">📦</span><span class="marker" style="left:1040px;top:750px">🎒</span><div class="npc" style="left:560px;top:310px"></div><div class="npc" style="left:1280px;top:730px"></div><div id="e" class="sprite hidden"></div><div id="p" class="sprite"></div></div><div class="shade"></div><div class="rain"></div></div><div id="loc" class="panel">MEMORIAL PARK</div><div class="dpad"><i class="blank"></i><button onclick="mv(0,-1)">▲</button><i class="blank"></i><button onclick="mv(-1,0)">◀</button><button onclick="interact()">◎</button><button onclick="mv(1,0)">▶</button><i class="blank"></i><button onclick="mv(0,1)">▼</button><i class="blank"></i></div><div class="actions"><button onclick="search()">SEARCH</button><button onclick="interact()">INTERACT</button><button onclick="travel()">TRAVEL</button><button onclick="rest()">REST</button></div><div class="tabs"><button onclick="gear()">GEAR</button><button onclick="quests()">QUESTS</button><button onclick="saveGame()">SAVE</button><button onclick="resetView()">CENTER</button></div><div id="info" class="panel"></div></main><div id="modal" class="overlay hidden"><div id="card" class="card"></div></div><script>let old,save;try{old=JSON.parse(localStorage.getItem('echoLifeEcho'));save=JSON.parse(localStorage.getItem('echoLifeSaveV9'))}catch(e){}let s=save||{px:900,py:620,ex:old?1500:-1,ey:old?900:-1,time:72,hp:100,en:100,food:100,water:100,cash:40,level:1,xp:0,bag:[],weapon:'FISTS',shelter:false,quests:{market:false,clinic:false,safe:false}};const sites=[['CLINIC',180,140],['MARKET',530,145],['GARAGE',940,145],['WAREHOUSE',1420,150],['MEMORIAL PARK',580,480],['DINER',995,490],['SUBSTATION',1480,500],['APARTMENTS',220,890],['PHARMACY',740,930],['SAFE ZONE',1320,900]];const loot=['Water','Food','Bandage','Battery','Wire','Scrap','Crowbar','Flashlight'];if(old)e.classList.remove('hidden');function nearSite(){let best=null,d=1e9;sites.forEach(a=>{let q=Math.hypot(s.px-a[1],s.py-a[2]);if(q<d){d=q;best=a}});return d<145?best:null}function camera(){let vw=viewport.clientWidth,vh=viewport.clientHeight,x=Math.max(vw-1800,Math.min(0,vw/2-s.px)),y=Math.max(vh-1240,Math.min(0,vh/2-s.py));world.style.transform='translate('+x+'px,'+y+'px)'}function pos(){p.style.left=s.px+'px';p.style.top=s.py+'px';if(s.ex>=0){e.style.left=s.ex+'px';e.style.top=s.ey+'px'}}function tick(v){s.time=Math.max(0,s.time-v);s.en=Math.max(0,s.en-v*2);s.food=Math.max(0,s.food-v*.7);s.water=Math.max(0,s.water-v);document.body.classList.toggle('night',Math.floor((72-s.time)/12)%2===1);if(!s.time)document.body.classList.add('blackout')}function chase(){if(s.ex<0)return;let dx=s.px-s.ex,dy=s.py-s.ey,d=Math.hypot(dx,dy);if(d<700&&d>0){s.ex+=dx/d*18;s.ey+=dy/d*18}if(d<55){s.hp-=10;story.innerHTML='<span class="danger">Your Echo catches you in the street.</span>';s.ex=1600;s.ey=1100}}function mv(dx,dy){s.px=Math.max(25,Math.min(1775,s.px+dx*45));s.py=Math.max(35,Math.min(1210,s.py+dy*45));tick(.15);chase();render()}function search(){if(s.bag.length>=12)return msg('Backpack full.');tick(.75);let q=loot[Math.floor(Math.random()*loot.length)];s.bag.push(q);if(q==='Crowbar')s.weapon='CROWBAR';msg('You search this block and find '+q+'.');render()}function interact(){let a=nearSite();if(!a)return msg('Nothing close enough to interact with. Move toward a named location.');if(a[0]==='MARKET'&&!s.quests.market){s.quests.market=true;s.cash+=20;s.xp+=25;msg('<span class="good">MARKET CONTACT COMPLETE — +$20 +25 XP.</span>')}else if(a[0]==='CLINIC'&&!s.quests.clinic){s.quests.clinic=true;s.bag.push('Bandage');s.xp+=25;msg('<span class="good">CLINIC SECURED — Bandage +25 XP.</span>')}else if(a[0]==='SAFE ZONE'){s.shelter=true;s.quests.safe=true;msg('<span class="good">SAFE ZONE UNLOCKED. Rest restores more energy here.</span>')}else msg('You investigate '+a[0]+'. Survivors have passed through recently.');render()}function travel(){show('<h2>FAST TRAVEL</h2>'+sites.map((a,i)=>'<button onclick="go('+i+')">'+a[0]+'</button>').join(''))}function go(i){let a=sites[i];s.px=a[1];s.py=a[2]+80;tick(1);closeM();msg('You travel across the city to '+a[0]+'. One hour passes.');render()}function rest(){tick(2);s.en=Math.min(100,s.en+(s.shelter?55:30));msg(s.shelter?'You recover under Safe Zone protection.':'You rest in an exposed building entrance.');render()}function gear(){show('<h2>GEAR</h2><p>Weapon: '+s.weapon+'</p><p>Backpack: '+(s.bag.join(' · ')||'empty')+'</p>')}function quests(){show('<h2>QUESTS</h2><p>'+done(s.quests.market)+' Make contact at MARKET</p><p>'+done(s.quests.clinic)+' Secure supplies at CLINIC</p><p>'+done(s.quests.safe)+' Reach SAFE ZONE</p>')}function done(x){return x?'✓':'○'}function saveGame(){localStorage.setItem('echoLifeSaveV9',JSON.stringify(s));msg('<span class="good">WORLD POSITION + PROGRESS SAVED.</span>')}function resetView(){camera()}function show(x){card.innerHTML=x+'<button onclick="closeM()">CLOSE</button>';modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}function msg(x){story.innerHTML=x}function render(){pos();camera();let a=nearSite();loc.textContent=a?a[0]:'CITY STREETS';district.textContent=s.px<600?'WEST DISTRICT':s.px>1200?'EAST DISTRICT':s.py<420?'NORTH DISTRICT':s.py>820?'SOUTH DISTRICT':'CENTRAL DISTRICT';hp.textContent=Math.round(s.hp);en.textContent=Math.round(s.en);food.textContent=Math.round(s.food);water.textContent=Math.round(s.water);cash.textContent='$'+s.cash;while(s.xp>=100){s.xp-=100;s.level++}level.textContent=s.level;info.textContent='World '+Math.round(s.px)+','+Math.round(s.py)+' · '+s.weapon+' · '+s.bag.length+'/12 items · '+s.time.toFixed(1)+'h until blackout'}window.addEventListener('resize',camera);render()</script></body></html>
