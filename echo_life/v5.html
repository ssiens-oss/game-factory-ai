<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v8</title><style>*{box-sizing:border-box}body{margin:0;background:#03080b;color:#eaffff;font-family:system-ui;text-align:center}main{max-width:680px;margin:auto;padding:8px}h1{letter-spacing:7px;text-shadow:0 0 20px #31dff5;margin:5px}.panel,.stat{background:#0b2028e8;border:1px solid #39717d;border-radius:10px;padding:7px}.hud{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.stat{font-size:10px}.world{position:relative;width:100%;aspect-ratio:900/620;margin:6px 0;border-radius:16px;overflow:hidden;background:url('assets/city.svg?v=8') center/cover;border:1px solid #4b7f88}.sprite{position:absolute;width:58px;height:84px;transform:translate(-50%,-65%);transition:.2s;z-index:4}#p{background:url('assets/survivor.svg?v=5') center/contain no-repeat}#e{background:url('assets/echo.svg?v=5') center/contain no-repeat;filter:drop-shadow(0 0 10px #f34)}.npc{position:absolute;width:31px;height:45px;border-radius:40%;background:linear-gradient(#c99b78 0 20%,#527a66 21% 60%,#28373b 61%);z-index:3}.merchant{background:linear-gradient(#c99b78 0 20%,#a08036 21% 60%,#302c22 61%)}.hostile{background:linear-gradient(#c99b78 0 20%,#92343b 21% 60%,#292b2e 61%)}.rain{position:absolute;inset:-30%;z-index:7;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 22px,#bdefff35 23px 24px,transparent 25px 48px);animation:r .6s linear infinite}.shade{position:absolute;inset:0;z-index:6;pointer-events:none}.night .shade{background:#00152d99}.blackout .shade{background:#000b}.danger{color:#ff7086}.good{color:#8fffc5}.gold{color:#ffe482}.dpad{width:180px;margin:5px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.blank{visibility:hidden}button{background:linear-gradient(#237b8c,#104653);color:#fff;border:1px solid #4eb3c5;border-radius:9px;padding:9px;font-weight:800;margin:2px}.dpad button{margin:0}.actions,.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.actions button,.tabs button{font-size:10px;margin:0;padding:9px 2px}.tabs{margin-top:4px}.hidden{display:none!important}#story{min-height:54px;display:flex;align-items:center;justify-content:center}.overlay{position:fixed;inset:0;background:#010407ee;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(440px,100%);max-height:85vh;overflow:auto;background:#0b1d24;border:1px solid #43808c;border-radius:16px;padding:18px;text-align:left}.card button{width:100%;margin:4px 0}.district{font-size:11px;letter-spacing:2px;color:#81eaf6}.xpbar{height:5px;background:#102d34;border-radius:9px;overflow:hidden;margin:4px}.xpbar i{display:block;height:100%;background:#68e7f6}.questDone{text-decoration:line-through;opacity:.55}@keyframes r{to{transform:translate(-30px,55px)}}</style></head><body><main><h1>ECHO//LIFE</h1><div id="district" class="district">CENTRAL DISTRICT</div><div class="hud"><div class="stat">HP<br><b id="hp">100</b></div><div class="stat">ENERGY<br><b id="en">100</b></div><div class="stat">FOOD<br><b id="food">100</b></div><div class="stat">WATER<br><b id="water">100</b></div><div class="stat">CASH<br><b id="cash">$40</b></div><div class="stat">LVL<br><b id="level">1</b></div></div><div class="xpbar"><i id="xpbar" style="width:0%"></i></div><div id="story" class="panel">QUEST: Reach the Market and talk to a survivor.</div><div id="world" class="world"><div class="npc" style="left:25%;top:30%"></div><div id="shopNpc" class="npc merchant" style="left:48%;top:48%"></div><div id="bad" class="npc hostile" style="left:76%;top:35%"></div><div id="e" class="sprite hidden"></div><div id="p" class="sprite"></div><div class="shade"></div><div class="rain"></div></div><div id="loc" class="panel">PARK</div><div class="dpad"><i class="blank"></i><button onclick="mv(0,-1)">▲</button><i class="blank"></i><button onclick="mv(-1,0)">◀</button><button onclick="talk()">◎</button><button onclick="mv(1,0)">▶</button><i class="blank"></i><button onclick="mv(0,1)">▼</button><i class="blank"></i></div><div class="actions"><button onclick="search()">SEARCH</button><button onclick="talk()">TALK</button><button onclick="attack()">FIGHT</button><button onclick="rest()">REST</button></div><div class="tabs"><button onclick="openInv()">GEAR</button><button onclick="openQuests()">QUESTS</button><button onclick="openShop()">MERCHANT</button><button onclick="saveGame()">SAVE</button></div><div id="info" class="panel"></div></main><div id="modal" class="overlay hidden"><div id="card" class="card"></div></div><script>let old,save;try{old=JSON.parse(localStorage.getItem('echoLifeEcho'));save=JSON.parse(localStorage.getItem('echoLifeSave'))}catch(e){}let fresh={x:2,y:2,ex:old?4:-1,ey:old?4:-1,time:72,post:0,hp:100,en:100,food:100,water:100,cash:40,armor:0,bag:[],weapon:'FISTS',dmg:5,collapsed:false,shelter:false,xp:0,level:1,rep:{wardens:0,drifters:0},quests:{market:false,supplies:false,shelter:false,blackout:false}};let s=save?Object.assign(fresh,save):fresh;const places=['APARTMENTS','MARKET','CLINIC','GARAGE','ALLEY','PARK','WAREHOUSE','DINER','SUBSTATION','PHARMACY'];const loot=['Water','Food','Bandage','Battery','Wire','Scrap','Crowbar','Flashlight'];if(old)e.classList.remove('hidden');function pos(q,x,y){q.style.left=(10+x*20)+'%';q.style.top=(12+y*19)+'%'}function msg(x){story.innerHTML=x}function gain(v){s.xp+=v;while(s.xp>=100){s.xp-=100;s.level++;s.hp=Math.min(100,s.hp+20);s.dmg+=2;msg('<span class="good">LEVEL UP! You are now level '+s.level+'.</span>')}}function tick(v){if(s.collapsed)s.post+=v;else{s.time=Math.max(0,s.time-v);if(!s.time){s.collapsed=true;s.quests.blackout=true;document.body.classList.add('blackout');gain(30);msg('<span class="danger">BLACKOUT. The factions are moving.</span>')}}s.en=Math.max(0,s.en-v*2);s.food=Math.max(0,s.food-v*.8);s.water=Math.max(0,s.water-v*1.2);if(!s.food||!s.water)s.hp-=v*3;day()}function day(){document.body.classList.toggle('night',Math.floor((72-s.time+s.post)/12)%2===1&&!s.collapsed)}function districtName(){if(s.x<2)return'WEST DISTRICT';if(s.x>2)return'EAST DISTRICT';if(s.y<2)return'NORTH DISTRICT';if(s.y>2)return'SOUTH DISTRICT';return'CENTRAL DISTRICT'}function chase(){if(s.ex<0)return;if(Math.random()<.55){if(s.ex<s.x)s.ex++;else if(s.ex>s.x)s.ex--;else if(s.ey<s.y)s.ey++;else if(s.ey>s.y)s.ey--}if(s.ex===s.x&&s.ey===s.y){s.hp-=Math.max(4,12-s.armor);msg('<span class="danger">Your Echo ambushes you, then disappears into the rain.</span>');s.ex=0;s.ey=0}}function mv(dx,dy){s.x=Math.max(0,Math.min(4,s.x+dx));s.y=Math.max(0,Math.min(4,s.y+dy));tick(.25);chase();if(place()==='MARKET'&&!s.quests.market)msg('<span class="gold">You reached the Market. Talk to someone.</span>');render()}function place(){return places[(s.x+s.y*5)%places.length]}function search(){if(s.bag.length>=10)return msg('Backpack full.');tick(1);let q=loot[Math.floor(Math.random()*loot.length)];s.bag.push(q);if(q==='Crowbar'){s.weapon='CROWBAR';s.dmg=Math.max(s.dmg,18)}if(s.bag.length>=4&&!s.quests.supplies){s.quests.supplies=true;gain(25);s.cash+=20;msg('<span class="good">QUEST COMPLETE: Supply Run. +25 XP +$20.</span>')}else msg('Found '+q+'.');render()}function talk(){tick(.25);if(place()==='MARKET'&&!s.quests.market){s.quests.market=true;s.rep.wardens++;gain(20);s.cash+=15;msg('<span class="good">QUEST COMPLETE: First Contact. +20 XP +$15. Warden reputation +1.</span>')}else if(s.collapsed){s.rep.drifters++;msg('Drifter: "The Wardens are taking over the clinic. Pick your friends carefully."')}else msg('Warden: "Build a shelter before the grid dies. We pay people who help."');render()}function attack(){tick(.25);if(s.en<5)return msg('Too exhausted.');s.en-=5;if(Math.random()<.75){gain(10);s.cash+=5;bad.style.left='90%';bad.style.top='82%';msg('Hostile driven off. +10 XP +$5.')}else{s.hp-=Math.max(2,8-s.armor);msg('You miss. They hit back.')}render()}function rest(){tick(2);s.en=Math.min(100,s.en+(s.shelter?50:30));msg(s.shelter?'You rest safely at your shelter.':'You rest exposed in the district.');render()}function openInv(){show('<h2>GEAR</h2><p>Weapon: '+s.weapon+' · '+s.dmg+' damage</p><p>Armor: '+s.armor+'</p><p>'+ (s.bag.join(' · ')||'Backpack empty')+'</p><button onclick="craft()">CRAFT SCRAP ARMOR</button>')}function craft(){let a=s.bag.indexOf('Scrap'),b=s.bag.indexOf('Wire');if(a>=0&&b>=0){s.bag.splice(Math.max(a,b),1);s.bag.splice(Math.min(a,b),1);s.armor+=4;gain(10);msg('Crafted armor.');closeM();render()}else alert('Need Scrap + Wire')}function openQuests(){show('<h2>QUESTS</h2>'+q('First Contact',s.quests.market,'Reach Market and talk to a survivor')+q('Supply Run',s.quests.supplies,'Collect 4 items')+q('Safe House',s.quests.shelter,'Build a shelter')+q('The Blackout',s.quests.blackout,'Survive until the grid fails'))}function q(n,d,t){return'<p class="'+(d?'questDone':'')+'"><b>'+n+'</b><br>'+t+'</p>'}function openShop(){show('<h2>MERCHANT</h2><p>Cash: $'+s.cash+'</p><button onclick="buy(\'Water\',8)">Water — $8</button><button onclick="buy(\'Food\',10)">Food — $10</button><button onclick="buy(\'Bandage\',15)">Bandage — $15</button><button onclick="buy(\'Flashlight\',20)">Flashlight — $20</button>')}function buy(i,p){if(s.cash<p)return alert('Not enough cash');if(s.bag.length>=10)return alert('Backpack full');s.cash-=p;s.bag.push(i);openShop();render()}function buildShelter(){if(s.shelter)return;if(s.bag.includes('Battery')&&s.bag.includes('Flashlight')){s.shelter=true;s.quests.shelter=true;s.rep.wardens++;gain(30);msg('<span class="good">SAFE HOUSE ESTABLISHED. +30 XP.</span>');render()}}function saveGame(){localStorage.setItem('echoLifeSave',JSON.stringify(s));msg('<span class="good">GAME SAVED ON THIS DEVICE.</span>')}function show(x){card.innerHTML=x+'<button onclick="closeM()">CLOSE</button>';modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}function render(){pos(p,s.x,s.y);if(s.ex>=0)pos(e,s.ex,s.ey);hp.textContent=Math.max(0,Math.round(s.hp));en.textContent=Math.round(s.en);food.textContent=Math.round(s.food);water.textContent=Math.round(s.water);cash.textContent='$'+s.cash;level.textContent=s.level;xpbar.style.width=s.xp+'%';loc.textContent=place();district.textContent=districtName();info.innerHTML='Weapon '+s.weapon+' · Armor '+s.armor+' · <span class="gold">Wardens '+s.rep.wardens+'</span> · Drifters '+s.rep.drifters+' · '+(s.shelter?'SAFE HOUSE ACTIVE':'<button onclick="buildShelter()">BUILD SAFE HOUSE</button>')}render()</script></body></html>
