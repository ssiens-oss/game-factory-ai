<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v6</title><style>*{box-sizing:border-box}body{margin:0;background:#03080b;color:#eaffff;font-family:system-ui;text-align:center;transition:background 1s}main{max-width:650px;margin:auto;padding:10px}h1{letter-spacing:7px;text-shadow:0 0 20px #31dff5;margin:8px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.hud div,.panel{background:#0c2028e8;border:1px solid #39717d;border-radius:12px;padding:9px}.world{position:relative;width:100%;aspect-ratio:900/620;margin:9px 0;border-radius:18px;overflow:hidden;background:url('assets/city.svg?v=6') center/cover;border:1px solid #4b7f88;box-shadow:0 18px 45px #000}.sprite{position:absolute;width:58px;height:84px;transform:translate(-50%,-65%);transition:.22s;z-index:4;filter:drop-shadow(0 8px 5px #000)}#p{background:url('assets/survivor.svg?v=5') center/contain no-repeat}#e{background:url('assets/echo.svg?v=5') center/contain no-repeat;animation:glitch .7s infinite}.npc{position:absolute;width:34px;height:48px;transform:translate(-50%,-60%);z-index:3;background:linear-gradient(#d0a27e 0 18%,#687f65 19% 58%,#27363a 59%);border-radius:45% 45% 25% 25%;filter:drop-shadow(0 5px 4px #000)}.enemy{background:linear-gradient(#c99b78 0 18%,#8a3a36 19% 58%,#262b2e 59%)}.loot{position:absolute;font-size:25px;filter:drop-shadow(0 0 8px #ffe56b);animation:bob 1.2s infinite;z-index:3}.rain{position:absolute;inset:-30%;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 22px,#bdefff38 23px 24px,transparent 25px 48px);animation:rain .6s linear infinite;z-index:7}.shade{position:absolute;inset:0;pointer-events:none;z-index:6;transition:background 1s}.night .shade{background:#00112499}.blackout .shade{background:#000b}.blackout .world{filter:saturate(.5) brightness(.7)}.danger{color:#ff7187}.phase{font-size:11px;letter-spacing:2px;color:#82ecfa}.dpad{width:190px;margin:8px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.blank{visibility:hidden}button{background:linear-gradient(#237b8c,#104653);color:white;border:1px solid #4eb3c5;border-radius:10px;padding:11px;font-weight:800;margin:3px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.actions button{margin:0;font-size:11px;padding:11px 2px}#story{min-height:65px;display:flex;align-items:center;justify-content:center}.hidden{display:none}.weapon{color:#ffe58a}@keyframes rain{to{transform:translate(-30px,55px)}}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes glitch{50%{filter:drop-shadow(5px 0 #ff1744) drop-shadow(-4px 0 #63f4ff);transform:translate(-48%,-65%)}}</style></head><body><main><h1>ECHO//LIFE</h1><div id="phase" class="phase">PRE-COLLAPSE · DAY 1</div><div class="hud"><div>TIME<br><b id="t">72h</b></div><div>HEALTH<br><b id="h">100</b></div><div>ENERGY<br><b id="n">100</b></div><div>CASH<br><b id="c">$40</b></div></div><div id="story" class="panel">The city is still alive. For now.</div><div id="world" class="world"><span class="loot" style="left:47%;top:47%">🎒</span><span class="loot" style="left:73%;top:75%">📦</span><div id="npc1" class="npc" style="left:28%;top:30%"></div><div id="npc2" class="npc enemy" style="left:72%;top:33%"></div><div id="e" class="sprite hidden"></div><div id="p" class="sprite"></div><div class="shade"></div><div class="rain"></div></div><div id="loc" class="panel">MEMORIAL PARK</div><div class="dpad"><i class="blank"></i><button onclick="mv(0,-1)">▲</button><i class="blank"></i><button onclick="mv(-1,0)">◀</button><button onclick="interact()">◎</button><button onclick="mv(1,0)">▶</button><i class="blank"></i><button onclick="mv(0,1)">▼</button><i class="blank"></i></div><div class="actions"><button onclick="search()">SEARCH</button><button onclick="interact()">TALK</button><button onclick="attack()">ATTACK</button><button onclick="rest()">REST</button></div><div class="panel">EQUIPPED: <span id="weapon" class="weapon">FISTS</span><br>BACKPACK: <span id="bag">empty</span></div></main><script>let old;try{old=JSON.parse(localStorage.getItem('echoLifeEcho'))}catch(x){}let s={x:2,y:2,ex:old?4:-1,ey:old?4:-1,time:72,hp:100,en:100,cash:40,bag:[],weapon:'FISTS',damage:5,collapsed:false,post:0};const places=['APARTMENTS','MARKET','CLINIC','GARAGE','ALLEY','PARK','WAREHOUSE','DINER','SUBSTATION','PHARMACY'];const loot=['Water','Battery','Food','Flashlight','Bandage','Radio','Crowbar','Multi-tool'];if(old){e.classList.remove('hidden');story.innerHTML='<span class="danger">ECHO DETECTED — '+old.type+'. It remembers your last life.</span>'}function pos(el,x,y){el.style.left=(10+x*20)+'%';el.style.top=(12+y*19)+'%'}function tick(v){if(!s.collapsed){s.time=Math.max(0,s.time-v);if(s.time===0){s.collapsed=true;document.body.classList.add('blackout');story.innerHTML='<span class="danger">BLACKOUT. THE 72-HOUR PREPARATION PHASE IS OVER.</span>'}}else{s.post+=v}s.en=Math.max(0,s.en-v*2);daylight()}function daylight(){let elapsed=72-s.time,night=Math.floor(elapsed/12)%2===1;document.body.classList.toggle('night',night&&!s.collapsed);phase.textContent=s.collapsed?'POST-BLACKOUT · +'+s.post.toFixed(1)+'h':(night?'PRE-COLLAPSE · NIGHT':'PRE-COLLAPSE · DAY')+' · '+Math.ceil(s.time)+'h LEFT'}function chase(){if(s.ex<0)return;if(Math.random()<.65){if(s.ex<s.x)s.ex++;else if(s.ex>s.x)s.ex--;else if(s.ey<s.y)s.ey++;else if(s.ey>s.y)s.ey--}if(s.ex===s.x&&s.ey===s.y){s.hp-=10;story.innerHTML='<span class="danger">YOUR ECHO STRIKES. -10 HEALTH.</span>';s.ex=0;s.ey=0}}function mv(dx,dy){s.x=Math.max(0,Math.min(4,s.x+dx));s.y=Math.max(0,Math.min(4,s.y+dy));tick(.25);chase();npcMove();render()}function npcMove(){let a=[npc1,npc2];a.forEach(q=>{let l=parseFloat(q.style.left);l+=Math.random()>.5?2:-2;q.style.left=Math.max(10,Math.min(90,l))+'%'})}function search(){if(s.bag.length>=8)return story.textContent='Backpack full.';tick(1);let q=loot[Math.floor(Math.random()*loot.length)];s.bag.push(q);if(q==='Crowbar'){s.weapon='CROWBAR';s.damage=18;story.textContent='You found a Crowbar and equipped it. Damage increased.'}else story.textContent='You found '+q+'.';chase();render()}function interact(){if(Math.random()<.5){story.textContent='A survivor whispers: "The substation went dead before the rest of the grid. That was no accident."';s.en=Math.min(100,s.en+3)}else{story.textContent='The hostile survivor reaches for your backpack. Fight or move away.'}}function attack(){tick(.25);if(s.en<5)return story.textContent='Too exhausted to fight.';s.en-=5;let hit=Math.random()<.75;if(hit){story.textContent='You strike for '+s.damage+' damage with '+s.weapon+'. The hostile survivor backs off.';npc2.style.left='88%';npc2.style.top='80%'}else{story.textContent='You miss. The hostile survivor hits back. -8 health.';s.hp-=8}render()}function rest(){tick(2);s.en=Math.min(100,s.en+30);story.textContent=s.collapsed?'You rest in the dead city. No streetlights come back on.':'You rest while the city keeps moving around you.';chase();render()}function render(){pos(p,s.x,s.y);if(s.ex>=0)pos(e,s.ex,s.ey);t.textContent=s.collapsed?'+'+s.post.toFixed(1)+'h':s.time.toFixed(1)+'h';h.textContent=Math.max(0,s.hp);n.textContent=Math.round(s.en);c.textContent='$'+s.cash;loc.textContent=places[(s.x+s.y*5)%places.length];bag.textContent=s.bag.length?s.bag.join(' • '):'empty';weapon.textContent=s.weapon;if(s.hp<=0)story.innerHTML='<span class="danger">THIS LIFE ENDS HERE. THE NEXT ECHO WILL REMEMBER.</span>'}render()</script></body></html>
