<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v28</title><style>*{box-sizing:border-box}html,body{margin:0;background:#020609;color:#eaffff;font-family:system-ui;overflow-x:hidden}main{max-width:1100px;margin:auto;padding:5px}h1{text-align:center;margin:2px;letter-spacing:9px;font-size:22px;text-shadow:0 0 22px #55eaff}.hud{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.hud div,.panel{background:#07151bdd;border:1px solid #315963;border-radius:7px;padding:6px;text-align:center;font-size:10px}.hud b{font-size:15px}#wrap{position:relative;margin-top:4px;border-radius:14px;overflow:hidden;box-shadow:0 25px 80px #000}canvas{display:block;width:100%;aspect-ratio:16/9;background:#071015;touch-action:none}.joy{position:absolute;left:20px;bottom:18px;width:108px;height:108px;border:2px solid #80efff66;border-radius:50%;background:#07161bbd;touch-action:none}.stick{position:absolute;left:31px;top:31px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efffff,#40aabd 48%,#123943)}.fire{position:absolute;right:24px;bottom:23px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb0a8,#ad2940 55%,#3b0c17);border:2px solid #ffd0d5;color:#fff;font-weight:900;box-shadow:0 0 24px #ff496655}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:3px}button{background:linear-gradient(#20525f,#0a2730);border:1px solid #4b9ead;color:white;border-radius:7px;padding:10px;font-weight:800;font-size:10px}.overlay{position:fixed;inset:0;background:#010406f4;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.card{width:min(580px,100%);background:linear-gradient(145deg,#10252c,#050b0e);border:1px solid #527c86;border-radius:16px;padding:20px;text-align:center}.card button{width:100%;margin:4px 0}.hidden{display:none}@media(max-width:600px){.hud{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>LVL<br><b id="lvl">1</b></div><div>AMMO<br><b id="ammo">24</b></div><div>CREDITS<br><b id="cash">100</b></div><div>ARMOR<br><b id="armor">1</b></div><div>COMBO<br><b id="combo">0</b></div><div>ZONE<br><b id="zone">DOWNTOWN</b></div></div><div id="story" class="panel">v28 · COMBAT + VISUAL UPGRADE</div><div id="wrap"><canvas id="game" width="1280" height="720"></canvas><div id="joy" class="joy"><div id="stick" class="stick"></div></div><button id="fire" class="fire">FIRE</button></div><div class="grid"><button id="stealthBtn">STEALTH</button><button id="blastBtn">BLAST</button><button id="lootBtn">LOOT</button><button id="useBtn">USE</button><button id="swapBtn">SWAP</button><button id="mapBtn">MAP</button></div><div id="status" class="panel"></div></main><div id="title" class="overlay"><div class="card"><h2>ECHO//LIFE</h2><p>THE TOMORROW SIGNAL</p><p>v28 · standalone combat rebuild</p><button id="newBtn">NEW GAME</button><button id="continueBtn">CONTINUE</button></div></div><div id="modal" class="overlay hidden"><div id="card" class="card"></div></div><script>(()=>{'use strict';const C=document.getElementById('game'),g=C.getContext('2d'),$=id=>document.getElementById(id),Z=['DOWNTOWN','OLD TOWN','INDUSTRIAL','RIVERSIDE','UNDERGROUND','UPTOWN'];let s=null,flash=0,hit=0;const fresh=()=>({x:13,y:11,hp:100,lvl:1,xp:0,ammo:30,cash:100,armor:1,grenades:3,weapon:1,weapons:[['PIPE',16,2],['REVOLVER',28,8],['SMG',20,9]],zone:0,stealth:false,enemies:[],loot:[],shots:[],particles:[],shake:0,combo:0,kills:0});const iso=(x,y,z=0)=>({x:640+(x-y)*32,y:70+(x+y)*16-z});function tile(x,y,c){let a=iso(x,y),b=iso(x+1,y),c1=iso(x+1,y+1),d=iso(x,y+1);g.fillStyle=c;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.lineTo(c1.x,c1.y);g.lineTo(d.x,d.y);g.fill()}function building(x,y,w,h,z,c){let a=iso(x,y+h),b=iso(x+w,y+h),d=iso(x+w,y+h,z),e=iso(x,y+h,z),f=iso(x+w,y),q=iso(x+w,y,z),t=iso(x,y,z);g.fillStyle='#26383d';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.lineTo(d.x,d.y);g.lineTo(e.x,e.y);g.fill();g.fillStyle='#17272d';g.beginPath();g.moveTo(f.x,f.y);g.lineTo(b.x,b.y);g.lineTo(d.x,d.y);g.lineTo(q.x,q.y);g.fill();g.fillStyle=c;g.beginPath();g.moveTo(t.x,t.y);g.lineTo(q.x,q.y);g.lineTo(d.x,d.y);g.lineTo(e.x,e.y);g.fill();for(let r=0;r<4;r++)for(let i=0;i<w;i++){let p=iso(x+i+.5,y+h,z-20-r*20);g.fillStyle=(r+i)%4?'#6bd9e888':'#ffd27a99';g.fillRect(p.x-5,p.y-6,10,10)}}function prop(x,y,i){let p=iso(x,y,5);g.fillStyle=i%2?'#704047':'#3c5964';g.beginPath();g.roundRect(p.x-25,p.y-11,50,18,5);g.fill();g.fillStyle='#122128';g.fillRect(p.x-12,p.y-18,25,10);g.fillStyle='#05090b';g.beginPath();g.arc(p.x-16,p.y+7,5,0,7);g.arc(p.x+16,p.y+7,5,0,7);g.fill()}function person(x,y,c,big=1){let p=iso(x,y,4),t=performance.now(),w=Math.sin(t/120+x)*3;g.save();g.translate(p.x,p.y);g.scale(big,big);g.fillStyle='#000a';g.beginPath();g.ellipse(0,5,18,5,0,0,7);g.fill();g.strokeStyle='#111b1e';g.lineWidth=6;g.beginPath();g.moveTo(-5,-10);g.lineTo(-8+w,-1);g.moveTo(5,-10);g.lineTo(8-w,-1);g.stroke();g.fillStyle=c;g.beginPath();g.roundRect(-12,-36,24,28,6);g.fill();g.fillStyle='#17242a';g.fillRect(-12,-21,24,4);g.fillStyle='#c99b78';g.beginPath();g.arc(0,-46,9,0,7);g.fill();g.fillStyle='#222';g.beginPath();g.arc(0,-49,9,Math.PI,6.2);g.fill();g.strokeStyle='#263238';g.lineWidth=4;g.beginPath();g.moveTo(9,-28);g.lineTo(28,-22);g.stroke();g.restore()}function spawn(){s.enemies=[];for(let i=0;i<6;i++){let h=48+s.lvl*7;s.enemies.push({x:17+i%3,y:7+(i*2)%11,hp:h,max:h,alert:false,boss:i===5&&s.lvl>2})}}function fx(x,y,c,n=14){let p=iso(x,y,25);for(let i=0;i<n;i++)s.particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,l:18,c})}function draw(){requestAnimationFrame(draw);if(!s)return;g.save();if(s.shake>1){g.translate((Math.random()-.5)*s.shake,(Math.random()-.5)*s.shake);s.shake*=.7}let sky=g.createLinearGradient(0,0,0,720);sky.addColorStop(0,['#193844','#3b3233','#313a38','#173b46','#20232c','#293a50'][s.zone]);sky.addColorStop(1,'#020609');g.fillStyle=sky;g.fillRect(0,0,1280,720);for(let x=0;x<27;x++)for(let y=0;y<21;y++)tile(x,y,(x%7===6||y%6===5)?'#18252a':((x+y)%2?'#293b3e':'#33474a'));building(1,1,4,3,115,'#38555b');building(8,1,4,3,132,'#4c4841');building(15,1,4,3,148,'#354d55');building(22,2,4,3,126,'#4a3f51');for(let i=0;i<10;i++)prop(3+(i*5)%24,8+(i*3)%12,i);s.loot.forEach(l=>{let p=iso(l.x,l.y,10+Math.sin(performance.now()/180)*4);g.shadowColor='#6ff';g.shadowBlur=22;g.fillStyle='#8fffff';g.fillRect(p.x-6,p.y-7,12,12);g.shadowBlur=0});s.enemies.filter(e=>e.hp>0).forEach(e=>{person(e.x,e.y,e.boss?'#df3153':'#a43a4d',e.boss?1.4:1);let p=iso(e.x,e.y,e.boss?82:64),w=e.boss?60:42;g.fillStyle='#18080b';g.fillRect(p.x-w/2,p.y,w,6);g.fillStyle=e.boss?'#ff3b62':'#62df8e';g.fillRect(p.x-w/2,p.y,w*Math.max(0,e.hp/e.max),6)});person(s.x,s.y,s.stealth?'#77765f':'#238ca6');s.shots=s.shots.filter(a=>a.l-->0);s.shots.forEach(a=>{g.shadowColor='#ffe681';g.shadowBlur=15;g.strokeStyle='#fff0a0';g.lineWidth=3;g.beginPath();g.moveTo(a.a.x,a.a.y);g.lineTo(a.b.x,a.b.y);g.stroke();g.shadowBlur=0});s.particles=s.particles.filter(p=>p.l-->0);s.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;g.globalAlpha=p.l/18;g.fillStyle=p.c;g.fillRect(p.x,p.y,4,4)});g.globalAlpha=1;g.strokeStyle='#d9faff55';for(let i=0;i<90;i++){let x=(i*91+performance.now()*.35)%1320,y=(i*53+performance.now()*.8)%760;g.beginPath();g.moveTo(x,y);g.lineTo(x-8,y+22);g.stroke()}if(hit>0){g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(630,350);g.lineTo(637,357);g.moveTo(650,350);g.lineTo(643,357);g.stroke();hit--}if(flash>0){g.fillStyle='#ff244022';g.fillRect(0,0,1280,720);flash--}let v=g.createRadialGradient(640,350,250,640,350,700);v.addColorStop(0,'#0000');v.addColorStop(1,'#000b');g.fillStyle=v;g.fillRect(0,0,1280,720);g.restore()}function dist(e){return Math.abs(s.x-e.x)+Math.abs(s.y-e.y)}function near(r){return s.enemies.filter(e=>e.hp>0).sort((a,b)=>dist(a)-dist(b)).find(e=>dist(e)<=r)}function move(dx,dy){s.x=Math.max(0,Math.min(26,s.x+dx));s.y=Math.max(0,Math.min(20,s.y+dy));turn();ui()}function turn(){s.enemies.filter(e=>e.hp>0).forEach(e=>{let d=dist(e);if(d<=(s.stealth?3:8))e.alert=true;if(!e.alert)return;if(d<=1){s.hp-=Math.max(3,(e.boss?15:9)-s.armor);flash=5}else if(Math.abs(s.x-e.x)>Math.abs(s.y-e.y))e.x+=Math.sign(s.x-e.x);else e.y+=Math.sign(s.y-e.y)});if(s.hp<=0){s.hp=100;s.cash=Math.max(0,s.cash-25);s.combo=0;s.x=13;s.y=11;spawn();msg('RESPAWNED · -25 CREDITS')}}function attack(){let w=s.weapons[s.weapon],e=near(w[2]);if(!e)return msg('NO TARGET IN RANGE');if(s.weapon){if(!s.ammo)return msg('OUT OF AMMO');s.ammo--}let a=iso(s.x,s.y,25),b=iso(e.x,e.y,25);s.shots.push({a,b,l:5});e.hp-=w[1];s.shake=5;hit=8;fx(e.x,e.y,'#ff526c');navigator.vibrate?.(25);if(e.hp<=0){s.cash+=e.boss?100:20;s.xp+=e.boss?60:25;s.kills++;s.combo++;s.loot.push({x:e.x,y:e.y});fx(e.x,e.y,'#ffd15c',28);if(s.xp>=100){s.xp-=100;s.lvl++;s.hp=100;msg('LEVEL UP · '+s.lvl)}}else s.combo=Math.max(0,s.combo);turn();ui()}function blast(){if(!s.grenades)return msg('NO GRENADES');s.grenades--;s.shake=18;s.enemies.forEach(e=>{if(e.hp>0&&dist(e)<=5){e.hp-=70;fx(e.x,e.y,'#ff9d42',35);if(e.hp<=0){s.loot.push({x:e.x,y:e.y});s.cash+=20;s.combo++}}});navigator.vibrate?.([40,30,80]);ui()}function loot(){let i=s.loot.findIndex(l=>Math.abs(l.x-s.x)+Math.abs(l.y-s.y)<=2);if(i<0)return msg('NO LOOT NEARBY');s.loot.splice(i,1);let c=10+Math.floor(Math.random()*21);s.cash+=c;s.ammo+=5;msg('LOOT · +'+c+' CREDITS · +5 AMMO');ui()}function msg(x){$('story').textContent=x}function ui(){if(!s)return;$('hp').textContent=Math.max(0,s.hp);$('lvl').textContent=s.lvl;$('ammo').textContent=s.ammo;$('cash').textContent=s.cash;$('armor').textContent=s.armor;$('combo').textContent=s.combo;$('zone').textContent=Z[s.zone];$('status').textContent=(s.stealth?'STEALTH · ':'')+s.weapons[s.weapon][0]+' · '+s.weapons[s.weapon][1]+' DMG · GRENADES '+s.grenades+' · HOSTILES '+s.enemies.filter(e=>e.hp>0).length;localStorage.setItem('echo28',JSON.stringify(s))}function show(h){$('card').innerHTML=h+'<button id="closeBtn">CLOSE</button>';$('modal').classList.remove('hidden');$('closeBtn').onclick=()=>$('modal').classList.add('hidden')}function map(){show('<h2>TRAVEL</h2>'+Z.map((z,i)=>'<button data-z="'+i+'">'+z+'</button>').join(''));document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{s.zone=+b.dataset.z;s.x=13;s.y=11;spawn();$('modal').classList.add('hidden');msg('ENTERED '+Z[s.zone]);ui()})}function start(load){s=load?JSON.parse(localStorage.getItem('echo28')||'null'):null;if(!s)s=fresh();spawn();$('title').classList.add('hidden');ui()}$('newBtn').onclick=()=>start(false);$('continueBtn').onclick=()=>start(true);$('fire').onclick=attack;$('blastBtn').onclick=blast;$('lootBtn').onclick=loot;$('stealthBtn').onclick=()=>{s.stealth=!s.stealth;ui()};$('swapBtn').onclick=()=>{s.weapon=(s.weapon+1)%s.weapons.length;msg('EQUIPPED '+s.weapons[s.weapon][0]);ui()};$('mapBtn').onclick=map;$('useBtn').onclick=()=>msg('SIGNAL SCAN · '+Z[s.zone]+' STABLE');document.addEventListener('keydown',e=>{if(!s)return;let k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')move(0,-1);if(k==='s'||e.key==='ArrowDown')move(0,1);if(k==='a'||e.key==='ArrowLeft')move(-1,0);if(k==='d'||e.key==='ArrowRight')move(1,0);if(e.key===' ')attack()});let active=false,cx=0,cy=0,last=0;$('joy').onpointerdown=e=>{active=true;$('joy').setPointerCapture(e.pointerId);let r=$('joy').getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2};$('joy').onpointermove=e=>{if(!active||!s)return;let dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy)||1,L=30;if(mag>L){dx=dx/mag*L;dy=dy/mag*L}$('stick').style.transform=`translate(${dx}px,${dy}px)`;if(Date.now()-last>115&&Math.hypot(dx,dy)>12){last=Date.now();Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy))}};let end=()=>{active=false;$('stick').style.transform=''};$('joy').onpointerup=end;$('joy').onpointercancel=end;draw()})();</script></body></html>
