<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v27 Standalone</title><style>*{box-sizing:border-box}html,body{margin:0;background:#020609;color:#eaffff;font-family:system-ui;overflow-x:hidden}main{max-width:1100px;margin:auto;padding:5px}h1{text-align:center;margin:2px;letter-spacing:9px;font-size:22px;text-shadow:0 0 22px #55eaff}.hud{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.hud div,.panel{background:#07151bdd;border:1px solid #315963;border-radius:7px;padding:6px;text-align:center;font-size:10px}.hud b{font-size:15px}#wrap{position:relative;margin-top:4px;border-radius:14px;overflow:hidden;box-shadow:0 25px 80px #000}canvas{display:block;width:100%;aspect-ratio:16/9;background:#071015;touch-action:none}.joy{position:absolute;left:20px;bottom:18px;width:108px;height:108px;border:2px solid #80efff66;border-radius:50%;background:#07161bbd;touch-action:none}.stick{position:absolute;left:31px;top:31px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efffff,#40aabd 48%,#123943)}.fire{position:absolute;right:24px;bottom:23px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb0a8,#ad2940 55%,#3b0c17);border:2px solid #ffd0d5;color:#fff;font-weight:900}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:3px}button{background:linear-gradient(#20525f,#0a2730);border:1px solid #4b9ead;color:white;border-radius:7px;padding:10px;font-weight:800;font-size:10px}.overlay{position:fixed;inset:0;background:#010406f4;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.card{width:min(580px,100%);background:linear-gradient(145deg,#10252c,#050b0e);border:1px solid #527c86;border-radius:16px;padding:20px;text-align:center}.card button{width:100%;margin:4px 0}.hidden{display:none}.good{color:#8fffc5}.rare{color:#68baff}@media(max-width:600px){.hud{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>LEVEL<br><b id="lvl">1</b></div><div>AMMO<br><b id="ammo">24</b></div><div>CREDITS<br><b id="cash">100</b></div><div>ARMOR<br><b id="armor">1</b></div><div>ZONE<br><b id="zone">DOWNTOWN</b></div></div><div id="story" class="panel">v27 · STANDALONE CORE</div><div id="wrap"><canvas id="game" width="1280" height="720"></canvas><div id="joy" class="joy"><div id="stick" class="stick"></div></div><button id="fire" class="fire">FIRE</button></div><div class="grid"><button id="stealthBtn">STEALTH</button><button id="blastBtn">BLAST</button><button id="lootBtn">LOOT</button><button id="useBtn">USE</button><button id="swapBtn">SWAP</button><button id="mapBtn">MAP</button></div><div id="status" class="panel"></div></main><div id="title" class="overlay"><div class="card"><h2>ECHO//LIFE</h2><p>THE TOMORROW SIGNAL</p><p>v27 · standalone rebuild</p><button id="newBtn">NEW GAME</button><button id="continueBtn">CONTINUE</button></div></div><div id="modal" class="overlay hidden"><div id="card" class="card"></div></div><script>(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);const zones=['DOWNTOWN','OLD TOWN','INDUSTRIAL','RIVERSIDE','UNDERGROUND','UPTOWN'];let state=null;const fresh=()=>({x:13,y:11,hp:100,lvl:1,xp:0,ammo:24,cash:100,armor:1,grenades:2,weapon:0,weapons:[['PIPE',14,2],['REVOLVER',25,8]],zone:0,stealth:false,enemies:[],loot:[],shake:0});const iso=(x,y,z=0)=>({x:640+(x-y)*32,y:72+(x+y)*16-z});function tile(x,y,c){let a=iso(x,y),b=iso(x+1,y),d=iso(x+1,y+1),e=iso(x,y+1);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(d.x,d.y);ctx.lineTo(e.x,e.y);ctx.closePath();ctx.fill()}function building(x,y,w,h,z,c){let a=iso(x,y+h),b=iso(x+w,y+h),d=iso(x+w,y+h,z),e=iso(x,y+h,z),f=iso(x+w,y),q=iso(x+w,y,z),t=iso(x,y,z);ctx.fillStyle='#23343a';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(d.x,d.y);ctx.lineTo(e.x,e.y);ctx.fill();ctx.fillStyle='#17272d';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(b.x,b.y);ctx.lineTo(d.x,d.y);ctx.lineTo(q.x,q.y);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(q.x,q.y);ctx.lineTo(d.x,d.y);ctx.lineTo(e.x,e.y);ctx.fill();for(let r=0;r<3;r++)for(let i=0;i<w;i++){let p=iso(x+i+.5,y+h,z-25-r*23);ctx.fillStyle=(r+i)%3?'#75dceb88':'#ffd58099';ctx.fillRect(p.x-5,p.y-7,10,11)}}function person(x,y,c,big=1){let p=iso(x,y,4),t=performance.now(),bob=Math.abs(Math.sin(t/180+x))*2;ctx.save();ctx.translate(p.x,p.y-bob);ctx.scale(big,big);ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,5,18,5,0,0,7);ctx.fill();ctx.strokeStyle='#151c20';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-5,-10);ctx.lineTo(-8,-1);ctx.moveTo(5,-10);ctx.lineTo(8,-1);ctx.stroke();ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(-12,-35,24,27,6);ctx.fill();ctx.fillStyle='#c99b78';ctx.beginPath();ctx.arc(0,-45,9,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(0,-48,9,Math.PI,6.2);ctx.fill();ctx.strokeStyle='#263238';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(9,-27);ctx.lineTo(27,-22);ctx.stroke();ctx.restore()}function spawn(){state.enemies=[];for(let i=0;i<5;i++)state.enemies.push({x:17+i%3,y:8+i*2,hp:50+state.lvl*6,max:50+state.lvl*6,alert:false})}function draw(){if(!state){requestAnimationFrame(draw);return}ctx.save();if(state.shake>1){ctx.translate((Math.random()-.5)*state.shake,(Math.random()-.5)*state.shake);state.shake*=.72}let sky=ctx.createLinearGradient(0,0,0,720);sky.addColorStop(0,'#1c3944');sky.addColorStop(1,'#03080b');ctx.fillStyle=sky;ctx.fillRect(0,0,1280,720);for(let x=0;x<27;x++)for(let y=0;y<21;y++)tile(x,y,(x%7===6||y%6===5)?'#1b272c':((x+y)%2?'#293b3e':'#304347'));building(1,1,4,3,110,'#38555b');building(8,1,4,3,125,'#4c4841');building(15,1,4,3,140,'#354d55');building(22,2,4,3,120,'#4a3f51');for(let i=0;i<7;i++){let p=iso(3+i*4,10+(i%4),5);ctx.fillStyle='#6c3e42';ctx.fillRect(p.x-24,p.y-10,48,16);ctx.fillStyle='#15252b';ctx.fillRect(p.x-11,p.y-17,24,10)}state.loot.forEach(l=>{let p=iso(l.x,l.y,8);ctx.shadowColor='#6ff';ctx.shadowBlur=16;ctx.fillStyle='#7ff5ff';ctx.fillRect(p.x-5,p.y-8,10,10);ctx.shadowBlur=0});state.enemies.filter(e=>e.hp>0).forEach(e=>{person(e.x,e.y,'#a43a4d');let p=iso(e.x,e.y,62);ctx.fillStyle='#18080b';ctx.fillRect(p.x-20,p.y,40,5);ctx.fillStyle='#62df8e';ctx.fillRect(p.x-20,p.y,40*Math.max(0,e.hp/e.max),5)});person(state.x,state.y,state.stealth?'#7b775f':'#238ca6');ctx.strokeStyle='#d9faff88';for(let i=0;i<80;i++){let x=(i*91+performance.now()*.35)%1320,y=(i*53+performance.now()*.8)%760;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-8,y+22);ctx.stroke()}ctx.restore();requestAnimationFrame(draw)}function dist(e){return Math.abs(state.x-e.x)+Math.abs(state.y-e.y)}function nearest(r){return state.enemies.filter(e=>e.hp>0).sort((a,b)=>dist(a)-dist(b)).find(e=>dist(e)<=r)}function move(dx,dy){state.x=Math.max(0,Math.min(26,state.x+dx));state.y=Math.max(0,Math.min(20,state.y+dy));enemyTurn();ui()}function enemyTurn(){state.enemies.filter(e=>e.hp>0).forEach(e=>{let d=dist(e);if(d<=(state.stealth?3:7))e.alert=true;if(!e.alert)return;if(d<=1)state.hp-=Math.max(3,9-state.armor);else if(Math.abs(state.x-e.x)>Math.abs(state.y-e.y))e.x+=Math.sign(state.x-e.x);else e.y+=Math.sign(state.y-e.y)});if(state.hp<=0){state.hp=100;state.cash=Math.max(0,state.cash-25);state.x=13;state.y=11;spawn();msg('Respawned · lost 25 credits')}}function attack(){let w=state.weapons[state.weapon],e=nearest(w[2]);if(!e)return msg('No target in range');if(state.weapon>0){if(!state.ammo)return msg('Out of ammo');state.ammo--}e.hp-=w[1];state.shake=5;if(navigator.vibrate)navigator.vibrate(25);if(e.hp<=0){state.cash+=20;state.xp+=25;state.loot.push({x:e.x,y:e.y});if(state.xp>=100){state.xp-=100;state.lvl++;state.hp=100}}enemyTurn();ui()}function blast(){if(!state.grenades)return msg('No grenades');state.grenades--;state.shake=15;state.enemies.forEach(e=>{if(dist(e)<=5)e.hp-=65});if(navigator.vibrate)navigator.vibrate([40,30,70]);ui()}function loot(){let i=state.loot.findIndex(l=>Math.abs(l.x-state.x)+Math.abs(l.y-state.y)<=2);if(i<0)return msg('No loot nearby');state.loot.splice(i,1);state.cash+=15;state.ammo+=4;msg('Looted · +15 credits · +4 ammo');ui()}function msg(x){$('story').textContent=x}function ui(){if(!state)return;$('hp').textContent=Math.max(0,state.hp);$('lvl').textContent=state.lvl;$('ammo').textContent=state.ammo;$('cash').textContent=state.cash;$('armor').textContent=state.armor;$('zone').textContent=zones[state.zone];$('status').textContent=(state.stealth?'STEALTH · ':'')+state.weapons[state.weapon][0]+' · '+state.weapons[state.weapon][1]+' DMG · Grenades '+state.grenades+' · Enemies '+state.enemies.filter(e=>e.hp>0).length;localStorage.setItem('echo27',JSON.stringify(state))}function show(html){$('card').innerHTML=html+'<button id="closeBtn">CLOSE</button>';$('modal').classList.remove('hidden');$('closeBtn').onclick=()=>$('modal').classList.add('hidden')}function mapMenu(){show('<h2>TRAVEL</h2>'+zones.map((z,i)=>'<button data-zone="'+i+'">'+z+'</button>').join(''));document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{state.zone=+b.dataset.zone;state.x=13;state.y=11;spawn();$('modal').classList.add('hidden');msg('Entered '+zones[state.zone]);ui()})}function start(load){state=load?JSON.parse(localStorage.getItem('echo27')||'null'):null;if(!state)state=fresh();spawn();$('title').classList.add('hidden');ui()}$('newBtn').onclick=()=>start(false);$('continueBtn').onclick=()=>start(true);$('fire').onclick=attack;$('blastBtn').onclick=blast;$('lootBtn').onclick=loot;$('stealthBtn').onclick=()=>{state.stealth=!state.stealth;ui()};$('swapBtn').onclick=()=>{state.weapon=(state.weapon+1)%state.weapons.length;ui()};$('mapBtn').onclick=mapMenu;$('useBtn').onclick=()=>msg('Nearby systems scanned · objective signal stable');document.addEventListener('keydown',e=>{if(!state)return;let k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')move(0,-1);if(k==='s'||e.key==='ArrowDown')move(0,1);if(k==='a'||e.key==='ArrowLeft')move(-1,0);if(k==='d'||e.key==='ArrowRight')move(1,0);if(e.key===' ')attack()});let active=false,cx=0,cy=0,last=0;$('joy').onpointerdown=e=>{active=true;$('joy').setPointerCapture(e.pointerId);let r=$('joy').getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2};$('joy').onpointermove=e=>{if(!active||!state)return;let dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy)||1,L=30;if(mag>L){dx=dx/mag*L;dy=dy/mag*L}$('stick').style.transform=`translate(${dx}px,${dy}px)`;if(Date.now()-last>130&&Math.hypot(dx,dy)>12){last=Date.now();Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy))}};function joyEnd(){active=false;$('stick').style.transform=''}$('joy').onpointerup=joyEnd;$('joy').onpointercancel=joyEnd;draw()})();</script></body></html>
