<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>ECHO//LIFE v36</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307;color:#eff;font-family:system-ui}#world{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:radial-gradient(circle at 65% 25%,#183b4b,#061017 45%,#020307 80%);filter:saturate(1.18) contrast(1.08)}#shade{position:fixed;inset:0;background:linear-gradient(#03101a33,#0000 45%,#000a),radial-gradient(circle at center,#0000 45%,#000b);pointer-events:none}.hud{position:fixed;z-index:5;top:max(7px,env(safe-area-inset-top));left:max(9px,env(safe-area-inset-left));right:max(9px,env(safe-area-inset-right));display:flex;gap:5px}.p{background:#041017d9;border:1px solid #61eaff55;border-radius:8px;box-shadow:0 8px 28px #000a;backdrop-filter:blur(7px)}.brand{padding:7px 12px;font-weight:900;letter-spacing:4px;text-shadow:0 0 14px #4ef}.stat{min-width:58px;text-align:center;padding:4px 8px;font-size:8px;color:#8eb8c2}.stat b{display:block;color:white;font-size:14px}.objective{margin-left:auto;padding:6px 12px;font-size:9px}.joy{position:fixed;z-index:7;left:max(22px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:112px;height:112px;border:2px solid #6ef3ff66;border-radius:50%;background:#06161bbb;touch-action:none}.stick{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,white,#5bdbe8 40%,#153c46)}.actions{position:fixed;z-index:7;right:max(20px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:190px;height:145px}.actions button{position:absolute;border-radius:50%;border:1px solid #8ef2ff77;color:white;font-weight:900;background:radial-gradient(circle at 35% 30%,#386d7b,#102a33 60%,#061116);box-shadow:0 8px 24px #000}.fire{right:0;bottom:0;width:84px;height:84px;background:radial-gradient(circle at 35% 30%,#ffe1da,#dc3a58 48%,#500d1c)!important;box-shadow:0 0 34px #ff45665c!important}.blast{right:94px;bottom:0;width:58px;height:58px}.loot{right:103px;bottom:67px;width:52px;height:52px}.swap{right:42px;bottom:91px;width:48px;height:48px}.map{right:0;bottom:91px;width:44px;height:44px}.player{position:fixed;z-index:4;left:50%;top:58%;width:70px;height:130px;transform:translate(-50%,-50%);filter:drop-shadow(0 14px 10px #000b);pointer-events:none}.head{position:absolute;left:25px;top:3px;width:23px;height:25px;border-radius:48%;background:#bd8b6e}.body{position:absolute;left:16px;top:27px;width:40px;height:58px;border-radius:12px 12px 6px 6px;background:linear-gradient(100deg,#173e4a,#36a7bd 50%,#10252d);box-shadow:0 0 18px #2fe5ff33}.leg{position:absolute;top:80px;width:13px;height:47px;background:#10191d;border-radius:5px}.l1{left:18px;transform:rotate(5deg)}.l2{left:39px;transform:rotate(-5deg)}.gun{position:absolute;left:46px;top:51px;width:43px;height:8px;background:#33484e;transform:rotate(10deg);transform-origin:left}.msg{position:fixed;z-index:6;left:50%;top:60px;transform:translateX(-50%);background:#02080bcc;border:1px solid #6df3ff55;border-radius:20px;padding:5px 14px;font-size:10px}.flash{position:fixed;z-index:3;width:100px;height:100px;border-radius:50%;left:52%;top:52%;background:radial-gradient(circle,#fff8bd,#ff9b3b66 25%,#0000 70%);display:none}.overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#102934ee,#010305fa 70%)}.card{width:min(540px,90vw);padding:28px;text-align:center;background:#07151be8;border:1px solid #61dbea66;border-radius:18px}.card h1{letter-spacing:9px;text-shadow:0 0 25px #4ef}.card button{width:100%;padding:12px;margin:5px;background:#143b47;border:1px solid #58cfe0;color:white;border-radius:8px;font-weight:800}.hidden{display:none}@media(max-height:500px){.brand{font-size:10px}.stat{min-width:49px}.objective{font-size:8px}.joy{transform:scale(.86);transform-origin:left bottom}.actions{transform:scale(.84);transform-origin:right bottom}}</style></head><body><img id=world src='assets/echo-city-v36.png' alt='' onerror="this.style.display='none'"><div id=shade></div><div class=hud><div class='p brand'>ECHO//LIFE</div><div class='p stat'>HP<b id=hp>100</b></div><div class='p stat'>LVL<b id=lvl>1</b></div><div class='p stat'>AMMO<b id=ammo>36</b></div><div class='p stat'>¢<b id=cash>100</b></div><div class='p objective'>SIGNAL <b id=mission>0 / 5</b></div></div><div id=msg class=msg>v36 · CINEMATIC ASSET PIPELINE READY</div><div class=player id=player><div class=head></div><div class=body></div><div class='leg l1'></div><div class='leg l2'></div><div class=gun></div></div><div id=flash class=flash></div><div id=joy class=joy><div id=stick class=stick></div></div><div class=actions><button id=fire class=fire>FIRE</button><button id=blast class=blast>BLAST</button><button id=loot class=loot>LOOT</button><button id=swap class=swap>SWAP</button><button id=map class=map>MAP</button></div><div id=title class=overlay><div class=card><h1>ECHO//LIFE</h1><p>THE TOMORROW SIGNAL</p><p>v36 · CINEMATIC ASSET EDITION</p><button id=start>ENTER CITY</button></div></div><script>(()=>{const $=x=>document.getElementById(x);let S={hp:100,lvl:1,ammo:36,cash:100,mission:0,goal:5,x:50,y:58,weapon:0},active=false,cx=0,cy=0,last=0;function ui(){$('hp').textContent=S.hp;$('lvl').textContent=S.lvl;$('ammo').textContent=S.ammo;$('cash').textContent=S.cash;$('mission').textContent=S.mission+' / '+S.goal;$('player').style.left=S.x+'%';$('player').style.top=S.y+'%';localStorage.setItem('echo36',JSON.stringify(S))}function msg(t){$('msg').textContent=t}function move(dx,dy){S.x=Math.max(13,Math.min(87,S.x+dx*1.4));S.y=Math.max(28,Math.min(80,S.y+dy*1.2));ui()}function fire(){if(S.ammo<=0)return msg('OUT OF AMMO');S.ammo--;$('flash').style.display='block';navigator.vibrate?.(20);setTimeout(()=>$('flash').style.display='none',70);if(Math.random()>.38){S.mission++;S.cash+=12;msg('HOSTILE SIGNAL DISRUPTED · +12¢');if(S.mission>=S.goal){S.mission=0;S.goal++;S.lvl++;S.cash+=100;msg('CONTRACT COMPLETE · +100¢')}}else msg('SHOT MISSED');ui()}$('start').onclick=()=>{$('title').classList.add('hidden');let old=localStorage.getItem('echo36');if(old)try{S=JSON.parse(old)}catch(e){}ui()};$('fire').onclick=fire;$('blast').onclick=()=>{if(S.ammo<3)return msg('NEED 3 AMMO');S.ammo-=3;S.mission+=2;S.cash+=20;navigator.vibrate?.([30,20,60]);msg('PULSE BLAST · +20¢');ui()};$('loot').onclick=()=>{S.cash+=5;S.ammo+=2;msg('CACHE FOUND · +5¢ · +2 AMMO');ui()};$('swap').onclick=()=>{S.weapon=(S.weapon+1)%4;msg('WEAPON '+['REVOLVER','SMG','PULSE','ARC'][S.weapon])};$('map').onclick=()=>msg('NEON WARD · CINEMATIC DISTRICT 01');document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);if(e.key==='ArrowRight'||e.key==='d')move(1,0);if(e.key==='ArrowUp'||e.key==='w')move(0,-1);if(e.key==='ArrowDown'||e.key==='s')move(0,1);if(e.key===' ')fire()});$('joy').onpointerdown=e=>{active=true;$('joy').setPointerCapture(e.pointerId);let r=$('joy').getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2};$('joy').onpointermove=e=>{if(!active)return;let dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy)||1,L=33;if(m>L){dx=dx/m*L;dy=dy/m*L}$('stick').style.transform=`translate(${dx}px,${dy}px)`;if(Date.now()-last>45&&m>10){last=Date.now();move(dx/L,dy/L)}};let end=()=>{active=false;$('stick').style.transform=''};$('joy').onpointerup=end;$('joy').onpointercancel=end;ui()})();</script></body></html>
