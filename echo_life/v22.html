>');ui()}function grenade(){if(!s.grenades)return msg('No grenades.');s.grenades--;s.shake=15;s.enemies.forEach(e=>{if(dist(e)<=5){e.hp-=60;fx(e.x,e.y,'#ff9b45',40);kill(e)}});enemyTurn();checkDeath();ui()}function kill(e){if(e.hp<=0&&!e.dead){e.dead=true;s.kills++;s.cash+=e.boss?220:18;s.xp+=e.boss?200:25;if(e.boss&&(s.mission===5||s.mission===7))advance();while(s.xp>=100){s.xp-=100;s.lvl++;s.hp=100}}}function enemyTurn(){s.enemies.filter(e=>e.hp>0).forEach(e=>{let d=dist(e);if(d<=(s.stealth?3:7))e.alert=true;if(!e.alert)return;if(d<=1)s.hp-=Math.max(3,10-s.armor);else{let dx=px()-e.x,dy=py()-e.y;if(Math.abs(dx)>Math.abs(dy))e.x+=Math.sign(dx);else e.y+=Math.sign(dy)}})}function allyTurn(){let e=nearest(6);if(e&&e.alert&&s.compHP>0){e.hp-=10;s.shots.push({a:iso(px()-1,py()+1,22),b:iso(e.x,e.y,22),c:'#7dffad',life:4});kill(e)}}function checkDeath(){if(s.hp>0)return;s.deaths++;s.hp=100;s.cash=Math.max(0,s.cash-25);s.zone=s.checkpoint;s.inside=null;s.x=12;s.y=10;spawn();msg('<span class="danger">You died · checkpoint restored.</span>')}const rr=['common','common','uncommon','uncommon','rare','epic','legendary'];function loot(){let r=rr[Math.floor(Math.random()*rr.length)],names={common:['Scrap','Bandage'],uncommon:['Medkit','Ammo Pack'],rare:['Armor Plate','Weapon Parts'],epic:['Echo Capacitor'],legendary:['Tomorrow Shard']}[r],n=names[Math.floor(Math.random()*names.length)];if(n==='Ammo Pack')s.ammo+=12;else if(n==='Armor Plate'){s.armor++;s.armorName='Echo Vest';s.armorRarity=r}else if(s.bag.length<s.slots)s.bag.push({n,r});msg('<span class="'+r+'">'+r.toUpperCase()+' · '+n+'</span>');ui()}function buildingHere(){let n=zones[s.zone];if(s.x<6&&s.y<7)return n[0];if(s.x>7&&s.x<14&&s.y<7)return n[1];if(s.x>14&&s.x<21&&s.y<7)return n[2];if(s.x>21&&s.y<8)return n[3]}function interact(){if(s.inside){let o=objective();if(o&&o[0]===s.zone&&o[1]===s.inside)return storyEvent();if(s.ix<=3&&s.iy>=7){s.inside=null;s.x=12;s.y=8;spawn();return ui()}return npc(s.inside)}let b=buildingHere();if(!b)return msg('Move to a building entrance.');s.inside=b;s.ix=4;s.iy=8;spawn();msg('Entered '+b);ui()}function storyEvent(){let sc=[['Radio Operator','The voice on tomorrow’s broadcast is yours.'],['Engineer','This Grid Key was predicted to disappear tonight.'],['Detective Hale','Dr. Vale built the system. Find her.'],['Dr. Vale','Echoes are corrections. Every changed prediction creates one.'],['Archive AI','Tomorrow is being transmitted backward, not predicted.'],['Mara','The Tower Echo knew we were coming.'],['Dr. Vale','The Mirror Network can send us through the signal.'],['THE ARCHITECT','I am you, twenty-four hours from now.']][s.mission];if(s.mission===7)return ending();choice(sc[0],sc[1],['Continue','Ask why'],()=>advance())}function advance(){s.mission++;s.inside=null;s.x=12;s.y=10;s.cash+=40;s.day+=.2;spawn();let o=objective();msg(o?'New objective · '+o[2]+' · '+o[0]+'/'+o[1]:'Campaign complete');ui()}function ending(){show('<h2>THE ARCHITECT</h2><p>Your future self says the corrections were keeping you alive.</p><button onclick="end(\'BREAK THE SIGNAL\')">Destroy the signal</button><button onclick="end(\'MAINTAIN THE LOOP\')">Preserve the loop</button><button onclick="end(\'REWRITE TOMORROW\')">Rewrite tomorrow</button>')}function end(v){s.ending=v;s.mission=8;closeM();msg('<span class="legendary">ENDING · '+v+'</span>');ui()}function npc(p){if(p.includes('MARKET')||p.includes('PAWN')||p.includes('MALL'))return shop();if(p.includes('CLINIC'))return show('<h2>Clinic</h2><button onclick="heal()">Full heal $30</button>');if(p.includes('SAFEHOUSE')){s.checkpoint=s.zone;return msg('Checkpoint updated.')}choice('Survivor','The broadcasts are changing people.',['Ask about supplies','Ask about Echoes'],v=>s.rep+=v+1)}function choice(n,t,opts,cb){show('<h2>'+n+'</h2><p>'+t+'</p>'+opts.map((o,i)=>'<button onclick="choose('+i+')">'+o+'</button>').join(''));window.cb=cb}function choose(i){cb(i);closeM();ui()}function shop(){show('<h2>Trader · $'+s.cash+'</h2><button onclick="buy(\'ammo\',25)">12 Ammo · $25</button><button onclick="buy(\'grenade\',35)">Grenade · $35</button><button onclick="buy(\'shotgun\',100)">Rare Shotgun · $100</button><button onclick="buy(\'rifle\',160)">Epic Rifle · $160</button>')}function buy(k,c){if(s.cash<c)return alert('Not enough credits');s.cash-=c;if(k==='ammo')s.ammo+=12;if(k==='grenade')s.grenades++;if(k==='shotgun'&&!s.weapons.some(w=>w.n==='Shotgun'))s.weapons.push({n:'Shotgun',type:'gun',d:44,r:'rare'});if(k==='rifle'&&!s.weapons.some(w=>w.n==='Rifle'))s.weapons.push({n:'Rifle',type:'gun',d:58,r:'epic'});shop();ui()}function heal(){if(s.cash<30)return alert('Need $30');s.cash-=30;s.hp=100;closeM();ui()}function map(){show('<h2>City Map</h2>'+Object.keys(zones).map(z=>'<button onclick="go(\''+z+'\')">'+z+(objective()&&objective()[0]===z?' · ◆ OBJECTIVE':'')+'</button>').join(''))}function go(z){s.zone=z;s.inside=null;s.x=12;s.y=10;s.day+=.1;s.weather=Math.random()<.25?'STORM':Math.random()<.75?'RAIN':'CLEAR';spawn();closeM();ui()}function inventory(){show('<h2>Gear</h2><p class="'+s.armorRarity+'">'+s.armorName+' · Armor '+s.armor+'</p><p>'+s.bag.map(x=>'<span class="'+x.r+'">'+x.n+'</span>').join(' · ')+'</p>')}function weapons(){show('<h2>Arsenal</h2>'+s.weapons.map((w,i)=>'<button class="'+w.r+'" onclick="equip('+i+')">'+(i===s.weapon?'✓ ':'')+w.n+' · '+w.d+' DMG</button>').join(''))}function equip(i){s.weapon=i;closeM();ui()}function cycleWeapon(){s.weapon=(s.weapon+1)%s.weapons.length;ui()}function missions(){let o=objective();show('<h2>The Tomorrow Signal</h2><p>Chapter '+Math.min(s.mission+1,8)+' / 8</p><p>'+(o?o[2]+' · '+o[0]+' → '+o[1]:'Ending · '+s.ending)+'</p>')}function systemMenu(){show('<h2>System</h2><button onclick="save()">Save Game</button><button onclick="tutorial()">Tutorial</button><button onclick="titleScreen()">Title Screen</button>')}function save(){localStorage.setItem('echo22',JSON.stringify(s));closeM();msg('Game saved.')}function loadGame(){s=JSON.parse(localStorage.getItem('echo22')||'null')||fresh();spawn();title.classList.add('hidden');ui()}function newGame(){s=fresh();spawn();title.classList.add('hidden');tutorial();ui()}function titleScreen(){closeM();title.classList.remove('hidden')}function tutorial(){show('<h2>v22 Visual Rebuild</h2><p>Use the touch joystick or WASD/arrow keys to move. FIRE attacks. Yellow markers show story objectives. USE enters buildings. The city now has detailed roads, sidewalks, lit windows, doors, cars, streetlights, trees, debris, animated characters, rain, fog, shadows and cinematic lighting.</p>')}function show(h){card.innerHTML=h+'<button onclick="closeM()">CLOSE</button>';modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}function msg(t){story.innerHTML=t}function ui(){hp.textContent=Math.max(0,Math.round(s.hp));en.textContent=s.en;lvl.textContent=s.lvl;ammo.textContent=s.ammo;cash.textContent=s.cash;armor.textContent=s.armor;quest.textContent=Math.min(s.mission,8)+'/8';day.textContent=s.day.toFixed(1);let o=objective();status.textContent=(s.stealth?'STEALTH · ':'')+s.zone+' · '+s.weather+' · '+s.weapons[s.weapon].n+' '+s.weapons[s.weapon].d+'DMG · Grenades '+s.grenades+(o?' · ◆ '+o[0]+'/'+o[1]:'');localStorage.setItem('echo22',JSON.stringify(s))}function setupJoy(){let active=false,cx,cy,last=0;joy.onpointerdown=e=>{active=true;joy.setPointerCapture(e.pointerId);let r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2};joy.onpointermove=e=>{if(!active)return;let dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy)||1,lim=31;if(mag>lim){dx=dx/mag*lim;dy=dy/mag*lim}stick.style.transform=`translate(${dx}px,${dy}px)`;if(Date.now()-last>135&&Math.hypot(dx,dy)>13){last=Date.now();Math.abs(dx)>Math.abs(dy)?mv(Math.sign(dx),0):mv(0,Math.sign(dy))}};let end=()=>{active=false;stick.style.transform=''};joy.onpointerup=end;joy.onpointercancel=end}document.addEventListener('keydown',e=>{if(!title.classList.contains('hidden'))return;if(e.key==='
