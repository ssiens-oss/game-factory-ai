<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v16</title><style>*{box-sizing:border-box}body{margin:0;background:#020609;color:#eaffff;font-family:system-ui;text-align:center}main{max-width:850px;margin:auto;padding:6px}h1{margin:2px;letter-spacing:7px;text-shadow:0 0 14px #5eeaff}.hud{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.hud div,.panel{background:#0a2028e8;border:1px solid #376b76;border-radius:9px;padding:6px;font-size:10px}canvas{width:100%;aspect-ratio:16/10;border:1px solid #4d7e88;border-radius:14px;background:#071015;touch-action:none}.pad{width:180px;margin:5px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.pad i{visibility:hidden}button{border:1px solid #4ea7b6;background:linear-gradient(#23798a,#0d4350);color:white;border-radius:8px;padding:9px;font-weight:800}.actions,.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.actions button,.tabs button{font-size:9px;padding:9px 1px}.tabs{margin-top:3px}.good{color:#8fffc5}.danger{color:#ff7187}.gold{color:#ffe279}.bar{height:5px;background:#17282e;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#76eaff}.modal{position:fixed;inset:0;background:#010407ed;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.card{width:min(480px,100%);max-height:82vh;overflow:auto;background:#0b1d24;border:1px solid #43808c;border-radius:15px;padding:15px;text-align:left}.card button{width:100%;margin:3px}.hidden{display:none}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>EN<br><b id="en">100</b></div><div>LVL<br><b id="lvl">1</b></div><div>XP<br><b id="xp">0</b></div><div>$<br><b id="cash">25</b></div><div>DAY<br><b id="day">1</b></div><div>ZONE<br><b id="zone">CITY</b></div></div><div class="bar"><i id="xpbar"></i></div><div id="story" class="panel">v16: the city has opened up.</div><canvas id="view" width="960" height="600"></canvas><div class="pad"><i></i><button onclick="mv(0,-1)">▲</button><i></i><button onclick="mv(-1,0)">◀</button><button onclick="act()">◎</button><button onclick="mv(1,0)">▶</button><i></i><button onclick="mv(0,1)">▼</button><i></i></div><div class="actions"><button onclick="attack()">ATTACK</button><button onclick="loot()">LOOT</button><button onclick="act()">INTERACT</button><button onclick="travel()">MAP</button><button onclick="rest()">REST</button></div><div class="tabs"><button onclick="inventory()">INVENTORY</button><button onclick="craft()">CRAFT</button><button onclick="quests()">QUESTS</button><button onclick="skills()">SKILLS</button><button onclick="radio()">RADIO</button></div><div id="status" class="panel"></div></main><div id="modal" class="modal hidden"><div id="card" class="card"></div></div><script>const C=view,g=C.getContext('2d'),W=72,H=36,O=480;let s=JSON.parse(localStorage.getItem('echo16')||'null')||{x:8,y:7,hp:100,en:100,lvl:1,xp:0,cash:25,day:1,hour:8,zone:'DOWNTOWN',bag:['Scrap','Wire'],weapon:'Pipe',dmg:9,armor:0,points:1,skills:{combat:0,survival:0,scavenge:0},rep:{Wardens:0,Drifters:0},quests:{signal:0,subway:0,rescue:0},kills:0,bosses:0,weather:'RAIN',enemy:{x:13,y:9,hp:35,type:'Raider'},vehicle:false,generator:false};const zones={DOWNTOWN:{c:'#24383b',sites:['Market','Clinic','Apartments']},INDUSTRIAL:{c:'#393a35',sites:['Garage','Warehouse','Power Plant']},RIVERSIDE:{c:'#263d3a',sites:['Docks','Motel','Radio Tower']},UNDERGROUND:{c:'#25272e',sites:['Subway','Maintenance','Vault']}};function iso(a,b,z=0){return{x:O+(a-b)*W/2,y:82+(a+b)*H/2-z}}function poly(p,f){g.beginPath();g.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>g.lineTo(q.x,q.y));g.closePath();g.fillStyle=f;g.fill();g.strokeStyle='#0007';g.stroke()}function tile(a,b,f){poly([iso(a,b),iso(a+1,b),iso(a+1,b+1),iso(a,b+1)],f)}function human(a,b,col='#2c8da0',big=1){let q=iso(a,b,5);g.save();g.translate(q.x,q.y);g.shadowColor=col;g.shadowBlur=big>1?22:4;g.strokeStyle='#17262b';g.lineWidth=5*big;g.beginPath();g.moveTo(-4*big,-8*big);g.lineTo(-8*big,10*big);g.moveTo(4*big,-8*big);g.lineTo(8*big,10*big);g.stroke();g.fillStyle=col;g.fillRect(-9*big,-32*big,18*big,25*big);g.fillStyle='#c99b78';g.beginPath();g.arc(0,-40*big,8*big,0,7);g.fill();g.restore()}function building(a,b,w,h,z,name,col){let d=iso(a,b+h),e=iso(a+w,b+h),t=iso(a,b,z),u=iso(a+w,b,z),v=iso(a,b+h,z),q=iso(a+w,b+h,z);poly([d,e,q,v],'#26383d');poly([t,u,q,v],col);g.fillStyle='#dffcff';g.font='bold 12px system-ui';let m=iso(a+w/2,b+h/2,z+5);g.fillText(name,m.x,m.y)}function draw(){g.clearRect(0,0,960,600);g.fillStyle=s.zone==='UNDERGROUND'?'#06070a':'#071015';g.fillRect(0,0,960,600);let z=zones[s.zone];for(let a=0;a<21;a++)for(let b=0;b<17;b++)tile(a,b,(a%6===5||b%5===4)?'#151d21':z.c);building(1,1,4,3,95,z.sites[0],z.c);building(8,1,4,3,120,z.sites[1],z.c);building(15,2,4,3,105,z.sites[2],z.c);for(let i=0;i<8;i++){let q=iso((i*3+2)%20,(i*5+7)%16,4);g.fillStyle=i%2?'#684640':'#445c64';g.fillRect(q.x-24,q.y-9,48,15)}if(s.generator){let q=iso(10,12,8);g.fillStyle='#6eff9b';g.fillRect(q.x-15,q.y-15,30,18);g.fillText('GEN',q.x-12,q.y-20)}human(s.x,s.y);if(s.enemy.hp>0)human(s.enemy.x,s.enemy.y,s.enemy.type==='Echo Brute'?'#b51638':'#913640',s.enemy.type==='Echo Brute'?1.5:1);if(s.weather!=='CLEAR'&&s.zone!=='UNDERGROUND'){g.strokeStyle=s.weather==='STORM'?'#d9f7ff88':'#c9f2ff38';for(let i=0;i<(s.weather==='STORM'?140:70);i++){let rx=(i*79+performance.now()/6)%1000,ry=(i*43+performance.now()/2.5)%650;g.beginPath();g.moveTo(rx,ry);g.lineTo(rx-8,ry+22);g.stroke()}}requestAnimationFrame(draw)}function tick(h=.25){s.hour+=h;s.en=Math.max(0,s.en-h*2);if(s.hour>=24){s.hour-=24;s.day++;s.weather=Math.random()<.25?'STORM':Math.random()<.5?'CLEAR':'RAIN';spawn()}if(!s.en)s.hp-=2;save()}function spawn(){let types=s.day>2?['Raider','Stalker','Echo Brute']:['Raider','Stalker'];s.enemy={x:14,y:8,hp:30+s.day*8,type:types[Math.floor(Math.random()*types.length)]}}function mv(dx,dy){s.x=Math.max(0,Math.min(20,s.x+dx));s.y=Math.max(0,Math.min(16,s.y+dy));tick();if(s.enemy.hp>0&&Math.abs(s.x-s.enemy.x)+Math.abs(s.y-s.enemy.y)<7){if(Math.abs(s.x-s.enemy.x)>Math.abs(s.y-s.enemy.y))s.enemy.x+=Math.sign(s.x-s.enemy.x);else s.enemy.y+=Math.sign(s.y-s.enemy.y);if(Math.abs(s.x-s.enemy.x)+Math.abs(s.y-s.enemy.y)<=1){s.hp-=Math.max(2,8-s.armor-s.skills.survival);story.innerHTML='<span class="danger">'+s.enemy.type+' attacks.</span>'}}ui()}function attack(){let d=Math.abs(s.x-s.enemy.x)+Math.abs(s.y-s.enemy.y);if(s.enemy.hp<=0)return msg('Area clear.');if(d>2)return msg('Target out of range.');let dmg=s.dmg+s.skills.combat*4;s.enemy.hp-=dmg;s.en=Math.max(0,s.en-4);msg('You hit '+s.enemy.type+' for '+dmg+'.');if(s.enemy.hp<=0){s.kills++;s.cash+=12;gain(25);msg('<span class="good">'+s.enemy.type+' defeated · +25 XP · $12</span>');if(s.enemy.type==='Echo Brute'){s.bosses++;s.bag.push('Echo Shard')}}ui()}function loot(){let chance=.35+s.skills.scavenge*.12,items=['Scrap','Wire','Battery','Food','Medical Kit','Ammo','Circuit'];if(Math.random()<chance){let it=items[Math.floor(Math.random()*items.length)];s.bag.push(it);msg('<span class="gold">Found '+it+'</span>')}else msg('Nothing useful here.');tick(.5);ui()}function act(){if(s.zone==='RIVERSIDE'&&s.x>14&&s.y<7&&!s.quests.signal){s.quests.signal=1;s.cash+=30;gain(40);msg('<span class="good">RADIO TOWER ONLINE · New transmission unlocked.</span>')}else if(s.zone==='UNDERGROUND'&&s.x>14&&s.y<7&&!s.quests.subway){s.quests.subway=1;s.bag.push('Vault Key');gain(50);msg('<span class="gold">SUBWAY VAULT KEY RECOVERED.</span>')}else if(s.zone==='INDUSTRIAL'&&s.x>14&&s.y<7&&!s.generator){s.generator=true;s.rep.Wardens+=2;gain(35);msg('<span class="good">POWER PLANT RESTARTED. Wardens +2.</span>')}else msg('Search nearby landmarks for objectives.');ui()}function travel(){show('<h2>CITY MAP</h2>'+Object.keys(zones).map(k=>'<button onclick="go(\''+k+'\')">'+k+' · '+zones[k].sites.join(' / ')+'</button>').join(''))}function go(z){s.zone=z;s.x=8;s.y=7;spawn();tick(1);closeM();msg('Traveled to '+z+'. One hour passed.');ui()}function rest(){s.en=Math.min(100,s.en+55);s.hp=Math.min(100,s.hp+10+s.skills.survival*5);tick(4);msg('You rest for four hours.');ui()}function inventory(){show('<h2>INVENTORY</h2><p>Weapon: '+s.weapon+' · '+s.dmg+' DMG</p><p>Armor '+s.armor+'</p><p>'+(s.bag.join(' · ')||'Empty')+'</p><button onclick="use(\'Medical Kit\')">Use Medical Kit</button><button onclick="use(\'Food\')">Eat Food</button>')}function use(it){let i=s.bag.indexOf(it);if(i<0)return alert('You do not have one.');s.bag.splice(i,1);if(it==='Medical Kit')s.hp=Math.min(100,s.hp+50);else s.en=Math.min(100,s.en+50);closeM();ui()}function craft(){show('<h2>CRAFTING</h2><button onclick="make(\'Shock Baton\')">Scrap + Wire + Battery → Shock Baton</button><button onclick="make(\'Armor\')">2 Scrap + Wire → Armor</button><button onclick="make(\'Motorbike\')">3 Scrap + Circuit + Battery → Motorbike</button>')}function take(arr){let b=[...s.bag];for(let a of arr){let i=b.indexOf(a);if(i<0)return false;b.splice(i,1)}s.bag=b;return true}function make(i){if(i==='Shock Baton'&&take(['Scrap','Wire','Battery'])){s.weapon=i;s.dmg=18}else if(i==='Armor'&&take(['Scrap','Scrap','Wire']))s.armor+=5;else if(i==='Motorbike'&&take(['Scrap','Scrap','Scrap','Circuit','Battery']))s.vehicle=true;else return alert('Missing materials');closeM();msg(i+' crafted.');ui()}function skills(){show('<h2>SKILLS · '+s.points+' POINTS</h2>'+Object.keys(s.skills).map(k=>'<button onclick="up(\''+k+'\')">'+k.toUpperCase()+' '+s.skills[k]+'</button>').join(''))}function up(k){if(!s.points)return alert('No skill points.');s.points--;s.skills[k]++;skills();ui()}function quests(){show('<h2>MISSIONS</h2><p>'+(s.generator?'✓':'○')+' Restart Industrial Power Plant</p><p>'+(s.quests.signal?'✓':'○')+' Activate Riverside Radio Tower</p><p>'+(s.quests.subway?'✓':'○')+' Recover Underground Vault Key</p><p>Enemies defeated: '+s.kills+'</p><p>Echo Brutes defeated: '+s.bosses+'</p>')}function radio(){msg(s.quests.signal?'TRANSMISSION: "The signal is coming from below the subway vault. The Echoes are not copies. They are previews."':'Radio static. Activate the Riverside tower.')}function gain(n){s.xp+=n;while(s.xp>=100){s.xp-=100;s.lvl++;s.points++;s.hp=100;msg('<span class="good">LEVEL '+s.lvl+' · SKILL POINT +1</span>')}}function show(h){card.innerHTML=h+'<button onclick="closeM()">CLOSE</button>';modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}function msg(t){story.innerHTML=t}function save(){localStorage.setItem('echo16',JSON.stringify(s))}function ui(){hp.textContent=Math.max(0,Math.round(s.hp));en.textContent=Math.round(s.en);lvl.textContent=s.lvl;xp.textContent=s.xp;cash.textContent=s.cash;day.textContent=s.day;zone.textContent=s.zone;xpbar.style.width=s.xp+'%';status.textContent='Day '+s.day+' · '+String(Math.floor(s.hour)).padStart(2,'0')+':00 · '+s.weather+' · '+s.weapon+' '+s.dmg+'DMG · Armor '+s.armor+' · '+(s.vehicle?'Motorbike · ':'')+'Bag '+s.bag.length+' · Enemy '+s.enemy.type+' '+Math.max(0,s.enemy.hp)+'HP';save()}ui();draw();</script></body></html>
