<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v15</title><style>*{box-sizing:border-box}body{margin:0;background:#020609;color:#eaffff;font-family:system-ui;text-align:center}main{max-width:820px;margin:auto;padding:6px}h1{margin:2px;letter-spacing:7px;text-shadow:0 0 14px #5eeaff}.hud{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.hud div,.panel{background:#0a2028e8;border:1px solid #376b76;border-radius:9px;padding:6px;font-size:10px}#view{width:100%;aspect-ratio:16/10;border:1px solid #4d7e88;border-radius:14px;background:#071015;touch-action:none}.pad{width:180px;margin:5px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.pad i{visibility:hidden}button{border:1px solid #4ea7b6;background:linear-gradient(#23798a,#0d4350);color:white;border-radius:8px;padding:9px;font-weight:800}.actions,.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.actions button,.tabs button{font-size:9px;padding:9px 1px}.tabs{margin-top:3px}.danger{color:#ff7187}.good{color:#8fffc5}.gold{color:#ffe279}.bar{height:5px;background:#17282e;border-radius:6px;overflow:hidden;margin:3px}.bar i{display:block;height:100%;background:#76eaff}.modal{position:fixed;inset:0;background:#010407ed;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(460px,100%);max-height:80vh;overflow:auto;background:#0b1d24;border:1px solid #43808c;border-radius:16px;padding:16px;text-align:left}.card button{width:100%;margin:3px 0}.hidden{display:none}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>ENERGY<br><b id="en">100</b></div><div>TIME<br><b id="tm">72h</b></div><div>LVL<br><b id="lvl">1</b></div><div>CASH<br><b id="cash">$20</b></div><div>WEATHER<br><b id="weather">RAIN</b></div></div><div class="bar"><i id="xpbar"></i></div><div id="story" class="panel">v15 WORLD SYSTEMS ONLINE.</div><canvas id="view" width="960" height="600"></canvas><div class="pad"><i></i><button onpointerdown="move(0,-1)">▲</button><i></i><button onpointerdown="move(-1,0)">◀</button><button onclick="interact()">◎</button><button onpointerdown="move(1,0)">▶</button><i></i><button onpointerdown="move(0,1)">▼</button><i></i></div><div class="actions"><button onclick="search()">SEARCH</button><button onclick="enter()">ENTER</button><button onclick="fight()">ATTACK</button><button onclick="floorUp()">STAIRS</button><button onclick="useItem()">USE</button></div><div class="tabs"><button onclick="craftMenu()">CRAFT</button><button onclick="skillMenu()">SKILLS</button><button onclick="factionMenu()">FACTIONS</button><button onclick="camp()">CAMP</button><button onclick="radio()">RADIO</button></div><div id="gear" class="panel"></div><div id="quest" class="panel"></div></main><div id="modal" class="modal hidden"><div id="card" class="card"></div></div><script>const c=view,x=c.getContext('2d');let s=JSON.parse(localStorage.getItem('echoIso15')||'null')||{px:9,py:8,hp:100,en:100,time:72,lvl:1,xp:0,cash:20,inside:null,floor:1,ix:4,iy:7,bag:['Scrap','Wire'],weapon:'Fists',dmg:6,armor:0,opened:{},kills:0,boss:false,bossHP:120,enemy:{x:8,y:4,hp:30},skills:{combat:0,scavenge:0,survival:0},points:1,rep:{Wardens:0,Drifters:0},faction:null,camp:false,weather:'RAIN',eventClock:0,radioFound:false,ending:null};const W=72,H=36,OX=480,OY=96,B=[{x:1,y:1,w:5,h:4,z:120,n:'CLINIC',col:'#426773'},{x:8,y:1,w:5,h:4,z:145,n:'MARKET',col:'#685943'},{x:15,y:2,w:5,h:4,z:108,n:'GARAGE',col:'#495961'},{x:2,y:10,w:5,h:4,z:160,n:'APARTMENTS',col:'#515c6b'},{x:11,y:10,w:6,h:4,z:135,n:'PHARMACY',col:'#45685d'}],special={CLINIC:'Medical Kit',MARKET:'Food',GARAGE:'Crowbar',APARTMENTS:'Security Key',PHARMACY:'Antibiotics'};function iso(a,b,z=0){return{x:OX+(a-b)*W/2,y:OY+(a+b)*H/2-z}}function poly(p,f){x.beginPath();x.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>x.lineTo(q.x,q.y));x.closePath();x.fillStyle=f;x.fill();x.strokeStyle='#0007';x.stroke()}function tile(a,b,f){poly([iso(a,b),iso(a+1,b),iso(a+1,b+1),iso(a,b+1)],f)}function person(a,b,col='#278093',big=1){let q=iso(a,b,5),w=Math.sin(performance.now()/100)*4;x.save();x.translate(q.x,q.y);x.shadowColor=col;x.shadowBlur=big>1?22:5;x.strokeStyle='#17262b';x.lineWidth=5*big;x.beginPath();x.moveTo(-4*big,-8*big);x.lineTo((-7+w/2)*big,10*big);x.moveTo(4*big,-8*big);x.lineTo((7-w/2)*big,10*big);x.stroke();x.fillStyle=col;x.fillRect(-9*big,-32*big,18*big,25*big);x.fillStyle='#c99b78';x.beginPath();x.arc(0,-40*big,8*big,0,Math.PI*2);x.fill();x.restore()}function building(o){let d=iso(o.x,o.y+o.h),e=iso(o.x+o.w,o.y+o.h),t=iso(o.x,o.y,o.z),u=iso(o.x+o.w,o.y,o.z),v=iso(o.x,o.y+o.h,o.z),w=iso(o.x+o.w,o.y+o.h,o.z);poly([d,e,w,v],'#273b40');poly([t,u,w,v],o.col);x.fillStyle='#d9fbff';x.font='bold 13px system-ui';x.fillText(o.n,iso(o.x+o.w/2,o.y+o.h/2,o.z+5).x,iso(o.x+o.w/2,o.y+o.h/2,o.z+5).y)}function street(){for(let a=0;a<21;a++)for(let b=0;b<17;b++)tile(a,b,(a%7===6||b%6===5)?'#172126':'#253936');B.forEach(building);if(s.camp){let q=iso(10,9,8);x.fillStyle='#ffb04f';x.beginPath();x.arc(q.x,q.y,10,0,7);x.fill();x.fillStyle='#ffe2a3';x.font='11px system-ui';x.fillText('CAMP',q.x,q.y-18)}person(s.px,s.py)}function prop(a,b,col='#705c43'){let q=iso(a,b,18);x.fillStyle=col;x.fillRect(q.x-34,q.y-26,68,34)}function interior(){let theme={CLINIC:'#29474b',MARKET:'#493e2e',GARAGE:'#343e43',APARTMENTS:'#3d3948',PHARMACY:'#2c493f'}[s.inside];for(let a=2;a<11;a++)for(let b=2;b<10;b++)tile(a,b,(a+b)%2?theme:'#17252a');prop(4,4);prop(7,4);let k=s.inside+s.floor,q=iso(8,7,18);x.fillStyle=s.opened[k]?'#333':'#bd8239';x.fillRect(q.x-18,q.y-18,36,22);if(s.boss){person(8,4,'#b11235',1.7);x.fillStyle='#ff637d';x.font='bold 15px system-ui';x.fillText('PRIME ECHO · '+s.bossHP+' HP',480,105)}else if(s.enemy.hp>0){person(s.enemy.x,s.enemy.y,'#92343d');x.fillStyle='#ff7187';x.font='11px system-ui';x.fillText('HOSTILE '+s.enemy.hp,iso(s.enemy.x,s.enemy.y,50).x,iso(s.enemy.x,s.enemy.y,50).y)}person(s.ix,s.iy);x.fillStyle='#eaffff';x.font='bold 19px system-ui';x.fillText(s.inside+' · FLOOR '+s.floor,480,40)}function draw(){x.clearRect(0,0,960,600);x.fillStyle=s.weather==='STORM'?'#04080d':'#071015';x.fillRect(0,0,960,600);s.inside?interior():street();if(!s.inside&&s.weather!=='CLEAR'){x.strokeStyle=s.weather==='STORM'?'#d9f6ff88':'#c9f2ff38';let n=s.weather==='STORM'?150:80;for(let i=0;i<n;i++){let rx=(i*83+performance.now()/6)%1050,ry=(i*47+performance.now()/2.4)%670;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx-9,ry+24);x.stroke()}}requestAnimationFrame(draw)}function near(){return B.find(o=>s.px>=o.x-1&&s.px<=o.x+o.w+1&&s.py>=o.y-1&&s.py<=o.y+o.h+1)}function gain(n){s.xp+=n;while(s.xp>=100){s.xp-=100;s.lvl++;s.points++;s.hp=Math.min(100,s.hp+25);story.innerHTML='<span class="good">LEVEL UP · SKILL POINT EARNED</span>'}}function worldTick(){s.eventClock++;if(s.eventClock%12===0){let r=Math.random();s.weather=r<.25?'STORM':r<.55?'CLEAR':'RAIN';if(Math.random()<.35&&!s.inside){let reward=10+Math.floor(Math.random()*20);s.cash+=reward;story.innerHTML='<span class="gold">WORLD EVENT: abandoned courier cache · $'+reward+'</span>'}}}function ai(){if(!s.inside||s.enemy.hp<=0||s.boss)return;let dx=s.ix-s.enemy.x,dy=s.iy-s.enemy.y,d=Math.abs(dx)+Math.abs(dy);if(d<7){if(Math.abs(dx)>Math.abs(dy))s.enemy.x+=Math.sign(dx);else s.enemy.y+=Math.sign(dy)}if(Math.abs(s.ix-s.enemy.x)+Math.abs(s.iy-s.enemy.y)<=1){s.hp-=Math.max(2,9-s.armor-s.skills.survival);story.innerHTML='<span class="danger">HOSTILE ATTACKS</span>'}}function move(dx,dy){if(s.inside){s.ix=Math.max(2,Math.min(10,s.ix+dx));s.iy=Math.max(2,Math.min(9,s.iy+dy));ai()}else{s.px=Math.max(0,Math.min(20,s.px+dx));s.py=Math.max(0,Math.min(16,s.py+dy));worldTick()}s.en=Math.max(0,s.en-1);s.time=Math.max(0,s.time-.15);ui()}function enter(){if(s.inside){s.inside=null;s.floor=1;story.textContent='Returned to city.';return ui()}let o=near();if(!o)return story.textContent='Move closer to a building.';s.inside=o.n;s.floor=1;s.ix=4;s.iy=7;s.enemy={x:8,y:4,hp:30+s.lvl*4};s.boss=false;story.textContent='Entered '+o.n+'.';ui()}function fight(){if(!s.inside)return story.textContent='No target.';let t=s.boss?{x:8,y:4}:s.enemy;if(Math.abs(s.ix-t.x)+Math.abs(s.iy-t.y)>2)return story.textContent='Get closer.';let dmg=s.dmg+s.skills.combat*4+(s.weapon==='Crowbar'?8:s.weapon==='Echo Blade'?15:0);if(Math.random()<.82){s.boss?s.bossHP-=dmg:s.enemy.hp-=dmg;story.textContent='Hit '+dmg+' damage.'}else story.textContent='Miss.';if(!s.boss&&s.enemy.hp<=0){s.kills++;s.cash+=10;gain(20);story.innerHTML='<span class="good">HOSTILE DOWN · +20 XP</span>'}if(s.boss&&s.bossHP<=0){s.boss=false;s.bag.push('Prime Echo Core');s.weapon='Echo Blade';s.dmg=20;gain(150);s.ending='CORE';story.innerHTML='<span class="gold">PRIME ECHO DEFEATED · ENDGAME UNLOCKED</span>'}ui()}function search(){if(!s.inside){let chance=.35+s.skills.scavenge*.12;if(Math.random()<chance){s.bag.push('Scrap');story.textContent='Street salvage: Scrap.'}else story.textContent='Nothing useful.';return ui()}let k=s.inside+s.floor;if(Math.abs(s.ix-8)+Math.abs(s.iy-7)>2)return story.textContent='Move to container.';if(s.enemy.hp>0&&!s.boss)return story.textContent='Clear enemy first.';if(s.opened[k])return story.textContent='Empty.';if(s.floor===2&&!s.bag.includes('Security Key'))return story.textContent='Security Key required.';s.opened[k]=true;let item=s.floor===1?special[s.inside]:(s.inside==='GARAGE'?'Body Armor':'Rare Supplies');s.bag.push(item);if(item==='Crowbar'){s.weapon='Crowbar';s.dmg=12}if(item==='Body Armor')s.armor=5;if(item==='Security Key')s.radioFound=true;gain(15);story.innerHTML='<span class="gold">FOUND '+item+'</span>';ui()}function floorUp(){if(!s.inside)return story.textContent='No stairs.';if(s.floor===1){if(!s.bag.includes('Security Key')&&s.inside!=='APARTMENTS')return story.textContent='Need Security Key.';s.floor=2;s.ix=4;s.iy=7;s.enemy={x:8,y:4,hp:50+s.lvl*5};if(s.inside==='PHARMACY'&&s.kills>=3){s.boss=true;s.bossHP=120+s.lvl*10;story.innerHTML='<span class="danger">PRIME ECHO AWAKENS</span>'}}else{s.floor=1;s.enemy={x:8,y:4,hp:30}}ui()}function useItem(){let i=s.bag.indexOf('Medical Kit');if(i>=0){s.bag.splice(i,1);s.hp=Math.min(100,s.hp+50);story.textContent='+50 HP';}else if((i=s.bag.indexOf('Food'))>=0){s.bag.splice(i,1);s.en=Math.min(100,s.en+50);story.textContent='+50 Energy';}else story.textContent='No usable item.';ui()}function craftMenu(){show('<h2>CRAFTING</h2><button onclick="craft(\'Reinforced Armor\')">Scrap + Wire → Reinforced Armor</button><button onclick="craft(\'Shock Baton\')">2 Scrap + Battery → Shock Baton</button>')}function craft(item){if(item==='Reinforced Armor'&&take(['Scrap','Wire'])){s.armor+=4;story.textContent='Reinforced Armor crafted.';closeM()}else if(item==='Shock Baton'&&take(['Scrap','Scrap','Battery'])){s.weapon='Shock Baton';s.dmg=17;story.textContent='Shock Baton crafted.';closeM()}else alert('Missing materials');ui()}function take(items){let copy=[...s.bag];for(let a of items){let i=copy.indexOf(a);if(i<0)return false;copy.splice(i,1)}s.bag=copy;return true}function skillMenu(){show('<h2>SKILLS · '+s.points+' points</h2><button onclick="skill(\'combat\')">Combat '+s.skills.combat+' — +4 damage</button><button onclick="skill(\'scavenge\')">Scavenge '+s.skills.scavenge+' — better loot</button><button onclick="skill(\'survival\')">Survival '+s.skills.survival+' — damage resistance</button>')}function skill(k){if(!s.points)return alert('No skill points');s.points--;s.skills[k]++;skillMenu();ui()}function factionMenu(){show('<h2>FACTIONS</h2><p>Wardens '+s.rep.Wardens+' · Drifters '+s.rep.Drifters+'</p><button onclick="joinF(\'Wardens\')">Support Wardens</button><button onclick="joinF(\'Drifters\')">Support Drifters</button>')}function joinF(f){s.faction=f;s.rep[f]+=2;s.cash+=15;story.textContent='Faction allegiance: '+f+'. +$15';closeM();ui()}function camp(){if(s.inside)return story.textContent='Camp must be outside.';if(!s.camp){if(!take(['Scrap','Wire']))return story.textContent='Camp requires Scrap + Wire.';s.camp=true;story.textContent='SAFE CAMP BUILT.'}else{s.en=Math.min(100,s.en+60);s.hp=Math.min(100,s.hp+15);s.time=Math.max(0,s.time-3);story.textContent='Rested at camp.'}ui()}function radio(){if(!s.radioFound)return story.textContent='You need a radio frequency clue. Search Apartments.';let msg=s.ending?'Transmission: "The Core changed the signal. Something beneath the city answered."':'Transmission: "Survivors: avoid the Pharmacy upper floor. It is calling people by name."';story.textContent=msg}function interact(){story.textContent=s.inside?'Clear rooms, loot, climb floors.':near()?'Entrance found. Tap ENTER.':'Explore. Weather and world events change as you move.'}function show(h){card.innerHTML=h+'<button onclick="closeM()">CLOSE</button>';modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}function ui(){hp.textContent=Math.max(0,Math.round(s.hp));en.textContent=Math.round(s.en);tm.textContent=s.time.toFixed(1)+'h';lvl.textContent=s.lvl;cash.textContent='$'+s.cash;weather.textContent=s.weather;xpbar.style.width=s.xp+'%';gear.textContent='Weapon '+s.weapon+' · DMG '+s.dmg+' · Armor '+s.armor+' · Skill points '+s.points+' · '+(s.faction||'Independent')+' · Bag: '+(s.bag.join(' • ')||'empty');quest.textContent=s.ending?'ENDGAME: The Core is broadcasting from beneath the city.':s.kills<3?'MAIN QUEST: Defeat '+(3-s.kills)+' hostiles.':'MAIN QUEST: Security Key → Pharmacy Floor 2 → Prime Echo.';localStorage.setItem('echoIso15',JSON.stringify(s))}ui();draw();</script></body></html>
