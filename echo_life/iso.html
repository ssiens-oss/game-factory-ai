<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE ISO v12</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#15242b,#020507 65%);color:#eaffff;font-family:system-ui;text-align:center}main{max-width:780px;margin:auto;padding:7px}h1{margin:3px;letter-spacing:7px;text-shadow:0 0 10px #61ecff,0 0 30px #168ca0}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.hud div,.panel{background:#0c222add;border:1px solid #356773;border-radius:10px;padding:7px;font-size:11px}#view{width:100%;aspect-ratio:16/10;border:1px solid #4d7e88;border-radius:15px;background:#071015;touch-action:none;box-shadow:0 22px 55px #000}.pad{width:185px;margin:7px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.pad i{visibility:hidden}button{border:1px solid #4ea7b6;background:linear-gradient(#23798a,#0d4350);color:white;border-radius:9px;padding:11px;font-weight:800;box-shadow:0 5px 12px #0007}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.actions button{font-size:10px;padding:10px 2px}.danger{color:#ff7187}.good{color:#8fffc5}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>ENERGY<br><b id="en">100</b></div><div>TIME<br><b id="tm">72h</b></div><div>ZONE<br><b id="zone">STREETS</b></div></div><div id="story" class="panel">Find a building and enter it.</div><canvas id="view" width="960" height="600"></canvas><div class="pad"><i></i><button onpointerdown="move(0,-1)">▲</button><i></i><button onpointerdown="move(-1,0)">◀</button><button onclick="interact()">◎</button><button onpointerdown="move(1,0)">▶</button><i></i><button onpointerdown="move(0,1)">▼</button><i></i></div><div class="actions"><button onclick="search()">SEARCH</button><button onclick="enter()">ENTER</button><button onclick="interact()">INTERACT</button><button onclick="save()">SAVE</button></div></main><script>const c=view,x=c.getContext('2d');let s=JSON.parse(localStorage.getItem('echoIsoSave12')||'null')||{px:9,py:8,ex:15,ey:13,hp:100,en:100,time:72,loot:0,inside:null,ix:4,iy:4};const W=72,H=36,OX=480,OY=96;const buildings=[{x:1,y:1,w:5,h:4,z:120,n:'CLINIC',col:'#426773',sign:'#66efff'},{x:8,y:1,w:5,h:4,z:145,n:'MARKET',col:'#685943',sign:'#ffd36a'},{x:15,y:2,w:5,h:4,z:108,n:'GARAGE',col:'#495961',sign:'#ff7c67'},{x:2,y:10,w:5,h:4,z:160,n:'APARTMENTS',col:'#515c6b',sign:'#d08cff'},{x:11,y:10,w:6,h:4,z:135,n:'PHARMACY',col:'#45685d',sign:'#72ff9e'}];function iso(a,b,z=0){return{x:OX+(a-b)*W/2,y:OY+(a+b)*H/2-z}}function poly(p,f,st='#0008'){x.beginPath();x.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>x.lineTo(q.x,q.y));x.closePath();x.fillStyle=f;x.fill();x.strokeStyle=st;x.stroke()}function tile(a,b,col){poly([iso(a,b),iso(a+1,b),iso(a+1,b+1),iso(a,b+1)],col,'#ffffff08')}function box(B){let b=iso(B.x+B.w,B.y),d=iso(B.x,B.y+B.h),e=iso(B.x+B.w,B.y+B.h),at=iso(B.x,B.y,B.z),bt=iso(B.x+B.w,B.y,B.z),dt=iso(B.x,B.y+B.h,B.z),et=iso(B.x+B.w,B.y+B.h,B.z);poly([d,e,et,dt],'#273b40');poly([b,e,et,bt],'#182a30');poly([at,bt,et,dt],B.col);let m=iso(B.x+B.w/2,B.y+B.h,B.z*.72);x.save();x.shadowColor=B.sign;x.shadowBlur=18;x.fillStyle=B.sign;x.font='bold 14px system-ui';x.textAlign='center';x.fillText(B.n,m.x,m.y);x.restore()}function person(a,b,echo=false){let q=iso(a,b,5),w=Math.sin(performance.now()/100)*4;x.save();x.translate(q.x,q.y);if(echo){x.shadowColor='#f24';x.shadowBlur=22}x.strokeStyle=echo?'#ff4c68':'#213137';x.lineWidth=5;x.beginPath();x.moveTo(-4,-8);x.lineTo(-7+w/2,10);x.moveTo(4,-8);x.lineTo(7-w/2,10);x.stroke();x.fillStyle=echo?'#9e1831':'#277f90';x.fillRect(-9,-32,18,25);x.fillStyle=echo?'#ff8798':'#cba17d';x.beginPath();x.arc(0,-40,8,0,Math.PI*2);x.fill();x.restore()}function street(){for(let a=0;a<21;a++)for(let b=0;b<17;b++)tile(a,b,(a%7===6||b%6===5)?'#172126':'#253936');buildings.forEach(box);[[7,7],[13,6],[5,14]].forEach(v=>{let q=iso(...v,4);x.fillStyle='#5c5960';x.fillRect(q.x-25,q.y-12,50,17)});person(s.ex,s.ey,true);person(s.px,s.py)}function interior(){let theme=s.inside==='CLINIC'?'#29474b':s.inside==='MARKET'?'#4b4030':s.inside==='GARAGE'?'#343e43':s.inside==='PHARMACY'?'#2d4a40':'#3c3c49';for(let a=2;a<11;a++)for(let b=2;b<10;b++)tile(a,b,(a+b)%2?theme:'#1c292d');for(let i=3;i<10;i+=2){let q=iso(i,3,28),q2=iso(i+1,3,28),q3=iso(i+1,4,28),q4=iso(i,4,28);poly([q,q2,q3,q4],'#685844')}let counter=iso(7,7,20);x.fillStyle='#796249';x.fillRect(counter.x-65,counter.y-30,130,28);let item=iso(5,6,25);x.save();x.shadowColor='#ffe275';x.shadowBlur=18;x.fillStyle='#ffe275';x.font='30px sans-serif';x.fillText('◆',item.x,item.y);x.restore();person(s.ix,s.iy,false);x.fillStyle='#dffcff';x.font='bold 20px system-ui';x.textAlign='center';x.fillText(s.inside+' INTERIOR',480,45)}function draw(){x.clearRect(0,0,960,600);let g=x.createLinearGradient(0,0,0,600);g.addColorStop(0,'#14262d');g.addColorStop(1,'#030709');x.fillStyle=g;x.fillRect(0,0,960,600);s.inside?interior():street();x.strokeStyle='#c9f2ff40';for(let i=0;i<90;i++){let rx=(i*83+performance.now()/7)%1050,ry=(i*47+performance.now()/2.5)%670;if(!s.inside){x.beginPath();x.moveTo(rx,ry);x.lineTo(rx-8,ry+22);x.stroke()}}requestAnimationFrame(draw)}function near(){return buildings.find(B=>s.px>=B.x-1&&s.px<=B.x+B.w+1&&s.py>=B.y-1&&s.py<=B.y+B.h+1)}function move(dx,dy){if(s.inside){s.ix=Math.max(2,Math.min(10,s.ix+dx));s.iy=Math.max(2,Math.min(9,s.iy+dy))}else{s.px=Math.max(0,Math.min(20,s.px+dx));s.py=Math.max(0,Math.min(16,s.py+dy));chase()}s.en=Math.max(0,s.en-1);s.time=Math.max(0,s.time-.2);ui()}function chase(){let dx=s.px-s.ex,dy=s.py-s.ey;if(Math.abs(dx)+Math.abs(dy)<10){if(Math.abs(dx)>Math.abs(dy))s.ex+=Math.sign(dx);else s.ey+=Math.sign(dy)}if(s.ex===s.px&&s.ey===s.py){s.hp-=12;s.ex=18;s.ey=15;story.innerHTML='<span class="danger">THE ECHO FOUND YOU. -12 HP.</span>'}}function enter(){if(s.inside){s.inside=null;story.textContent='You step back into the rain.';return ui()}let B=near();if(!B)return story.textContent='Move closer to a named building first.';s.inside=B.n;s.ix=4;s.iy=5;story.innerHTML='<span class="good">ENTERED '+B.n+'. Search the interior.</span>';ui()}function interact(){story.textContent=s.inside?'You inspect the '+s.inside+'. Shelves and rooms can hide supplies.':near()?'The entrance is unlocked. Tap ENTER.':'Nothing close enough to interact with.'}function search(){s.en=Math.max(0,s.en-3);s.time=Math.max(0,s.time-.5);s.loot++;story.textContent=s.inside?'You search '+s.inside+' and recover interior supplies. Loot: '+s.loot:'You search the street. Loot: '+s.loot;ui()}function save(){localStorage.setItem('echoIsoSave12',JSON.stringify(s));story.textContent='v12 run saved.'}function ui(){hp.textContent=s.hp;en.textContent=s.en;tm.textContent=s.time.toFixed(1)+'h';zone.textContent=s.inside?s.inside:(near()?.n||'STREETS')}ui();draw();</script></body></html>
