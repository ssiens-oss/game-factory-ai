<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v14</title><style>*{box-sizing:border-box}body{margin:0;background:#020609;color:#eaffff;font-family:system-ui;text-align:center}main{max-width:800px;margin:auto;padding:6px}h1{margin:2px;letter-spacing:7px;text-shadow:0 0 14px #5eeaff}.hud{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.hud div,.panel{background:#0a2028e8;border:1px solid #376b76;border-radius:9px;padding:6px;font-size:10px}#view{width:100%;aspect-ratio:16/10;border:1px solid #4d7e88;border-radius:14px;background:#071015;touch-action:none}.pad{width:180px;margin:5px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.pad i{visibility:hidden}button{border:1px solid #4ea7b6;background:linear-gradient(#23798a,#0d4350);color:white;border-radius:8px;padding:9px;font-weight:800}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.actions button{font-size:9px;padding:9px 1px}.danger{color:#ff7187}.good{color:#8fffc5}.gold{color:#ffe279}.boss{color:#ff4868}.bar{height:5px;background:#17282e;border-radius:6px;overflow:hidden;margin:3px}.bar i{display:block;height:100%;background:#76eaff}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>ENERGY<br><b id="en">100</b></div><div>TIME<br><b id="tm">72h</b></div><div>LVL<br><b id="lvl">1</b></div><div>CASH<br><b id="cash">$20</b></div><div>ZONE<br><b id="zone">STREETS</b></div></div><div class="bar"><i id="xpbar"></i></div><div id="story" class="panel">v14 — weapons, AI, floors, locked rooms, quests and boss.</div><canvas id="view" width="960" height="600"></canvas><div class="pad"><i></i><button onpointerdown="move(0,-1)">▲</button><i></i><button onpointerdown="move(-1,0)">◀</button><button onclick="interact()">◎</button><button onpointerdown="move(1,0)">▶</button><i></i><button onpointerdown="move(0,1)">▼</button><i></i></div><div class="actions"><button onclick="search()">SEARCH</button><button onclick="enter()">ENTER/EXIT</button><button onclick="fight()">ATTACK</button><button onclick="floorUp()">STAIRS</button><button onclick="useItem()">USE ITEM</button></div><div id="gear" class="panel"></div><div id="quest" class="panel"></div></main><script>const c=view,x=c.getContext('2d');let s=JSON.parse(localStorage.getItem('echoIso14')||'null')||{px:9,py:8,hp:100,en:100,time:72,lvl:1,xp:0,cash:20,inside:null,floor:1,ix:4,iy:7,bag:[],weapon:'Fists',dmg:6,armor:0,opened:{},kills:0,boss:false,bossHP:100,enemy:{x:8,y:4,hp:30},quest:0,flash:0};const W=72,H=36,OX=480,OY=96,B=[{x:1,y:1,w:5,h:4,z:120,n:'CLINIC',col:'#426773'},{x:8,y:1,w:5,h:4,z:145,n:'MARKET',col:'#685943'},{x:15,y:2,w:5,h:4,z:108,n:'GARAGE',col:'#495961'},{x:2,y:10,w:5,h:4,z:160,n:'APARTMENTS',col:'#515c6b'},{x:11,y:10,w:6,h:4,z:135,n:'PHARMACY',col:'#45685d'}],special={CLINIC:'Medical Kit',MARKET:'Food',GARAGE:'Crowbar',APARTMENTS:'Security Key',PHARMACY:'Antibiotics'};function iso(a,b,z=0){return{x:OX+(a-b)*W/2,y:OY+(a+b)*H/2-z}}function poly(p,f){x.beginPath();x.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>x.lineTo(q.x,q.y));x.closePath();x.fillStyle=f;x.fill();x.strokeStyle='#0007';x.stroke()}function tile(a,b,f){poly([iso(a,b),iso(a+1,b),iso(a+1,b+1),iso(a,b+1)],f)}function person(a,b,col='#278093',big=1){let q=iso(a,b,5),w=Math.sin(performance.now()/100)*4;x.save();x.translate(q.x,q.y);x.shadowColor=col;x.shadowBlur=big>1?20:5;x.strokeStyle='#1b282d';x.lineWidth=5*big;x.beginPath();x.moveTo(-4*big,-8*big);x.lineTo((-7+w/2)*big,10*big);x.moveTo(4*big,-8*big);x.lineTo((7-w/2)*big,10*big);x.stroke();x.fillStyle=col;x.fillRect(-9*big,-32*big,18*big,25*big);x.fillStyle='#c99b78';x.beginPath();x.arc(0,-40*big,8*big,0,Math.PI*2);x.fill();x.restore()}function building(o){let d=iso(o.x,o.y+o.h),e=iso(o.x+o.w,o.y+o.h),t=iso(o.x,o.y,o.z),u=iso(o.x+o.w,o.y,o.z),v=iso(o.x,o.y+o.h,o.z),w=iso(o.x+o.w,o.y+o.h,o.z);poly([d,e,w,v],'#273b40');poly([t,u,w,v],o.col);x.fillStyle='#d9fbff';x.font='bold 13px system-ui';x.fillText(o.n,iso(o.x+o.w/2,o.y+o.h/2,o.z+5).x,iso(o.x+o.w/2,o.y+o.h/2,o.z+5).y)}function street(){for(let a=0;a<21;a++)for(let b=0;b<17;b++)tile(a,b,(a%7===6||b%6===5)?'#172126':'#253936');B.forEach(building);person(s.px,s.py)}function prop(type,a,b){let q=iso(a,b,18);x.fillStyle=type==='bed'?'#617786':type==='shelf'?'#735c42':type==='car'?'#7e4742':'#665744';x.fillRect(q.x-34,q.y-26,68,type==='car'?28:34);x.strokeStyle='#b7c9c9';x.strokeRect(q.x-34,q.y-26,68,type==='car'?28:34)}function interior(){let theme={CLINIC:'#29474b',MARKET:'#493e2e',GARAGE:'#343e43',APARTMENTS:'#3d3948',PHARMACY:'#2c493f'}[s.inside];for(let a=2;a<11;a++)for(let b=2;b<10;b++)tile(a,b,(a+b)%2?theme:'#17252a');if(s.inside==='CLINIC'){prop('bed',4,4);prop('bed',7,4)}if(s.inside==='MARKET'){prop('shelf',4,4);prop('shelf',7,4);prop('shelf',9,6)}if(s.inside==='GARAGE'){prop('car',6,5);prop('shelf',9,4)}if(s.inside==='APARTMENTS'){prop('bed',4,4);prop('shelf',8,7)}if(s.inside==='PHARMACY'){prop('shelf',4,4);prop('shelf',7,4)}if(s.floor===2){x.fillStyle='#9b2639';x.font='bold 18px system-ui';x.fillText('RESTRICTED FLOOR',480,65)}let chest=iso(8,7,18);x.fillStyle=s.opened[s.inside+s.floor]?'#333':'#bd8239';x.fillRect(chest.x-18,chest.y-18,36,22);if(s.boss){person(8,4,'#b11235',1.6);x.fillStyle='#ff637d';x.font='bold 15px system-ui';x.fillText('THE FIRST ECHO · '+s.bossHP+' HP',480,105)}else if(s.enemy.hp>0){person(s.enemy.x,s.enemy.y,'#92343d');x.fillStyle='#ff7187';x.font='bold 11px system-ui';x.fillText('HOSTILE '+s.enemy.hp,iso(s.enemy.x,s.enemy.y,50).x,iso(s.enemy.x,s.enemy.y,50).y)}person(s.ix,s.iy);x.fillStyle='#eaffff';x.font='bold 19px system-ui';x.fillText(s.inside+' · FLOOR '+s.floor,480,40)}function draw(){x.clearRect(0,0,960,600);x.fillStyle='#071015';x.fillRect(0,0,960,600);s.inside?interior():street();if(!s.inside){x.strokeStyle='#c9f2ff38';for(let i=0;i<90;i++){let rx=(i*83+performance.now()/7)%1050,ry=(i*47+performance.now()/2.5)%670;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx-8,ry+22);x.stroke()}}if(s.flash>0){x.fillStyle='#fff'+Math.floor(s.flash*2).toString(16).padStart(2,'0');x.fillRect(0,0,960,600);s.flash--}requestAnimationFrame(draw)}function near(){return B.find(o=>s.px>=o.x-1&&s.px<=o.x+o.w+1&&s.py>=o.y-1&&s.py<=o.y+o.h+1)}function gain(n){s.xp+=n;while(s.xp>=100){s.xp-=100;s.lvl++;s.hp=Math.min(100,s.hp+25);s.dmg+=2;story.innerHTML='<span class="good">LEVEL UP · '+s.lvl+'</span>'}}function ai(){if(!s.inside||s.enemy.hp<=0||s.boss)return;let dx=s.ix-s.enemy.x,dy=s.iy-s.enemy.y,d=Math.abs(dx)+Math.abs(dy);if(d<6){if(Math.abs(dx)>Math.abs(dy))s.enemy.x+=Math.sign(dx);else s.enemy.y+=Math.sign(dy)}if(Math.abs(s.ix-s.enemy.x)+Math.abs(s.iy-s.enemy.y)<=1){s.hp-=Math.max(3,9-s.armor);s.flash=4;story.innerHTML='<span class="danger">HOSTILE ATTACKS!</span>'}}function move(dx,dy){if(s.inside){s.ix=Math.max(2,Math.min(10,s.ix+dx));s.iy=Math.max(2,Math.min(9,s.iy+dy));ai()}else{s.px=Math.max(0,Math.min(20,s.px+dx));s.py=Math.max(0,Math.min(16,s.py+dy))}s.en=Math.max(0,s.en-1);s.time=Math.max(0,s.time-.15);ui()}function enter(){if(s.inside){s.inside=null;s.floor=1;story.textContent='Returned to the city.';return ui()}let o=near();if(!o)return story.textContent='Move closer to a building.';s.inside=o.n;s.floor=1;s.ix=4;s.iy=7;s.enemy={x:8,y:4,hp:30};s.boss=false;story.textContent='Entered '+o.n+'. Enemy movement detected.';ui()}function fight(){if(!s.inside)return story.textContent='No target.';let target=s.boss?{x:8,y:4,hp:s.bossHP}:s.enemy,d=Math.abs(s.ix-target.x)+Math.abs(s.iy-target.y);if(d>2)return story.textContent='Get closer to attack.';s.en=Math.max(0,s.en-4);let hit=Math.random()<.82;if(hit){let dmg=s.dmg+(s.weapon==='Crowbar'?8:s.weapon==='Echo Blade'?15:0);if(s.boss)s.bossHP-=dmg;else s.enemy.hp-=dmg;s.flash=2;story.textContent=s.weapon+' hits for '+dmg+'.'}else{story.textContent='Attack missed.'}if(!s.boss&&s.enemy.hp<=0){s.kills++;s.cash+=10;gain(20);story.innerHTML='<span class="good">HOSTILE DOWN · +20 XP · $10</span>'}if(s.boss&&s.bossHP<=0){s.boss=false;s.bag.push('Echo Core');s.weapon='Echo Blade';s.dmg=20;gain(100);story.innerHTML='<span class="gold">FIRST ECHO DEFEATED · ECHO BLADE UNLOCKED</span>'}ui()}function search(){if(!s.inside)return story.textContent='Better loot is indoors.';let k=s.inside+s.floor;if(Math.abs(s.ix-8)+Math.abs(s.iy-7)>2)return story.textContent='Move near the container.';if(s.enemy.hp>0&&!s.boss)return story.textContent='Clear the hostile first.';if(s.opened[k])return story.textContent='Container empty.';if(s.floor===2&&!s.bag.includes('Security Key'))return story.textContent='LOCKED: Security Key required.';s.opened[k]=true;let item=s.floor===1?special[s.inside]:(s.inside==='GARAGE'?'Body Armor':'Rare Supplies');s.bag.push(item);if(item==='Crowbar'){s.weapon='Crowbar';s.dmg=12}if(item==='Body Armor')s.armor=5;gain(15);story.innerHTML='<span class="gold">FOUND '+item+' · +15 XP</span>';ui()}function floorUp(){if(!s.inside)return story.textContent='No stairs here.';if(s.floor===1){if(!s.bag.includes('Security Key')&&s.inside!=='APARTMENTS')return story.textContent='Floor 2 access requires the Security Key from Apartments.';s.floor=2;s.ix=4;s.iy=7;s.enemy={x:8,y:4,hp:45};if(s.inside==='PHARMACY'&&s.kills>=3){s.boss=true;s.bossHP=100;story.innerHTML='<span class="boss">THE FIRST ECHO IS WAITING UPSTAIRS.</span>'}else story.textContent='Floor 2. Stronger hostiles detected.'}else{s.floor=1;s.enemy={x:8,y:4,hp:30};story.textContent='Returned to floor 1.'}ui()}function useItem(){let i=s.bag.indexOf('Medical Kit');if(i>=0){s.bag.splice(i,1);s.hp=Math.min(100,s.hp+50);story.textContent='Medical Kit used. +50 HP.'}else{i=s.bag.indexOf('Food');if(i>=0){s.bag.splice(i,1);s.en=Math.min(100,s.en+45);story.textContent='Food used. +45 energy.'}else story.textContent='No usable healing item.'}ui()}function interact(){story.textContent=s.inside?'Objective: clear rooms, loot containers, find the Security Key, reach Pharmacy floor 2.':near()?'Entrance found.':'Explore the city.'}function ui(){hp.textContent=Math.max(0,s.hp);en.textContent=s.en;tm.textContent=s.time.toFixed(1)+'h';lvl.textContent=s.lvl;cash.textContent='$'+s.cash;zone.textContent=s.inside?s.inside+' F'+s.floor:(near()?.n||'STREETS');xpbar.style.width=s.xp+'%';gear.textContent='Weapon: '+s.weapon+' · Damage '+s.dmg+' · Armor '+s.armor+' · Backpack: '+(s.bag.join(' • ')||'empty');quest.textContent=s.bag.includes('Echo Core')?'MAIN QUEST COMPLETE: The First Echo has fallen.':s.kills<3?'QUEST: Defeat '+(3-s.kills)+' more hostiles.':'QUEST: Find Security Key → enter Pharmacy Floor 2 → confront The First Echo.';localStorage.setItem('echoIso14',JSON.stringify(s))}ui();draw();</script></body></html>
