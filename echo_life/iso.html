<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE ISO v13</title><style>*{box-sizing:border-box}body{margin:0;background:#03080b;color:#eaffff;font-family:system-ui;text-align:center}main{max-width:780px;margin:auto;padding:7px}h1{margin:3px;letter-spacing:7px;text-shadow:0 0 12px #5eeaff}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.hud div,.panel{background:#0b2028e8;border:1px solid #376b76;border-radius:10px;padding:7px;font-size:10px}#view{width:100%;aspect-ratio:16/10;border:1px solid #4d7e88;border-radius:15px;background:#071015;touch-action:none;box-shadow:0 20px 50px #000}.pad{width:185px;margin:6px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.pad i{visibility:hidden}button{border:1px solid #4ea7b6;background:linear-gradient(#23798a,#0d4350);color:white;border-radius:9px;padding:10px;font-weight:800}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.actions button{font-size:10px;padding:10px 1px}.danger{color:#ff7187}.good{color:#8fffc5}.gold{color:#ffe279}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>ENERGY<br><b id="en">100</b></div><div>TIME<br><b id="tm">72h</b></div><div>LOOT<br><b id="lootn">0</b></div><div>ZONE<br><b id="zone">STREETS</b></div></div><div id="story" class="panel">Buildings now contain rooms, enemies and unique loot.</div><canvas id="view" width="960" height="600"></canvas><div class="pad"><i></i><button onpointerdown="move(0,-1)">▲</button><i></i><button onpointerdown="move(-1,0)">◀</button><button onclick="interact()">◎</button><button onpointerdown="move(1,0)">▶</button><i></i><button onpointerdown="move(0,1)">▼</button><i></i></div><div class="actions"><button onclick="search()">OPEN/SEARCH</button><button onclick="enter()">ENTER/EXIT</button><button onclick="fight()">FIGHT</button><button onclick="save()">SAVE</button></div><div id="bag" class="panel">Backpack: empty</div></main><script>const c=view,x=c.getContext('2d');let s=JSON.parse(localStorage.getItem('echoIsoSave13')||'null')||{px:9,py:8,ex:15,ey:13,hp:100,en:100,time:72,inside:null,ix:4,iy:5,bag:[],opened:{},enemyHP:24};const W=72,H=36,OX=480,OY=96;const buildings=[{x:1,y:1,w:5,h:4,z:120,n:'CLINIC',col:'#426773',sign:'#66efff'},{x:8,y:1,w:5,h:4,z:145,n:'MARKET',col:'#685943',sign:'#ffd36a'},{x:15,y:2,w:5,h:4,z:108,n:'GARAGE',col:'#495961',sign:'#ff7c67'},{x:2,y:10,w:5,h:4,z:160,n:'APARTMENTS',col:'#515c6b',sign:'#d08cff'},{x:11,y:10,w:6,h:4,z:135,n:'PHARMACY',col:'#45685d',sign:'#72ff9e'}];const special={CLINIC:'Medical Kit',MARKET:'Canned Food',GARAGE:'Tool Kit',APARTMENTS:'House Key',PHARMACY:'Antibiotics'};function iso(a,b,z=0){return{x:OX+(a-b)*W/2,y:OY+(a+b)*H/2-z}}function poly(p,f,st='#0008'){x.beginPath();x.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>x.lineTo(q.x,q.y));x.closePath();x.fillStyle=f;x.fill();x.strokeStyle=st;x.stroke()}function tile(a,b,col){poly([iso(a,b),iso(a+1,b),iso(a+1,b+1),iso(a,b+1)],col,'#ffffff08')}function person(a,b,col='#277f90'){let q=iso(a,b,5),w=Math.sin(performance.now()/100)*4;x.save();x.translate(q.x,q.y);x.strokeStyle='#1c292e';x.lineWidth=5;x.beginPath();x.moveTo(-4,-8);x.lineTo(-7+w/2,10);x.moveTo(4,-8);x.lineTo(7-w/2,10);x.stroke();x.fillStyle=col;x.fillRect(-9,-32,18,25);x.fillStyle='#cba17d';x.beginPath();x.arc(0,-40,8,0,Math.PI*2);x.fill();x.restore()}function box(B){let b=iso(B.x+B.w,B.y),d=iso(B.x,B.y+B.h),e=iso(B.x+B.w,B.y+B.h),at=iso(B.x,B.y,B.z),bt=iso(B.x+B.w,B.y,B.z),dt=iso(B.x,B.y+B.h,B.z),et=iso(B.x+B.w,B.y+B.h,B.z);poly([d,e,et,dt],'#273b40');poly([b,e,et,bt],'#182a30');poly([at,bt,et,dt],B.col);let m=iso(B.x+B.w/2,B.y+B.h,B.z*.7);x.save();x.shadowColor=B.sign;x.shadowBlur=18;x.fillStyle=B.sign;x.font='bold 14px system-ui';x.textAlign='center';x.fillText(B.n,m.x,m.y);x.restore()}function street(){for(let a=0;a<21;a++)for(let b=0;b<17;b++)tile(a,b,(a%7===6||b%6===5)?'#172126':'#253936');buildings.forEach(box);person(s.px,s.py)}function furniture(type,a,b){let q=iso(a,b,18);if(type==='bed'){x.fillStyle='#566b79';x.fillRect(q.x-35,q.y-20,70,28);x.fillStyle='#c7d4d8';x.fillRect(q.x-30,q.y-17,22,12)}else if(type==='shelf'){x.fillStyle='#765f43';x.fillRect(q.x-35,q.y-35,70,35);x.strokeStyle='#b79b6c';x.strokeRect(q.x-35,q.y-35,70,35)}else if(type==='car'){x.fillStyle='#80504a';x.fillRect(q.x-45,q.y-22,90,30);x.fillStyle='#a7cbd0';x.fillRect(q.x-20,q.y-32,42,12)}else if(type==='counter'){x.fillStyle='#6b5c49';x.fillRect(q.x-45,q.y-25,90,28)}}function interior(){let theme={CLINIC:'#29474b',MARKET:'#4b4030',GARAGE:'#343e43',APARTMENTS:'#3c3c49',PHARMACY:'#2d4a40'}[s.inside]||'#333';for(let a=2;a<11;a++)for(let b=2;b<10;b++)tile(a,b,(a+b)%2?theme:'#19272b');x.strokeStyle='#78939a';x.lineWidth=5;let wa=iso(2,5,35),wb=iso(7,5,35);x.beginPath();x.moveTo(wa.x,wa.y);x.lineTo(wb.x,wb.y);x.stroke();if(s.inside==='CLINIC'){furniture('bed',4,4);furniture('bed',7,4);furniture('counter',8,7)}if(s.inside==='MARKET'){furniture('shelf',4,4);furniture('shelf',6,4);furniture('shelf',8,4)}if(s.inside==='GARAGE'){furniture('car',6,5);furniture('shelf',9,4)}if(s.inside==='APARTMENTS'){furniture('bed',4,4);furniture('counter',8,7)}if(s.inside==='PHARMACY'){furniture('shelf',4,4);furniture('shelf',7,4);furniture('counter',8,7)}let key=s.inside,opened=s.opened[key];let chest=iso(8,6,20);x.fillStyle=opened?'#343434':'#b07a39';x.fillRect(chest.x-18,chest.y-18,36,22);if(!opened){x.save();x.shadowColor='#ffe36d';x.shadowBlur=16;x.strokeStyle='#ffe36d';x.strokeRect(chest.x-18,chest.y-18,36,22);x.restore()}if(s.enemyHP>0){person(8,4,'#8e3039');x.fillStyle='#ff7585';x.font='bold 11px system-ui';x.fillText('HOSTILE '+s.enemyHP+'HP',iso(8,4,50).x,iso(8,4,50).y)}person(s.ix,s.iy);x.fillStyle='#eaffff';x.font='bold 20px system-ui';x.textAlign='center';x.fillText(s.inside+' · FLOOR 1',480,42)}function draw(){x.clearRect(0,0,960,600);let g=x.createLinearGradient(0,0,0,600);g.addColorStop(0,'#14262d');g.addColorStop(1,'#030709');x.fillStyle=g;x.fillRect(0,0,960,600);s.inside?interior():street();if(!s.inside){x.strokeStyle='#c9f2ff40';for(let i=0;i<90;i++){let rx=(i*83+performance.now()/7)%1050,ry=(i*47+performance.now()/2.5)%670;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx-8,ry+22);x.stroke()}}requestAnimationFrame(draw)}function near(){return buildings.find(B=>s.px>=B.x-1&&s.px<=B.x+B.w+1&&s.py>=B.y-1&&s.py<=B.y+B.h+1)}function move(dx,dy){if(s.inside){s.ix=Math.max(2,Math.min(10,s.ix+dx));s.iy=Math.max(2,Math.min(9,s.iy+dy))}else{s.px=Math.max(0,Math.min(20,s.px+dx));s.py=Math.max(0,Math.min(16,s.py+dy))}s.en=Math.max(0,s.en-1);s.time=Math.max(0,s.time-.2);ui()}function enter(){if(s.inside){s.inside=null;s.enemyHP=24;story.textContent='Back outside.';return ui()}let B=near();if(!B)return story.textContent='Move closer to a building.';s.inside=B.n;s.ix=4;s.iy=7;s.enemyHP=24;story.textContent='Entered '+B.n+'. A hostile is somewhere inside.';ui()}function search(){if(!s.inside)return story.textContent='Search containers inside buildings for better loot.';if(Math.hypot(s.ix-8,s.iy-6)>2)return story.textContent='Move closer to the glowing container.';if(s.enemyHP>0)return story.textContent='The hostile blocks the container.';if(s.opened[s.inside])return story.textContent='This container is empty.';let item=special[s.inside];s.opened[s.inside]=true;s.bag.push(item);story.innerHTML='<span class="gold">UNIQUE LOOT: '+item+'</span>';ui()}function fight(){if(!s.inside)return story.textContent='No target nearby.';if(s.enemyHP<=0)return story.textContent='The room is clear.';if(Math.hypot(s.ix-8,s.iy-4)>3)return story.textContent='Move closer to the hostile.';s.en=Math.max(0,s.en-5);if(Math.random()<.78){s.enemyHP-=12;story.textContent='You hit the hostile for 12 damage.'}else{s.hp-=8;story.innerHTML='<span class="danger">You miss. -8 HP.</span>'}if(s.enemyHP<=0)story.innerHTML='<span class="good">ROOM CLEARED. The container is accessible.</span>';ui()}function interact(){story.textContent=s.inside?'Explore both sides of the interior wall. Clear the hostile and open the container.':near()?'Entrance found. Tap ENTER.':'Keep exploring.'}function save(){localStorage.setItem('echoIsoSave13',JSON.stringify(s));story.textContent='v13 progress saved.'}function ui(){hp.textContent=s.hp;en.textContent=s.en;tm.textContent=s.time.toFixed(1)+'h';lootn.textContent=s.bag.length;zone.textContent=s.inside?s.inside:(near()?.n||'STREETS');bag.textContent='Backpack: '+(s.bag.join(' · ')||'empty')}ui();draw();</script></body></html>
