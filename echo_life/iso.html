<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE ISO v11</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#15242b,#020507 65%);color:#eaffff;font-family:system-ui;text-align:center}main{max-width:780px;margin:auto;padding:7px}h1{margin:3px;letter-spacing:7px;text-shadow:0 0 10px #61ecff,0 0 30px #168ca0}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.hud div,.panel{background:linear-gradient(#10272fdd,#07151bdd);border:1px solid #356773;border-radius:10px;padding:7px;font-size:11px;box-shadow:inset 0 1px #ffffff12}#view{width:100%;height:auto;aspect-ratio:16/10;border:1px solid #4d7e88;border-radius:15px;background:#071015;touch-action:none;box-shadow:0 22px 55px #000}.pad{width:185px;margin:7px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.pad i{visibility:hidden}button{border:1px solid #4ea7b6;background:linear-gradient(#23798a,#0d4350);color:white;border-radius:9px;padding:11px;font-weight:800;box-shadow:0 5px 12px #0007}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.danger{color:#ff7187}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>ENERGY<br><b id="en">100</b></div><div>TIME<br><b id="tm">72h</b></div><div>ZONE<br><b id="zone">CENTRAL</b></div></div><div id="story" class="panel">THE RAIN REMEMBERS YOU.</div><canvas id="view" width="960" height="600"></canvas><div class="pad"><i></i><button onpointerdown="move(0,-1)">▲</button><i></i><button onpointerdown="move(-1,0)">◀</button><button onpointerdown="interact()">◎</button><button onpointerdown="move(1,0)">▶</button><i></i><button onpointerdown="move(0,1)">▼</button><i></i></div><div class="actions"><button onclick="search()">SEARCH</button><button onclick="interact()">INTERACT</button><button onclick="save()">SAVE</button></div></main><script>const c=view,x=c.getContext('2d');let s=JSON.parse(localStorage.getItem('echoIsoSave')||'null')||{px:9,py:8,ex:15,ey:13,hp:100,en:100,time:72,loot:0,step:0};s.step=s.step||0;const W=72,H=36,OX=480,OY=96;const buildings=[{x:1,y:1,w:5,h:4,z:120,n:'CLINIC',col:'#426773',sign:'#66efff'},{x:8,y:1,w:5,h:4,z:145,n:'MARKET',col:'#685943',sign:'#ffd36a'},{x:15,y:2,w:5,h:4,z:108,n:'GARAGE',col:'#495961',sign:'#ff7c67'},{x:2,y:10,w:5,h:4,z:160,n:'APARTMENTS',col:'#515c6b',sign:'#d08cff'},{x:11,y:10,w:6,h:4,z:135,n:'PHARMACY',col:'#45685d',sign:'#72ff9e'}];const cars=[[7,7,'#8b443f'],[13,6,'#385f70'],[5,14,'#777044'],[17,11,'#674253'],[9,15,'#354b53']];const crates=[[10,7],[16,8],[7,12]];const lamps=[[6,5],[13,5],[6,11],[13,11],[19,6]];const npcs=[[11,5,'#6d8469'],[4,8,'#596f82'],[15,12,'#8b6b48']];function iso(a,b,z=0){return{x:OX+(a-b)*W/2,y:OY+(a+b)*H/2-z}}function poly(p,fill,stroke='#0008'){x.beginPath();x.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>x.lineTo(q.x,q.y));x.closePath();x.fillStyle=fill;x.fill();x.strokeStyle=stroke;x.stroke()}function tile(a,b,col){poly([iso(a,b),iso(a+1,b),iso(a+1,b+1),iso(a,b+1)],col,'#ffffff08')}function box(B){let b=iso(B.x+B.w,B.y),d=iso(B.x,B.y+B.h),e=iso(B.x+B.w,B.y+B.h),at=iso(B.x,B.y,B.z),bt=iso(B.x+B.w,B.y,B.z),dt=iso(B.x,B.y+B.h,B.z),et=iso(B.x+B.w,B.y+B.h,B.z);poly([d,e,et,dt],'#273b40');poly([b,e,et,bt],'#182a30');poly([at,bt,et,dt],B.col);for(let row=.25;row<.9;row+=.28)for(let i=.7;i<B.w;i+=1.2){let q=iso(B.x+i,B.y+B.h,B.z*row);x.fillStyle=Math.random()>.2?'#9eefff45':'#111';x.fillRect(q.x-6,q.y-8,12,15)}let m=iso(B.x+B.w/2,B.y+B.h,B.z*.72);x.save();x.shadowColor=B.sign;x.shadowBlur=15;x.fillStyle=B.sign;x.font='bold 13px system-ui';x.textAlign='center';x.fillText(B.n,m.x,m.y);x.restore()}function lamp(a,b){let q=iso(a,b);x.strokeStyle='#17262a';x.lineWidth=5;x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x,q.y-65);x.stroke();let g=x.createRadialGradient(q.x,q.y-66,2,q.x,q.y-66,55);g.addColorStop(0,'#d9fbffcc');g.addColorStop(1,'#75d8ff00');x.fillStyle=g;x.beginPath();x.arc(q.x,q.y-66,55,0,Math.PI*2);x.fill();x.fillStyle='#eaffff';x.fillRect(q.x-6,q.y-70,12,6)}function person(a,b,col='#277f90',echo=false,npc=false){let q=iso(a,b,6),walk=Math.sin(performance.now()/110+(a+b))*4;x.save();x.translate(q.x,q.y);x.fillStyle='#0008';x.beginPath();x.ellipse(0,10,16,6,0,0,Math.PI*2);x.fill();if(echo){x.shadowColor='#ff2148';x.shadowBlur=22}x.strokeStyle=echo?'#ff4c68':'#1b282d';x.lineWidth=5;x.beginPath();x.moveTo(-4,-9);x.lineTo(-7+walk/2,9);x.moveTo(4,-9);x.lineTo(7-walk/2,9);x.stroke();x.fillStyle=echo?'#9f1732':col;x.beginPath();x.roundRect(-9,-33,18,25,5);x.fill();x.strokeStyle=echo?'#ff8394':'#cba17d';x.lineWidth=4;x.beginPath();x.moveTo(-7,-27);x.lineTo(-13,-12+walk);x.moveTo(7,-27);x.lineTo(13,-12-walk);x.stroke();x.fillStyle=echo?'#ff91a0':'#cba17d';x.beginPath();x.arc(0,-41,8,0,Math.PI*2);x.fill();if(!npc){x.fillStyle=echo?'#ff4562':'#7df3ff';x.fillRect(-7,-31,14,3)}x.restore()}function car(a,b,col){let q=iso(a,b,5);x.save();x.translate(q.x,q.y);x.fillStyle='#0009';x.beginPath();x.ellipse(0,8,30,10,0,0,Math.PI*2);x.fill();x.fillStyle=col;x.beginPath();x.roundRect(-27,-9,54,17,5);x.fill();x.fillStyle='#91b6bc';x.fillRect(-12,-18,27,10);x.fillStyle='#d8f4ff';x.fillRect(-28,-4,4,5);x.restore()}function crate(a,b){let q=iso(a,b,6);x.fillStyle='#806441';x.fillRect(q.x-12,q.y-18,24,18);x.strokeStyle='#d5b47a';x.strokeRect(q.x-12,q.y-18,24,18);x.beginPath();x.moveTo(q.x-12,q.y-18);x.lineTo(q.x+12,q.y);x.moveTo(q.x+12,q.y-18);x.lineTo(q.x-12,q.y);x.stroke()}function draw(){x.clearRect(0,0,960,600);let sky=x.createLinearGradient(0,0,0,600);sky.addColorStop(0,'#15262d');sky.addColorStop(.6,'#071116');sky.addColorStop(1,'#030709');x.fillStyle=sky;x.fillRect(0,0,960,600);for(let a=0;a<21;a++)for(let b=0;b<17;b++){let road=a%7===6||b%6===5;tile(a,b,road?'#172126':((a+b)%3?'#253b38':'#203632'))}x.strokeStyle='#c7a84b55';x.setLineDash([16,20]);for(let a=6;a<20;a+=7){let q=iso(a,0),r=iso(a,17);x.beginPath();x.moveTo(q.x,q.y);x.lineTo(r.x,r.y);x.stroke()}x.setLineDash([]);buildings.forEach(box);lamps.forEach(v=>lamp(...v));cars.forEach(v=>car(...v));crates.forEach(v=>crate(...v));npcs.forEach(v=>person(v[0],v[1],v[2],false,true));person(s.ex,s.ey,'#9f1732',true);person(s.px,s.py);let vign=x.createRadialGradient(480,300,170,480,300,520);vign.addColorStop(0,'#0000');vign.addColorStop(1,'#000b');x.fillStyle=vign;x.fillRect(0,0,960,600);x.strokeStyle='#c9f2ff42';x.lineWidth=1;for(let i=0;i<110;i++){let rx=(i*83+performance.now()/7)%1050,ry=(i*47+performance.now()/2.5)%670;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx-8,ry+22);x.stroke()}requestAnimationFrame(draw)}function near(){return buildings.find(B=>s.px>=B.x-1&&s.px<=B.x+B.w+1&&s.py>=B.y-1&&s.py<=B.y+B.h+1)}function chase(){let dx=s.px-s.ex,dy=s.py-s.ey;if(Math.abs(dx)+Math.abs(dy)<10){if(Math.abs(dx)>Math.abs(dy))s.ex+=Math.sign(dx);else s.ey+=Math.sign(dy)}if(s.ex===s.px&&s.ey===s.py){s.hp-=12;s.ex=18;s.ey=15;story.innerHTML='<span class="danger">THE ECHO FOUND YOU. -12 HP.</span>'}}function move(dx,dy){s.px=Math.max(0,Math.min(20,s.px+dx));s.py=Math.max(0,Math.min(16,s.py+dy));s.step++;s.en=Math.max(0,s.en-1);s.time=Math.max(0,s.time-.2);chase();ui()}function interact(){let B=near();story.textContent=B?'You stand beneath the glowing '+B.n+' sign. The entrance is open.':'A survivor disappears around the next block. Rain hisses on abandoned cars.'}function search(){s.en=Math.max(0,s.en-3);s.time=Math.max(0,s.time-.5);s.loot++;story.textContent='You pry open a street crate. Supplies recovered: '+s.loot;ui()}function save(){localStorage.setItem('echoIsoSave',JSON.stringify(s));story.textContent='Run saved on this device.'}function ui(){hp.textContent=s.hp;en.textContent=s.en;tm.textContent=s.time.toFixed(1)+'h';let B=near();zone.textContent=B?B.n:'STREETS'}ui();draw();</script></body></html>
