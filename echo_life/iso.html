<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE ISO</title><style>*{box-sizing:border-box}body{margin:0;background:#05090c;color:#eaffff;font-family:system-ui;text-align:center}main{max-width:760px;margin:auto;padding:8px}h1{margin:4px;letter-spacing:6px;text-shadow:0 0 18px #53ddef}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.hud div,.panel{background:#0b1b21;border:1px solid #315866;border-radius:10px;padding:7px;font-size:11px}#view{width:100%;height:auto;aspect-ratio:16/10;border:1px solid #426b75;border-radius:14px;background:#0a1115;touch-action:none;box-shadow:0 18px 45px #000}.pad{width:185px;margin:7px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.pad i{visibility:hidden}button{border:1px solid #4ea7b6;background:linear-gradient(#1d6b7a,#0c3e49);color:white;border-radius:9px;padding:11px;font-weight:800}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.danger{color:#ff7187}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>ENERGY<br><b id="en">100</b></div><div>TIME<br><b id="tm">72h</b></div><div>ZONE<br><b id="zone">CENTRAL</b></div></div><div id="story" class="panel">ISOMETRIC CITY ONLINE — move through the rain.</div><canvas id="view" width="960" height="600"></canvas><div class="pad"><i></i><button onpointerdown="move(0,-1)">▲</button><i></i><button onpointerdown="move(-1,0)">◀</button><button onpointerdown="interact()">◎</button><button onpointerdown="move(1,0)">▶</button><i></i><button onpointerdown="move(0,1)">▼</button><i></i></div><div class="actions"><button onclick="search()">SEARCH</button><button onclick="interact()">INTERACT</button><button onclick="save()">SAVE</button></div></main><script>const c=view,x=c.getContext('2d');let s=JSON.parse(localStorage.getItem('echoIsoSave')||'null')||{px:9,py:8,ex:15,ey:13,hp:100,en:100,time:72,loot:0};const W=72,H=36,OX=480,OY=105;const buildings=[{x:1,y:1,w:5,h:4,z:110,n:'CLINIC',col:'#47636b'},{x:8,y:1,w:5,h:4,z:135,n:'MARKET',col:'#6a5943'},{x:15,y:2,w:5,h:4,z:100,n:'GARAGE',col:'#4c5960'},{x:2,y:10,w:5,h:4,z:150,n:'APARTMENTS',col:'#555d68'},{x:11,y:10,w:6,h:4,z:125,n:'PHARMACY',col:'#4b665d'}];const cars=[[7,7,'#824b42'],[13,6,'#435e6c'],[5,14,'#6a6750'],[17,11,'#5c4654']];const loot=[[10,7],[16,8],[7,12]];function iso(a,b,z=0){return{x:OX+(a-b)*W/2,y:OY+(a+b)*H/2-z}}function poly(p,fill,stroke='#0008'){x.beginPath();x.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>x.lineTo(q.x,q.y));x.closePath();x.fillStyle=fill;x.fill();x.strokeStyle=stroke;x.stroke()}function tile(a,b,col){let q=iso(a,b),r=iso(a+1,b),t=iso(a+1,b+1),u=iso(a,b+1);poly([q,r,t,u],col,'#ffffff08')}function box(B){let a=iso(B.x,B.y),b=iso(B.x+B.w,B.y),d=iso(B.x,B.y+B.h),e=iso(B.x+B.w,B.y+B.h),at=iso(B.x,B.y,B.z),bt=iso(B.x+B.w,B.y,B.z),dt=iso(B.x,B.y+B.h,B.z),et=iso(B.x+B.w,B.y+B.h,B.z);poly([d,e,et,dt],'#26373d');poly([b,e,et,bt],'#1c2c32');poly([at,bt,et,dt],B.col);x.fillStyle='#a9e8ee55';for(let i=1;i<B.w;i+=1.4){let q=iso(B.x+i,B.y+B.h,B.z*.55);x.fillRect(q.x-7,q.y-10,14,18)}let m=iso(B.x+B.w/2,B.y+B.h/2,B.z+8);x.fillStyle='#d9fbff';x.font='bold 14px system-ui';x.textAlign='center';x.fillText(B.n,m.x,m.y)}function person(a,b,echo=false){let q=iso(a,b,6);x.save();x.translate(q.x,q.y);x.fillStyle='#0008';x.beginPath();x.ellipse(0,9,17,7,0,0,Math.PI*2);x.fill();x.fillStyle=echo?'#9e2038':'#287d8d';x.fillRect(-9,-31,18,25);x.fillStyle=echo?'#ff7789':'#cda17e';x.beginPath();x.arc(0,-39,8,0,Math.PI*2);x.fill();x.strokeStyle=echo?'#ff3657':'#8ceeff';x.lineWidth=3;x.beginPath();x.moveTo(-6,-8);x.lineTo(-9,8);x.moveTo(6,-8);x.lineTo(9,8);x.stroke();if(echo){x.shadowColor='#ff2448';x.shadowBlur=20;x.strokeStyle='#ff5870';x.strokeRect(-12,-49,24,45)}x.restore()}function car(a,b,col){let q=iso(a,b,5);x.save();x.translate(q.x,q.y);x.fillStyle='#0008';x.fillRect(-23,3,46,10);x.fillStyle=col;x.fillRect(-25,-8,50,15);x.fillStyle='#a7c6c9';x.fillRect(-10,-16,24,9);x.restore()}function draw(){x.clearRect(0,0,c.width,c.height);let g=x.createLinearGradient(0,0,0,600);g.addColorStop(0,'#17272c');g.addColorStop(1,'#071014');x.fillStyle=g;x.fillRect(0,0,960,600);for(let a=0;a<21;a++)for(let b=0;b<17;b++){let road=(a%7===6||b%6===5);tile(a,b,road?'#182125':'#263a38')}buildings.forEach(box);cars.forEach(v=>car(...v));loot.forEach(v=>{let q=iso(v[0],v[1],8);x.font='25px sans-serif';x.fillText('◆',q.x,q.y)});person(s.ex,s.ey,true);person(s.px,s.py,false);x.strokeStyle='#bceeff30';x.lineWidth=1;for(let i=0;i<90;i++){let rx=(i*83+performance.now()/8)%1000,ry=(i*47+performance.now()/3)%650;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx-7,ry+18);x.stroke()}requestAnimationFrame(draw)}function near(){return buildings.find(B=>s.px>=B.x-1&&s.px<=B.x+B.w+1&&s.py>=B.y-1&&s.py<=B.y+B.h+1)}function chase(){let dx=s.px-s.ex,dy=s.py-s.ey;if(Math.abs(dx)+Math.abs(dy)<10){if(Math.abs(dx)>Math.abs(dy))s.ex+=Math.sign(dx);else s.ey+=Math.sign(dy)}if(s.ex===s.px&&s.ey===s.py){s.hp-=12;s.ex=18;s.ey=15;story.innerHTML='<span class="danger">THE ECHO FOUND YOU. -12 HP.</span>'}}function move(dx,dy){s.px=Math.max(0,Math.min(20,s.px+dx));s.py=Math.max(0,Math.min(16,s.py+dy));s.en=Math.max(0,s.en-1);s.time=Math.max(0,s.time-.2);chase();ui()}function interact(){let B=near();story.textContent=B?'You reach '+B.n+'. The entrance is accessible.':'Rain and abandoned traffic. Nothing close enough to enter.'}function search(){s.en=Math.max(0,s.en-3);s.time=Math.max(0,s.time-.5);s.loot++;story.textContent='You search the street and recover supplies. Loot '+s.loot;ui()}function save(){localStorage.setItem('echoIsoSave',JSON.stringify(s));story.textContent='Isometric run saved on this device.'}function ui(){hp.textContent=s.hp;en.textContent=s.en;tm.textContent=s.time.toFixed(1)+'h';let B=near();zone.textContent=B?B.n:'STREETS'}ui();draw();</script></body></html>
