<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v29 GRAPHICS</title><style>*{box-sizing:border-box}html,body{margin:0;background:#020406;color:#eaffff;font-family:system-ui;overflow-x:hidden}main{max-width:1100px;margin:auto;padding:5px}h1{text-align:center;margin:2px;letter-spacing:10px;font-size:22px;text-shadow:0 0 25px #57eaff}.hud{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.hud div,.panel{background:linear-gradient(#0a1b22ee,#061015ee);border:1px solid #39636d;border-radius:7px;padding:6px;text-align:center;font-size:10px;box-shadow:inset 0 0 14px #0008}.hud b{font-size:15px}#wrap{position:relative;margin-top:4px;border-radius:14px;overflow:hidden;box-shadow:0 30px 100px #000}canvas{display:block;width:100%;aspect-ratio:16/9;background:#050b0e;touch-action:none}.joy{position:absolute;left:20px;bottom:18px;width:108px;height:108px;border:2px solid #80efff66;border-radius:50%;background:#07161bc9;touch-action:none;box-shadow:0 0 28px #42c9df22}.stick{position:absolute;left:31px;top:31px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#4bb9ca 45%,#123943);box-shadow:0 5px 18px #000}.fire{position:absolute;right:24px;bottom:23px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd1ca,#c52e48 52%,#430c18);border:2px solid #ffd0d5;color:#fff;font-weight:900;box-shadow:0 0 30px #ff496677}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:3px}button{background:linear-gradient(#245b68,#0a2730);border:1px solid #55aaba;color:#fff;border-radius:7px;padding:10px;font-weight:800;font-size:10px}.overlay{position:fixed;inset:0;background:#010406f5;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.card{width:min(580px,100%);background:linear-gradient(145deg,#10252c,#050b0e);border:1px solid #527c86;border-radius:16px;padding:20px;text-align:center}.card button{width:100%;margin:4px 0}.hidden{display:none}@media(max-width:600px){.hud{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>LVL<br><b id="lvl">1</b></div><div>AMMO<br><b id="ammo">30</b></div><div>CREDITS<br><b id="cash">100</b></div><div>ARMOR<br><b id="armor">1</b></div><div>COMBO<br><b id="combo">0</b></div><div>ZONE<br><b id="zone">DOWNTOWN</b></div></div><div id="story" class="panel">v29 · HIGH FIDELITY VISUAL OVERHAUL</div><div id="wrap"><canvas id="game" width="1280" height="720"></canvas><div id="joy" class="joy"><div id="stick" class="stick"></div></div><button id="fire" class="fire">FIRE</button></div><div class="grid"><button id="stealth">STEALTH</button><button id="blast">BLAST</button><button id="loot">LOOT</button><button id="use">USE</button><button id="swap">SWAP</button><button id="map">MAP</button></div><div id="status" class="panel"></div></main><div id="title" class="overlay"><div class="card"><h2>ECHO//LIFE</h2><p>THE TOMORROW SIGNAL</p><p>v29 · HIGH FIDELITY</p><button id="new">NEW GAME</button><button id="cont">CONTINUE</button></div></div><div id="modal" class="overlay hidden"><div id="card" class="card"></div></div><script>(()=>{'use strict';const C=document.querySelector('#game'),g=C.getContext('2d'),$=x=>document.getElementById(x),Z=['DOWNTOWN','OLD TOWN','INDUSTRIAL','RIVERSIDE','UNDERGROUND','UPTOWN'];let s=null,flash=0;const fresh=()=>({x:13,y:11,hp:100,lvl:1,xp:0,ammo:30,cash:100,armor:1,grenades:3,weapon:1,weapons:[['PIPE',16,2],['REVOLVER',28,8],['SMG',20,9]],zone:0,stealth:false,enemies:[],loot:[],shots:[],particles:[],shake:0,combo:0});const iso=(x,y,z=0)=>({x:640+(x-y)*32,y:68+(x+y)*16-z});function poly(p,c){g.fillStyle=c;g.beginPath();g.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>g.lineTo(q.x,q.y));g.closePath();g.fill()}function tile(x,y,c){poly([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],c)}function road(x,y){tile(x,y,(x+y)%2?'#192429':'#1d292e');let p=iso(x+.5,y+.5);g.strokeStyle='#d8c46c35';g.lineWidth=2;g.setLineDash([8,12]);if(x%7===6){g.beginPath();g.moveTo(p.x-27,p.y-13);g.lineTo(p.x+27,p.y+13);g.stroke()}if(y%6===5){g.beginPath();g.moveTo(p.x+27,p.y-13);g.lineTo(p.x-27,p.y+13);g.stroke()}g.setLineDash([])}function building(x,y,w,h,z,style){let A=iso(x,y+h),B=iso(x+w,y+h),D=iso(x+w,y+h,z),E=iso(x,y+h,z),F=iso(x+w,y),Q=iso(x+w,y,z),T=iso(x,y,z),cols=[['#26383e','#17272d','#40545a'],['#39332f','#28221f','#54483e'],['#30383a','#20282a','#465054'],['#28383d','#172a31','#385361']][style%4];poly([A,B,D,E],cols[0]);poly([F,B,D,Q],cols[1]);poly([T,Q,D,E],cols[2]);for(let r=0;r<5;r++)for(let i=0;i<w;i++){let p=iso(x+i+.5,y+h,z-18-r*19),on=(r+i+style)%4!==0;g.fillStyle=on?(style%2?'#ffd07a':'#70ddea')+'aa':'#081013';g.shadowColor=on?'#6deaff':'transparent';g.shadowBlur=on?9:0;g.fillRect(p.x-5,p.y-6,10,10)}g.shadowBlur=0;let door=iso(x+w*.5,y+h,20);g.fillStyle='#060c0f';g.fillRect(door.x-10,door.y-23,20,25);g.strokeStyle='#69838a';g.strokeRect(door.x-10,door.y-23,20,25);let roof=iso(x+w*.55,y+h*.4,z+7);g.fillStyle='#233238';g.fillRect(roof.x-18,roof.y-9,36,11);g.strokeStyle='#65777b';g.beginPath();g.moveTo(roof.x,roof.y-9);g.lineTo(roof.x,roof.y-28);g.stroke()}function lamp(x,y){let a=iso(x,y),b=iso(x,y,72);g.strokeStyle='#27373c';g.lineWidth=4;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();let R=g.createRadialGradient(b.x,b.y,1,b.x,b.y,70);R.addColorStop(0,'#fff2bbaa');R.addColorStop(.25,'#ffd96b38');R.addColorStop(1,'#ffd96b00');g.fillStyle=R;g.beginPath();g.arc(b.x,b.y,70,0,7);g.fill();g.fillStyle='#fff2bb';g.beginPath();g.arc(b.x,b.y,4,0,7);g.fill()}function car(x,y,i){let p=iso(x,y,5);g.save();g.translate(p.x,p.y);g.rotate(i%2?.42:-.42);g.fillStyle='#0009';g.beginPath();g.ellipse(0,10,32,9,0,0,7);g.fill();g.fillStyle=['#713943','#345d78','#6d573e','#426a59'][i%4];g.beginPath();g.roundRect(-28,-12,56,21,7);g.fill();g.fillStyle='#14242a';g.beginPath();g.roundRect(-14,-22,31,15,6);g.fill();g.fillStyle='#8bd9e588';g.fillRect(-10,-20,10,9);g.fillRect(3,-20,10,9);g.fillStyle='#050708';g.beginPath();g.arc(-18,9,6,0,7);g.arc(18,9,6,0,7);g.fill();g.fillStyle='#fff0a0';g.fillRect(-28,-6,3,6);g.restore()}function tree(x,y,dead=false){let a=iso(x,y),b=iso(x,y,43);g.strokeStyle='#4d392d';g.lineWidth=6;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();for(let i=0;i<7;i++){g.fillStyle=dead?'#3c3732':i%2?'#244b3b':'#315c46';g.beginPath();g.arc(b.x+(i-3)*6,b.y-(i%3)*7,dead?6:13,0,7);g.fill()}}function person(x,y,c,big=1){let p=iso(x,y,4),t=performance.now(),w=Math.sin(t/120+x)*3;g.save();g.translate(p.x,p.y);g.scale(big,big);g.fillStyle='#000b';g.beginPath();g.ellipse(0,6,20,6,0,0,7);g.fill();g.strokeStyle='#11191d';g.lineCap='round';g.lineWidth=7;g.beginPath();g.moveTo(-5,-11);g.lineTo(-8+w,-1);g.moveTo(5,-11);g.lineTo(8-w,-1);g.stroke();g.fillStyle='#17262b';g.beginPath();g.roundRect(-13,-38,26,31,6);g.fill();g.fillStyle=c;g.beginPath();g.roundRect(-14,-36,28,22,6);g.fill();g.fillStyle='#111b20';g.fillRect(-13,-24,26,5);g.strokeStyle='#c99a76';g.lineWidth=5;g.beginPath();g.moveTo(-11,-31);g.lineTo(-18,-17);g.moveTo(11,-31);g.lineTo(18,-17);g.stroke();g.fillStyle='#c99a76';g.beginPath();g.arc(0,-49,9,0,7);g.fill();g.fillStyle='#241e20';g.beginPath();g.arc(0,-52,9,Math.PI,6.2);g.fill();g.fillStyle='#101010';g.fillRect(-5,-49,3,2);g.fillRect(3,-49,3,2);g.strokeStyle='#273238';g.lineWidth=4;g.beginPath();g.moveTo(10,-28);g.lineTo(29,-22);g.stroke();g.fillStyle='#39484d';g.fillRect(24,-25,10,5);g.restore()}function spawn(){s.enemies=[];for(let i=0;i<6;i++){let h=50+s.lvl*7;s.enemies.push({x:17+i%3,y:7+(i*2)%11,hp:h,max:h,alert:false,boss:i===5&&s.lvl>2})}}function fx(x,y,c,n=16){let p=iso(x,y,25);for(let i=0;i<n;i++)s.particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,l:20,c})}function draw(){requestAnimationFrame(draw);if(!s)return;g.save();if(s.shake>1){g.translate((Math.random()-.5)*s.shake,(Math.random()-.5)*s.shake);s.shake*=.72}let sky=g.createLinearGradient(0,0,0,720);sky.addColorStop(0,['#193b49','#443536','#303b39','#17414e','#20232d','#2c405a'][s.zone]);sky.addColorStop(.58,'#09151a');sky.addColorStop(1,'#020507');g.fillStyle=sky;g.fillRect(0,0,1280,720);g.fillStyle='#0b151a';for(let i=0;i<18;i++)g.fillRect(i*78,155-(i%4)*20,55,190+(i%5)*18);for(let x=0;x<27;x++)for(let y=0;y<21;y++)x%7===6||y%6===5?road(x,y):tile(x,y,(x+y)%2?'#293b3e':'#33474a');building(1,1,4,3,120,0);building(8,1,4,3,138,1);building(15,1,4,3,155,2);building(22,2,4,3,132,3);for(let i=0;i<8;i++){lamp(4+(i*5)%23,8+(i*4)%12);tree(2+(i*4)%25,9+(i*3)%11,s.zone===2);car(5+(i*6)%21,10+(i*5)%10,i)}s.loot.forEach(l=>{let p=iso(l.x,l.y,11+Math.sin(performance.now()/170)*5);g.shadowColor='#69f6ff';g.shadowBlur=28;g.fillStyle='#b2ffff';g.beginPath();g.moveTo(p.x,p.y-8);g.lineTo(p.x+7,p.y);g.lineTo(p.x,p.y+8);g.lineTo(p.x-7,p.y);g.fill();g.shadowBlur=0});s.enemies.filter(e=>e.hp>0).forEach(e=>{person(e.x,e.y,e.boss?'#e33153':'#a33b4e',e.boss?1.45:1);let p=iso(e.x,e.y,e.boss?86:67),w=e.boss?68:44;g.fillStyle='#17070a';g.fillRect(p.x-w/2,p.y,w,6);g.fillStyle=e.boss?'#ff365c':'#62e18e';g.fillRect(p.x-w/2,p.y,w*Math.max(0,e.hp/e.max),6)});person(s.x,s.y,s.stealth?'#77755e':'#218ea8');s.shots=s.shots.filter(a=>a.l-->0);s.shots.forEach(a=>{g.shadowColor='#ffe681';g.shadowBlur=18;g.strokeStyle='#fff3ae';g.lineWidth=3;g.beginPath();g.moveTo(a.a.x,a.a.y);g.lineTo(a.b.x,a.b.y);g.stroke();g.shadowBlur=0});s.particles=s.particles.filter(p=>p.l-->0);s.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;g.globalAlpha=p.l/20;g.fillStyle=p.c;g.fillRect(p.x,p.y,4,4)});g.globalAlpha=1;g.strokeStyle='#dff9ff48';for(let i=0;i<110;i++){let x=(i*91+performance.now()*.35)%1320,y=(i*53+performance.now()*.82)%760;g.beginPath();g.moveTo(x,y);g.lineTo(x-9,y+24);g.stroke()}if(flash>0){g.fillStyle='#ff244028';g.fillRect(0,0,1280,720);flash--}let fog=g.createLinearGradient(0,360,0,720);fog.addColorStop(0,'#c5eef000');fog.addColorStop(1,'#b8dfe012');g.fillStyle=fog;g.fillRect(0,0,1280,720);let v=g.createRadialGradient(640,350,230,640,350,720);v.addColorStop(0,'#0000');v.addColorStop(1,'#000d');g.fillStyle=v;g.fillRect(0,0,1280,720);g.restore()}function dist(e){return Math.abs(s.x-e.x)+Math.abs(s.y-e.y)}function near(r){return s.enemies.filter(e=>e.hp>0).sort((a,b)=>dist(a)-dist(b)).find(e=>dist(e)<=r)}function move(dx,dy){s.x=Math.max(0,Math.min(26,s.x+dx));s.y=Math.max(0,Math.min(20,s.y+dy));turn();ui()}function turn(){s.enemies.filter(e=>e.hp>0).forEach(e=>{let d=dist(e);if(d<=(s.stealth?3:8))e.alert=true;if(!e.alert)return;if(d<=1){s.hp-=Math.max(3,(e.boss?15:9)-s.armor);flash=5}else if(Math.abs(s.x-e.x)>Math.abs(s.y-e.y))e.x+=Math.sign(s.x-e.x);else e.y+=Math.sign(s.y-e.y)});if(s.hp<=0){s.hp=100;s.cash=Math.max(0,s.cash-25);s.combo=0;s.x=13;s.y=11;spawn();msg('RESPAWNED · -25 CREDITS')}}function attack(){let w=s.weapons[s.weapon],e=near(w[2]);if(!e)return msg('NO TARGET IN RANGE');if(s.weapon){if(!s.ammo)return msg('OUT OF AMMO');s.ammo--}s.shots.push({a:iso(s.x,s.y,26),b:iso(e.x,e.y,27),l:5});e.hp-=w[1];s.shake=5;fx(e.x,e.y,'#ff526c');navigator.vibrate?.(25);if(e.hp<=0){s.cash+=e.boss?100:20;s.xp+=e.boss?60:25;s.combo++;s.loot.push({x:e.x,y:e.y});fx(e.x,e.y,'#ffd15c',30);if(s.xp>=100){s.xp-=100;s.lvl++;s.hp=100;msg('LEVEL UP · '+s.lvl)}}turn();ui()}function blast(){if(!s.grenades)return msg('NO GRENADES');s.grenades--;s.shake=18;s.enemies.forEach(e=>{if(e.hp>0&&dist(e)<=5){e.hp-=70;fx(e.x,e.y,'#ff9d42',40);if(e.hp<=0){s.loot.push({x:e.x,y:e.y});s.cash+=20;s.combo++}}});navigator.vibrate?.([40,30,80]);ui()}function loot(){let i=s.loot.findIndex(l=>Math.abs(l.x-s.x)+Math.abs(l.y-s.y)<=2);if(i<0)return msg('NO LOOT NEARBY');s.loot.splice(i,1);let c=10+Math.floor(Math.random()*21);s.cash+=c;s.ammo+=5;msg('LOOT · +'+c+' CREDITS · +5 AMMO');ui()}function msg(x){$('story').textContent=x}function ui(){if(!s)return;$('hp').textContent=Math.max(0,s.hp);$('lvl').textContent=s.lvl;$('ammo').textContent=s.ammo;$('cash').textContent=s.cash;$('armor').textContent=s.armor;$('combo').textContent=s.combo;$('zone').textContent=Z[s.zone];$('status').textContent=(s.stealth?'STEALTH · ':'')+s.weapons[s.weapon][0]+' · '+s.weapons[s.weapon][1]+' DMG · GRENADES '+s.grenades+' · HOSTILES '+s.enemies.filter(e=>e.hp>0).length;localStorage.setItem('echo29',JSON.stringify(s))}function show(h){$('card').innerHTML=h+'<button id="close">CLOSE</button>';$('modal').classList.remove('hidden');$('close').onclick=()=>$('modal').classList.add('hidden')}function map(){show('<h2>TRAVEL</h2>'+Z.map((z,i)=>'<button data-z="'+i+'">'+z+'</button>').join(''));document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{s.zone=+b.dataset.z;s.x=13;s.y=11;spawn();$('modal').classList.add('hidden');msg('ENTERED '+Z[s.zone]);ui()})}function start(load){s=load?JSON.parse(localStorage.getItem('echo29')||'null'):null;if(!s)s=fresh();spawn();$('title').classList.add('hidden');ui()}$('new').onclick=()=>start(false);$('cont').onclick=()=>start(true);$('fire').onclick=attack;$('blast').onclick=blast;$('loot').onclick=loot;$('stealth').onclick=()=>{s.stealth=!s.stealth;ui()};$('swap').onclick=()=>{s.weapon=(s.weapon+1)%s.weapons.length;msg('EQUIPPED '+s.weapons[s.weapon][0]);ui()};$('map').onclick=map;$('use').onclick=()=>msg('SIGNAL SCAN · '+Z[s.zone]+' STABLE');document.addEventListener('keydown',e=>{if(!s)return;let k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')move(0,-1);if(k==='s'||e.key==='ArrowDown')move(0,1);if(k==='a'||e.key==='ArrowLeft')move(-1,0);if(k==='d'||e.key==='ArrowRight')move(1,0);if(e.key===' ')attack()});let active=false,cx=0,cy=0,last=0;$('joy').onpointerdown=e=>{active=true;$('joy').setPointerCapture(e.pointerId);let r=$('joy').getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2};$('joy').onpointermove=e=>{if(!active||!s)return;let dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy)||1,L=30;if(mag>L){dx=dx/mag*L;dy=dy/mag*L}$('stick').style.transform=`translate(${dx}px,${dy}px)`;if(Date.now()-last>115&&Math.hypot(dx,dy)>12){last=Date.now();Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy))}};let end=()=>{active=false;$('stick').style.transform=''};$('joy').onpointerup=end;$('joy').onpointercancel=end;draw()})();</script></body></html>
