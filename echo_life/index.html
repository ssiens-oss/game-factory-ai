<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050b10"><link rel="manifest" href="manifest.webmanifest"><title>ECHO//LIFE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#163341 0,#08141c 35%,#03070b 100%);color:#e9fbff;font-family:system-ui,-apple-system,sans-serif;text-align:center;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);mix-blend-mode:screen}#game{max-width:600px;margin:auto;padding:18px 14px 34px}h1{font-size:clamp(34px,10vw,58px);letter-spacing:7px;margin:14px 0 4px;text-shadow:0 0 12px #5ee8ff,0 0 32px #126b82}.tag{letter-spacing:3px;font-size:11px;opacity:.6;margin-bottom:18px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.stat{background:linear-gradient(180deg,rgba(25,57,69,.94),rgba(8,24,32,.94));border:1px solid #2f6875;border-radius:12px;padding:9px 3px;box-shadow:inset 0 1px rgba(255,255,255,.08),0 7px 20px #0007}.stat b{display:block;font-size:10px;letter-spacing:1px;opacity:.55}.stat span{font-size:16px}.panel{background:linear-gradient(145deg,rgba(17,43,53,.95),rgba(7,19,26,.95));border:1px solid #285664;border-radius:16px;padding:15px;margin:11px 0;box-shadow:0 14px 30px #0007,inset 0 1px rgba(255,255,255,.06)}#story{min-height:72px;display:flex;align-items:center;justify-content:center;line-height:1.45}.location{font-size:12px;letter-spacing:3px;color:#79dcea;margin:13px 0 5px;text-transform:uppercase}.mapWrap{position:relative;padding:9px;background:linear-gradient(145deg,#102b35,#07151d);border:1px solid #326474;border-radius:18px;box-shadow:0 20px 45px #0009}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.cell{position:relative;aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(145deg,#183843,#0d252e);border:1px solid #29505c;box-shadow:inset 0 -10px 20px #0003;overflow:hidden}.cell:after{content:"";position:absolute;inset:auto 8% 8% 8%;height:2px;background:#65d6e822;box-shadow:0 0 8px #65d6e833}.road{background:linear-gradient(135deg,#12242b,#0b171d)}.player{background:radial-gradient(circle,#b9fbff 0 12%,#29b8cc 14% 30%,#124e5b 32% 100%);box-shadow:0 0 15px #69edff,0 0 30px #1a8da5;animation:pulse 1.6s infinite}.player:before{content:"";position:absolute;width:70%;height:70%;border:1px solid #83f5ff66;border-radius:50%;animation:ring 1.6s infinite}@keyframes pulse{50%{filter:brightness(1.3)}}@keyframes ring{to{transform:scale(1.45);opacity:0}}button{background:linear-gradient(180deg,#23788a,#15515e);color:white;border:1px solid #45a4b7;border-radius:12px;padding:12px 15px;margin:4px;font-weight:700;letter-spacing:.5px;box-shadow:0 6px 14px #0007,inset 0 1px rgba(255,255,255,.14);touch-action:manipulation}button:active{transform:translateY(2px);filter:brightness(1.2)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.actions button{margin:0;padding:13px 5px;font-size:12px}.dpad{width:190px;margin:13px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.dpad button{margin:0;font-size:22px;padding:10px}.dpad .blank{visibility:hidden}.bagTitle{font-size:11px;letter-spacing:2px;opacity:.6}.bag{margin-top:8px;font-size:13px;line-height:1.6}.hidden{display:none!important}.small{font-size:12px;opacity:.7}.collapse{background:radial-gradient(circle at 50% 0,#361921,#10080c 45%,#020304 100%)}.collapse h1{text-shadow:0 0 12px #ff5168,0 0 30px #8c182b}.collapse .cell{filter:saturate(.45) brightness(.7)}#choices button{font-size:13px}.startHero{padding:28px 15px}.signal{font-size:46px;filter:drop-shadow(0 0 12px #65eaff);animation:pulse 1.6s infinite}@media(max-width:390px){#game{padding-left:9px;padding-right:9px}.cell{font-size:20px}.hud{gap:4px}.stat span{font-size:14px}}</style></head><body><div id="game"><h1>ECHO//LIFE</h1><div class="tag">THE CITY REMEMBERS</div><div id="start" class="panel startHero"><div class="signal">◉</div><p><b>72 HOURS UNTIL THE UNKNOWN</b></p><p class="small">Prepare. Choose. Survive. Become the thing your next life has to face.</p><div id="echoIntro"></div><button onclick="newLife()">BEGIN NEW LIFE</button></div><div id="play" class="hidden"><div class="hud"><div class="stat"><b>TIME</b><span id="time"></span></div><div class="stat"><b>HEALTH</b><span id="hp"></span></div><div class="stat"><b>ENERGY</b><span id="energy"></span></div><div class="stat"><b>CASH</b><span id="cash"></span></div></div><div id="location" class="location"></div><div id="story" class="panel"></div><div class="mapWrap"><div id="map" class="map"></div></div><div class="dpad"><span class="blank"></span><button onclick="move(0,-1)">▲</button><span class="blank"></span><button onclick="move(-1,0)">◀</button><button onclick="encounter()">◎</button><button onclick="move(1,0)">▶</button><span class="blank"></span><button onclick="move(0,1)">▼</button><span class="blank"></span></div><div class="panel"><div class="bagTitle">BACKPACK · 8 SLOTS</div><div id="bag" class="bag"></div></div><div class="actions"><button onclick="scavenge()">SEARCH</button><button onclick="encounter()">OBSERVE</button><button onclick="rest()">REST</button></div><div id="choices" class="panel hidden"></div></div></div><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');let s;const loot=['💧 Water','🔋 Battery','🥫 Canned food','🔦 Flashlight','🧵 Wire','🩹 Bandage','📻 Old radio','🔧 Multi-tool'];const places=['Apartment','Corner Store','Clinic','Garage','Alley','Park','Warehouse','Diner','Substation','Pharmacy'];const icons=['🏠','🏪','🏥','🔧','▥','🌲','🏭','☕','⚡','✚'];const events=[{text:'A stranger is forcing open a pharmacy door.',opts:[['Help them','empathy'],['Stop them','aggression'],['Demand a cut','greed'],['Watch quietly','curiosity']]},{text:'A woman asks for water for her child.',opts:[['Give water','empathy'],['Sell it for $20','greed'],['Refuse and move on','courage'],['Ask what she knows','curiosity']]},{text:'You find an unattended emergency supply crate.',opts:[['Leave it for others','empathy'],['Take supplies','greed'],['Hide it for later','deception'],['Search for its owner','curiosity']]},{text:'Two men are arguing over the last generator.',opts:[['Calm them down','empathy'],['Intimidate both','aggression'],['Offer a deal','deception'],['Walk away','courage']]}];function previous(){try{return JSON.parse(localStorage.getItem('echoLifeEcho'))}catch(e){return null}}function intro(){let e=previous();echoIntro.innerHTML=e?'<p class="small">⚠ ECHO DETECTED · '+e.type+' · '+e.items+' ITEMS</p>':'<p class="small">NO PREVIOUS ECHO DETECTED</p>'}intro();function newLife(){let e=previous();s={hours:72,hp:100,energy:100,cash:40,x:2,y:2,bag:[],collapsed:false,traits:{empathy:0,aggression:0,greed:0,courage:0,deception:0,curiosity:0}};start.classList.add('hidden');play.classList.remove('hidden');say(e?'A memory flashes behind your eyes. It belongs to someone who was you.':'Your phone loses signal. Every dog on the block starts barking at once.');render()}function say(t){story.textContent=t}function tick(n){s.hours=Math.max(0,s.hours-n);s.energy=Math.max(0,s.energy-n*2);if(s.hours===0&&!s.collapsed){s.collapsed=true;collapse()}}function collapse(){saveEcho();document.body.classList.add('collapse');say('BLACKOUT. The city goes silent. Your preparation is now your survival plan.')}function placeIndex(){return(s.x+s.y*5)%places.length}function place(){return places[placeIndex()]}function move(dx,dy){s.x=Math.max(0,Math.min(4,s.x+dx));s.y=Math.max(0,Math.min(4,s.y+dy));tick(.25);say('You enter '+place()+'.');render()}function scavenge(){if(s.bag.length>=8)return say('Your backpack is full.');tick(1);let item=loot[Math.floor(Math.random()*loot.length)];s.bag.push(item);s.traits.curiosity++;say('You search '+place()+' and recover '+item+'.');render()}function encounter(){tick(.5);let e=events[Math.floor(Math.random()*events.length)];choices.classList.remove('hidden');choices.innerHTML='<b>'+e.text+'</b><br>'+e.opts.map(o=>'<button onclick="choose(\''+o[1]+'\',\''+o[0].replace(/'/g,'')+'\')">'+o[0]+'</button>').join('');render()}function choose(trait,label){s.traits[trait]++;if(trait==='greed')s.cash+=20;if(trait==='aggression')s.energy=Math.max(0,s.energy-5);say(label+'. The city remembers.');choices.classList.add('hidden');render()}function rest(){tick(2);s.energy=Math.min(100,s.energy+30);say('Two hours pass. Somewhere nearby, a transformer explodes.');render()}function saveEcho(){let entries=Object.entries(s.traits).sort((a,b)=>b[1]-a[1]);let type=(entries[0]&&entries[0][1]>0?entries[0][0]:'unknown').toUpperCase();localStorage.setItem('echoLifeEcho',JSON.stringify({type,hours:(72-s.hours).toFixed(1),items:s.bag.length,traits:s.traits,bag:s.bag}))}function render(){time.textContent=s.hours.toFixed(1)+'h';hp.textContent=s.hp;energy.textContent=Math.round(s.energy);cash.textContent='$'+s.cash;location.textContent=place();bag.textContent=s.bag.length?s.bag.join('  •  '):'— EMPTY —';map.innerHTML='';for(let y=0;y<5;y++)for(let x=0;x<5;x++){let d=document.createElement('div'),i=(x+y*5)%places.length;d.className='cell'+((x+y)%3===1?' road':'')+(x===s.x&&y===s.y?' player':'');d.textContent=x===s.x&&y===s.y?'●':icons[i];map.appendChild(d)}if(s.energy<=0){s.hp=Math.max(0,s.hp-2);say('Exhaustion is hurting you. Find somewhere safe to rest.')}}</script></body></html>
