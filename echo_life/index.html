<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE</title><style>body{margin:0;background:#071014;color:#dff;font-family:system-ui;text-align:center}#game{max-width:520px;margin:auto;padding:14px}h1{letter-spacing:4px}.hud{display:flex;justify-content:space-around;background:#10242a;padding:10px;border-radius:12px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:14px 0}.cell{aspect-ratio:1;background:#183239;border:1px solid #31545c;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:24px}.player{background:#26747d}.panel{background:#10242a;padding:12px;border-radius:12px;margin:10px 0}button{background:#1c5962;color:white;border:0;padding:12px 15px;margin:4px;border-radius:9px;font-size:16px}.hidden{display:none}</style></head><body><div id="game"><h1>ECHO//LIFE</h1><div id="start" class="panel"><p>You have 72 hours before something happens to the city.</p><p>You don't know what.</p><button onclick="newLife()">NEW LIFE</button></div><div id="play" class="hidden"><div class="hud"><span id="time"></span><span id="hp"></span><span id="cash"></span></div><div id="story" class="panel"></div><div id="map" class="map"></div><div><button onclick="move(-1,0)">←</button><button onclick="move(0,-1)">↑</button><button onclick="move(0,1)">↓</button><button onclick="move(1,0)">→</button></div><div class="panel"><b>Backpack</b><div id="bag"></div></div><button onclick="scavenge()">SCAVENGE</button><button onclick="encounter()">LOOK AROUND</button><div id="choices" class="panel hidden"></div></div></div><script>let s;const loot=['Water','Battery','Canned food','Flashlight','Wire','Bandage','Old radio','Multi-tool'];function newLife(){s={hours:72,hp:100,cash:40,x:2,y:2,bag:[],traits:{empathy:0,aggression:0,greed:0,courage:0,deception:0,curiosity:0}};start.classList.add('hidden');play.classList.remove('hidden');say('Your phone loses signal for three seconds. Every dog on the block starts barking at once.');render()}function say(t){story.textContent=t}function tick(n=1){s.hours=Math.max(0,s.hours-n);if(!s.hours)say('THE GRID GOES DARK. The Collapse has begun. Your choices are now your survival plan.')}function move(dx,dy){s.x=Math.max(0,Math.min(4,s.x+dx));s.y=Math.max(0,Math.min(4,s.y+dy));tick(.25);render()}function scavenge(){tick(1);if(s.bag.length>=8)return say('Your backpack is full.');let item=loot[Math.floor(Math.random()*loot.length)];s.bag.push(item);s.traits.curiosity++;say('You search nearby and find: '+item+'.');render()}function encounter(){tick(.5);choices.classList.remove('hidden');choices.innerHTML='<b>A stranger is forcing open a pharmacy door.</b><br><button onclick="choose(\'help\')">Help them</button><button onclick="choose(\'stop\')">Stop them</button><button onclick="choose(\'deal\')">Demand a cut</button><button onclick="choose(\'watch\')">Watch quietly</button>'}function choose(c){if(c==='help'){s.traits.empathy++;s.traits.courage++;say('You help. They remember your face.')}if(c==='stop'){s.traits.aggression++;s.traits.courage++;say('You confront them. They back away—for now.')}if(c==='deal'){s.traits.greed+=2;s.cash+=20;s.traits.deception++;say('You make a deal. +$20. Someone across the street saw everything.')}if(c==='watch'){s.traits.curiosity++;s.traits.deception++;say('You stay hidden and learn how they entered.')}choices.classList.add('hidden');render()}function render(){time.textContent='⏳ '+s.hours.toFixed(1)+'h';hp.textContent='♥ '+s.hp;cash.textContent='$'+s.cash;bag.textContent=s.bag.length?s.bag.join(' • '):'Empty';map.innerHTML='';for(let y=0;y<5;y++)for(let x=0;x<5;x++){let d=document.createElement('div');d.className='cell'+(x===s.x&&y===s.y?' player':'');d.textContent=x===s.x&&y===s.y?'◉':['⌂','▣','·','·','♜'][(x+y*3)%5];map.appendChild(d)}}</script></body></html>
