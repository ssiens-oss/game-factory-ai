<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#071014"><link rel="manifest" href="manifest.webmanifest"><title>ECHO//LIFE</title><style>body{margin:0;background:#071014;color:#dff;font-family:system-ui;text-align:center}#game{max-width:540px;margin:auto;padding:14px}h1{letter-spacing:4px}.hud{display:flex;flex-wrap:wrap;justify-content:space-around;background:#10242a;padding:10px;border-radius:12px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:14px 0}.cell{aspect-ratio:1;background:#183239;border:1px solid #31545c;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:22px}.player{background:#26747d;box-shadow:0 0 12px #7ff}.panel{background:#10242a;padding:12px;border-radius:12px;margin:10px 0}button{background:#1c5962;color:white;border:0;padding:12px 14px;margin:4px;border-radius:9px;font-size:16px}.danger{background:#702d36}.hidden{display:none}.small{font-size:13px;opacity:.8}</style></head><body><div id="game"><h1>ECHO//LIFE</h1><div id="start" class="panel"><p>You have 72 hours before something happens to the city.</p><div id="echoIntro"></div><button onclick="newLife()">NEW LIFE</button></div><div id="play" class="hidden"><div class="hud"><span id="time"></span><span id="hp"></span><span id="energy"></span><span id="cash"></span></div><div id="location" class="small"></div><div id="story" class="panel"></div><div id="map" class="map"></div><div><button onclick="move(-1,0)">←</button><button onclick="move(0,-1)">↑</button><button onclick="move(0,1)">↓</button><button onclick="move(1,0)">→</button></div><div class="panel"><b>Backpack</b><div id="bag"></div></div><button onclick="scavenge()">SCAVENGE</button><button onclick="encounter()">LOOK AROUND</button><button onclick="rest()">REST</button><div id="choices" class="panel hidden"></div></div></div><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');let s;const loot=['Water','Battery','Canned food','Flashlight','Wire','Bandage','Old radio','Multi-tool'];const places=['Apartment','Corner Store','Clinic','Garage','Alley','Park','Warehouse','Diner','Substation','Pharmacy'];const events=[{text:'A stranger is forcing open a pharmacy door.',opts:[['Help them','empathy'],['Stop them','aggression'],['Demand a cut','greed'],['Watch quietly','curiosity']]},{text:'A woman asks for water for her child.',opts:[['Give water','empathy'],['Sell it for $20','greed'],['Refuse and move on','courage'],['Ask what she knows','curiosity']]},{text:'You find an unattended emergency supply crate.',opts:[['Leave it for others','empathy'],['Take supplies','greed'],['Hide it for later','deception'],['Search for its owner','curiosity']]},{text:'Two men are arguing over the last generator.',opts:[['Calm them down','empathy'],['Intimidate both','aggression'],['Offer a deal','deception'],['Walk away','courage']]}];function previous(){try{return JSON.parse(localStorage.getItem('echoLifeEcho'))}catch(e){return null}}function intro(){let e=previous();echoIntro.innerHTML=e?'<p class="small">AN ECHO REMAINS: '+e.type+' • survived '+e.hours+'h • '+e.items+' items carried</p>':'<p class="small">No previous Echo detected.</p>'}intro();function newLife(){let e=previous();s={hours:72,hp:100,energy:100,cash:40,x:2,y:2,bag:[],collapsed:false,traits:{empathy:0,aggression:0,greed:0,courage:0,deception:0,curiosity:0}};start.classList.add('hidden');play.classList.remove('hidden');say(e?'You wake with a memory that is not yours. Your previous Echo is somewhere in this city.':'Your phone loses signal for three seconds. Every dog on the block starts barking at once.');render()}function say(t){story.textContent=t}function tick(n){s.hours=Math.max(0,s.hours-n);s.energy=Math.max(0,s.energy-n*2);if(s.hours===0&&!s.collapsed){s.collapsed=true;collapse()}}function collapse(){saveEcho();say('THE GRID GOES DARK. Sirens stop. Cell towers die. BLACKOUT has begun. Your preparation is now your survival plan.');document.body.classList.add('collapse')}function move(dx,dy){s.x=Math.max(0,Math.min(4,s.x+dx));s.y=Math.max(0,Math.min(4,s.y+dy));tick(.25);say('You reach the '+place()+'.');render()}function place(){return places[(s.x+s.y*5)%places.length]}function scavenge(){if(s.bag.length>=8)return say('Your backpack is full.');tick(1);let item=loot[Math.floor(Math.random()*loot.length)];s.bag.push(item);s.traits.curiosity++;say('At the '+place()+' you find '+item+'.');render()}function encounter(){tick(.5);let e=events[Math.floor(Math.random()*events.length)];choices.classList.remove('hidden');choices.innerHTML='<b>'+e.text+'</b><br>'+e.opts.map(o=>'<button onclick="choose(\''+o[1]+'\',\''+o[0].replace(/'/g,'')+'\')">'+o[0]+'</button>').join('');render()}function choose(trait,label){s.traits[trait]++;if(trait==='greed')s.cash+=20;if(trait==='aggression')s.energy=Math.max(0,s.energy-5);say(label+'. The city remembers.');choices.classList.add('hidden');render()}function rest(){tick(2);s.energy=Math.min(100,s.energy+30);say('You rest for two hours. Somewhere outside, a transformer explodes.');render()}function saveEcho(){let entries=Object.entries(s.traits).sort((a,b)=>b[1]-a[1]);let type=(entries[0]&&entries[0][1]>0?entries[0][0]:'unknown').toUpperCase();localStorage.setItem('echoLifeEcho',JSON.stringify({type:type,hours:(72-s.hours).toFixed(1),items:s.bag.length,traits:s.traits,bag:s.bag}));}function render(){time.textContent='⏳ '+s.hours.toFixed(1)+'h';hp.textContent='♥ '+s.hp;energy.textContent='⚡ '+Math.round(s.energy);cash.textContent='$'+s.cash;location.textContent=place();bag.textContent=s.bag.length?s.bag.join(' • '):'Empty';map.innerHTML='';for(let y=0;y<5;y++)for(let x=0;x<5;x++){let d=document.createElement('div');d.className='cell'+(x===s.x&&y===s.y?' player':'');d.textContent=x===s.x&&y===s.y?'◉':['⌂','▣','·','⚕','⚙'][(x+y*3)%5];map.appendChild(d)}if(s.energy<=0){s.hp=Math.max(0,s.hp-2);say('Exhaustion is hurting you. Rest or find supplies.')}}</script></body></html>
