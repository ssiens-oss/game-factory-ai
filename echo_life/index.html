<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050b10"><link rel="manifest" href="manifest.webmanifest"><title>ECHO//LIFE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#173541,#07131a 38%,#020609 100%);color:#eafcff;font-family:system-ui,-apple-system,sans-serif;text-align:center;overflow-x:hidden}#game{max-width:620px;margin:auto;padding:12px 10px 32px}h1{font-size:clamp(34px,10vw,56px);letter-spacing:7px;margin:8px 0 2px;text-shadow:0 0 12px #5ee8ff,0 0 32px #126b82}.tag{letter-spacing:3px;font-size:10px;opacity:.6;margin-bottom:12px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stat,.panel{background:linear-gradient(145deg,#112d37ee,#071820ee);border:1px solid #2b5d69;border-radius:14px;box-shadow:0 12px 28px #0008,inset 0 1px #fff10}.stat{padding:7px 2px}.stat b{display:block;font-size:9px;letter-spacing:1px;opacity:.55}.panel{padding:12px;margin:9px 0}.location{font-size:11px;letter-spacing:3px;color:#7be8f4;margin:10px 0 5px}.world{position:relative;height:min(75vw,420px);min-height:305px;border-radius:18px;overflow:hidden;border:1px solid #3a6d77;background:#17292c;box-shadow:0 22px 50px #000b}.world:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 17%,#101a1d 17% 34%,transparent 34% 66%,#101a1d 66% 83%,transparent 83%),linear-gradient(0deg,transparent 0 18%,#10191c 18% 34%,transparent 34% 67%,#10191c 67% 83%,transparent 83%)}.building{position:absolute;border-radius:5px;background:linear-gradient(135deg,#344b4e,#192b2f);border:1px solid #526d70;box-shadow:6px 8px 0 #0005}.building:before{content:"";position:absolute;inset:12%;background:repeating-linear-gradient(90deg,#79cbd133 0 8%,transparent 9% 22%)}.b1{left:2%;top:3%;width:29%;height:28%}.b2{right:2%;top:4%;width:31%;height:27%}.b3{left:2%;bottom:3%;width:30%;height:30%}.b4{right:2%;bottom:3%;width:31%;height:30%}.park{position:absolute;left:36%;top:37%;width:28%;height:27%;background:#183a32;border:1px solid #2f5b4c;border-radius:8px}.car{position:absolute;width:27px;height:13px;border-radius:5px;background:#71898d;border:1px solid #a1b7ba;box-shadow:2px 3px 3px #0009}.c1{left:42%;top:17%;transform:rotate(90deg)}.c2{right:19%;top:47%}.c3{left:17%;bottom:18%}.human{position:absolute;width:22px;height:34px;z-index:8;transition:left .22s,top .22s;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 3px #0009)}.human .head{position:absolute;left:6px;top:0;width:10px;height:10px;border-radius:50%;background:#c9a37d}.human .body{position:absolute;left:4px;top:9px;width:14px;height:16px;border-radius:6px 6px 3px 3px;background:#36b6ca}.human .body:before,.human .body:after{content:"";position:absolute;top:14px;width:5px;height:13px;background:#26383e;border-radius:3px}.human .body:before{left:1px;transform:rotate(8deg)}.human .body:after{right:1px;transform:rotate(-8deg)}.human .arm{position:absolute;top:11px;width:5px;height:15px;background:#c9a37d;border-radius:4px}.human .a1{left:0;transform:rotate(16deg)}.human .a2{right:0;transform:rotate(-16deg)}#avatar{filter:drop-shadow(0 0 8px #5defff)}#echo{filter:drop-shadow(0 0 10px #ff4965);animation:flicker .7s infinite}#echo .head{background:#ff9aaa}#echo .body{background:#9d1931}#echo:after{content:"ECHO";position:absolute;top:34px;left:50%;transform:translateX(-50%);font-size:7px;color:#ff91a2;letter-spacing:1px}.lootDrop{position:absolute;z-index:5;font-size:19px;filter:drop-shadow(0 0 6px #ffe778);animation:bob 1.4s ease-in-out infinite}.rain{position:absolute;inset:-20%;pointer-events:none;z-index:9;background:repeating-linear-gradient(110deg,transparent 0 17px,#bdeeff2a 18px 19px,transparent 20px 38px);animation:rain .6s linear infinite}.fog{position:absolute;inset:0;pointer-events:none;z-index:7;background:radial-gradient(circle at 50% 50%,transparent 0 35%,#b8e4e510 65%,#02090c66 100%)}@keyframes rain{to{transform:translate(-18px,38px)}}@keyframes flicker{50%{opacity:.5;transform:translate(-50%,-50%) translateX(2px)}}@keyframes bob{50%{transform:translateY(-5px)}}#story{min-height:62px;display:flex;align-items:center;justify-content:center;line-height:1.4}.dpad{width:185px;margin:10px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.dpad .blank{visibility:hidden}button{background:linear-gradient(180deg,#23788a,#124c59);color:#fff;border:1px solid #45a4b7;border-radius:11px;padding:11px 13px;margin:3px;font-weight:700;box-shadow:0 6px 13px #0007;touch-action:manipulation}.dpad button{margin:0;font-size:20px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.actions button{margin:0;font-size:11px;padding:11px 3px}.hidden{display:none!important}.small{font-size:12px;opacity:.7}.collapse{background:radial-gradient(circle at 50% 0,#35151e,#0e080b 45%,#010203)}.collapse h1{text-shadow:0 0 12px #ff4f68}.collapse .world{filter:saturate(.45) brightness(.68)}.interior{position:absolute;inset:5%;z-index:20;border-radius:15px;background:linear-gradient(145deg,#202c2e,#0d1518);border:1px solid #71868a;box-shadow:0 0 0 100vmax #000b;padding:20px 14px;text-align:left}.room{height:62%;border:2px solid #53666a;background:linear-gradient(90deg,#293537 49%,#1b2628 50%);position:relative;margin-bottom:12px}.shelf{position:absolute;width:50%;height:13px;background:#765f45;border:2px solid #443525}.s1{left:8%;top:18%}.s2{right:8%;top:48%}.door{position:absolute;bottom:0;left:42%;width:16%;height:25%;background:#493b31}.insideLoot{position:absolute;left:67%;top:20%;font-size:28px}.confront{border-color:#8f3040;box-shadow:0 0 25px #8f203066}.signal{font-size:44px;filter:drop-shadow(0 0 12px #65eaff)}#bag{font-size:12px;line-height:1.6}@media(max-width:390px){.world{min-height:292px}}</style></head><body><div id="game"><h1>ECHO//LIFE</h1><div class="tag">THE CITY REMEMBERS</div><div id="start" class="panel"><div class="signal">◉</div><p><b>72 HOURS UNTIL THE UNKNOWN</b></p><p class="small">Prepare. Choose. Survive. Face what you were.</p><div id="echoIntro"></div><button onclick="newLife()">BEGIN NEW LIFE</button></div><div id="play" class="hidden"><div class="hud"><div class="stat"><b>TIME</b><span id="time"></span></div><div class="stat"><b>HEALTH</b><span id="hp"></span></div><div class="stat"><b>ENERGY</b><span id="energy"></span></div><div class="stat"><b>CASH</b><span id="cash"></span></div></div><div id="location" class="location"></div><div id="story" class="panel"></div><div class="world" id="world"><div class="building b1"></div><div class="building b2"></div><div class="building b3"></div><div class="building b4"></div><div class="park"></div><i class="car c1"></i><i class="car c2"></i><i class="car c3"></i><span class="lootDrop" style="left:52%;top:42%">🎒</span><span class="lootDrop" style="left:76%;top:76%">📦</span><div id="echo" class="human hidden"><i class="head"></i><i class="body"></i><i class="arm a1"></i><i class="arm a2"></i></div><div id="avatar" class="human"><i class="head"></i><i class="body"></i><i class="arm a1"></i><i class="arm a2"></i></div><div class="fog"></div><div class="rain"></div><div id="interior" class="interior hidden"><b id="roomName">INTERIOR</b><div class="room"><i class="shelf s1"></i><i class="shelf s2"></i><i class="door"></i><span class="insideLoot">📦</span></div><button onclick="lootInterior()">SEARCH ROOM</button><button onclick="leaveInterior()">LEAVE</button></div></div><div class="dpad"><span class="blank"></span><button onclick="move(0,-1)">▲</button><span class="blank"></span><button onclick="move(-1,0)">◀</button><button onclick="encounter()">◎</button><button onclick="move(1,0)">▶</button><span class="blank"></span><button onclick="move(0,1)">▼</button><span class="blank"></span></div><div class="panel"><b>BACKPACK</b><div id="bag">— EMPTY —</div></div><div class="actions"><button onclick="scavenge()">SEARCH</button><button onclick="enterBuilding()">ENTER</button><button onclick="encounter()">OBSERVE</button><button onclick="rest()">REST</button></div><div id="choices" class="panel hidden"></div></div></div><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');let s;const loot=['💧 Water','🔋 Battery','🥫 Food','🔦 Flashlight','🧵 Wire','🩹 Bandage','📻 Radio','🔧 Multi-tool'];const places=['Apartments','Market District','Clinic','Garage Row','West Alley','Memorial Park','Warehouse Block','Diner','Substation','Pharmacy'];const events=[{text:'A stranger is forcing open a pharmacy door.',opts:[['Help them','empathy'],['Stop them','aggression'],['Demand a cut','greed'],['Watch quietly','curiosity']]},{text:'A woman asks for water for her child.',opts:[['Give water','empathy'],['Sell it','greed'],['Refuse','courage'],['Ask what she knows','curiosity']]},{text:'You find an emergency supply crate.',opts:[['Leave it','empathy'],['Take it','greed'],['Hide it','deception'],['Find its owner','curiosity']]}];function previous(){try{return JSON.parse(localStorage.getItem('echoLifeEcho'))}catch(e){return null}}function intro(){let e=previous();echoIntro.innerHTML=e?'<p class="small">⚠ ECHO DETECTED · '+e.type+' · '+e.items+' ITEMS</p>':'<p class="small">NO PREVIOUS ECHO DETECTED</p>'}intro();function newLife(){let e=previous();s={hours:72,hp:100,energy:100,cash:40,x:2,y:2,ex:e?4:-1,ey:e?4:-1,bag:[],collapsed:false,inside:false,traits:{empathy:0,aggression:0,greed:0,courage:0,deception:0,curiosity:0}};start.classList.add('hidden');play.classList.remove('hidden');echo.classList.toggle('hidden',!e);say(e?'Your Echo is somewhere in the rain. It remembers being you.':'Rain begins. Your phone loses signal.');render()}function say(t){story.textContent=t}function tick(n){s.hours=Math.max(0,s.hours-n);s.energy=Math.max(0,s.energy-n*2);if(s.hours===0&&!s.collapsed){s.collapsed=true;saveEcho();document.body.classList.add('collapse');say('BLACKOUT. The city goes silent.')}}function place(){return places[(s.x+s.y*5)%places.length]}function move(dx,dy){if(s.inside)return say('Leave the building first.');s.x=Math.max(0,Math.min(4,s.x+dx));s.y=Math.max(0,Math.min(4,s.y+dy));tick(.25);moveEcho();if(s.x===s.ex&&s.y===s.ey)return echoEncounter();say('You move through '+place()+'.');render()}function moveEcho(){if(s.ex<0)return;if(Math.random()<.7){if(s.ex<s.x)s.ex++;else if(s.ex>s.x)s.ex--;else if(s.ey<s.y)s.ey++;else if(s.ey>s.y)s.ey--}}function echoEncounter(){let e=previous();choices.classList.remove('hidden');choices.classList.add('confront');choices.innerHTML='<b>YOUR ECHO: '+e.type+'</b><p>It blocks the road carrying fragments of your previous life.</p><button onclick="echoChoice(\'fight\')">FIGHT</button><button onclick="echoChoice(\'talk\')">TALK</button><button onclick="echoChoice(\'trade\')">OFFER TRADE</button><button onclick="echoChoice(\'run\')">RUN</button>';say('You are face to face with yourself.');render()}function echoChoice(c){let e=previous();if(c==='fight'){s.hp-=15;s.traits.aggression+=2;say('You clash with your Echo. It retreats, but you are wounded.')}if(c==='talk'){s.traits.empathy+=2;s.energy+=5;say('It repeats something you once believed. For a moment, it remembers being human.')}if(c==='trade'){s.cash=Math.max(0,s.cash-10);if(e.bag&&e.bag.length&&s.bag.length<8)s.bag.push(e.bag[0]);s.traits.deception++;say('The Echo accepts $10 and returns one object from your previous life.')}if(c==='run'){s.energy=Math.max(0,s.energy-15);s.traits.courage++;say('You escape through an alley. It will find you again.')}s.ex=0;s.ey=0;choices.classList.add('hidden');choices.classList.remove('confront');render()}function enterBuilding(){s.inside=true;roomName.textContent=place().toUpperCase();interior.classList.remove('hidden');tick(.5);say('You step inside '+place()+'. Rain drums against the windows.');render()}function leaveInterior(){s.inside=false;interior.classList.add('hidden');say('You return to the street.');render()}function lootInterior(){if(s.bag.length>=8)return say('Your backpack is full.');let item=loot[Math.floor(Math.random()*loot.length)];s.bag.push(item);s.traits.curiosity++;tick(1);say('Inside '+place()+' you find '+item+'.');render()}function scavenge(){if(s.bag.length>=8)return say('Your backpack is full.');tick(1);let item=loot[Math.floor(Math.random()*loot.length)];s.bag.push(item);s.traits.curiosity++;moveEcho();say('You recover '+item+'.');render()}function encounter(){tick(.5);let e=events[Math.floor(Math.random()*events.length)];choices.classList.remove('hidden');choices.innerHTML='<b>'+e.text+'</b><br>'+e.opts.map(o=>'<button onclick="choose(\''+o[1]+'\',\''+o[0].replace(/'/g,'')+'\')">'+o[0]+'</button>').join('');render()}function choose(t,l){s.traits[t]++;if(t==='greed')s.cash+=20;say(l+'. The city remembers.');choices.classList.add('hidden');render()}function rest(){tick(2);s.energy=Math.min(100,s.energy+30);moveEcho();say('You rest. Footsteps pass somewhere outside.');render()}function saveEcho(){let a=Object.entries(s.traits).sort((x,y)=>y[1]-x[1]),type=(a[0]&&a[0][1]>0?a[0][0]:'unknown').toUpperCase();localStorage.setItem('echoLifeEcho',JSON.stringify({type,hours:(72-s.hours).toFixed(1),items:s.bag.length,traits:s.traits,bag:s.bag}))}function pos(el,x,y){el.style.left=(10+x*20)+'%';el.style.top=(10+y*20)+'%'}function render(){time.textContent=s.hours.toFixed(1)+'h';hp.textContent=s.hp;energy.textContent=Math.round(s.energy);cash.textContent='$'+s.cash;location.textContent=place();bag.textContent=s.bag.length?s.bag.join(' • '):'— EMPTY —';pos(avatar,s.x,s.y);if(s.ex>=0)pos(echo,s.ex,s.ey)}</script></body></html>
