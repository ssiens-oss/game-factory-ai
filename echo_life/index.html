<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050b10"><link rel="manifest" href="manifest.webmanifest"><title>ECHO//LIFE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#173541,#07131a 38%,#020609 100%);color:#eafcff;font-family:system-ui,-apple-system,sans-serif;text-align:center;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#fff0 0 3px,#fff08 4px);opacity:.08}#game{max-width:620px;margin:auto;padding:14px 12px 34px}h1{font-size:clamp(34px,10vw,56px);letter-spacing:7px;margin:10px 0 2px;text-shadow:0 0 12px #5ee8ff,0 0 32px #126b82}.tag{letter-spacing:3px;font-size:10px;opacity:.6;margin-bottom:14px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat,.panel{background:linear-gradient(145deg,#112d37ee,#071820ee);border:1px solid #2b5d69;border-radius:14px;box-shadow:0 12px 28px #0008,inset 0 1px #fff10}.stat{padding:8px 2px}.stat b{display:block;font-size:9px;letter-spacing:1px;opacity:.55}.panel{padding:13px;margin:10px 0}.location{font-size:11px;letter-spacing:3px;color:#7be8f4;margin:11px 0 5px}.world{position:relative;height:min(74vw,410px);min-height:310px;border-radius:18px;overflow:hidden;border:1px solid #3a6d77;background:#182a2d;box-shadow:0 22px 50px #000b}.world:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 17%,#111b1d 17% 34%,transparent 34% 66%,#111b1d 66% 83%,transparent 83%),linear-gradient(0deg,transparent 0 18%,#10191c 18% 34%,transparent 34% 67%,#10191c 67% 83%,transparent 83%)}.world:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 48%,#e5c65d30 49% 50%,transparent 51% 100%);background-size:34% 100%;pointer-events:none}.building{position:absolute;border-radius:5px;background:linear-gradient(135deg,#32474a,#1b2c30);border:1px solid #50686c;box-shadow:6px 8px 0 #0005,inset 0 0 15px #0005}.building:before{content:"";position:absolute;inset:12%;background:repeating-linear-gradient(90deg,#79cbd133 0 8%,transparent 9% 22%)}.b1{left:2%;top:3%;width:29%;height:28%}.b2{right:2%;top:4%;width:31%;height:27%}.b3{left:2%;bottom:3%;width:30%;height:30%}.b4{right:2%;bottom:3%;width:31%;height:30%}.park{position:absolute;left:36%;top:37%;width:28%;height:27%;background:#183a32;border:1px solid #2f5b4c;border-radius:8px}.tree{position:absolute;font-size:20px;filter:drop-shadow(3px 4px 2px #0008)}.car{position:absolute;width:26px;height:13px;border-radius:5px;background:#6c8589;border:1px solid #9eb3b6;box-shadow:2px 3px 3px #0009}.c1{left:42%;top:17%;transform:rotate(90deg)}.c2{right:19%;top:47%}.c3{left:17%;bottom:18%}.player,.echo{position:absolute;width:28px;height:28px;border-radius:50%;z-index:8;transition:left .22s,top .22s;transform:translate(-50%,-50%)}.player{background:radial-gradient(circle,#fff 0 10%,#65f1ff 13% 30%,#087b91 34% 60%,transparent 63%);box-shadow:0 0 12px #6df4ff,0 0 28px #20b6cf}.player:after{content:"";position:absolute;inset:-9px;border:1px solid #70efff88;border-radius:50%;animation:ring 1.5s infinite}.echo{background:radial-gradient(circle,#fff 0 8%,#ff5570 13% 30%,#7d1227 34% 60%,transparent 63%);box-shadow:0 0 14px #ff4f68,0 0 32px #a3132b;animation:flicker .8s infinite}.echo:after{content:"ECHO";position:absolute;top:28px;left:50%;transform:translateX(-50%);font-size:8px;color:#ff9aaa;letter-spacing:1px}.rain{position:absolute;inset:-20%;pointer-events:none;z-index:9;background:repeating-linear-gradient(110deg,transparent 0 17px,#bdeeff2a 18px 19px,transparent 20px 38px);animation:rain .6s linear infinite}.fog{position:absolute;inset:0;pointer-events:none;z-index:7;background:radial-gradient(circle at 50% 50%,transparent 0 35%,#b8e4e510 65%,#02090c66 100%)}@keyframes rain{to{transform:translate(-18px,38px)}}@keyframes ring{to{transform:scale(1.5);opacity:0}}@keyframes flicker{50%{opacity:.55;filter:blur(.7px)}}#story{min-height:64px;display:flex;align-items:center;justify-content:center;line-height:1.4}.dpad{width:185px;margin:11px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.dpad .blank{visibility:hidden}button{background:linear-gradient(180deg,#23788a,#124c59);color:#fff;border:1px solid #45a4b7;border-radius:11px;padding:11px 13px;margin:3px;font-weight:700;box-shadow:0 6px 13px #0007;touch-action:manipulation}.dpad button{margin:0;font-size:20px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.actions button{margin:0;font-size:12px}.hidden{display:none!important}.small{font-size:12px;opacity:.7}.collapse{background:radial-gradient(circle at 50% 0,#35151e,#0e080b 45%,#010203)}.collapse h1{text-shadow:0 0 12px #ff4f68}.collapse .world{filter:saturate(.45) brightness(.68)}.collapse .building:before{opacity:0}.signal{font-size:45px;filter:drop-shadow(0 0 12px #65eaff)}#bag{font-size:12px;line-height:1.6}@media(max-width:390px){#game{padding-left:8px;padding-right:8px}.world{min-height:295px}}</style></head><body><div id="game"><h1>ECHO//LIFE</h1><div class="tag">THE CITY REMEMBERS</div><div id="start" class="panel"><div class="signal">◉</div><p><b>72 HOURS UNTIL THE UNKNOWN</b></p><p class="small">Prepare. Choose. Survive. Face what you were.</p><div id="echoIntro"></div><button onclick="newLife()">BEGIN NEW LIFE</button></div><div id="play" class="hidden"><div class="hud"><div class="stat"><b>TIME</b><span id="time"></span></div><div class="stat"><b>HEALTH</b><span id="hp"></span></div><div class="stat"><b>ENERGY</b><span id="energy"></span></div><div class="stat"><b>CASH</b><span id="cash"></span></div></div><div id="location" class="location"></div><div id="story" class="panel"></div><div class="world"><div class="building b1"></div><div class="building b2"></div><div class="building b3"></div><div class="building b4"></div><div class="park"></div><span class="tree" style="left:40%;top:40%">♣</span><span class="tree" style="left:55%;top:51%">♣</span><span class="tree" style="left:46%;top:57%">♣</span><i class="car c1"></i><i class="car c2"></i><i class="car c3"></i><div id="echo" class="echo hidden"></div><div id="avatar" class="player"></div><div class="fog"></div><div class="rain"></div></div><div class="dpad"><span class="blank"></span><button onclick="move(0,-1)">▲</button><span class="blank"></span><button onclick="move(-1,0)">◀</button><button onclick="encounter()">◎</button><button onclick="move(1,0)">▶</button><span class="blank"></span><button onclick="move(0,1)">▼</button><span class="blank"></span></div><div class="panel"><b>BACKPACK</b><div id="bag">— EMPTY —</div></div><div class="actions"><button onclick="scavenge()">SEARCH</button><button onclick="encounter()">OBSERVE</button><button onclick="rest()">REST</button></div><div id="choices" class="panel hidden"></div></div></div><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');let s;const loot=['💧 Water','🔋 Battery','🥫 Canned food','🔦 Flashlight','🧵 Wire','🩹 Bandage','📻 Old radio','🔧 Multi-tool'];const places=['Apartments','Market District','Clinic','Garage Row','West Alley','Memorial Park','Warehouse Block','Diner','Substation','Pharmacy'];const events=[{text:'A stranger is forcing open a pharmacy door.',opts:[['Help them','empathy'],['Stop them','aggression'],['Demand a cut','greed'],['Watch quietly','curiosity']]},{text:'A woman asks for water for her child.',opts:[['Give water','empathy'],['Sell it for $20','greed'],['Refuse','courage'],['Ask what she knows','curiosity']]},{text:'You find an unattended emergency supply crate.',opts:[['Leave it','empathy'],['Take it','greed'],['Hide it','deception'],['Find its owner','curiosity']]},{text:'Two men argue over the last generator.',opts:[['Calm them','empathy'],['Intimidate them','aggression'],['Offer a deal','deception'],['Walk away','courage']]}];function previous(){try{return JSON.parse(localStorage.getItem('echoLifeEcho'))}catch(e){return null}}function intro(){let e=previous();echoIntro.innerHTML=e?'<p class="small">⚠ ECHO DETECTED · '+e.type+' · '+e.items+' ITEMS</p>':'<p class="small">NO PREVIOUS ECHO DETECTED</p>'}intro();function newLife(){let e=previous();s={hours:72,hp:100,energy:100,cash:40,x:2,y:2,ex:e?4:-1,ey:e?4:-1,bag:[],collapsed:false,traits:{empathy:0,aggression:0,greed:0,courage:0,deception:0,curiosity:0}};start.classList.add('hidden');play.classList.remove('hidden');echo.classList.toggle('hidden',!e);say(e?'A red silhouette moves three blocks away. It knows your habits because they used to be its habits.':'Rain begins. Your phone loses signal. Every dog on the block starts barking.');render()}function say(t){story.textContent=t}function tick(n){s.hours=Math.max(0,s.hours-n);s.energy=Math.max(0,s.energy-n*2);if(s.hours===0&&!s.collapsed){s.collapsed=true;collapse()}}function collapse(){saveEcho();document.body.classList.add('collapse');say('BLACKOUT. Windows die one block at a time. The city goes silent.')}function place(){return places[(s.x+s.y*5)%places.length]}function move(dx,dy){s.x=Math.max(0,Math.min(4,s.x+dx));s.y=Math.max(0,Math.min(4,s.y+dy));tick(.25);moveEcho();if(s.x===s.ex&&s.y===s.ey)echoEncounter();else say('You move through '+place()+'.');render()}function moveEcho(){if(s.ex<0)return;if(Math.random()<.65){if(s.ex<s.x)s.ex++;else if(s.ex>s.x)s.ex--;else if(s.ey<s.y)s.ey++;else if(s.ey>s.y)s.ey--}}function echoEncounter(){let e=previous();say('YOUR ECHO FOUND YOU. Its dominant memory is '+e.type+'. It is carrying pieces of your previous life.');s.energy=Math.max(0,s.energy-10);s.ex=0;s.ey=0}function scavenge(){if(s.bag.length>=8)return say('Your backpack is full.');tick(1);let item=loot[Math.floor(Math.random()*loot.length)];s.bag.push(item);s.traits.curiosity++;moveEcho();say('You search '+place()+' and recover '+item+'.');render()}function encounter(){tick(.5);let e=events[Math.floor(Math.random()*events.length)];choices.classList.remove('hidden');choices.innerHTML='<b>'+e.text+'</b><br>'+e.opts.map(o=>'<button onclick="choose(\''+o[1]+'\',\''+o[0].replace(/'/g,'')+'\')">'+o[0]+'</button>').join('');render()}function choose(trait,label){s.traits[trait]++;if(trait==='greed')s.cash+=20;if(trait==='aggression')s.energy=Math.max(0,s.energy-5);say(label+'. The city remembers.');choices.classList.add('hidden');render()}function rest(){tick(2);s.energy=Math.min(100,s.energy+30);moveEcho();say('You rest. Something moves through the rain outside.');render()}function saveEcho(){let entries=Object.entries(s.traits).sort((a,b)=>b[1]-a[1]),type=(entries[0]&&entries[0][1]>0?entries[0][0]:'unknown').toUpperCase();localStorage.setItem('echoLifeEcho',JSON.stringify({type,hours:(72-s.hours).toFixed(1),items:s.bag.length,traits:s.traits,bag:s.bag}))}function pos(el,x,y){el.style.left=(10+x*20)+'%';el.style.top=(10+y*20)+'%'}function render(){time.textContent=s.hours.toFixed(1)+'h';hp.textContent=s.hp;energy.textContent=Math.round(s.energy);cash.textContent='$'+s.cash;location.textContent=place();bag.textContent=s.bag.length?s.bag.join(' • '):'— EMPTY —';pos(avatar,s.x,s.y);if(s.ex>=0)pos(echo,s.ex,s.ey);if(s.energy<=0){s.hp=Math.max(0,s.hp-2);say('Exhaustion is hurting you. Find somewhere safe to rest.')}}</script></body></html>
