><div>ZONE<br><b id=zone>NEON WARD</b></div></div><div id=msg>v33 · CITY ALIVE</div><div id=wrap><canvas id=c width=1440 height=810></canvas><div id=joy class=joy><div id=stick class=stick></div></div><button id=fire class=fire>FIRE</button></div><div class=buttons><button id=blast>BLAST</button><button id=loot>LOOT</button><button id=stealth>STEALTH</button><button id=swap>SWAP</button><button id=travel>TRAVEL</button><button id=use>SCAN</button></div></main><div id=title class=overlay><div class=card><h2>ECHO//LIFE</h2><p>THE TOMORROW SIGNAL · v33</p><p>Living city · missions · drones · weather</p><button id=newg>NEW GAME</button><button id=cont>CONTINUE</button></div></div><div id=modal class='overlay hidden'><div id=card class=card></div></div><script>(()=>{const $=x=>document.getElementById(x),C=$('c'),g=C.getContext('2d'),ZN=['NEON WARD','OLD QUARTER','IRONWORKS','RIVERLINE','THE BELOW','GLASS HEIGHTS'];let S,flash=0,muzzle=0;const fresh=()=>({x:13,y:11,hp:100,lvl:1,xp:0,ammo:30,cash:100,combo:0,gren:3,w:1,weapons:[['BAT',18,2],['REVOLVER',30,8],['SMG',21,10],['PULSE',40,12]],z:0,stealth:false,en:[],drops:[],shots:[],parts:[],smoke:[],shake:0,mission:0,goal:4,weather:0});const iso=(x,y,z=0)=>({x:720+(x-y)*36,y:80+(x+y)*18-z});function poly(a,c){g.fillStyle=c;g.beginPath();g.moveTo(a[0].x,a[0].y);a.slice(1).forEach(p=>g.lineTo(p.x,p.y));g.closePath();g.fill()}function tile(x,y,c){poly([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],c)}function road(x,y){tile(x,y,(x+y)%2?'#101c22':'#15242a');let p=iso(x+.5,y+.5);g.strokeStyle='#f0d66b55';g.setLineDash([12,15]);g.beginPath();if(x%7==6){g.moveTo(p.x-32,p.y-16);g.lineTo(p.x+32,p.y+16)}else{g.moveTo(p.x+32,p.y-16);g.lineTo(p.x-32,p.y+16)}g.stroke();g.setLineDash([]);let r=g.createLinearGradient(p.x,p.y-18,p.x,p.y+35);r.addColorStop(0,'#54eaff00');r.addColorStop(1,(x+y)%3?'#54eaff20':'#ff4d9b20');g.fillStyle=r;g.fillRect(p.x-28,p.y,56,27)}function building(x,y,w,h,z,style){let A=iso(x,y+h),B=iso(x+w,y+h),D=iso(x+w,y+h,z),E=iso(x,y+h,z),F=iso(x+w,y),Q=iso(x+w,y,z),T=iso(x,y,z),pal=[['#263b42','#14262d','#3d5961'],['#443730','#281f1b','#5b493e'],['#323c3c','#1d2829','#4b5754'],['#283847','#162430','#405a70']][style%4];poly([A,B,D,E],pal[0]);poly([F,B,D,Q],pal[1]);poly([T,Q,D,E],pal[2]);for(let r=0;r<7;r++)for(let i=0;i<w;i++){let p=iso(x+i+.5,y+h,z-17-r*17),on=(r+i+style)%4;g.fillStyle=on?(style%2?'#ffd17f':'#67e7f4'):'#061014';g.globalAlpha=on?.72:1;g.shadowColor=g.fillStyle;g.shadowBlur=on?14:0;g.fillRect(p.x-6,p.y-7,12,11)}g.globalAlpha=1;g.shadowBlur=0;let p=iso(x+w/2,y+h,z*.7),name=['ECHO','NOVA','GRID','VOID'][style%4];g.fillStyle='#061014';g.fillRect(p.x-35,p.y-12,70,20);g.strokeStyle=style%2?'#ff4e9b':'#56efff';g.shadowColor=g.strokeStyle;g.shadowBlur=16;g.strokeRect(p.x-35,p.y-12,70,20);g.fillStyle=g.strokeStyle;g.font='bold 10px system-ui';g.textAlign='center';g.fillText(name,p.x,p.y+2);g.shadowBlur=0}function lamp(x,y){let a=iso(x,y),b=iso(x,y,80);g.strokeStyle='#26383e';g.lineWidth=5;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();let R=g.createRadialGradient(b.x,b.y,2,b.x,b.y,100);R.addColorStop(0,'#fff7c5dd');R.addColorStop(.18,'#ffd86a55');R.addColorStop(1,'#ffd86a00');g.fillStyle=R;g.beginPath();g.arc(b.x,b.y,100,0,7);g.fill()}function car(x,y,i){let p=iso(x,y,6);g.save();g.translate(p.x,p.y);g.rotate(i%2?.45:-.45);g.fillStyle='#000c';g.beginPath();g.ellipse(0,13,38,10,0,0,7);g.fill();g.fillStyle=['#873a50','#346b89','#8a693d','#39725c'][i%4];g.beginPath();g.roundRect(-33,-15,66,25,8);g.fill();g.fillStyle='#8bddec88';g.beginPath();g.roundRect(-17,-27,36,18,6);g.fill();g.fillStyle='#050708';g.beginPath();g.arc(-21,10,7,0,7);g.arc(21,10,7,0,7);g.fill();g.fillStyle='#fff0a0';g.fillRect(-34,-8,5,7);g.restore()}function drone(i){let t=performance.now()/1200,p=iso(8+(i*7)%17+Math.sin(t+i)*2,5+(i*4)%10,125+Math.sin(t*2+i)*12);g.shadowColor='#4ff';g.shadowBlur=18;g.fillStyle='#243b43';g.beginPath();g.ellipse(p.x,p.y,16,6,0,0,7);g.fill();g.fillStyle='#64f4ff';g.fillRect(p.x-3,p.y-2,6,3);g.shadowBlur=0}function person(x,y,c,big=1,enemy=false){let p=iso(x,y,5),t=performance.now(),w=Math.sin(t/120+x)*4;g.save();g.translate(p.x,p.y);g.scale(big,big);g.fillStyle='#000d';g.beginPath();g.ellipse(0,7,23,7,0,0,7);g.fill();g.strokeStyle='#11191d';g.lineWidth=8;g.lineCap='round';g.beginPath();g.moveTo(-6,-12);g.lineTo(-9+w,-1);g.moveTo(6,-12);g.lineTo(9-w,-1);g.stroke();g.fillStyle='#15252a';g.beginPath();g.roundRect(-14,-42,28,33,7);g.fill();g.fillStyle=c;g.beginPath();g.roundRect(-15,-40,30,24,7);g.fill();g.fillStyle='#10191d';g.fillRect(-14,-27,28,6);g.strokeStyle='#c99a76';g.lineWidth=6;g.beginPath();g.moveTo(-12,-34);g.lineTo(-20,-18);g.moveTo(12,-34);g.lineTo(20,-18);g.stroke();g.fillStyle='#c99a76';g.beginPath();g.arc(0,-54,10,0,7);g.fill();g.fillStyle=enemy?'#17191b':'#282025';g.beginPath();g.arc(0,-58,10,Math.PI,6.2);g.fill();g.fillStyle='#111';g.fillRect(-6,-54,3,2);g.fillRect(3,-54,3,2);g.strokeStyle='#28343a';g.lineWidth=5;g.beginPath();g.moveTo(11,-30);g.lineTo(34,-24);g.stroke();g.fillStyle='#405157';g.fillRect(27,-28,13,6);if(!enemy&&muzzle>0){g.shadowColor='#ffd55f';g.shadowBlur=30;g.fillStyle='#fff1a0';g.beginPath();g.moveTo(39,-25);g.lineTo(55,-32);g.lineTo(48,-22);g.lineTo(56,-15);g.closePath();g.fill();g.shadowBlur=0}g.restore()}function spawn(){S.en=[];for(let i=0;i<8;i++){let h=52+S.lvl*8;S.en.push({x:17+i%4,y:7+(i*2)%12,hp:h,max:h,alert:false,boss:i==7&&S.lvl>2})}}function fx(x,y,c,n=20){let p=iso(x,y,28);for(let i=0;i<n;i++)S.parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*11,vy:(Math.random()-.5)*11,l:22,c})}function smoke(x,y,n=8){let p=iso(x,y,20);for(let i=0;i<n;i++)S.smoke.push({x:p.x+(Math.random()-.5)*25,y:p.y,vx:(Math.random()-.5)*2,vy:-1-Math.random()*2,l:50,r:8+Math.random()*12})}function draw(){requestAnimationFrame(draw);if(!S)return;if(muzzle)muzzle--;g.save();if(S.shake>1){g.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);S.shake*=.72}let sky=g.createLinearGradient(0,0,0,810);sky.addColorStop(0,['#123e50','#4a3238','#2d3c3a','#10485a','#20232f','#293f61'][S.z]);sky.addColorStop(.55,'#071319');sky.addColorStop(1,'#010306');g.fillStyle=sky;g.fillRect(0,0,1440,810);g.fillStyle='#071319';for(let i=0;i<25;i++){let h=100+(i%6)*32;g.fillRect(i*62,180-h*.35,45,h)}for(let x=0;x<27;x++)for(let y=0;y<21;y++)x%7==6||y%6==5?road(x,y):tile(x,y,(x+y)%2?'#263a3d':'#30464a');building(1,1,4,3,135,0);building(8,1,4,3,158,1);building(15,1,4,3,178,2);building(22,2,4,3,150,3);for(let i=0;i<10;i++){lamp(3+(i*5)%24,8+(i*4)%12);car(5+(i*6)%21,10+(i*5)%10,i)}for(let i=0;i<4;i++)drone(i);S.drops.forEach(d=>{let p=iso(d.x,d.y,14+Math.sin(performance.now()/150)*6);g.shadowColor='#65f5ff';g.shadowBlur=35;g.fillStyle='#bfffff';g.beginPath();g.moveTo(p.x,p.y-11);g.lineTo(p.x+10,p.y);g.lineTo(p.x,p.y+11);g.lineTo(p.x-10,p.y);g.fill();g.shadowBlur=0});S.en.filter(e=>e.hp>0).forEach(e=>{person(e.x,e.y,e.boss?'#ee3158':'#a73a50',e.boss?1.55:1,true);let p=iso(e.x,e.y,e.boss?98:75),w=e.boss?78:50;g.fillStyle='#18070a';g.fillRect(p.x-w/2,p.y,w,7);g.fillStyle=e.boss?'#ff3158':'#65e390';g.fillRect(p.x-w/2,p.y,w*Math.max(0,e.hp/e.max),7)});person(S.x,S.y,S.stealth?'#7a775e':'#2094af');S.shots=S.shots.filter(a=>a.l-->0);S.shots.forEach(a=>{g.shadowColor='#ffe37a';g.shadowBlur=25;g.strokeStyle='#fff2a2';g.lineWidth=4;g.beginPath();g.moveTo(a.a.x,a.a.y);g.lineTo(a.b.x,a.b.y);g.stroke();g.shadowBlur=0});S.parts=S.parts.filter(p=>p.l-->0);S.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;g.globalAlpha=p.l/22;g.fillStyle=p.c;g.fillRect(p.x,p.y,5,5)});g.globalAlpha=1;S.smoke=S.smoke.filter(p=>p.l-->0);S.smoke.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.15;g.globalAlpha=.2*p.l/50;g.fillStyle='#aab5b8';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()});g.globalAlpha=1;if(S.weather!==2){g.strokeStyle='#dff8ff44';for(let i=0;i<150;i++){let x=(i*97+performance.now()*.4)%1500,y=(i*59+performance.now()*.9)%850;g.beginPath();g.moveTo(x,y);g.lineTo(x-11,y+30);g.stroke()}}if(S.weather===1){g.fillStyle='#d7e9ff22';for(let i=0;i<100;i++){let x=(i*83+performance.now()*.08)%1440,y=(i*41+performance.now()*.18)%810;g.beginPath();g.arc(x,y,2,0,7);g.fill()}}if(flash){g.fillStyle='#ff24402c';g.fillRect(0,0,1440,810);flash--}let v=g.createRadialGradient(720,400,280,720,400,850);v.addColorStop(0,'#0000');v.addColorStop(1,'#000e');g.fillStyle=v;g.fillRect(0,0,1440,810);g.restore()}const dist=e=>Math.abs(S.x-e.x)+Math.abs(S.y-e.y),near=r=>S.en.filter(e=>e.hp>0).sort((a,b)=>dist(a)-dist(b)).find(e=>dist(e)<=r);function turn(){S.en.filter(e=>e.hp>0).forEach(e=>{let d=dist(e);if(d<=(S.stealth?3:8))e.alert=true;if(!e.alert)return;if(d<=1){S.hp-=Math.max(3,e.boss?15:8);flash=6}else Math.abs(S.x-e.x)>Math.abs(S.y-e.y)?e.x+=Math.sign(S.x-e.x):e.y+=Math.sign(S.y-e.y)});if(S.hp<=0){S.hp=100;S.cash=Math.max(0,S.cash-25);S.combo=0;S.x=13;S.y=11;spawn();msg('RESPAWNED')}}function move(dx,dy){S.x=Math.max(0,Math.min(26,S.x+dx));S.y=Math.max(0,Math.min(20,S.y+dy));turn();ui()}function attack(){let w=S.weapons[S.w],e=near(w[2]);if(!e)return msg('NO TARGET');if(S.w&&S.ammo<1)return msg('OUT OF AMMO');if(S.w)S.ammo--;muzzle=5;S.shots.push({a:iso(S.x,S.y,30),b:iso(e.x,e.y,30),l:5});e.hp-=w[1];S.shake=7;fx(e.x,e.y,'#ffb35c');smoke(e.x,e.y,3);if(e.hp<=0){S.cash+=e.boss?120:20;S.xp+=e.boss?70:25;S.combo++;S.mission++;S.drops.push({x:e.x,y:e.y});fx(e.x,e.y,'#ffd15c',35);if(S.mission>=S.goal){S.cash+=100;S.mission=0;S.goal++;msg('CONTRACT COMPLETE · +100 CREDITS')}if(S.xp>=100){S.xp-=100;S.lvl++;S.hp=100}}turn();ui()}function blast(){if(!S.gren)return msg('NO GRENADES');S.gren--;S.shake=22;S.en.forEach(e=>{if(e.hp>0&&dist(e)<=5){e.hp-=70;fx(e.x,e.y,'#ff9b42',45);smoke(e.x,e.y,12);if(e.hp<=0){S.drops.push({x:e.x,y:e.y});S.cash+=20;S.combo++;S.mission++}}});ui()}function loot(){let i=S.drops.findIndex(d=>Math.abs(d.x-S.x)+Math.abs(d.y-S.y)<=2);if(i<0)return msg('NO LOOT NEARBY');S.drops.splice(i,1);S.cash+=15;S.ammo+=5;msg('LOOT +15 · AMMO +5');ui()}function msg(t){$('msg').textContent=t}function ui(){if(!S)return;$('hp').textContent=Math.max(0,S.hp);$('lvl').textContent=S.lvl;$('ammo').textContent=S.ammo;$('cash').textContent=S.cash;$('combo').textContent=S.combo;$('zone').textContent=ZN[S.z];if(!$('msg').textContent.includes('COMPLETE'))$('msg').textContent='CONTRACT '+S.mission+'/'+S.goal+' · '+['RAIN','ASH','CLEAR'][S.weather]+' · '+S.weapons[S.w][0];localStorage.setItem('echo33',JSON.stringify(S))}function show(h){$('card').innerHTML=h+'<button id=close>CLOSE</button>';$('modal').classList.remove('hidden');$('close').onclick=()=>$('modal').classList.add('hidden')}function travel(){show('<h2>TRAVEL</h2>'+ZN.map((z,i)=>'<button data-z='+i+'>'+z+'</button>').join(''));document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{S.z=+b.dataset.z;S.weather=(S.z+Math.floor(Math.random()*3))%3;S.x=13;S.y=11;spawn();$('modal').classList.add('hidden');ui()})}function start(load){S=load?JSON.parse(localStorage.getItem('echo33')||'null'):null;if(!S)S=fresh();spawn();$('title').classList.add('hidden');ui()}$('newg').onclick=()=>start(false);$('cont').onclick=()=>start(true);$('fire').onclick=attack;$('blast').onclick=blast;$('loot').onclick=loot;$('stealth').onclick=()=>{S.stealth=!S.stealth;ui()};$('swap').onclick=()=>{S.w=(S.w+1)%S.weapons.length;msg('EQUIPPED '+S.weapons[S.w][0]);ui()};$('travel').onclick=travel;$('use').onclick=()=>msg('SCAN · CONTRACT '+S.mission+'/'+S.goal+' · HOSTILES '+S.en.filter(e=>e.hp>0).length);document.addEventListener('keydown',e=>{if(!S)return;let k=e.key.toLowerCase();if(k=='w'||e.key=='ArrowUp')move(0,-1);if(k=='s'||e.key=='ArrowDown')move(0,1);if(k=='a'||e.key=='ArrowLeft')move(-1,0);if(k=='d'||e.key=='ArrowRight')move(1,0);if(e.key==' ')attack()});let active=false,cx=0,cy=0,last=0;$('joy').onpointerdown=e=>{active=true;$('joy').setPointerCapture(e.pointerId);let r=$('joy').getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2};$('joy').onpointermove=e=>{if(!active||!S)return;let dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy)||1,L=30;if(mag>L){dx=dx/mag*L;dy=dy/mag*L}$('stick').style.transform=`translate(${dx}px,${dy}px)`;if(Date.now()-last>105&&Math.hypot(dx,dy)>12){last=Date.now();Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy))}};let end=()=>{active=false;$('stick').style.transform=''};$('joy').onpointerup=end;$('joy').onpointercancel=end;draw()})();</script></body></html>
