<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>ECHO//LIFE FPS v37</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307;color:#eff;font-family:system-ui}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:4;top:max(7px,env(safe-area-inset-top));left:max(9px,env(safe-area-inset-left));right:max(9px,env(safe-area-inset-right));display:flex;gap:5px;pointer-events:none}.p{background:#041017d9;border:1px solid #61eaff55;border-radius:8px;padding:5px 9px;box-shadow:0 8px 25px #000a}.brand{font-weight:900;letter-spacing:4px}.stat{font-size:9px;text-align:center;min-width:60px}.stat b{display:block;font-size:14px}.obj{margin-left:auto;font-size:10px}.cross{position:fixed;z-index:5;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:'';position:absolute;background:#dfffff;box-shadow:0 0 8px #4ef}.cross:before{width:2px;height:30px;left:14px}.cross:after{height:2px;width:30px;top:14px}.gun{position:fixed;z-index:3;left:50%;bottom:-8px;transform:translateX(-50%);width:230px;height:190px;pointer-events:none}.hand{position:absolute;bottom:0;width:78px;height:112px;background:linear-gradient(110deg,#b77f62,#7c4e3b);border-radius:40px 35px 8px 8px}.hl{left:20px;transform:rotate(17deg)}.hr{right:20px;transform:rotate(-17deg)}.weapon{position:absolute;left:66px;top:15px;width:100px;height:150px;background:linear-gradient(90deg,#15272d,#52666b 40%,#17282e 70%,#0b1418);clip-path:polygon(30% 0,70% 0,80% 58%,100% 67%,90% 78%,65% 70%,61% 100%,37% 100%,33% 69%,8% 78%,0 67%,22% 57%);filter:drop-shadow(0 8px 9px #000)}.muzzle{position:absolute;left:82px;top:-50px;width:70px;height:70px;background:radial-gradient(circle,#fff9b7 0 10%,#ffb133 25%,#ff572266 45%,#0000 70%);display:none}.joy{position:fixed;z-index:7;left:max(20px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:112px;height:112px;border:2px solid #6ef3ff66;border-radius:50%;background:#06161bbb;touch-action:none}.stick{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,white,#5bdbe8 40%,#153c46)}.look{position:fixed;z-index:6;inset:70px 0 0 38%;touch-action:none}.fire{position:fixed;z-index:8;right:max(22px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;border:1px solid #ffc0cb;color:white;font-weight:900;background:radial-gradient(circle at 35% 30%,#ffe1da,#dc3a58 48%,#500d1c);box-shadow:0 0 34px #ff45665c}.reload{position:fixed;z-index:8;right:120px;bottom:32px;width:58px;height:58px;border-radius:50%;border:1px solid #8ef2ff77;color:white;font-weight:800;background:#12323b}.msg{position:fixed;z-index:5;top:60px;left:50%;transform:translateX(-50%);padding:5px 13px;background:#02080bcc;border:1px solid #6df3ff55;border-radius:20px;font-size:10px}.overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#102934ee,#010305fa 70%)}.card{width:min(540px,90vw);padding:28px;text-align:center;background:#07151be8;border:1px solid #61dbea66;border-radius:18px}.card h1{letter-spacing:9px;text-shadow:0 0 25px #4ef}.card button{width:100%;padding:12px;background:#143b47;border:1px solid #58cfe0;color:white;border-radius:8px;font-weight:800}.hidden{display:none}</style></head><body><canvas id=c width=1600 height=900></canvas><div class=hud><div class='p brand'>ECHO//LIFE FPS</div><div class='p stat'>HP<b id=hp>100</b></div><div class='p stat'>AMMO<b id=ammo>12/72</b></div><div class='p stat'>KILLS<b id=kills>0</b></div><div class='p obj'>SIGNAL PURGE <b id=obj>0/8</b></div></div><div id=msg class=msg>v37 · FIRST PERSON PROTOCOL</div><div class=cross></div><div class=gun><div id=muzzle class=muzzle></div><div class='hand hl'></div><div class='hand hr'></div><div class=weapon></div></div><div id=joy class=joy><div id=stick class=stick></div></div><div id=look class=look></div><button id=reload class=reload>R</button><button id=fire class=fire>FIRE</button><div id=title class=overlay><div class=card><h1>ECHO//LIFE</h1><h2>FIRST PERSON PROTOCOL</h2><p>Move with left thumb · drag right side to aim · FIRE</p><button id=start>ENTER NEON WARD</button></div></div><script>(()=>{const $=s=>document.getElementById(s),C=$('c'),g=C.getContext('2d');let P={x:0,z:0,a:0,hp:100,mag:12,res:72,kills:0,obj:0,goal:8},E=[],shots=[],shake=0;function spawn(){E=[];for(let i=0;i<10;i++){let ang=Math.random()*6.28,d=6+Math.random()*14;E.push({x:Math.cos(ang)*d,z:Math.sin(ang)*d,hp:60})}}spawn();function proj(wx,wz){let dx=wx-P.x,dz=wz-P.z,ca=Math.cos(P.a),sa=Math.sin(P.a),rx=dx*ca-dz*sa,rz=dx*sa+dz*ca;if(rz<.3)return null;return{x:800+rx/rz*720,y:450+120/rz,s:260/rz,d:rz}}function draw(){requestAnimationFrame(draw);g.save();if(shake){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.7}let sky=g.createLinearGradient(0,0,0,900);sky.addColorStop(0,'#12394b');sky.addColorStop(.48,'#07151d');sky.addColorStop(.5,'#17252a');sky.addColorStop(1,'#020406');g.fillStyle=sky;g.fillRect(0,0,1600,900);for(let i=-18;i<19;i++){let off=((i*150-P.a*650)%1600+1600)%1600;let h=150+(i*i%5)*55;g.fillStyle=i%2?'#0a1c24':'#102832';g.fillRect(off,450-h,105,h);g.fillStyle=i%3?'#57eaff55':'#ff4d9c44';for(let y=465-h;y<430;y+=25)for(let xx=off+12;xx<off+95;xx+=22)g.fillRect(xx,y,8,11)}let grad=g.createLinearGradient(0,450,0,900);grad.addColorStop(0,'#17272c');grad.addColorStop(1,'#030507');g.fillStyle=grad;g.fillRect(0,450,1600,450);g.strokeStyle='#56eaff24';for(let i=1;i<18;i++){let y=450+450*(1-1/(1+i*.22));g.beginPath();g.moveTo(0,y);g.lineTo(1600,y);g.stroke()}for(let i=-12;i<=12;i++){g.beginPath();g.moveTo(800,450);g.lineTo(800+i*150,900);g.stroke()}let visible=E.filter(e=>e.hp>0).map(e=>({e,p:proj(e.x,e.z)})).filter(q=>q.p).sort((a,b)=>b.p.d-a.p.d);visible.forEach(({e,p})=>{let s=Math.min(240,p.s),y=520-s*.65;g.fillStyle='#0008';g.beginPath();g.ellipse(p.x,y+s*.95,s*.35,s*.09,0,0,7);g.fill();g.fillStyle='#9e304b';g.fillRect(p.x-s*.22,y,s*.44,s*.62);g.fillStyle='#c38d6d';g.beginPath();g.arc(p.x,y-s*.12,s*.15,0,7);g.fill();g.fillStyle='#15191c';g.fillRect(p.x-s*.12,y-s*.22,s*.24,s*.08);g.strokeStyle='#283c43';g.lineWidth=Math.max(3,s*.07);g.beginPath();g.moveTo(p.x+s*.18,y+s*.2);g.lineTo(p.x+s*.48,y+s*.27);g.stroke();g.fillStyle='#e93c59';g.fillRect(p.x-s*.25,y-s*.38,s*.5,5);g.fillStyle='#63e690';g.fillRect(p.x-s*.25,y-s*.38,s*.5*(e.hp/60),5)});g.strokeStyle='#dff8ff40';for(let i=0;i<130;i++){let x=(i*107+performance.now()*.3)%1700,y=(i*67+performance.now()*.8)%950;g.beginPath();g.moveTo(x,y);g.lineTo(x-10,y+28);g.stroke()}g.restore()}function ui(){$('hp').textContent=P.hp;$('ammo').textContent=P.mag+'/'+P.res;$('kills').textContent=P.kills;$('obj').textContent=P.obj+'/'+P.goal}function fire(){if(P.mag<=0)return $('msg').textContent='RELOAD';P.mag--;$('muzzle').style.display='block';setTimeout(()=>$('muzzle').style.display='none',55);shake=8;navigator.vibrate?.(18);let best=null,score=999;E.forEach(e=>{if(e.hp<=0)return;let p=proj(e.x,e.z);if(!p)return;let d=Math.abs(p.x-800)+Math.abs(p.y-450)*.4;if(d<score&&d<Math.max(70,p.s*.45)){score=d;best=e}});if(best){best.hp-=35;$('msg').textContent='HIT';if(best.hp<=0){P.kills++;P.obj++;$('msg').textContent='SIGNAL DOWN';if(P.obj>=P.goal){P.obj=0;P.goal+=2;P.res+=24;spawn();$('msg').textContent='SECTOR CLEARED · +24 AMMO'}}}ui()}function reload(){if(P.mag>=12||P.res<=0)return;let n=Math.min(12-P.mag,P.res);P.mag+=n;P.res-=n;$('msg').textContent='RELOADED';ui()}$('fire').onclick=fire;$('reload').onclick=reload;$('start').onclick=()=>{$('title').classList.add('hidden');ui()};let ja=false,jx=0,jy=0,last=0;$('joy').onpointerdown=e=>{ja=true;$('joy').setPointerCapture(e.pointerId);let r=$('joy').getBoundingClientRect();jx=r.left+r.width/2;jy=r.top+r.height/2};$('joy').onpointermove=e=>{if(!ja)return;let dx=e.clientX-jx,dy=e.clientY-jy,m=Math.hypot(dx,dy)||1,L=33;if(m>L){dx=dx/m*L;dy=dy/m*L}$('stick').style.transform=`translate(${dx}px,${dy}px)`;if(Date.now()-last>20){last=Date.now();let f=-dy/L*.16,side=dx/L*.13;P.x+=Math.cos(P.a)*side+Math.sin(P.a)*f;P.z+=-Math.sin(P.a)*side+Math.cos(P.a)*f}};let je=()=>{ja=false;$('stick').style.transform=''};$('joy').onpointerup=je;$('joy').onpointercancel=je;let la=false,lx=0;$('look').onpointerdown=e=>{la=true;lx=e.clientX;$('look').setPointerCapture(e.pointerId)};$('look').onpointermove=e=>{if(!la)return;let dx=e.clientX-lx;lx=e.clientX;P.a+=dx*.005};$('look').onpointerup=()=>la=false;$('look').onpointercancel=()=>la=false;document.addEventListener('keydown',e=>{if(e.key===' ')fire();if(e.key.toLowerCase()==='r')reload();if(e.key==='ArrowLeft')P.a-=.08;if(e.key==='ArrowRight')P.a+=.08;if(e.key==='ArrowUp'){P.x+=Math.sin(P.a)*.2;P.z+=Math.cos(P.a)*.2}});draw();ui()})();</script></body></html>
