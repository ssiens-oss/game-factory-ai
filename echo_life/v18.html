<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v18</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#13242b,#010304 70%);color:#eaffff;font-family:system-ui;text-align:center}main{max-width:900px;margin:auto;padding:6px}h1{margin:2px;letter-spacing:8px;text-shadow:0 0 10px #75efff,0 0 32px #148ca3}.hud{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.hud div,.panel{background:linear-gradient(#0d2831ee,#07171dee);border:1px solid #376b76;border-radius:9px;padding:6px;font-size:10px;box-shadow:inset 0 1px #fff1}canvas{width:100%;aspect-ratio:16/10;border:1px solid #528995;border-radius:14px;background:#071015;touch-action:none;box-shadow:0 25px 70px #000}.pad{width:180px;margin:5px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.pad i{visibility:hidden}button{border:1px solid #4ea7b6;background:linear-gradient(#23798a,#0d4350);color:#fff;border-radius:8px;padding:9px;font-weight:800}.actions,.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.actions button,.tabs button{font-size:9px;padding:9px 1px}.tabs{margin-top:3px}.good{color:#8fffc5}.danger{color:#ff7187}.gold{color:#ffe279}.modal{position:fixed;inset:0;background:#010407ed;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.card{width:min(520px,100%);max-height:82vh;overflow:auto;background:#0b1d24;border:1px solid #43808c;border-radius:15px;padding:15px;text-align:left}.card button{width:100%;margin:3px}.hidden{display:none}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>EN<br><b id="en">100</b></div><div>LVL<br><b id="lvl">1</b></div><div>AMMO<br><b id="ammo">12</b></div><div>$<br><b id="cash">30</b></div><div>COMBO<br><b id="combo">x1</b></div><div>ZONE<br><b id="zone">DOWNTOWN</b></div></div><div id="story" class="panel">v18: combat and visual overhaul online.</div><canvas id="view" width="960" height="600"></canvas><div class="pad"><i></i><button onpointerdown="mv(0,-1)">▲</button><i></i><button onpointerdown="mv(-1,0)">◀</button><button onclick="act()">◎</button><button onpointerdown="mv(1,0)">▶</button><i></i><button onpointerdown="mv(0,1)">▼</button><i></i></div><div class="actions"><button onclick="melee()">MELEE</button><button onclick="shoot()">SHOOT</button><button onclick="dodge()">DODGE</button><button onclick="cover()">COVER</button><button onclick="loot()">LOOT</button></div><div class="tabs"><button onclick="map()">MAP</button><button onclick="gear()">GEAR</button><button onclick="companion()">MARA</button><button onclick="upgrade()">UPGRADE</button><button onclick="mission()">MISSION</button></div><div id="status" class="panel"></div></main><div id="modal" class="modal hidden"><div id="card" class="card"></div></div><script>const C=view,g=C.getContext('2d'),W=70,H=35,O=480;let s=JSON.parse(localStorage.getItem('echo18')||'null')||{x:8,y:8,hp:100,en:100,lvl:1,xp:0,cash:30,ammo:12,dmg:12,gun:24,armor:1,zone:'DOWNTOWN',weather:'RAIN',cover:false,dodging:false,combo:1,kills:0,bag:['Scrap','Medkit'],comp:true,compHP:80,compDmg:10,enemies:[],boss:false,bossHP:220,mission:0,up:{melee:0,gun:0,armor:0},particles:[],shots:[],shake:0,flash:0};const zones={DOWNTOWN:['MARKET','CLINIC','TOWER'],INDUSTRIAL:['GARAGE','FACTORY','POWER'],RIVERSIDE:['DOCKS','MOTEL','RADIO'],UNDERGROUND:['SUBWAY','LAB','VAULT']};function iso(a,b,z=0){return{x:O+(a-b)*W/2,y:78+(a+b)*H/2-z}}function poly(p,f,st='#0007'){g.beginPath();g.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>g.lineTo(q.x,q.y));g.closePath();g.fillStyle=f;g.fill();g.strokeStyle=st;g.stroke()}function tile(a,b,f){poly([iso(a,b),iso(a+1,b),iso(a+1,b+1),iso(a,b+1)],f,'#ffffff08')}function shadow(a,b,r=18){let q=iso(a,b);g.fillStyle='#0008';g.beginPath();g.ellipse(q.x,q.y+7,r,r/3,0,0,7);g.fill()}function human(a,b,col='#248aa0',big=1,aim=false){let q=iso(a,b,6),t=performance.now()/120,w=Math.sin(t+a+b)*4;shadow(a,b,18*big);g.save();g.translate(q.x,q.y);g.shadowColor=col;g.shadowBlur=big>1?24:8;g.strokeStyle='#14242a';g.lineWidth=5*big;g.beginPath();g.moveTo(-4*big,-8*big);g.lineTo((-7+w/2)*big,10*big);g.moveTo(4*big,-8*big);g.lineTo((7-w/2)*big,10*big);g.stroke();g.fillStyle=col;g.beginPath();g.roundRect(-10*big,-34*big,20*big,27*big,5);g.fill();g.fillStyle='#c99b78';g.beginPath();g.arc(0,-42*big,8*big,0,7);g.fill();if(aim){g.strokeStyle='#a7c9ce';g.lineWidth=4;g.beginPath();g.moveTo(6,-27);g.lineTo(23,-24);g.stroke()}g.restore()}function building(a,b,w,h,z,n,col,glow){let d=iso(a,b+h),e=iso(a+w,b+h),t=iso(a,b,z),u=iso(a+w,b,z),v=iso(a,b+h,z),q=iso(a+w,b+h,z);poly([d,e,q,v],'#20343a');poly([iso(a+w,b),e,q,u],'#17282e');poly([t,u,q,v],col);for(let yy=.25;yy<.8;yy+=.25)for(let xx=.7;xx<w;xx+=1.2){let p=iso(a+xx,b+h,z*yy);g.fillStyle=Math.random()>.08?'#9cecff38':'#111';g.fillRect(p.x-6,p.y-8,12,15)}let m=iso(a+w/2,b+h,z*.72);g.save();g.shadowColor=glow;g.shadowBlur=18;g.fillStyle=glow;g.font='bold 13px system-ui';g.textAlign='center';g.fillText(n,m.x,m.y);g.restore()}function car(a,b,col){let q=iso(a,b,5);shadow(a,b,28);g.fillStyle=col;g.beginPath();g.roundRect(q.x-27,q.y-12,54,18,5);g.fill();g.fillStyle='#8db8bf';g.fillRect(q.x-11,q.y-20,25,9)}function lamp(a,b){let q=iso(a,b);g.strokeStyle='#1b2a2d';g.lineWidth=4;g.beginPath();g.moveTo(q.x,q.y);g.lineTo(q.x,q.y-65);g.stroke();let z=g.createRadialGradient(q.x,q.y-65,2,q.x,q.y-65,55);z.addColorStop(0,'#d8fbffaa');z.addColorStop(1,'#7eeaff00');g.fillStyle=z;g.beginPath();g.arc(q.x,q.y-65,55,0,7);g.fill()}function world(){let base={DOWNTOWN:'#223a3b',INDUSTRIAL:'#393b35',RIVERSIDE:'#203d39',UNDERGROUND:'#20232b'}[s.zone];for(let a=0;a<21;a++)for(let b=0;b<17;b++)tile(a,b,(a%6===5||b%5===4)?'#151e22':base);let n=zones[s.zone];building(1,1,4,3,105,n[0],base,'#69eaff');building(8,1,4,3,135,n[1],base,'#ffe071');building(15,2,4,3,115,n[2],base,'#ff7288');[[6,6,'#6d4542'],[12,5,'#3d5f6b'],[5,12,'#6a6845'],[17,10,'#4e485f']].forEach(v=>car(...v));[[6,4],[12,4],[6,10],[18,6]].forEach(v=>lamp(...v));s.enemies.forEach(e=>{if(e.hp>0)human(e.x,e.y,e.boss?'#c5143a':'#8d3540',e.boss?1.6:1,e.ranged)});if(s.comp&&s.compHP>0)human(s.x-1,s.y+1,'#50b977',1,true);human(s.x,s.y,'#258fa3',1,true)}function particles(){s.particles=s.particles.filter(p=>p.life-->0);s.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;g.globalAlpha=p.life/20;g.fillStyle=p.col;g.fillRect(p.x,p.y,3,3)});g.globalAlpha=1;s.shots=s.shots.filter(p=>p.life-->0);s.shots.forEach(p=>{g.strokeStyle=p.col;g.lineWidth=2;g.beginPath();g.moveTo(p.x1,p.y1);g.lineTo(p.x2,p.y2);g.stroke()})}function fx(a,b,col,n=15){let q=iso(a,b,25);for(let i=0;i<n;i++)s.particles.push({x:q.x,y:q.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,col,life:10+Math.random()*12})}function line(a,b,c,d,col){let p=iso(a,b,25),q=iso(c,d,25);s.shots.push({x1:p.x,y1:p.y,x2:q.x,y2:q.y,col,life:4})}function draw(){g.clearRect(0,0,960,600);g.save();if(s.shake){g.translate((Math.random()-.5)*s.shake,(Math.random()-.5)*s.shake);s.shake*=.75;if(s.shake<.3)s.shake=0}let sky=g.createLinearGradient(0,0,0,600);sky.addColorStop(0,s.zone==='UNDERGROUND'?'#08090d':'#14262d');sky.addColorStop(1,'#020608');g.fillStyle=sky;g.fillRect(-20,-20,1000,640);world();if(s.weather!=='CLEAR'&&s.zone!=='UNDERGROUND'){g.strokeStyle=s.weather==='STORM'?'#dff9ff99':'#c9f2ff42';for(let i=0;i<(s.weather==='STORM'?150:80);i++){let rx=(i*79+performance.now()/6)%1000,ry=(i*43+performance.now()/2.5)%650;g.beginPath();g.moveTo(rx,ry);g.lineTo(rx-8,ry+22);g.stroke()}}particles();let v=g.createRadialGradient(480,300,180,480,300,520);v.addColorStop(0,'#0000');v.addColorStop(1,'#000c');g.fillStyle=v;g.fillRect(0,0,960,600);if(s.flash){g.fillStyle='#ffffff33';g.fillRect(0,0,960,600);s.flash--}g.restore();requestAnimationFrame(draw)}function spawn(){s.enemies=[];let count=2+Math.min(3,Math.floor(s.kills/4));for(let i=0;i<count;i++)s.enemies.push({x:13+i%3,y:7+i,hp:35+s.lvl*8,type:i%3===2?'Gunner':'Stalker',ranged:i%3===2,boss:false});if(s.mission>=3&&!s.boss){s.enemies.push({x:16,y:5,hp:s.bossHP,type:'Signal Beast',ranged:true,boss:true});s.boss=true}}function nearest(r){return s.enemies.filter(e=>e.hp>0).sort((a,b)=>Math.abs(s.x-a.x)+Math.abs(s.y-a.y)-Math.abs(s.x-b.x)-Math.abs(s.y-b.y)).find(e=>Math.abs(s.x-e.x)+Math.abs(s.y-e.y)<=r)}function mv(dx,dy){s.x=Math.max(0,Math.min(20,s.x+dx));s.y=Math.max(0,Math.min(16,s.y+dy));s.en=Math.max(0,s.en-1);s.cover=false;enemyTurn();compTurn();ui()}function melee(){let e=nearest(2);if(!e)return msg('No enemy in melee range.');let d=s.dmg+s.up.melee*4;e.hp-=d;s.combo=Math.min(5,s.combo+1);fx(e.x,e.y,'#ff657c',18);s.shake=5;msg('Melee '+d+' damage · combo x'+s.combo);dead(e);enemyTurn();compTurn();ui()}function shoot(){if(!s.ammo)return msg('Out of ammo.');let e=nearest(8);if(!e)return msg('No target in range.');s.ammo--;let d=(s.gun+s.up.gun*5)*s.combo;e.hp-=d;line(s.x,s.y,e.x,e.y,'#ffe48a');fx(e.x,e.y,'#ffe48a',10);s.flash=2;s.shake=3;msg('Shot '+d+' damage.');dead(e);enemyTurn();compTurn();ui()}function dodge(){if(s.en<8)return msg('Too exhausted to dodge.');s.en-=8;s.dodging=true;s.cover=false;msg('DODGE READY — next attack heavily reduced.');ui()}function cover(){s.cover=true;s.dodging=false;msg('Behind cover — ranged damage reduced.');ui()}function dead(e){if(e.hp<=0){s.kills++;s.cash+=e.boss?150:15;s.xp+=e.boss?150:25;fx(e.x,e.y,e.boss?'#ff1748':'#ff7288',30);if(e.boss){s.bossHP=0;s.bag.push('Signal Core');s.mission=4;msg('<span class="gold">SIGNAL BEAST DESTROYED · SIGNAL CORE ACQUIRED</span>')}while(s.xp>=100){s.xp-=100;s.lvl++;s.hp=100}}}function enemyTurn(){s.enemies.filter(e=>e.hp>0).forEach(e=>{let dx=s.x-e.x,dy=s.y-e.y,d=Math.abs(dx)+Math.abs(dy);if(e.ranged&&d<=6){let hit=s.dodging?2:Math.max(3,11-s.armor-(s.cover?6:0));s.hp-=hit;line(e.x,e.y,s.x,s.y,'#ff4c68');fx(s.x,s.y,'#ff4c68',8);s.shake=4}else if(d<=1){let hit=s.dodging?2:Math.max(3,(e.boss?18:9)-s.armor);s.hp-=hit;s.shake=6}else{if(Math.abs(dx)>Math.abs(dy))e.x+=Math.sign(dx);else e.y+=Math.sign(dy)}});s.dodging=false;s.combo=1}function compTurn(){if(!s.comp||s.compHP<=0)return;let e=nearest(7);if(e){e.hp-=s.compDmg;line(s.x-1,s.y+1,e.x,e.y,'#83ffad');fx(e.x,e.y,'#83ffad',6);dead(e)}}function loot(){let dead=s.enemies.every(e=>e.hp<=0);if(!dead)return msg('Clear nearby enemies first.');let pool=['Ammo','Medkit','Scrap','Armor Plate','Weapon Parts'],it=pool[Math.floor(Math.random()*pool.length)];if(it==='Ammo')s.ammo+=6;else if(it==='Armor Plate')s.armor++;else s.bag.push(it);msg('<span class="gold">Loot: '+it+'</span>');spawn();ui()}function act(){if(!s.enemies.length)spawn();if(s.zone==='RIVERSIDE'&&s.x>14&&s.y<7&&s.mission<1){s.mission=1;s.weather='STORM';msg('<span class="danger">RADIO ARRAY ACTIVATED. Something answered.</span>')}else if(s.zone==='INDUSTRIAL'&&s.x>14&&s.y<7&&s.mission===1){s.mission=2;s.bag.push('Signal Decoder');msg('<span class="good">SIGNAL DECODER RECOVERED.</span>')}else if(s.zone==='UNDERGROUND'&&s.x>14&&s.y<7&&s.mission===2){s.mission=3;spawn();msg('<span class="danger">THE SIGNAL BEAST HAS ENTERED THE CITY.</span>')}else msg('No objective at this location.');ui()}function map(){show('<h2>CITY MAP</h2>'+Object.keys(zones).map(z=>'<button onclick="go(\''+z+'\')">'+z+' · '+zones[z].join(' / ')+'</button>').join(''))}function go(z){s.zone=z;s.x=8;s.y=8;s.weather=Math.random()<.3?'STORM':Math.random()<.6?'RAIN':'CLEAR';spawn();closeM();msg('Entered '+z+'.');ui()}function gear(){show('<h2>GEAR</h2><p>Melee '+s.dmg+' · Firearm '+s.gun+' · Ammo '+s.ammo+' · Armor '+s.armor+'</p><p>'+(s.bag.join(' · ')||'Empty')+'</p><button onclick="heal()">Use Medkit</button>')}function heal(){let i=s.bag.indexOf('Medkit');if(i<0)return alert('No Medkit');s.bag.splice(i,1);s.hp=Math.min(100,s.hp+55);closeM();ui()}function companion(){show('<h2>MARA</h2><p>HP '+s.compHP+' · Cover-fire damage '+s.compDmg+'</p><button onclick="maraUp()">Upgrade Mara ($50)</button>')}function maraUp(){if(s.cash<50)return alert('Need $50');s.cash-=50;s.compDmg+=5;s.compHP=Math.min(100,s.compHP+20);closeM();ui()}function upgrade(){show('<h2>WORKBENCH</h2><button onclick="up(\'melee\')">Melee '+s.up.melee+' → +4 DMG ($40)</button><button onclick="up(\'gun\')">Gun '+s.up.gun+' → +5 DMG ($50)</button><button onclick="up(\'armor\')">Armor '+s.up.armor+' → +1 armor ($45)</button>')}function up(k){let cost=k==='gun'?50:k==='armor'?45:40;if(s.cash<cost)return alert('Need $'+cost);s.cash-=cost;s.up[k]++;if(k==='armor')s.armor++;closeM();ui()}function mission(){show('<h2>SIGNAL HUNT</h2><p>'+(s.mission>0?'✓':'○')+' Activate Riverside Radio</p><p>'+(s.mission>1?'✓':'○')+' Recover Industrial Decoder</p><p>'+(s.mission>2?'✓':'○')+' Trace signal Underground</p><p>'+(s.mission>3?'✓':'○')+' Destroy Signal Beast</p><p>Kills '+s.kills+' · Level '+s.lvl+'</p>')}function msg(t){story.innerHTML=t}function show(h){card.innerHTML=h+'<button onclick="closeM()">CLOSE</button>';modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}function save(){localStorage.setItem('echo18',JSON.stringify(s))}function ui(){hp.textContent=Math.max(0,Math.round(s.hp));en.textContent=Math.round(s.en);lvl.textContent=s.lvl;ammo.textContent=s.ammo;cash.textContent=s.cash;combo.textContent='x'+s.combo;zone.textContent=s.zone;let alive=s.enemies.filter(e=>e.hp>0);status.textContent=s.weather+' · '+alive.length+' enemies · Melee '+(s.dmg+s.up.melee*4)+' · Gun '+(s.gun+s.up.gun*5)+' · Armor '+s.armor+' · Mara '+s.compHP+'HP · Mission '+s.mission+'/4';save()}spawn();ui();draw();</script></body></html>
