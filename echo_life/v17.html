<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ECHO//LIFE v17</title><style>*{box-sizing:border-box}body{margin:0;background:#020609;color:#eaffff;font-family:system-ui;text-align:center}main{max-width:860px;margin:auto;padding:6px}h1{margin:2px;letter-spacing:7px;text-shadow:0 0 14px #5eeaff}.hud{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.hud div,.panel{background:#0a2028e8;border:1px solid #376b76;border-radius:9px;padding:6px;font-size:10px}canvas{width:100%;aspect-ratio:16/10;border:1px solid #4d7e88;border-radius:14px;background:#071015;touch-action:none}.pad{width:180px;margin:5px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.pad i{visibility:hidden}button{border:1px solid #4ea7b6;background:linear-gradient(#23798a,#0d4350);color:#fff;border-radius:8px;padding:9px;font-weight:800}.actions,.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.actions button,.tabs button{font-size:9px;padding:9px 1px}.tabs{margin-top:3px}.good{color:#8fffc5}.danger{color:#ff7187}.gold{color:#ffe279}.modal{position:fixed;inset:0;background:#010407ed;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.card{width:min(500px,100%);max-height:82vh;overflow:auto;background:#0b1d24;border:1px solid #43808c;border-radius:15px;padding:15px;text-align:left}.card button{width:100%;margin:3px}.hidden{display:none}</style></head><body><main><h1>ECHO//LIFE</h1><div class="hud"><div>HP<br><b id="hp">100</b></div><div>EN<br><b id="en">100</b></div><div>LVL<br><b id="lvl">1</b></div><div>AMMO<br><b id="ammo">6</b></div><div>$<br><b id="cash">30</b></div><div>ROOM<br><b id="room">CITY</b></div><div>FACTION<br><b id="faction">NONE</b></div></div><div id="story" class="panel">v17: the Subway Vault is open.</div><canvas id="view" width="960" height="600"></canvas><div class="pad"><i></i><button onclick="mv(0,-1)">▲</button><i></i><button onclick="mv(-1,0)">◀</button><button onclick="act()">◎</button><button onclick="mv(1,0)">▶</button><i></i><button onclick="mv(0,1)">▼</button><i></i></div><div class="actions"><button onclick="melee()">MELEE</button><button onclick="shoot()">SHOOT</button><button onclick="loot()">LOOT</button><button onclick="act()">INTERACT</button><button onclick="nextRoom()">NEXT ROOM</button></div><div class="tabs"><button onclick="map()">MAP</button><button onclick="inventory()">GEAR</button><button onclick="companion()">COMPANION</button><button onclick="factions()">FACTIONS</button><button onclick="quests()">QUESTS</button></div><div id="status" class="panel"></div></main><div id="modal" class="modal hidden"><div id="card" class="card"></div></div><script>const C=view,g=C.getContext('2d'),W=72,H=36,O=480;let s=JSON.parse(localStorage.getItem('echo17')||'null')||{x:8,y:7,hp:100,en:100,lvl:1,xp:0,cash:30,ammo:6,weapon:'Pipe',gun:'Revolver',dmg:10,armor:0,zone:'DOWNTOWN',dungeon:false,room:0,rooms:[],enemies:[],bag:['Scrap','Wire'],comp:null,compHP:0,faction:null,rep:{Wardens:0,Drifters:0},territory:{DOWNTOWN:'Neutral',INDUSTRIAL:'Wardens',RIVERSIDE:'Drifters',UNDERGROUND:'Echo'},vaultKey:false,bossDead:false,choice:null};const zones=['DOWNTOWN','INDUSTRIAL','RIVERSIDE','UNDERGROUND'];function iso(a,b,z=0){return{x:O+(a-b)*W/2,y:82+(a+b)*H/2-z}}function poly(p,f){g.beginPath();g.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>g.lineTo(q.x,q.y));g.closePath();g.fillStyle=f;g.fill();g.strokeStyle='#0008';g.stroke()}function tile(a,b,f){poly([iso(a,b),iso(a+1,b),iso(a+1,b+1),iso(a,b+1)],f)}function human(a,b,col='#2c8da0',big=1){let q=iso(a,b,5);g.save();g.translate(q.x,q.y);g.shadowColor=col;g.shadowBlur=big>1?22:4;g.strokeStyle='#17262b';g.lineWidth=5*big;g.beginPath();g.moveTo(-4*big,-8*big);g.lineTo(-8*big,10*big);g.moveTo(4*big,-8*big);g.lineTo(8*big,10*big);g.stroke();g.fillStyle=col;g.fillRect(-9*big,-32*big,18*big,25*big);g.fillStyle='#c99b78';g.beginPath();g.arc(0,-40*big,8*big,0,7);g.fill();g.restore()}function city(){let colors={DOWNTOWN:'#263b3e',INDUSTRIAL:'#3b3a33',RIVERSIDE:'#25423c',UNDERGROUND:'#24252c'},z=colors[s.zone];for(let a=0;a<21;a++)for(let b=0;b<17;b++)tile(a,b,(a%6===5||b%5===4)?'#151d21':z);let names=s.zone==='UNDERGROUND'?['SUBWAY','MAINTENANCE','VAULT']:s.zone==='DOWNTOWN'?['MARKET','CLINIC','APARTMENTS']:s.zone==='INDUSTRIAL'?['GARAGE','WAREHOUSE','POWER']:['DOCKS','MOTEL','RADIO'];for(let i=0;i<3;i++){let a=1+i*7,b=1+(i==2?1:0),q=iso(a,b,80+i*15);g.fillStyle='#40545a';g.fillRect(q.x-55,q.y-65,110,65);g.fillStyle='#dffcff';g.fillText(names[i],q.x-35,q.y-72)}human(s.x,s.y);if(s.comp)human(s.x-1,s.y+1,'#55b873')}function dungeon(){for(let a=2;a<12;a++)for(let b=2;b<10;b++)tile(a,b,(a+b)%2?'#1c252a':'#11191d');let type=s.rooms[s.room]||'CORRIDOR';g.fillStyle='#eaffff';g.font='bold 18px system-ui';g.fillText('VAULT '+(s.room+1)+' · '+type,380,45);for(let i=0;i<4;i++){let q=iso(3+i*2,3,15);g.fillStyle=type==='LAB'?'#496f70':type==='ARMORY'?'#705942':'#41484d';g.fillRect(q.x-30,q.y-25,60,28)}human(s.x,s.y);if(s.comp)human(s.x-1,s.y+1,'#55b873');s.enemies.forEach(e=>{if(e.hp>0)human(e.x,e.y,e.boss?'#d20d3b':'#8e3540',e.boss?1.7:1);})}function draw(){g.clearRect(0,0,960,600);g.fillStyle='#061014';g.fillRect(0,0,960,600);s.dungeon?dungeon():city();requestAnimationFrame(draw)}function spawnRoom(){let count=s.room===5?1:1+Math.floor(Math.random()*3);s.enemies=[];for(let i=0;i<count;i++)s.enemies.push({x:7+i*2,y:4+i%2,hp:s.room===5?180:35+s.room*10,type:s.room===5?'Mirror Warden':['Raider','Echo','Stalker'][Math.floor(Math.random()*3)],boss:s.room===5});}function genDungeon(){let pool=['CORRIDOR','LAB','ARMORY','FLOODED','NEST'];s.rooms=Array.from({length:5},()=>pool[Math.floor(Math.random()*pool.length)]);s.rooms.push('MIRROR CHAMBER');s.room=0;s.dungeon=true;s.x=4;s.y=7;spawnRoom();}function mv(dx,dy){s.x=Math.max(2,Math.min(s.dungeon?11:20,s.x+dx));s.y=Math.max(2,Math.min(s.dungeon?9:16,s.y+dy));enemyTurn();save();ui()}function target(range){return s.enemies.filter(e=>e.hp>0).sort((a,b)=>(Math.abs(s.x-a.x)+Math.abs(s.y-a.y))-(Math.abs(s.x-b.x)+Math.abs(s.y-b.y))).find(e=>Math.abs(s.x-e.x)+Math.abs(s.y-e.y)<=range)}function melee(){let e=target(2);if(!e)return msg('No enemy in melee range.');let d=s.dmg+Math.floor(s.lvl/2);e.hp-=d;msg('You strike '+e.type+' for '+d+'.');resolve(e);enemyTurn();ui()}function shoot(){if(!s.ammo)return msg('Out of ammo.');let e=target(7);if(!e)return msg('No target in range.');s.ammo--;let d=22+Math.floor(s.lvl*1.5);e.hp-=d;msg('Revolver hits '+e.type+' for '+d+'.');resolve(e);enemyTurn();ui()}function resolve(e){if(e.hp<=0){s.cash+=e.boss?100:12;s.xp+=e.boss?120:25;if(e.boss){s.bossDead=true;s.bag.push('Mirror Core');msg('<span class="gold">MIRROR WARDEN DEFEATED · MIRROR CORE RECOVERED</span>')}while(s.xp>=100){s.xp-=100;s.lvl++;s.hp=100}}}function enemyTurn(){if(!s.dungeon)return;s.enemies.filter(e=>e.hp>0).forEach(e=>{let dx=s.x-e.x,dy=s.y-e.y,d=Math.abs(dx)+Math.abs(dy);if(d>1){if(Math.abs(dx)>Math.abs(dy))e.x+=Math.sign(dx);else e.y+=Math.sign(dy)}else{s.hp-=Math.max(2,(e.boss?16:8)-s.armor);if(s.comp&&s.compHP>0){s.compHP-=4;if(s.compHP<=0){msg('<span class="danger">Your companion is down.</span>');s.comp=null}}}})}function loot(){let dead=s.dungeon&&s.enemies.every(e=>e.hp<=0),items=['Ammo','Medical Kit','Scrap','Battery','Armor Plate'];if(s.dungeon&&!dead)return msg('Enemies still control the room.');let it=items[Math.floor(Math.random()*items.length)];if(it==='Ammo')s.ammo+=4;else if(it==='Armor Plate')s.armor++;else s.bag.push(it);msg('<span class="gold">Recovered '+it+'.</span>');ui()}function nextRoom(){if(!s.dungeon)return msg('Enter the Underground Vault first.');if(s.enemies.some(e=>e.hp>0))return msg('Clear the room first.');if(s.room>=5){if(!s.bossDead)return msg('The Mirror Warden blocks the exit.');return endingChoice()}s.room++;s.x=4;s.y=7;spawnRoom();msg('You push deeper into the Vault.');ui()}function act(){if(!s.dungeon&&s.zone==='UNDERGROUND'&&s.x>14&&s.y<7){if(!s.vaultKey){s.vaultKey=true;s.bag.push('Vault Key');return msg('<span class="gold">VAULT KEY FOUND.</span>')}genDungeon();msg('<span class="danger">THE SUBWAY VAULT OPENS.</span>');ui()}else if(!s.dungeon&&s.zone==='DOWNTOWN'&&s.x<7&&s.y<7&&!s.comp){show('<h2>SURVIVOR: MARA</h2><p>"I can shoot. You look like you need someone watching your back."</p><button onclick="recruit()">Recruit Mara</button><button onclick="closeM()">Leave</button>')}else msg('Nothing unusual here.')}function recruit(){s.comp='Mara';s.compHP=70;closeM();msg('<span class="good">MARA JOINED YOUR PARTY.</span>');ui()}function companion(){show('<h2>COMPANION</h2><p>'+(s.comp?s.comp+' · '+s.compHP+' HP · passive cover fire':'No companion. Find Mara near the Downtown Market.')+'</p>')}function factions(){show('<h2>FACTION TERRITORY</h2><p>Downtown: '+s.territory.DOWNTOWN+'</p><p>Industrial: '+s.territory.INDUSTRIAL+'</p><p>Riverside: '+s.territory.RIVERSIDE+'</p><button onclick="join(\'Wardens\')">Join Wardens</button><button onclick="join(\'Drifters\')">Join Drifters</button>')}function join(f){s.faction=f;s.rep[f]+=3;s.territory.DOWNTOWN=f;closeM();msg(f+' now controls your Downtown safe routes.');ui()}function map(){show('<h2>CITY MAP</h2>'+zones.map(z=>'<button onclick="go(\''+z+'\')">'+z+' · '+s.territory[z]+'</button>').join(''))}function go(z){s.zone=z;s.dungeon=false;s.x=8;s.y=7;closeM();msg('Travelled to '+z+'.');ui()}function inventory(){show('<h2>GEAR</h2><p>'+s.weapon+' · '+s.dmg+' melee DMG</p><p>'+s.gun+' · 22 ranged DMG · '+s.ammo+' ammo</p><p>Armor '+s.armor+'</p><p>'+(s.bag.join(' · ')||'Empty')+'</p>')}function quests(){show('<h2>QUESTS</h2><p>'+(s.comp?'✓':'○')+' Recruit a survivor</p><p>'+(s.vaultKey?'✓':'○')+' Recover Vault Key</p><p>'+(s.dungeon?'✓':'○')+' Enter Subway Vault</p><p>'+(s.bossDead?'✓':'○')+' Defeat Mirror Warden</p><p>'+(s.choice?'✓ Choose the fate of the Mirror Core':'○ Decide what to do with the Core')+'</p>')}function endingChoice(){show('<h2>THE MIRROR CORE</h2><p>The Core shows a version of the city one day in the future.</p><button onclick="end(\'DESTROY\')">Destroy it</button><button onclick="end(\'WARDENS\')">Give it to the Wardens</button><button onclick="end(\'DRIFTERS\')">Give it to the Drifters</button><button onclick="end(\'KEEP\')">Keep it</button>')}function end(v){s.choice=v;if(v==='WARDENS')s.rep.Wardens+=10;if(v==='DRIFTERS')s.rep.Drifters+=10;closeM();msg('<span class="gold">ENDING PATH LOCKED: '+v+'. The city will remember this.</span>');ui()}function msg(t){story.innerHTML=t}function show(h){card.innerHTML=h+'<button onclick="closeM()">CLOSE</button>';modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}function save(){localStorage.setItem('echo17',JSON.stringify(s))}function ui(){hp.textContent=Math.max(0,s.hp);en.textContent=s.en;lvl.textContent=s.lvl;ammo.textContent=s.ammo;cash.textContent=s.cash;room.textContent=s.dungeon?(s.room+1)+'/6':s.zone;faction.textContent=s.faction||'NONE';let alive=s.enemies.filter(e=>e.hp>0);status.textContent=(s.dungeon?'VAULT · '+(s.rooms[s.room]||'')+' · Enemies '+alive.length:'City territory · '+s.territory[s.zone])+' · '+s.weapon+' '+s.dmg+'DMG · '+s.gun+' · Armor '+s.armor+(s.comp?' · '+s.comp+' '+s.compHP+'HP':'');save()}ui();draw();</script></body></html>
