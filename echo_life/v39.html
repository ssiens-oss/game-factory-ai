<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>ECHO//LIFE TPS v39</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010307;color:#eff;font-family:system-ui}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:5;top:max(7px,env(safe-area-inset-top));left:max(9px,env(safe-area-inset-left));right:max(9px,env(safe-area-inset-right));display:flex;gap:5px;pointer-events:none}.p{background:#041017df;border:1px solid #62efff55;border-radius:8px;padding:5px 9px;box-shadow:0 8px 26px #000b;backdrop-filter:blur(7px)}.brand{font-weight:950;letter-spacing:4px}.stat{font-size:8px;text-align:center;min-width:58px}.stat b{display:block;font-size:14px}.obj{margin-left:auto;font-size:10px}.cross{position:fixed;z-index:6;left:61%;top:43%;width:34px;height:34px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:'';position:absolute;background:#eaffff;box-shadow:0 0 8px #4ef}.cross:before{left:16px;top:0;width:2px;height:34px}.cross:after{left:0;top:16px;width:34px;height:2px}.joy{position:fixed;z-index:8;left:max(20px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:112px;height:112px;border:2px solid #6ef3ff66;border-radius:50%;background:#06161bbb;touch-action:none}.stick{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,white,#5bdbe8 40%,#153c46)}.look{position:fixed;z-index:7;inset:65px 0 0 35%;touch-action:none}.fire{position:fixed;z-index:9;right:max(22px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;border:1px solid #ffc0cb;color:#fff;font-weight:900;background:radial-gradient(circle at 35% 30%,#ffe1da,#dc3a58 48%,#500d1c);box-shadow:0 0 34px #ff45665c}.reload{position:fixed;z-index:9;right:120px;bottom:30px;width:58px;height:58px;border-radius:50%;border:1px solid #8ef2ff77;color:#fff;background:#12323b;font-weight:800}.roll{position:fixed;z-index:9;right:92px;bottom:102px;width:54px;height:54px;border-radius:50%;border:1px solid #8ef2ff77;color:#fff;background:#173944;font-weight:800}.msg{position:fixed;z-index:6;top:60px;left:50%;transform:translateX(-50%);background:#02080bcc;border:1px solid #6df3ff55;border-radius:20px;padding:5px 14px;font-size:10px}.overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#102934ee,#010305fa 70%)}.card{width:min(540px,90vw);padding:28px;text-align:center;background:#07151be8;border:1px solid #61dbea66;border-radius:18px}.card h1{letter-spacing:9px;text-shadow:0 0 25px #4ef}.card button{width:100%;padding:12px;background:#143b47;border:1px solid #58cfe0;color:#fff;border-radius:8px;font-weight:800}</style></head><body><canvas id=c width=1920 height=1080></canvas><div class=hud><div class='p brand'>ECHO//LIFE TPS</div><div class='p stat'>HP<b id=hp>100</b></div><div class='p stat'>AMMO<b id=ammo>18/108</b></div><div class='p stat'>KILLS<b id=kills>0</b></div><div class='p obj'>NEON WARD <b id=obj>0/10</b></div></div><div id=msg class=msg>v39 · THIRD PERSON PROTOCOL</div><div class=cross></div><div id=joy class=joy><div id=stick class=stick></div></div><div id=look class=look></div><button id=roll class=roll>ROLL</button><button id=reload class=reload>R</button><button id=fire class=fire>FIRE</button><div id=title class=overlay><div class=card><h1>ECHO//LIFE</h1><h2>THIRD PERSON PROTOCOL</h2><p>Over-the-shoulder combat · drag right to aim</p><button id=start>DEPLOY</button></div></div><script>(()=>{const $=s=>document.getElementById(s),C=$('c'),g=C.getContext('2d');let P={x:0,z:0,a:0,hp:100,mag:18,res:108,kills:0,obj:0,goal:10},E=[],shake=0,muzzle=0,rolling=0;function spawn(){E=[];for(let i=0;i<13;i++){let a=Math.random()*6.28,d=7+Math.random()*17;E.push({x:Math.cos(a)*d,z:Math.sin(a)*d,hp:80})}}spawn();function proj(wx,wz){let dx=wx-P.x,dz=wz-P.z,ca=Math.cos(P.a),sa=Math.sin(P.a),rx=dx*ca-dz*sa,rz=dx*sa+dz*ca;if(rz<.4)return null;return{x:1080+rx/rz*820,y:515+155/rz,s:330/rz,d:rz}}function person(px,py,s,bad=false){g.save();g.translate(px,py);g.scale(s/180,s/180);g.fillStyle='#000b';g.beginPath();g.ellipse(0,145,56,14,0,0,7);g.fill();g.strokeStyle='#10191d';g.lineWidth=24;g.lineCap='round';g.beginPath();g.moveTo(-20,52);g.lineTo(-30,135);g.moveTo(20,52);g.lineTo(30,135);g.stroke();let body=g.createLinearGradient(-45,0,45,0);body.addColorStop(0,bad?'#47101d':'#103844');body.addColorStop(.5,bad?'#b93550':'#2a9ab0');body.addColorStop(1,bad?'#250910':'#0b2028');g.fillStyle=body;g.beginPath();g.roundRect(-48,-52,96,115,22);g.fill();g.fillStyle='#151d20';g.fillRect(-48,25,96,16);g.strokeStyle='#bd886a';g.lineWidth=19;g.beginPath();g.moveTo(36,-20);g.lineTo(75,15);g.stroke();g.fillStyle='#bd886a';g.beginPath();g.arc(0,-86,31,0,7);g.fill();g.fillStyle='#11171a';g.beginPath();g.arc(0,-96,32,Math.PI,6.2);g.fill();g.strokeStyle='#293c42';g.lineWidth=14;g.beginPath();g.moveTo(60,4);g.lineTo(128,17);g.stroke();g.fillStyle='#53676c';g.fillRect(105,8,45,17);if(bad){g.fillStyle='#ff334e';g.shadowColor='#ff334e';g.shadowBlur=12;g.fillRect(-14,-88,7,4);g.fillRect(8,-88,7,4);g.shadowBlur=0}else if(muzzle){g.fillStyle='#fff2a2';g.shadowColor='#ffb12f';g.shadowBlur=35;g.beginPath();g.moveTo(148,16);g.lineTo(190,-4);g.lineTo(172,17);g.lineTo(190,38);g.closePath();g.fill();g.shadowBlur=0}g.restore()}function enemy(e,p){let s=Math.min(280,p.s);person(p.x,590-s*.1,s,true);g.fillStyle='#19070b';g.fillRect(p.x-s*.3,420-s*.05,s*.6,6);g.fillStyle='#62e68f';g.fillRect(p.x-s*.3,420-s*.05,s*.6*(e.hp/80),6)}function draw(){requestAnimationFrame(draw);if(muzzle)muzzle--;if(rolling)rolling--;g.save();if(shake>.2){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.72}let sky=g.createLinearGradient(0,0,0,1080);sky.addColorStop(0,'#17465d');sky.addColorStop(.4,'#0a202b');sky.addColorStop(.52,'#071116');sky.addColorStop(1,'#010204');g.fillStyle=sky;g.fillRect(0,0,1920,1080);let moon=g.createRadialGradient(1500,160,3,1500,160,170);moon.addColorStop(0,'#eaffffcc');moon.addColorStop(.15,'#8eeaff33');moon.addColorStop(1,'#8eeaff00');g.fillStyle=moon;g.beginPath();g.arc(1500,160,170,0,7);g.fill();for(let i=-22;i<25;i++){let off=((i*150-P.a*760)%2100+2100)%2100-80,h=170+(Math.abs(i*91)%300),w=105+(i&1)*35;g.fillStyle=i%2?'#0b2029':'#102b35';g.fillRect(off,535-h,w,h);for(let yy=555-h;yy<510;yy+=30)for(let xx=off+14;xx<off+w-10;xx+=25){g.fillStyle=(xx+yy)%4?'#5cecff55':'#ff4c9b44';g.fillRect(xx,yy,9,13)}}let road=g.createLinearGradient(0,535,0,1080);road.addColorStop(0,'#1a2a2f');road.addColorStop(1,'#020305');g.fillStyle=road;g.fillRect(0,535,1920,545);g.strokeStyle='#61eaff22';for(let i=1;i<20;i++){let y=535+545*(1-1/(1+i*.2));g.beginPath();g.moveTo(0,y);g.lineTo(1920,y);g.stroke()}for(let i=-15;i<=15;i++){g.beginPath();g.moveTo(1080,535);g.lineTo(1080+i*175,1080);g.stroke()}g.strokeStyle='#efd96f66';g.lineWidth=7;g.setLineDash([52,44]);g.beginPath();g.moveTo(1080,600);g.lineTo(1080,1080);g.stroke();g.setLineDash([]);E.filter(e=>e.hp>0).map(e=>({e,p:proj(e.x,e.z)})).filter(q=>q.p).sort((a,b)=>b.p.d-a.p.d).forEach(q=>enemy(q.e,q.p));let bob=rolling?45:Math.sin(performance.now()/130)*3;person(710,800+bob,205,false);g.strokeStyle='#dff8ff40';g.lineWidth=2;for(let i=0;i<190;i++){let xx=(i*113+performance.now()*.4)%2050,yy=(i*71+performance.now())%1160;g.beginPath();g.moveTo(xx,yy);g.lineTo(xx-13,yy+34);g.stroke()}let fog=g.createLinearGradient(0,650,0,1080);fog.addColorStop(0,'#bdefff00');fog.addColorStop(1,'#bdefff17');g.fillStyle=fog;g.fillRect(0,0,1920,1080);let vig=g.createRadialGradient(960,520,420,960,520,1200);vig.addColorStop(0,'#0000');vig.addColorStop(1,'#000d');g.fillStyle=vig;g.fillRect(0,0,1920,1080);g.restore()}function ui(){$('hp').textContent=P.hp;$('ammo').textContent=P.mag+'/'+P.res;$('kills').textContent=P.kills;$('obj').textContent=P.obj+'/'+P.goal}function fire(){if(P.mag<=0)return $('msg').textContent='RELOAD';P.mag--;muzzle=5;shake=8;navigator.vibrate?.(20);let best=null,score=999;E.forEach(e=>{if(e.hp<=0)return;let p=proj(e.x,e.z);if(!p)return;let d=Math.abs(p.x-1171)+Math.abs(p.y-464)*.35;if(d<score&&d<Math.max(80,p.s*.5)){score=d;best=e}});if(best){best.hp-=42;$('msg').textContent='HIT';if(best.hp<=0){P.kills++;P.obj++;$('msg').textContent='HOSTILE DOWN';if(P.obj>=P.goal){P.obj=0;P.goal+=2;P.res+=36;spawn();$('msg').textContent='SECTOR CLEARED · +36 AMMO'}}}else $('msg').textContent='MISS';ui()}function reload(){if(P.mag>=18||P.res<=0)return;let n=Math.min(18-P.mag,P.res);P.mag+=n;P.res-=n;$('msg').textContent='RELOADED';ui()}$('fire').onclick=fire;$('reload').onclick=reload;$('roll').onclick=()=>{rolling=24;navigator.vibrate?.(25);$('msg').textContent='COMBAT ROLL'};$('start').onclick=()=>{$('title').style.display='none';ui()};let ja=false,jx=0,jy=0,last=0;$('joy').onpointerdown=e=>{ja=true;$('joy').setPointerCapture(e.pointerId);let r=$('joy').getBoundingClientRect();jx=r.left+r.width/2;jy=r.top+r.height/2};$('joy').onpointermove=e=>{if(!ja)return;let dx=e.clientX-jx,dy=e.clientY-jy,m=Math.hypot(dx,dy)||1,L=33;if(m>L){dx=dx/m*L;dy=dy/m*L}$('stick').style.transform=`translate(${dx}px,${dy}px)`;if(Date.now()-last>18){last=Date.now();let f=-dy/L*.18,s=dx/L*.14;P.x+=Math.cos(P.a)*s+Math.sin(P.a)*f;P.z+=-Math.sin(P.a)*s+Math.cos(P.a)*f}};let je=()=>{ja=false;$('stick').style.transform=''};$('joy').onpointerup=je;$('joy').onpointercancel=je;let la=false,lx=0;$('look').onpointerdown=e=>{la=true;lx=e.clientX;$('look').setPointerCapture(e.pointerId)};$('look').onpointermove=e=>{if(!la)return;let dx=e.clientX-lx;lx=e.clientX;P.a+=dx*.0045};$('look').onpointerup=()=>la=false;$('look').onpointercancel=()=>la=false;document.addEventListener('keydown',e=>{if(e.key===' ')fire();if(e.key.toLowerCase()==='r')reload();if(e.key==='ArrowLeft')P.a-=.08;if(e.key==='ArrowRight')P.a+=.08;if(e.key==='ArrowUp'){P.x+=Math.sin(P.a)*.2;P.z+=Math.cos(P.a)*.2}});draw();ui()})();</script></body></html>
