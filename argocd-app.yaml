apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: game-factory
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ssiens-oss/game-factory-ai
    targetRevision: main
    path: helm/game-factory
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
