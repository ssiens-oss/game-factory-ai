apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-api
  template:
    metadata:
      labels:
        app: game-api
    spec:
      containers:
      - name: api
        image: game-factory/api:latest
        ports:
        - containerPort: 8000
