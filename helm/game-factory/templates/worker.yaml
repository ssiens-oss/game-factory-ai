apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app: game-worker
  template:
    metadata:
      labels:
        app: game-worker
    spec:
      containers:
      - name: worker
        image: game-factory/worker:latest
        env:
        - name: REDIS_URL
          value: redis://redis:6379
