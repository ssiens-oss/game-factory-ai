<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>NEON SUDOKU v4</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#1d4860,#081321 42%,#02050b 80%);color:#eefcff;font-family:system-ui;display:flex;justify-content:center}.app{width:min(97vw,650px);padding:10px}.top{display:flex;align-items:center}.title{font-weight:950;letter-spacing:4px;font-size:20px;text-shadow:0 0 18px #4ef}.stats{margin-left:auto;text-align:right;font-size:11px}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;border:3px solid #8cf5ff;border-radius:9px;overflow:hidden;box-shadow:0 0 38px #32dfff44;background:#07121b}.cell{position:relative;border:1px solid #24434e;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,34px);font-weight:900;color:#62eaff;background:#091722;transition:.12s}.cell:nth-child(3n){border-right:3px solid #6a919c}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #6a919c}.cell.given{color:#fff;background:#0d1e29}.cell.peer{background:#123342}.cell.same{background:#087a91!important;color:#fff!important;box-shadow:inset 0 0 0 2px #7effff,inset 0 0 24px #00eaff,0 0 12px #00dfff88;z-index:2;text-shadow:0 0 10px #fff;transform:scale(.94);border-color:#aaffff}.cell.selected{background:#ffd84a!important;color:#061016!important;box-shadow:inset 0 0 0 3px #fff4a0,0 0 24px #ffd84aaa!important;z-index:3;transform:scale(.91);text-shadow:none}.cell.error{background:#65192a!important;color:#ffb2bf!important}.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);font-size:9px;color:#9ab7bf}.notes span{display:flex;align-items:center;justify-content:center}.notes span.matchnote{background:#0b8da6;color:#fff;border-radius:50%;font-weight:900}.progress{height:5px;background:#071015;border-radius:5px;margin:8px 0;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#42e5ff,#78ffd0)}.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:10px}.pad button,.actions button{border:1px solid #477787;background:linear-gradient(#17313d,#09171f);color:#fff;border-radius:9px;min-height:47px;font-weight:900}.pad button{font-size:20px}.pad button.numberactive{background:#ffd84a!important;color:#061016;box-shadow:0 0 22px #ffd84aaa;border-color:#fff4a0;transform:translateY(-2px)}.pad button.used{opacity:.3}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}.actions button{font-size:11px;min-height:40px}.message{text-align:center;min-height:28px;padding-top:7px;font-size:12px;color:#8ff5d2}.active{outline:2px solid #62efff;background:#1d5365!important}</style></head><body><main class=app><div class=top><div class=title>NEON SUDOKU <small>v4</small></div><div class=stats><b id=diff>MEDIUM</b><br><span id=timer>00:00</span> · Mistakes <span id=mistakes>0</span></div></div><div class=progress><i id=progress></i></div><div id=board class=board></div><div id=message class=message>Tap any number to highlight every match</div><div id=pad class=pad></div><div class=actions><button id=notes>NOTES</button><button id=erase>ERASE</button><button id=undo>UNDO</button><button id=hint>HINT</button><button id=newgame>NEW</button></div></main><script>(()=>{const $=x=>document.getElementById(x);let solution=[],puzzle=[],board=[],selected=-1,focusNumber=0,mistakes=0,noteMode=false,notes=[],history=[],started=Date.now();const shuffle=a=>{for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},pat=(r,c)=>(r*3+Math.floor(r/3)+c)%9;function make(){let nums=shuffle([1,2,3,4,5,6,7,8,9]),rows=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(r=>b*3+r)),cols=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(c=>b*3+c));solution=[];for(let r of rows)for(let c of cols)solution.push(nums[pat(r,c)]);puzzle=[...solution];shuffle([...Array(81).keys()]).slice(0,46).forEach(i=>puzzle[i]=0);board=[...puzzle];notes=Array.from({length:81},()=>new Set);history=[];selected=-1;focusNumber=0;mistakes=0;started=Date.now();render();ui()}function render(){let root=$('board');root.innerHTML='';let sr=selected<0?-1:Math.floor(selected/9),sc=selected%9;for(let i=0;i<81;i++){let d=document.createElement('div'),r=Math.floor(i/9),c=i%9;d.className='cell';if(puzzle[i])d.classList.add('given');if(selected>=0&&i!==selected&&(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3))))d.classList.add('peer');if(focusNumber&&board[i]===focusNumber)d.classList.add('same');if(i===selected)d.classList.add('selected');if(board[i])d.textContent=board[i];else if(notes[i].size){let n=document.createElement('div');n.className='notes';for(let k=1;k<=9;k++){let s=document.createElement('span');s.textContent=notes[i].has(k)?k:'';if(focusNumber===k&&notes[i].has(k))s.classList.add('matchnote');n.appendChild(s)}d.appendChild(n)}d.onclick=()=>{selected=i;if(board[i])focusNumber=board[i];render()};root.appendChild(d)}updatePad()}function updatePad(){let counts={};board.forEach(v=>counts[v]=(counts[v]||0)+1);[...$('pad').children].forEach((b,i)=>{let n=i+1;b.classList.toggle('numberactive',focusNumber===n);b.classList.toggle('used',counts[n]>=9)})}function snap(){history.push({board:[...board],notes:notes.map(s=>[...s]),mistakes});if(history.length>30)history.shift()}function input(n){focusNumber=n;if(selected<0){render();$('message').textContent='Highlighting every '+n;return}if(puzzle[selected]){render();return}if(noteMode){snap();notes[selected].has(n)?notes[selected].delete(n):notes[selected].add(n);render();return}snap();if(n!==solution[selected]){mistakes++;$('mistakes').textContent=mistakes;let cell=$('board').children[selected];cell?.classList.add('error');navigator.vibrate?.(40);$('message').textContent='Not quite';return}board[selected]=n;notes[selected].clear();$('message').textContent='Correct · all '+n+'s highlighted';render();ui();if(board.every((v,i)=>v===solution[i]))$('message').textContent='PUZZLE COMPLETE!'}for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>input(n);$('pad').appendChild(b)}$('notes').onclick=()=>{noteMode=!noteMode;$('notes').classList.toggle('active',noteMode)};$('erase').onclick=()=>{if(selected>=0&&!puzzle[selected]){snap();board[selected]=0;notes[selected].clear();render();ui()}};$('undo').onclick=()=>{let h=history.pop();if(!h)return;board=h.board;notes=h.notes.map(a=>new Set(a));mistakes=h.mistakes;render();ui()};$('hint').onclick=()=>{let empty=board.map((v,i)=>!v&&!puzzle[i]?i:-1).filter(i=>i>=0);if(!empty.length)return;selected=empty[Math.floor(Math.random()*empty.length)];board[selected]=solution[selected];focusNumber=board[selected];render();ui()};$('newgame').onclick=make;function ui(){$('mistakes').textContent=mistakes;$('progress').style.width=(board.filter(Boolean).length/81*100)+'%'}setInterval(()=>{let s=Math.floor((Date.now()-started)/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);make()})();</script></body></html>
