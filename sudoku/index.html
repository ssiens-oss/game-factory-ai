<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>NEON SUDOKU</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17314a,#07101d 45%,#02050b);color:#eefcff;font-family:system-ui;display:flex;justify-content:center}.app{width:min(96vw,620px);padding:18px 12px 30px}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.title{font-weight:950;letter-spacing:5px;font-size:22px;text-shadow:0 0 18px #4ef}.stats{margin-left:auto;text-align:right;font-size:12px;color:#9ac6d0}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;border:3px solid #8cf5ff;border-radius:8px;overflow:hidden;box-shadow:0 0 35px #32dfff33;background:#07121b}.cell{position:relative;border:1px solid #23404d;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,34px);font-weight:800;color:#67eaff;background:#091722;user-select:none}.cell:nth-child(3n){border-right:3px solid #668996}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #668996}.cell.given{color:#fff;background:#0c1d29}.cell.selected{background:#19495a;box-shadow:inset 0 0 18px #56efff55}.cell.peer{background:#102b38}.cell.same{color:#fff;text-shadow:0 0 12px #5ef}.cell.bad{color:#ff5573;background:#4a1320}.notes{position:absolute;font-size:9px;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);color:#8aaab3}.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:13px}.pad button,.actions button{border:1px solid #477787;background:linear-gradient(#17313d,#0a1820);color:#fff;border-radius:9px;min-height:48px;font-size:20px;font-weight:850;box-shadow:0 5px 15px #0006}.pad button:active,.actions button:active{transform:scale(.96);background:#225366}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.actions button{font-size:12px;min-height:43px}.active{outline:2px solid #63edff;background:#1b5364!important}.message{text-align:center;height:25px;padding-top:7px;font-size:12px;color:#8ff5d2}.win{color:#fff;font-weight:900;text-shadow:0 0 15px #56ffc4}@media(max-width:500px){.app{padding-top:10px}.title{font-size:17px}.pad{gap:3px}.pad button{min-height:43px;font-size:18px}.actions{gap:4px}}</style></head><body><main class=app><div class=top><div class=title>NEON SUDOKU</div><div class=stats><b id=difficulty>MEDIUM</b><br><span id=timer>00:00</span> · Mistakes <span id=mistakes>0</span>/3</div></div><div id=board class=board></div><div id=message class=message>Select a square</div><div id=pad class=pad></div><div class=actions><button id=notes>NOTES</button><button id=erase>ERASE</button><button id=hint>HINT</button><button id=newgame>NEW GAME</button></div></main><script>(()=>{const $=x=>document.getElementById(x);let solution=[],puzzle=[],board=[],selected=-1,mistakes=0,noteMode=false,notes=Array.from({length:81},()=>new Set()),started=Date.now(),timer;function pattern(r,c){return(r*3+Math.floor(r/3)+c)%9}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function make(){let nums=shuffle([1,2,3,4,5,6,7,8,9]),rows=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(r=>b*3+r)),cols=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(c=>b*3+c));solution=[];for(let r of rows)for(let c of cols)solution.push(nums[pattern(r,c)]);puzzle=[...solution];let holes=46,idx=shuffle([...Array(81).keys()]);for(let i=0;i<holes;i++)puzzle[idx[i]]=0;board=[...puzzle];notes=Array.from({length:81},()=>new Set());selected=-1;mistakes=0;started=Date.now();$('mistakes').textContent=0;$('message').textContent='Select a square';render()}function render(){let b=$('board');b.innerHTML='';for(let i=0;i<81;i++){let d=document.createElement('div');d.className='cell';let r=Math.floor(i/9),c=i%9;if(puzzle[i])d.classList.add('given');if(i===selected)d.classList.add('selected');if(selected>=0){let sr=Math.floor(selected/9),sc=selected%9;if(i!==selected&&(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3))))d.classList.add('peer');if(board[selected]&&board[i]===board[selected])d.classList.add('same')}if(board[i])d.textContent=board[i];else if(notes[i].size){let n=document.createElement('div');n.className='notes';for(let k=1;k<=9;k++){let s=document.createElement('span');s.textContent=notes[i].has(k)?k:'';n.appendChild(s)}d.appendChild(n)}d.onclick=()=>{selected=i;render()};b.appendChild(d)}}function input(n){if(selected<0||puzzle[selected])return;if(noteMode){if(notes[selected].has(n))notes[selected].delete(n);else notes[selected].add(n);render();return}if(n!==solution[selected]){mistakes++;$('mistakes').textContent=mistakes;$('message').textContent=mistakes>=3?'3 mistakes — keep trying':'Not quite';let cells=$('board').children;cells[selected]?.classList.add('bad');navigator.vibrate?.(40);return}board[selected]=n;notes[selected].clear();for(let i=0;i<81;i++)notes[i].delete(n);$('message').textContent='Correct';render();if(board.every((v,i)=>v===solution[i])){$('message').innerHTML='<span class=win>PUZZLE COMPLETE!</span>';clearInterval(timer)}}for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>input(n);$('pad').appendChild(b)}$('notes').onclick=()=>{noteMode=!noteMode;$('notes').classList.toggle('active',noteMode)};$('erase').onclick=()=>{if(selected>=0&&!puzzle[selected]){board[selected]=0;notes[selected].clear();render()}};$('hint').onclick=()=>{if(selected<0||puzzle[selected]||board[selected]){let empties=board.map((v,i)=>!v&&!puzzle[i]?i:-1).filter(i=>i>=0);if(!empties.length)return;selected=empties[Math.floor(Math.random()*empties.length)]}board[selected]=solution[selected];notes[selected].clear();$('message').textContent='Hint used';render();if(board.every((v,i)=>v===solution[i]))$('message').innerHTML='<span class=win>PUZZLE COMPLETE!</span>'};$('newgame').onclick=make;timer=setInterval(()=>{let s=Math.floor((Date.now()-started)/1000),m=Math.floor(s/60);$('timer').textContent=String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);make()})();</script></body></html>
