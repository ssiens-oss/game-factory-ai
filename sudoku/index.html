<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><meta name=theme-color content='#050b14'><title>NEON SUDOKU v2</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#1d4860,#081321 42%,#02050b 80%);color:#eefcff;font-family:system-ui;display:flex;justify-content:center;overscroll-behavior:none}.app{width:min(97vw,650px);padding:12px 10px 28px}.top{display:flex;align-items:center;gap:8px}.title{font-weight:950;letter-spacing:4px;font-size:20px;text-shadow:0 0 18px #4ef}.sub{font-size:8px;color:#6fe9ff;letter-spacing:2px}.stats{margin-left:auto;text-align:right;font-size:11px;color:#a2cad2}.toolbar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:9px 0}.toolbar button,.actions button,.modal button{border:1px solid #477787;background:linear-gradient(#17313d,#09171f);color:#fff;border-radius:9px;min-height:38px;font-weight:800}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;border:3px solid #8cf5ff;border-radius:9px;overflow:hidden;box-shadow:0 0 38px #32dfff38;background:#07121b}.cell{position:relative;border:1px solid #24434e;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,34px);font-weight:850;color:#62eaff;background:#091722;user-select:none;transition:background .1s,transform .08s}.cell:nth-child(3n){border-right:3px solid #6a919c}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #6a919c}.cell.given{color:#fff;background:#0d1e29}.cell.selected{background:#246078;box-shadow:inset 0 0 20px #62efff66}.cell.peer{background:#102c39}.cell.same{color:#fff;text-shadow:0 0 13px #5ef}.cell.error{color:#ff607a;background:#541827}.cell.hint{animation:pulse .7s 2}.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);font-size:9px;color:#9ab7bf;text-align:center}.notes span{display:flex;align-items:center;justify-content:center}.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:10px}.pad button{position:relative;border:1px solid #477787;background:linear-gradient(#17313d,#09171f);color:#fff;border-radius:9px;min-height:49px;font-size:20px;font-weight:900;box-shadow:0 5px 15px #0006}.pad button.used{opacity:.28}.pad small{position:absolute;right:3px;top:2px;font-size:8px;color:#72dce8}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}.actions button{font-size:11px;min-height:42px}.active{outline:2px solid #62efff;background:#1d5365!important}.message{text-align:center;min-height:28px;padding-top:7px;font-size:12px;color:#8ff5d2}.progress{height:5px;background:#071015;border-radius:5px;margin:8px 0;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#42e5ff,#78ffd0);box-shadow:0 0 10px #4ef}.modal{position:fixed;z-index:20;inset:0;background:#01050bed;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(92vw,470px);background:#081923;border:1px solid #5deaff66;border-radius:18px;padding:22px;box-shadow:0 25px 80px #000;text-align:center}.card h2{letter-spacing:3px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}.win{font-weight:950;color:#fff;text-shadow:0 0 16px #63ffd1}@keyframes pulse{50%{background:#2d786c;transform:scale(.96)}}@media(max-width:500px){.app{padding-top:7px}.title{font-size:16px}.toolbar button{font-size:10px}.pad{gap:3px}.pad button{min-height:43px}.actions{gap:3px}.actions button{font-size:9px}}</style></head><body><main class=app><div class=top><div><div class=title>NEON SUDOKU</div><div class=sub>v2 · BRAIN GRID</div></div><div class=stats><b id=diff>MEDIUM</b> · Streak <b id=streak>0</b><br><span id=timer>00:00</span> · Mistakes <span id=mistakes>0</span>/3 · Hints <span id=hints>3</span></div></div><div class=toolbar><button id=pause>PAUSE</button><button id=theme>GLOW</button><button id=sound>SOUND ✓</button><button id=stats>STATS</button><button id=difficulty>LEVEL</button></div><div class=progress><i id=progress></i></div><div id=board class=board></div><div id=message class=message>Select a square</div><div id=pad class=pad></div><div class=actions><button id=notes>NOTES</button><button id=erase>ERASE</button><button id=undo>UNDO</button><button id=hint>HINT</button><button id=newgame>NEW</button></div></main><div id=modal class='modal hidden'><div id=card class=card></div></div><script>(()=>{const $=x=>document.getElementById(x),levels={EASY:36,MEDIUM:46,HARD:52,EXPERT:57};let solution=[],puzzle=[],board=[],selected=-1,mistakes=0,noteMode=false,notes=[],history=[],started=Date.now(),elapsed=0,paused=false,diff=localStorage.nsDiff||'MEDIUM',hints=3,sound=true,streak=+(localStorage.nsStreak||0),best=JSON.parse(localStorage.nsBest||'{}'),errors=new Set(),hintCell=-1;function beep(f=520,d=.05){if(!sound)return;try{let A=new(window.AudioContext||webkitAudioContext),o=A.createOscillator(),v=A.createGain();o.frequency.value=f;v.gain.value=.035;o.connect(v);v.connect(A.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.stop(A.currentTime+d)}catch(e){}}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}const pat=(r,c)=>(r*3+Math.floor(r/3)+c)%9;function generate(){let nums=shuffle([1,2,3,4,5,6,7,8,9]),rows=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(r=>b*3+r)),cols=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(c=>b*3+c));solution=[];for(let r of rows)for(let c of cols)solution.push(nums[pat(r,c)]);puzzle=[...solution];shuffle([...Array(81).keys()]).slice(0,levels[diff]).forEach(i=>puzzle[i]=0);board=[...puzzle];notes=Array.from({length:81},()=>new Set);history=[];selected=-1;mistakes=0;hints=3;errors.clear();started=Date.now();elapsed=0;paused=false;ui();render();save()}function save(){localStorage.nsSave=JSON.stringify({solution,puzzle,board,notes:notes.map(s=>[...s]),history,mistakes,hints,diff,started,elapsed})}function resume(){try{let s=JSON.parse(localStorage.nsSave);if(!s)return false;solution=s.solution;puzzle=s.puzzle;board=s.board;notes=s.notes.map(a=>new Set(a));history=s.history||[];mistakes=s.mistakes;hints=s.hints;diff=s.diff;started=s.started;elapsed=s.elapsed||0;return true}catch(e){return false}}function render(){let root=$('board');root.innerHTML='';let sr=selected<0?-1:Math.floor(selected/9),sc=selected%9;for(let i=0;i<81;i++){let d=document.createElement('div'),r=Math.floor(i/9),c=i%9;d.className='cell';if(puzzle[i])d.classList.add('given');if(i===selected)d.classList.add('selected');if(selected>=0&&i!==selected&&(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3))))d.classList.add('peer');if(selected>=0&&board[selected]&&board[i]===board[selected])d.classList.add('same');if(errors.has(i))d.classList.add('error');if(i===hintCell)d.classList.add('hint');if(board[i])d.textContent=board[i];else if(notes[i].size){let n=document.createElement('div');n.className='notes';for(let k=1;k<=9;k++){let s=document.createElement('span');s.textContent=notes[i].has(k)?k:'';n.appendChild(s)}d.appendChild(n)}d.onclick=()=>{if(paused)return;selected=i;beep(340,.025);render()};root.appendChild(d)}updatePad()}function updatePad(){let counts={};board.forEach(v=>counts[v]=(counts[v]||0)+1);[...$('pad').children].forEach((b,i)=>{let n=i+1;b.classList.toggle('used',counts[n]>=9);b.querySelector('small').textContent=9-(counts[n]||0)})}function snapshot(){history.push({board:[...board],notes:notes.map(s=>[...s]),mistakes});if(history.length>40)history.shift()}function input(n){if(paused||selected<0||puzzle[selected])return;if(noteMode){snapshot();notes[selected].has(n)?notes[selected].delete(n):notes[selected].add(n);beep(430);render();save();return}snapshot();if(n!==solution[selected]){mistakes++;errors.add(selected);beep(130,.12);navigator.vibrate?.(45);$('message').textContent=mistakes>=3?'Mistake limit reached — puzzle continues':'Check that number';setTimeout(()=>{errors.delete(selected);render()},550);ui();save();return}board[selected]=n;notes[selected].clear();for(let i=0;i<81;i++){let r=Math.floor(i/9),c=i%9,sr=Math.floor(selected/9),sc=selected%9;if(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3)))notes[i].delete(n)}beep(690);$('message').textContent='Correct';ui();render();save();checkWin()}function checkWin(){if(!board.every((v,i)=>v===solution[i]))return;let seconds=Math.floor((Date.now()-started+elapsed)/1000);streak++;localStorage.nsStreak=streak;best[diff]=!best[diff]||seconds<best[diff]?seconds:best[diff];localStorage.nsBest=JSON.stringify(best);localStorage.removeItem('nsSave');$('message').innerHTML='<span class=win>PUZZLE COMPLETE · '+fmt(seconds)+'</span>';beep(880,.3);navigator.vibrate?.([30,30,80]);ui()}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function ui(){$('diff').textContent=diff;$('mistakes').textContent=mistakes;$('hints').textContent=hints;$('streak').textContent=streak;let filled=board.filter(Boolean).length;$('progress').style.width=(filled/81*100)+'%'}for(let n=1;n<=9;n++){let b=document.createElement('button');b.innerHTML=n+'<small></small>';b.onclick=()=>input(n);$('pad').appendChild(b)}$('notes').onclick=()=>{noteMode=!noteMode;$('notes').classList.toggle('active',noteMode);$('message').textContent=noteMode?'Notes mode on':'Notes mode off'};$('erase').onclick=()=>{if(selected>=0&&!puzzle[selected]){snapshot();board[selected]=0;notes[selected].clear();render();ui();save()}};$('undo').onclick=()=>{let h=history.pop();if(!h)return;board=h.board;notes=h.notes.map(a=>new Set(a));mistakes=h.mistakes;render();ui();save();beep(280)};$('hint').onclick=()=>{if(!hints)return $('message').textContent='No hints left';let empty=board.map((v,i)=>!v&&!puzzle[i]?i:-1).filter(i=>i>=0);if(!empty.length)return;selected=empty[Math.floor(Math.random()*empty.length)];snapshot();board[selected]=solution[selected];notes[selected].clear();hints--;hintCell=selected;setTimeout(()=>{hintCell=-1;render()},1500);$('message').textContent='Hint revealed';render();ui();save();checkWin()};$('newgame').onclick=()=>show('<h2>NEW PUZZLE?</h2><p>Current progress will be replaced.</p><button id=yes>START NEW</button><button id=no>CANCEL</button>',()=>{$('yes').onclick=()=>{hide();generate()};$('no').onclick=hide});$('pause').onclick=()=>{paused=!paused;if(paused){elapsed+=Date.now()-started;show('<h2>PAUSED</h2><p>Your timer is stopped.</p><button id=resume>RESUME</button>',()=>{$('resume').onclick=()=>{paused=false;started=Date.now();hide()}})}else started=Date.now()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent='SOUND '+(sound?'✓':'OFF')};$('theme').onclick=()=>{document.body.style.filter=document.body.style.filter?'':'hue-rotate(55deg)';beep(500)};$('stats').onclick=()=>show('<h2>PLAYER STATS</h2><p>Current streak: <b>'+streak+'</b></p>'+Object.keys(levels).map(k=>'<p>'+k+' best: <b>'+(best[k]?fmt(best[k]):'—')+'</b></p>').join('')+'<button id=close>CLOSE</button>',()=>{$('close').onclick=hide});$('difficulty').onclick=()=>show('<h2>DIFFICULTY</h2><div class=choices>'+Object.keys(levels).map(k=>'<button data-d='+k+'>'+k+'</button>').join('')+'</div><button id=close>CANCEL</button>',()=>{document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{diff=b.dataset.d;localStorage.nsDiff=diff;hide();generate()});$('close').onclick=hide});function show(html,ready){$('card').innerHTML=html;$('modal').classList.remove('hidden');ready?.()}function hide(){$('modal').classList.add('hidden')}document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')input(+e.key);if(e.key==='Backspace'||e.key==='Delete')$('erase').click();if((e.ctrlKey||e.metaKey)&&e.key==='z')$('undo').click();if(selected>=0&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){let r=Math.floor(selected/9),c=selected%9;if(e.key==='ArrowLeft')c=Math.max(0,c-1);if(e.key==='ArrowRight')c=Math.min(8,c+1);if(e.key==='ArrowUp')r=Math.max(0,r-1);if(e.key==='ArrowDown')r=Math.min(8,r+1);selected=r*9+c;render()}});setInterval(()=>{if(paused)return;let s=Math.floor((Date.now()-started+elapsed)/1000);$('timer').textContent=fmt(s)},1000);if(resume()){ui();render();$('message').textContent='Saved puzzle restored'}else generate()})();</script></body></html>
