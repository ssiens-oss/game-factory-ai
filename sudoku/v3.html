<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>NEON SUDOKU v3</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id=game src='./index.html?v=3'></iframe><script>const f=document.getElementById('game');f.addEventListener('load',()=>{const d=f.contentDocument,w=f.contentWindow;if(!d)return;const s=d.createElement('style');s.textContent=`.cell.same{background:linear-gradient(145deg,#197a92,#124f67)!important;color:#fff!important;text-shadow:0 0 7px #fff,0 0 18px #49efff!important;box-shadow:inset 0 0 0 2px #68f3ff88,inset 0 0 22px #32dfff66!important;transform:scale(.94);z-index:2}.cell.selected{background:linear-gradient(145deg,#36b5cf,#176077)!important;color:#fff!important;outline:2px solid #d9ffff;outline-offset:-3px;box-shadow:inset 0 0 24px #8effff88,0 0 16px #44eaff55!important;z-index:3}.cell.peer:not(.same):not(.selected){background:#102f3d!important}.cell.given.same{background:linear-gradient(145deg,#216a80,#173f51)!important}.cell{transition:background .12s,transform .12s,box-shadow .12s,color .12s!important}.pad button:not(.used):active{box-shadow:0 0 18px #4ef!important}.board{box-shadow:0 0 42px #32dfff44,0 18px 55px #0009!important}.message{font-weight:700;letter-spacing:.4px}.progress i{transition:width .25s ease}.same .notes{color:#fff!important}`;d.head.appendChild(s);const badge=d.querySelector('.sub');if(badge)badge.textContent='v3 · SMART HIGHLIGHT';const board=d.getElementById('board');if(board){board.addEventListener('click',()=>{setTimeout(()=>{const sel=board.querySelector('.selected');if(!sel)return;const val=sel.textContent.trim();const msg=d.getElementById('message');if(val&&/^\d$/.test(val)&&msg)msg.textContent='All '+val+'s highlighted'},10)})}const pad=d.getElementById('pad');if(pad){pad.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setTimeout(()=>{const n=b.childNodes[0]?.textContent?.trim();const msg=d.getElementById('message');if(n&&msg&&msg.textContent==='Correct')msg.textContent=n+' placed · matching numbers highlighted'},20)})}});</script></body></html>
