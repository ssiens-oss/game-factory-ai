version: "3.8"
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    depends_on: [redis]
    environment:
      REDIS_HOST: redis
    restart: unless-stopped
